<script>// ===== shared: palette, sprites, pixel font, audio, share, storage =====
const PAL={k:'#050505',c:'#E7E3DA',a:'#707762',A:'#4C5243',g:'#8F977E',m:'#9AA08A',o:'#C8702A',O:'#8A4A1C',w:'#D9A066',y:'#B5652A',d:'#5A3416',s:'#E2B48C',b:'#3A2A1E',r:'#B23A2A',R:'#E0563A',f:'#F2B33D',F:'#FFE08A',x:'#A9A9A0',X:'#6E6E68',u:'#2F5F8A',n:'#2B2E26',G:'#5E6650'};

const BLOKE=spr(["....aaaa....","...aaaaaa...","...aAAAAa...","...sssss....","...sksks....","...sssss....","..bbbbbbb...","..bbsssbb...","...bbbbb....",".rorooroor..","roroooroor..","sroroororos.","s.rororor.s.","..AAAAAAA...","..AAA.AAA...","..AAA.AAA...","..kkk.kkk..."]);
const BLOKE_NOARM=spr(["....aaaa....","...aaaaaa...","...aAAAAa...","...sssss....","...sksks....","...sssss....","..bbbbbbb...","..bbsssbb...","...bbbbb....",".rorooroor..","roroooroor..",".roroororo..","..rororor...","..AAAAAAA...","..AAA.AAA...","..AAA.AAA...","..kkk.kkk..."]);
const LOGEND=spr(["....OOOO....","..OOwwwwOO..",".OwwyyyywwO.",".OwywwwwywO.","OwywwyywwywO","OwywyddywywO","OwywyddywywO","OwywwyywwywO",".OwywwwwywO.",".OwwyyyywwO.","..OOwwwwOO..","....OOOO...."]);
// ---- pixel font 3x5
const FONT={A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",
"!":"010010010000010",".":"000000000000010","'":"010010000000000",":":"000010000010000","-":"000000111000000","+":"000010111010000","/":"001001010100100","?":"110001010000010",",":"000000000010100","*":"010111010101000","@":"010101111100011","\u00d7":"000101010101000"," ":"000000000000000"};
function txtW(s,sc){return String(s).length*4*sc-sc;}
function txt(ctx,s,x,y,sc=1,col=PAL.c,align='left',sh=PAL.k){s=String(s);const u=s.replace(/x(?=\d)/g,'\u00d7').toUpperCase();const w=txtW(u,sc);
  let x0=align==='center'?Math.round(x-w/2):align==='right'?x-w:x;x0=Math.round(x0);y=Math.round(y);
  const draw=(ox,oy,c)=>{ctx.fillStyle=c;for(let i=0;i<u.length;i++){const g=FONT[u[i]]||FONT[' '];for(let k=0;k<15;k++)if(g[k]==='1')ctx.fillRect(ox+i*4*sc+(k%3)*sc,oy+Math.floor(k/3)*sc,sc,sc);}};
  if(sh){draw(x0+sc,y+sc,sh);} draw(x0,y,col);}
// ---- storage
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
// ---- audio
let AC=null,muted=store.get('mt_arcade_muted',false),noiseBuf=null;
function audio(){if(muted)return null;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}
  if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function beep(f,d=0.1,type='square',v=0.06,f2=null,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}
function noise(d=0.12,v=0.08,hp=600){const a=audio();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=hp;s.buffer=noiseBuf;const t=a.currentTime;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
function setupMute(btn){const upd=()=>{btn.textContent=muted?'SOUND OFF':'SOUND ON';btn.setAttribute('aria-pressed',String(!muted));};upd();
  btn.addEventListener('click',()=>{muted=!muted;store.set('mt_arcade_muted',muted);upd();if(!muted)beep(660,0.08);});}
// ---- share

async function invite(text,link){const http=u=>/^https?:/.test(u||'');const url=link||(http(location.href)?location.href:undefined);const data={title:'My Timber · Shed Arcade',text};if(http(url))data.url=url;
  try{if(navigator.share){await navigator.share(data);return 'shared';}}catch(e){if(e&&e.name==='AbortError')return 'cancelled';}
  const full=url?text+' '+url:text;
  try{await navigator.clipboard.writeText(full);toast('Copied. Send it to a mate.');return 'copied';}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=full;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied. Send it to a mate.');return 'copied';}catch(e){toast(full);return 'shown';}}
// ---- pixel title on canvas
function pixelTitle(el,s){const sc=4,w=txtW(s,sc)+3,h=5*sc+3;el.width=w;el.height=h;el.style.width=Math.round(w*1.15)+'px';el.style.height=Math.round(h*1.15)+'px';el.style.imageRendering='pixelated';
  const x=el.getContext('2d');txt(x,s,3,3,sc,PAL.O,'left',null);txt(x,s,0,0,sc,PAL.c,'left',null);}
// ---- fit canvas into wrapper keeping aspect
function fitCanvas(canvas,wrap,W,H){const f=()=>{const r=wrap.getBoundingClientRect();let s=Math.min(r.width/W,r.height/H);if(!(s>0))s=1;
  canvas.style.width=Math.floor(W*s)+'px';canvas.style.height=Math.floor(H*s)+'px';};window.addEventListener('resize',f);f();setTimeout(f,50);return f;}
function fmt(n){return Math.round(n).toLocaleString('en-GB');}

// ===== tiny rigid-body engine (box2d-lite style: SAT boxes + circles, sequential impulses, warm start) =====
const PHYS={bodies:[],arbs:new Map(),g:15,iters:12,onImpact:null};
let _bid=1;
function mkBox(x,y,w,h,dens,kind){const m=dens*w*h;return{id:_bid++,kind,box:true,pos:{x,y},rot:0,vel:{x:0,y:0},w:0,hw:w/2,hh:h/2,W:w,H:h,rad:Math.hypot(w,h)/2,fr:0.7,
  invMass:dens>0?1/m:0,invI:dens>0?12/(m*(w*w+h*h)):0};}
function mkCircle(x,y,r,dens,kind){const m=dens*Math.PI*r*r;return{id:_bid++,kind,circle:true,pos:{x,y},rot:0,vel:{x:0,y:0},w:0,r,rad:r,fr:0.6,invMass:1/m,invI:1/(0.5*m*r*r)};}
function incident(hx,hy,pos,c,s,nx,ny){const lnx=-(c*nx+s*ny),lny=-(-s*nx+c*ny);let v;
  if(Math.abs(lnx)>Math.abs(lny))v=lnx>0?[[hx,-hy],[hx,hy]]:[[-hx,hy],[-hx,-hy]];else v=lny>0?[[hx,hy],[-hx,hy]]:[[-hx,-hy],[hx,-hy]];
  return v.map(([x,y])=>({x:pos.x+c*x-s*y,y:pos.y+s*x+c*y}));}
function clipSeg(vin,nx,ny,off){const out=[];const d0=nx*vin[0].x+ny*vin[0].y-off,d1=nx*vin[1].x+ny*vin[1].y-off;
  if(d0<=0)out.push(vin[0]);if(d1<=0)out.push(vin[1]);if(d0*d1<0){const t=d0/(d0-d1);out.push({x:vin[0].x+t*(vin[1].x-vin[0].x),y:vin[0].y+t*(vin[1].y-vin[0].y)});}return out;}
function collideBB(A,B){const hAx=A.hw,hAy=A.hh,hBx=B.hw,hBy=B.hh;const cA=Math.cos(A.rot),sA=Math.sin(A.rot),cB=Math.cos(B.rot),sB=Math.sin(B.rot);
  const dpx=B.pos.x-A.pos.x,dpy=B.pos.y-A.pos.y;const dAx=cA*dpx+sA*dpy,dAy=-sA*dpx+cA*dpy,dBx=cB*dpx+sB*dpy,dBy=-sB*dpx+cB*dpy;
  const C11=cA*cB+sA*sB,C12=-cA*sB+sA*cB,C21=-sA*cB+cA*sB,C22=sA*sB+cA*cB;const a11=Math.abs(C11),a12=Math.abs(C12),a21=Math.abs(C21),a22=Math.abs(C22);
  const fAx=Math.abs(dAx)-hAx-(a11*hBx+a12*hBy),fAy=Math.abs(dAy)-hAy-(a21*hBx+a22*hBy);if(fAx>0||fAy>0)return[];
  const fBx=Math.abs(dBx)-(a11*hAx+a21*hAy)-hBx,fBy=Math.abs(dBy)-(a12*hAx+a22*hAy)-hBy;if(fBx>0||fBy>0)return[];
  let axis=0,sep=fAx,nx=dAx>0?cA:-cA,ny=dAx>0?sA:-sA;const rt=0.95,at=0.01;
  if(fAy>rt*sep+at*hAy){axis=1;sep=fAy;nx=dAy>0?-sA:sA;ny=dAy>0?cA:-cA;}
  if(fBx>rt*sep+at*hBx){axis=2;sep=fBx;nx=dBx>0?cB:-cB;ny=dBx>0?sB:-sB;}
  if(fBy>rt*sep+at*hBy){axis=3;sep=fBy;nx=dBy>0?-sB:sB;ny=dBy>0?cB:-cB;}
  let fnx,fny,front,snx,sny,side,neg,pos,inc;
  if(axis===0){fnx=nx;fny=ny;front=A.pos.x*fnx+A.pos.y*fny+hAx;snx=-sA;sny=cA;side=A.pos.x*snx+A.pos.y*sny;neg=-side+hAy;pos=side+hAy;inc=incident(hBx,hBy,B.pos,cB,sB,fnx,fny);}
  else if(axis===1){fnx=nx;fny=ny;front=A.pos.x*fnx+A.pos.y*fny+hAy;snx=cA;sny=sA;side=A.pos.x*snx+A.pos.y*sny;neg=-side+hAx;pos=side+hAx;inc=incident(hBx,hBy,B.pos,cB,sB,fnx,fny);}
  else if(axis===2){fnx=-nx;fny=-ny;front=B.pos.x*fnx+B.pos.y*fny+hBx;snx=-sB;sny=cB;side=B.pos.x*snx+B.pos.y*sny;neg=-side+hBy;pos=side+hBy;inc=incident(hAx,hAy,A.pos,cA,sA,fnx,fny);}
  else{fnx=-nx;fny=-ny;front=B.pos.x*fnx+B.pos.y*fny+hBy;snx=cB;sny=sB;side=B.pos.x*snx+B.pos.y*sny;neg=-side+hBx;pos=side+hBx;inc=incident(hAx,hAy,A.pos,cA,sA,fnx,fny);}
  const c1=clipSeg(inc,-snx,-sny,neg);if(c1.length<2)return[];const c2=clipSeg(c1,snx,sny,pos);if(c2.length<2)return[];
  const out=[];for(const p of c2){const s=fnx*p.x+fny*p.y-front;if(s<=0)out.push({sep:s,nx,ny,px:p.x-s*fnx,py:p.y-s*fny,Pn:0,Pt:0});}return out;}
function collideBC(A,C){const c=Math.cos(A.rot),s=Math.sin(A.rot);const dx=C.pos.x-A.pos.x,dy=C.pos.y-A.pos.y;const lx=c*dx+s*dy,ly=-s*dx+c*dy;
  let cx=Math.max(-A.hw,Math.min(A.hw,lx)),cy=Math.max(-A.hh,Math.min(A.hh,ly)),nx,ny,dist;
  if(cx===lx&&cy===ly){const px=A.hw-Math.abs(lx),py=A.hh-Math.abs(ly);if(px<py){nx=Math.sign(lx)||1;ny=0;cx=nx*A.hw;dist=-px;}else{nx=0;ny=Math.sign(ly)||1;cy=ny*A.hh;dist=-py;}}
  else{const ex=lx-cx,ey=ly-cy;dist=Math.hypot(ex,ey);if(dist>C.r)return[];nx=ex/dist;ny=ey/dist;}
  const sep=dist-C.r;if(sep>0)return[];
  return[{sep,nx:c*nx-s*ny,ny:s*nx+c*ny,px:A.pos.x+c*cx-s*cy,py:A.pos.y+s*cx+c*cy,Pn:0,Pt:0}];}
function physRemove(b){const i=PHYS.bodies.indexOf(b);if(i>=0)PHYS.bodies.splice(i,1);for(const[k,a]of PHYS.arbs)if(a.b1===b||a.b2===b)PHYS.arbs.delete(k);}
function physClear(){PHYS.bodies.length=0;PHYS.arbs.clear();}
function physStep(dt){const B=PHYS.bodies,invDt=1/dt,arbs=PHYS.arbs;const seen=new Set();
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){let a=B[i],b=B[j];if(a.invMass===0&&b.invMass===0)continue;
    const dx=b.pos.x-a.pos.x,dy=b.pos.y-a.pos.y,rr=a.rad+b.rad;if(dx*dx+dy*dy>rr*rr)continue;

    band(lx*PX,ly*PX,false);ctx.drawImage(SPR.L,Math.round(lx*PX-4.5),Math.round(ly*PX-4.5));band(lx*PX,ly*PX,true);}
  else{ctx.strokeStyle='#9AA08A';ctx.beginPath();ctx.moveTo(17.5,GY*PX-44);ctx.lineTo(23.5,GY*PX-42);ctx.lineTo(30.5,GY*PX-44);ctx.stroke();}
  if(G.proj){drawBody(G.proj);if(G.state==='fly'&&G.tLaunch<1.5){ctx.fillStyle=PAL.c;ctx.globalAlpha=0.5;ctx.fillRect(Math.round(G.proj.pos.x*PX-8),Math.round(G.proj.pos.y*PX),3,1);ctx.fillRect(Math.round(G.proj.pos.x*PX-9),Math.round(G.proj.pos.y*PX+3),3,1);ctx.globalAlpha=1;}}
  if(G.proj&&G.proj.pos.y*PX<CAM-4){const x=Math.round(Math.max(3,Math.min(CW-4,G.proj.pos.x*PX)));ctx.fillStyle=PAL.f;ctx.fillRect(x,CAM+1,1,1);ctx.fillRect(x-1,CAM+2,3,1);ctx.fillRect(x-2,CAM+3,5,1);}
  for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);}ctx.globalAlpha=1;
  for(const p of pops){const k=p.t/p.life;ctx.globalAlpha=k>0.75?(1-k)*4:1;txt(ctx,p.text,p.x,Math.round(p.y-k*10),p.sc,p.col,'center');}ctx.globalAlpha=1;
  if(G.state==='aim'&&!G.started&&!G.drag&&Math.floor(tGlobal*2)%2===0)txt(ctx,'DRAG BACK, LET GO',CW/2,CAM+62,1,PAL.c,'center');
  ctx.restore();}
// ---- UI
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
function totalStars(){return starsBest.reduce((a,b)=>a+(b||0),0);}
function unlocked(i){return i===0||(starsBest[i-1]||0)>0;}
function ui(){const lv=LEVELS[L];$('hl').textContent=`L${L+1} ${lv.name.toUpperCase()}`;$('hs').textContent=`★★★ IN ${lv.par[0]}`;
  $('hg').textContent='TIMBER '+'●'.repeat(G.logsLeft)+'○'.repeat(lv.logs-G.logsLeft);
  $('best').textContent=`Your best: ${totalStars()} ★`;$('bestsub').textContent=`of ${LEVELS.length*3} stars · this level ${starsBest[L]?'★'.repeat(starsBest[L]):'not yet'}`;
  $('shed').innerHTML=`${fmt(SHED_EXAMPLE+lobbedMine)} timber lobs`;$('mine').textContent=lobbedMine?`incl. ${fmt(lobbedMine)} of yours`:'Every lob adds to it';
  $('next').disabled=!(L<LEVELS.length-1&&unlocked(L+1));
  const lr=$('levels');lr.innerHTML='';LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.className='lv'+(i===L?' on':'');b.disabled=!unlocked(i);b.innerHTML=`<span>${i+1}</span><i>${unlocked(i)?(starsBest[i]?'★'.repeat(starsBest[i]):'·'):'🔒'}</i>`;b.title=l.name;b.onclick=()=>{hidePanel();loadLevel(i);};lr.appendChild(b);});}
function showPanel(kind,st,improved){const o=$('ov');o.classList.add('on');const lv=LEVELS[L];
  if(kind==='win'){$('ph').textContent=['','Gnomes down!','Lovely lobbing!','Proper job!'][st];$('pst').innerHTML=`<span style="color:#F2B33D">${'★'.repeat(st)}</span><span style="color:#4C5243">${'★'.repeat(3-st)}</span>`;
    $('pp').textContent=`${lv.name}: done in ${G.used} lob${G.used>1?'s':''}.`+(st<3?` Three stars takes ${lv.par[0]}.`:'')+(improved?' New best!':'');
    $('pn').style.display=L<LEVELS.length-1?'':'none';$('pp2').textContent=L===LEVELS.length-1?'That\'s every level. Go for three stars?':'';}
  else{$('ph').textContent='So close!';$('pst').innerHTML='';$('pp').textContent=`${G.gnomes-G.down} gnome${G.gnomes-G.down>1?'s':''} still standing. Have another go.`;$('pn').style.display='none';$('pp2').textContent='';}
  beep(kind==='win'?660:330,0.15,'square',0.05,kind==='win'?990:220);ui();}
function hidePanel(){$('ov').classList.remove('on');}
$('again').onclick=$('pa').onclick=()=>{hidePanel();loadLevel(L);};
$('next').onclick=$('pn').onclick=()=>{if(L<LEVELS.length-1&&unlocked(L+1)){hidePanel();loadLevel(L+1);}};
$('invite').onclick=()=>invite(`Beat my ${totalStars()} stars at Timber Lob in the My Timber Shed Arcade. Knock the gnome off, if you can.`);
setupMute($('mute'));pixelTitle($('title'),'TIMBER LOB');
fitCanvas(cv,$('gwrap'),CW,CH);
// ---- loop
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){acc+=Math.min(0.1,(now-last)/1000);last=now;let n=0;while(acc>=STEP&&n<4){update(STEP);acc-=STEP;n++;}if(n===4)acc=0;render();requestAnimationFrame(frame);}
let startL=0;for(let i=0;i<LEVELS.length;i++)if(unlocked(i))startL=i;loadLevel(unlocked(startL)&&starsBest[startL]?Math.min(startL,LEVELS.length-1):startL);
requestAnimationFrame(frame);
// test hooks
window.__lob={launch,load:i=>{hidePanel();loadLevel(i);},fast:n=>{for(let i=0;i<n;i++)update(STEP);render();},state:()=>({L,state:G.state,logsLeft:G.logsLeft,gnomes:G.gnomes,down:G.down,used:G.used,bodies:PHYS.bodies.map(b=>({t:b.t||b.kind,x:+b.pos.x.toFixed(2),y:+b.pos.y.toFixed(2),r:+b.rot.toFixed(2)}))}),levels:LEVELS.length};
</script></body></html>
