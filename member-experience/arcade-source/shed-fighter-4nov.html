<script>// ===== shared: palette, sprites, pixel font, audio, share, storage =====
const PAL={k:'#050505',c:'#E7E3DA',a:'#707762',A:'#4C5243',g:'#8F977E',m:'#9AA08A',o:'#C8702A',O:'#8A4A1C',w:'#D9A066',y:'#B5652A',d:'#5A3416',s:'#E2B48C',b:'#3A2A1E',r:'#B23A2A',R:'#E0563A',f:'#F2B33D',F:'#FFE08A',x:'#A9A9A0',X:'#6E6E68',u:'#2F5F8A',n:'#2B2E26',G:'#5E6650'};
function spr(rows){const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');

const LOGEND=spr(["....OOOO....","..OOwwwwOO..",".OwwyyyywwO.",".OwywwwwywO.","OwywwyywwywO","OwywyddywywO","OwywyddywywO","OwywwyywwywO",".OwywwwwywO.",".OwwyyyywwO.","..OOwwwwOO..","....OOOO...."]);
// ---- pixel font 3x5
const FONT={A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",
"!":"010010010000010",".":"000000000000010","'":"010010000000000",":":"000010000010000","-":"000000111000000","+":"000010111010000","/":"001001010100100","?":"110001010000010",",":"000000000010100","*":"010111010101000","@":"010101111100011","\u00d7":"000101010101000"," ":"000000000000000"};
function txtW(s,sc){return String(s).length*4*sc-sc;}
function txt(ctx,s,x,y,sc=1,col=PAL.c,align='left',sh=PAL.k){s=String(s);const u=s.replace(/x(?=\d)/g,'\u00d7').toUpperCase();const w=txtW(u,sc);
  let x0=align==='center'?Math.round(x-w/2):align==='right'?x-w:x;x0=Math.round(x0);y=Math.round(y);
  const draw=(ox,oy,c)=>{ctx.fillStyle=c;for(let i=0;i<u.length;i++){const g=FONT[u[i]]||FONT[' '];for(let k=0;k<15;k++)if(g[k]==='1')ctx.fillRect(ox+i*4*sc+(k%3)*sc,oy+Math.floor(k/3)*sc,sc,sc);}};
  if(sh){draw(x0+sc,y+sc,sh);} draw(x0,y,col);}
// ---- storage
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
// ---- audio
let AC=null,muted=store.get('mt_arcade_muted',false),noiseBuf=null;
function audio(){if(muted)return null;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}
  if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function beep(f,d=0.1,type='square',v=0.06,f2=null,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);}
function noise(d=0.12,v=0.08,hp=600){const a=audio();if(!a)return;if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=hp;s.buffer=noiseBuf;const t=a.currentTime;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+0.02);}
function setupMute(btn){const upd=()=>{btn.textContent=muted?'SOUND OFF':'SOUND ON';btn.setAttribute('aria-pressed',String(!muted));};upd();

// ---- share

async function invite(text,link){const http=u=>/^https?:/.test(u||'');const url=link||(http(location.href)?location.href:undefined);const data={title:'My Timber · Shed Arcade',text};if(http(url))data.url=url;
  try{if(navigator.share){await navigator.share(data);return 'shared';}}catch(e){if(e&&e.name==='AbortError')return 'cancelled';}
  const full=url?text+' '+url:text;
  try{await navigator.clipboard.writeText(full);toast('Copied. Send it to a mate.');return 'copied';}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=full;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied. Send it to a mate.');return 'copied';}catch(e){toast(full);return 'shown';}}
// ---- pixel title on canvas
function pixelTitle(el,s){const sc=4,w=txtW(s,sc)+3,h=5*sc+3;el.width=w;el.height=h;el.style.width=Math.round(w*1.15)+'px';el.style.height=Math.round(h*1.15)+'px';el.style.imageRendering='pixelated';
  const x=el.getContext('2d');txt(x,s,3,3,sc,PAL.O,'left',null);txt(x,s,0,0,sc,PAL.c,'left',null);}

function fitCanvas(canvas,wrap,W,H){const f=()=>{const r=wrap.getBoundingClientRect();let s=Math.min(r.width/W,r.height/H);if(!(s>0))s=1;
  canvas.style.width=Math.floor(W*s)+'px';canvas.style.height=Math.floor(H*s)+'px';};window.addEventListener('resize',f);f();setTimeout(f,50);return f;}

 oaksy:{name:'OAKSY',short:'OAKSY',spn:'BEAM CHARGE',tag:'BIG + SLOW',spd:0.75,pow:1.2,hp:110,shirt:[PAL.r,PAL.R],trou:PAL.A,hair:PAL.b,pl:{len:18,th:4,c:PAL.y,t:PAL.w},special:'charge'},
 splinter:{name:'SPLINTER',short:'SPLINTER',spn:'PLANK WHIRL',tag:'QUICK',spd:1.2,pow:0.9,hp:95,shirt:[PAL.u,'#4F86B8'],trou:PAL.n,hair:PAL.d,pl:{len:18,th:2,c:PAL.w,t:PAL.s},special:'whirl'},

 foreman:{name:'THE FOREMAN',short:'FOREMAN',spn:'ANY OF THEM',tag:'THE BOSS',spd:1.0,pow:1.15,hp:125,shirt:[PAL.f,PAL.F],trou:PAL.n,hair:PAL.b,hat:true,pl:{len:19,th:4,c:PAL.O,t:PAL.y},special:'any'}};

    PICKS.forEach((id,i)=>{const cx=22+i*42,D=FIGHTERS[id],on=i===S.pick;if(on){ctx.fillStyle='#1b1a12';ctx.fillRect(cx-20,24,40,82);ctx.strokeStyle=Math.floor(t*4)%2?PAL.F:PAL.o;ctx.lineWidth=1;ctx.strokeRect(cx-19.5,24.5,39,81);}
      const f=mkF(id,cx,1,false);f.y=68;f.st=on?'win':'idle';drawF(f);txt(ctx,D.short,cx,76,1,on?PAL.F:PAL.c,'center');txt(ctx,D.spn.split(' ')[0],cx,84,1,PAL.m,'center');txt(ctx,D.spn.split(' ')[1],cx,90,1,PAL.m,'center');txt(ctx,D.tag,cx,98,1,PAL.a,'center');});
    if(Math.floor(t*2)%2===0)txt(ctx,'TAP A FIGHTER',CW/2,CH-8,1,PAL.c,'center');ctx.restore();return;}
  const P=S.P,C=S.C;
  if(S.freeze>0){ctx.globalAlpha=0.6;ctx.fillStyle=PAL.k;ctx.fillRect(0,0,CW,CH);ctx.globalAlpha=1;const w=S.frzWho;ctx.fillStyle=PAL.F;ctx.globalAlpha=0.25;ctx.fillRect(Math.round(w.x)-14,FLOOR-30,28,30);ctx.globalAlpha=1;}
  for(const p of S.projs){for(let i=0;i<8;i++){const a=t*4+i*0.8;ctx.fillStyle=[PAL.x,PAL.c,PAL.s][i%3];const r=4+i%3;ctx.globalAlpha=0.85;ctx.fillRect(Math.round(p.x+Math.cos(a)*(4+i%2*2)-r/2),Math.round(p.y+Math.sin(a)*3-r/2),r,r);}ctx.globalAlpha=1;txt(ctx,'PFF',p.x,p.y-12,1,PAL.c,'center');}
  const order=P.atk||P.sp?[C,P]:[P,C];order.forEach(drawF);
  for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life)*(p.puff?0.7:1);ctx.fillStyle=p.c;const s=p.puff?1+Math.round(p.t*5):1;ctx.fillRect(Math.round(p.x-s/2),Math.round(p.y-s/2),s,s);}ctx.globalAlpha=1;
  // HUD
  bar(4,50,P,false);bar(74,50,C,true);txt(ctx,P.D.short,4,12,1,PAL.c);txt(ctx,C.D.short,124,12,1,PAL.c,'right');txt(ctx,String(Math.ceil(S.rt)),CW/2,3,2,S.rt<10?PAL.R:PAL.c,'center');
  for(let i=0;i<2;i++){ctx.fillStyle=i<S.pW?PAL.F:PAL.A;ctx.fillRect(50-i*5,12,3,3);ctx.fillStyle=i<S.cW?PAL.F:PAL.A;ctx.fillRect(75+i*5,12,3,3);}
  meter(4,36,P,false);meter(88,36,C,true);
  for(const p of pops){const k=p.t/p.life;ctx.globalAlpha=k>0.75?(1-k)/0.25:1;const x=Math.max(txtW(p.text,p.sc)/2+1,Math.min(CW-txtW(p.text,p.sc)/2-1,p.x));txt(ctx,p.text,x,Math.round(p.y-k*5),p.sc,p.col,'center');}ctx.globalAlpha=1;
  ctx.restore();}
// ---- input
const KEYS={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',KeyJ:'lt',KeyK:'hv',KeyL:'bl',KeyI:'sp',Space:'lt',Enter:'go'};
function press(k,on){audio();if(on){if(!IN[k])PR[k]=true;IN[k]=true;}else IN[k]=false;const b=document.querySelector(`button.k[data-k="${k}"]`);if(b)b.classList.toggle('on',!!on);}
window.addEventListener('keydown',e=>{const k=KEYS[e.code];if(!k||S.state==='over')return;e.preventDefault();if(!e.repeat)press(k,true);});
window.addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)press(k,false);});
document.querySelectorAll('button.k').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}press(k,true);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>press(k,false)));b.addEventListener('contextmenu',e=>e.preventDefault());});
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(S.state==='select'){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*CW;S.pick=x<43?0:x<85?1:2;pickFighter(S.pick);}});
['touchstart','touchmove','touchend','gesturestart'].forEach(tp=>{cv.addEventListener(tp,e=>e.preventDefault(),{passive:false});$('pad').addEventListener(tp,e=>e.preventDefault(),{passive:false});});
// ---- UI
let lastUi='';function ui(light){const st=`${S.ladder}|${S.won}|${S.round}|${S.P&&S.P.meter>=100}`;if(light&&st===lastUi)return;lastUi=st;
  $('hl').textContent=`FIGHT ${Math.min(S.ladder+1,LADDER)}/${LADDER}`;$('hc').textContent=`WON ${S.won}`;$('ht').textContent=`ROUND ${S.round}`;$('spb').classList.toggle('full',!!(S.state==='fight'&&S.P&&S.P.meter>=100));
  $('best').textContent=`Your best: ${best} of ${LADDER} fights`;$('bestsub').textContent=clears?`Shed cleared ${clears} time${clears===1?'':'s'}`:'Beat the Foreman to clear the shed';
  $('shed').textContent=`${fmt(SHED_EXAMPLE+thwMine)} thwacks landed`;$('mine').textContent=thwMine?`incl. ${fmt(thwMine)} of yours`:'Every thwack adds to it';}
$('again').onclick=$('pa').onclick=()=>{$('ov').classList.remove('on');reset();};
$('invite').onclick=$('pi').onclick=()=>invite(best?`I won ${best} of ${LADDER} fights at Shed Fighter in the My Timber Shed Arcade. Your go.`:'Fancy a go at Shed Fighter in the My Timber Shed Arcade? Grab your timber.');
setupMute($('mute'));pixelTitle($('title'),'SHED FIGHTER');(()=>{const w=$('gwrap'),f=()=>{const r=w.getBoundingClientRect();let k=Math.min((r.width-12)/CW,(r.height-16)/CH);if(!(k>0))k=1;cv.style.width=Math.floor(CW*k)+'px';cv.style.height=Math.floor(CH*k)+'px';};addEventListener('resize',f);f();setTimeout(f,50);})();reset();
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){acc+=Math.min(0.1,(now-last)/1000);last=now;let n=0;while(acc>=STEP&&n<4){update(STEP);acc-=STEP;n++;}if(n===4)acc=0;render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__fight={state:()=>({state:S.state,ladder:S.ladder,won:S.won,round:S.round,pW:S.pW,cW:S.cW,rt:S.rt,me:S.me,opp:S.C&&S.C.id,P:S.P&&{x:S.P.x,y:S.P.y,hp:S.P.hp,meter:S.P.meter,st:S.P.st,sp:S.P.sp&&S.P.sp.ty},C:S.C&&{x:S.C.x,y:S.C.y,hp:S.C.hp,meter:S.C.meter,st:S.C.st},freeze:S.freeze,projs:S.projs.length}),
  fast:n=>{for(let i=0;i<n;i++)update(STEP);render();},press,pick:pickFighter,cpuOff:on=>{window.__cpuOff=on;},set:(o)=>Object.assign(S,o)};
</script></body></html>
