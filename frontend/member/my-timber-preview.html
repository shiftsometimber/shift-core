<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>My Timber Today — isolated preview</title>
  <link rel="stylesheet" href="/member-p0-v1.css?v=7">
  <link rel="stylesheet" href="/member-today-premium-v1.css?v=r3-1">
  <style>
    :root{color-scheme:dark;--ink:#E7E3DA;--muted:#707762;--sage:#707762;--panel:#050505}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#050505;color:var(--ink);font-family:Arial,sans-serif}.preview-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid #707762}.preview-head strong{letter-spacing:.08em}.preview-head span,.muted{color:var(--muted)}.preview-wrap{width:min(760px,100%);margin:auto;padding:24px 16px calc(64px + env(safe-area-inset-bottom))}.preview-auth{padding:22px;border:1px solid #707762;border-radius:20px;background:#050505}.preview-auth h1,.preview-member h1{margin:0 0 12px;font-size:clamp(34px,10vw,56px);line-height:1.02}.preview-auth p{color:#E7E3DA;line-height:1.55}.preview-auth form{display:grid;gap:12px;margin-top:22px}.preview-auth label{display:grid;gap:6px;font-weight:700}.preview-auth input{width:100%;min-height:50px;padding:12px 14px;border:1px solid #707762;border-radius:12px;background:#050505;color:var(--ink);font:inherit}.preview-auth button,.mt-button{min-height:52px;padding:13px 16px;border:1px solid #707762;border-radius:16px;background:#707762;color:#050505;font-size:16px;font-weight:900;text-align:left}.preview-auth button{border-radius:999px;text-align:center}.preview-auth button:disabled,.mt-button:disabled{opacity:.55}.preview-status{min-height:24px}.preview-note,.eyebrow{color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.12em}.preview-member{display:none}.preview-member.is-ready{display:block}#panel-today{display:block!important}#todayActions{min-height:280px}.mt-grid,.mt-actions{display:grid;gap:12px;margin-top:22px}.mt-button.secondary{background:var(--panel);color:var(--ink)}.mt-card{padding:18px;border:1px solid #707762;border-radius:18px;background:var(--panel)}.mt-card h2{margin:0 0 8px;font-size:23px}.mt-card p{margin:6px 0;line-height:1.45}.mt-why{margin:18px 0;padding-left:12px;border-left:3px solid var(--sage);color:#E7E3DA}.mt-back{padding:14px 0;border:0;background:none;color:var(--ink);font:inherit;text-decoration:underline}.mt-saved{padding:18px;border-radius:18px;background:var(--sage);color:#050505}.mt-saved h2{margin:0 0 8px}.mt-error{padding:16px;border:1px solid #707762;border-radius:14px}
  </style>
</head>
<body>
  <header class="preview-head"><strong>SHIFT SOME TIMBER</strong><span>Isolated My Timber preview</span></header>
  <main class="preview-wrap">
    <section class="preview-auth" id="previewAuth">
      <p class="preview-note">PREVIEW ACCOUNT</p>
      <h1>Open My Timber.</h1>
      <p>Create a disposable preview account or sign back into one you already made. Nothing here touches your live Shift account.</p>
      <form id="previewRegister">
        <label>First name<input name="firstName" autocomplete="given-name" value="Matt" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" placeholder="At least 10 characters" required></label>
        <button type="submit" data-auth="register">Create preview account</button>
        <button type="button" data-auth="login">Sign in to preview</button>
        <p class="preview-status" id="previewStatus" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="preview-member" id="previewMember">
      <section class="mp-panel" id="panel-today" aria-labelledby="todayTitle">
        <p class="preview-note">MY TIMBER · TODAY</p>
        <h1 id="todayTitle">What do you need help sorting?</h1>
        <div id="todayActions" aria-busy="true"><p>Opening My Timber…</p></div>
      </section>
    </section>
  </main>
  <script>window.SST_API_BASE=window.location.origin;</script>
  <script src="/api-adapter-v33d.js?v=preview-1"></script>
  <script>
    (function(){
      const auth=document.getElementById('previewAuth'),member=document.getElementById('previewMember'),form=document.getElementById('previewRegister'),msg=document.getElementById('previewStatus'),todayActions=document.getElementById('todayActions'),buttons=[...form.querySelectorAll('button[data-auth]')];
      let memberBoot=null,authResolved=false;
      function memberBootError(){todayActions.setAttribute('aria-busy','false');todayActions.innerHTML='<div class="mt-error"><strong>My Timber did not open.</strong><p>Your tap was not lost. Check your connection, then try again.</p><button type="button" class="mt-button" data-preview-retry>Try again</button></div>'}
      function loadMember(){
        if(memberBoot)return memberBoot;
        memberBoot=new Promise((resolve,reject)=>{
          const s=document.createElement('script');s.src='/member-today-premium-v1.js?v=r3-1';s.async=true;
          s.onload=()=>resolve();s.onerror=()=>{memberBoot=null;memberBootError();reject(new Error('member_bundle_failed'))};
          document.body.appendChild(s);
        });
        return memberBoot;
      }
      function showMember(){authResolved=true;auth.hidden=true;member.classList.add('is-ready');todayActions.setAttribute('aria-busy','true');loadMember().catch(()=>{})}
      async function existing(){try{await SST_API.getMe();if(!authResolved)showMember()}catch{if(!authResolved)auth.hidden=false}}
      async function authenticate(mode){buttons.forEach(button=>button.disabled=true);msg.textContent=mode==='login'?'Signing in…':'Creating isolated preview account…';try{const data=Object.fromEntries(new FormData(form).entries());data.source='my-timber-hosted-preview';await SST_API[mode](data);showMember()}catch(error){msg.textContent=error.code==='email_in_use'?'That account already exists. Tap “Sign in to preview”.':error.message||'That did not work. Check the details and try again.';buttons.forEach(button=>button.disabled=false)}}
      form.addEventListener('submit',event=>{event.preventDefault();authenticate('register')});
      form.querySelector('[data-auth="login"]').addEventListener('click',()=>authenticate('login'));
      document.addEventListener('click',event=>{if(event.target.closest('[data-preview-retry]')){todayActions.setAttribute('aria-busy','true');todayActions.innerHTML='<p>Opening My Timber…</p>';loadMember().catch(()=>{})}});
      existing();
    })();
  </script>
</body>
</html>
