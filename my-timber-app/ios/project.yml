name: MyTimber
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MyTimber:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - target: MyTimberWidget
        embed: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1'
        CURRENT_PROJECT_VERSION: 7
        CODE_SIGN_ENTITLEMENTS: HealthKit.entitlements
        MARKETING_VERSION: 1.0.0
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: uk.co.shiftsometimber.mytimber.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: uk.co.shiftsometimber.mytimber
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: My Timber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: My Timber
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: Take a photo you choose to upload to your My Timber account.
        NSHealthShareUsageDescription: Preview your heart rate, blood pressure and weight, then choose the readings to save to your private My Timber account. This is optional and is not clinical monitoring.
        NSHealthUpdateUsageDescription: My Timber does not write or change Apple Health data. You can choose to save copies of selected readings to your private My Timber account.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.shiftsometimber.mytimber.shortcuts
            CFBundleURLSchemes:
              - mytimber
  MyTimberWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: uk.co.shiftsometimber.mytimber.dev.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: uk.co.shiftsometimber.mytimber.widget
    info:
      path: GeneratedWidgetInfo.plist
      properties:
        CFBundleDisplayName: My Timber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  MyTimber:
    build:
      targets:
        MyTimber: all
