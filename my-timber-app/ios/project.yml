name: MyTimber
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MyTimber:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1'
        CURRENT_PROJECT_VERSION: 3
        CODE_SIGN_ENTITLEMENTS: HealthKit.entitlements
        MARKETING_VERSION: 1.0.0
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: uk.co.shiftsometimber.mytimber.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: uk.co.shiftsometimber.mytimber
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: My Timber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSCameraUsageDescription: Take a photo you choose to upload to your My Timber account.
        NSHealthShareUsageDescription: Preview your heart rate, blood pressure and weight, then choose the readings to save to your private My Timber account. This is optional and is not clinical monitoring.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  MyTimber:
    build:
      targets:
        MyTimber: all
