plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'uk.co.shiftsometimber.mytimber'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'uk.co.shiftsometimber.mytimber'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            buildConfigField 'String', 'HEALTH_TEST_ORIGIN', groovy.json.JsonOutput.toJson(providers.gradleProperty('myTimberHealthTestOrigin').getOrElse(''))
        }
        release {
            debuggable false
            minifyEnabled false
            buildConfigField 'String', 'HEALTH_TEST_ORIGIN', '""'
        }
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
// Final package identity is reserved in source. Store signing/publishing credentials
// are intentionally absent; an unsigned release compile is evidence, not deployment.
