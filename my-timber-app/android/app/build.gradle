plugins { id 'com.android.application' }
android {
    namespace 'uk.co.shiftsometimber.mytimber'
    compileSdk 36
    defaultConfig {
        applicationId 'uk.co.shiftsometimber.mytimber'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
}
// Final package identity is reserved in source. Store signing/publishing credentials
// are intentionally absent; an unsigned release compile is evidence, not deployment.
