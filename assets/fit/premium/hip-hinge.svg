<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Hip hinge — START, MOVE, FINISH</title><desc id="desc">Three-state coaching sequence showing tall standing, hips moving backward with a long neutral torso and soft knees, then squeezing the hips forward to return to tall standing.</desc><rect width="1200" height="420" rx="28" fill="#10261a"/><g font-family="Arial,sans-serif"><text x="48" y="54" fill="#c7eb16" font-size="18" font-weight="800">SHIFT FIT · HIP HINGE</text><text x="48" y="86" fill="#fff" font-size="20">Soften the knees. Send hips back. Keep your spine long. Drive hips forward to stand.</text></g><g fill="#fffdf8" stroke="#173c29" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><rect x="38" y="112" width="350" height="270" rx="20" stroke="none"/><circle cx="213" cy="178" r="22" fill="#e9efe4"/><path d="M213 201v70m0-42-46 20m46-20 46 20m-46 22-32 68m32-68 32 68" fill="none"/><rect x="425" y="112" width="350" height="270" rx="20" stroke="none"/><circle cx="620" cy="190" r="22" fill="#e9efe4"/><path d="M603 210l-62 50m35-28-52 4m52-4 36 32m-71-4 15 79m-15-79 74 79" fill="none"/><path d="M665 224l54 0" fill="none" stroke="#c7eb16"/><rect x="812" y="112" width="350" height="270" rx="20" stroke="none"/><circle cx="987" cy="178" r="22" fill="#e9efe4"/><path d="M987 201v70m0-42-46 20m46-20 46 20m-46 22-32 68m32-68 32 68" fill="none"/></g><g font-family="Arial" font-size="16" font-weight="800" fill="#173c29"><text x="62" y="148">START</text><text x="449" y="148">MOVE</text><text x="836" y="148">FINISH</text></g><g font-family="Arial" font-size="14" fill="#53624d"><text x="62" y="360">Tall stance · soft knees</text><text x="449" y="360">Hips travel back · spine long</text><text x="836" y="360">Hips forward · finish tall</text></g></svg>