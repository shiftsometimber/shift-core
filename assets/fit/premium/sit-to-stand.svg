<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Sit to stand — START, MOVE, FINISH</title><desc id="desc">Three-state coaching sequence showing a man seated near the front of a sturdy chair, leaning forward and driving through both feet, then standing tall.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#10261a"/><stop offset="1" stop-color="#244f38"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".16"/></filter></defs><rect width="1200" height="420" rx="28" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="48" y="54" fill="#c7eb16" font-size="18" font-weight="800" letter-spacing="2">SHIFT FIT · SIT TO STAND</text><text x="48" y="86" fill="#fff" font-size="20">Feet planted. Lean forward. Stand tall without throwing yourself up.</text></g><g transform="translate(38 112)" filter="url(#shadow)"><rect width="350" height="270" rx="20" fill="#fffdf8"/><text x="24" y="38" font-family="Arial" font-size="16" font-weight="800" fill="#173c29">START</text><g stroke="#173c29" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="176" cy="83" r="22" fill="#e9efe4"/><path d="M176 106v58l-44 34m44-34 52 34M176 128l-45 20m45-20 39 23"/><path d="M114 198h124M123 198v45m106-45v45" stroke="#8b9670"/></g><path d="M96 244h164" stroke="#c8c1b7" stroke-width="5"/><text x="24" y="248" font-family="Arial" font-size="14" fill="#53624d">Sit near the front · feet slightly back</text></g><g transform="translate(425 112)" filter="url(#shadow)"><rect width="350" height="270" rx="20" fill="#fffdf8"/><text x="24" y="38" font-family="Arial" font-size="16" font-weight="800" fill="#173c29">MOVE</text><g stroke="#173c29" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="185" cy="77" r="22" fill="#e9efe4"/><path d="M175 99l-21 58-48 27m48-27 61 23M159 126l-48 15m48-15 43 10"/><path d="M95 184h139M105 184v59m120-59v59" stroke="#8b9670"/></g><path d="M90 244h170" stroke="#c8c1b7" stroke-width="5"/><path d="M244 124l38-30m-8 0 8 0 0 8" stroke="#c7eb16" stroke-width="6" fill="none"/><text x="24" y="248" font-family="Arial" font-size="14" fill="#53624d">Nose forward · push the floor away</text></g><g transform="translate(812 112)" filter="url(#shadow)"><rect width="350" height="270" rx="20" fill="#fffdf8"/><text x="24" y="38" font-family="Arial" font-size="16" font-weight="800" fill="#173c29">FINISH</text><g stroke="#173c29" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="176" cy="68" r="22" fill="#e9efe4"/><path d="M176 91v82m0-42-43 20m43-20 43 20m-43 22-33 69m33-69 34 69"/></g><path d="M112 244h128" stroke="#c8c1b7" stroke-width="5"/><text x="24" y="248" font-family="Arial" font-size="14" fill="#53624d">Stand tall · hips and knees comfortably straight</text></g></svg>