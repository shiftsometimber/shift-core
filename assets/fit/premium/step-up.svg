<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Step-Up — START, MOVE, FINISH</title><desc id="desc">Three-state Shift Fit coaching sequence for Step-Up. Put the whole foot on the step. Lean forward slightly, drive through the foot on the step and stand tall on top; lower yourself back down under control.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10261a"/><stop offset="1" stop-color="#244f38"/></linearGradient><filter id="shadow"><feDropShadow dy="7" stdDeviation="9" flood-opacity=".18"/></filter></defs><rect width="1200" height="420" rx="30" fill="url(#bg)"/><text x="38" y="48" fill="#c7eb16" font-family="Arial,sans-serif" font-size="17" font-weight="800">SHIFT FIT · STEP-UP</text><text x="38" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="16">Put the whole foot on the step. Lean forward slightly, drive through the foot on the step and stand tall on top;</text><g filter="url(#shadow)"><g transform="translate(35 118)"><rect width="350" height="270" rx="22" fill="#fffdf8"/><text x="24" y="35" fill="#173c29" font-family="Arial,sans-serif" font-size="16" font-weight="800">START</text><circle cx="175" cy="88" r="24" fill="#d7b08a" stroke="#173c29" stroke-width="4"/><path d="M175 116l0 80m0-55l-58 20m0-34l58 20m-0 70l-42 73m0-64l47 73" stroke="#173c29" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M175 116l0 80" stroke="#eef4e8" stroke-width="28" stroke-linecap="round"/><path d="M175 116l0 80" stroke="#173c29" stroke-width="4" stroke-linecap="round"/><text x="20" y="248" fill="#53624d" font-family="Arial,sans-serif" font-size="13">whole working foot on step · support available if needed</text></g><g transform="translate(425 118)"><rect width="350" height="270" rx="22" fill="#fffdf8"/><text x="24" y="35" fill="#173c29" font-family="Arial,sans-serif" font-size="16" font-weight="800">MOVE</text><circle cx="158" cy="97" r="24" fill="#d7b08a" stroke="#173c29" stroke-width="4"/><path d="M158 125l8 80m0-55l-41 34m8-34l59 16m-8 70l-51 64m8-64l62 61" stroke="#173c29" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M158 125l8 80" stroke="#eef4e8" stroke-width="28" stroke-linecap="round"/><path d="M158 125l8 80" stroke="#173c29" stroke-width="4" stroke-linecap="round"/><text x="20" y="248" fill="#53624d" font-family="Arial,sans-serif" font-size="13">body rises primarily from step leg · knee tracks with foot</text></g><g transform="translate(815 118)"><rect width="350" height="270" rx="22" fill="#fffdf8"/><text x="24" y="35" fill="#173c29" font-family="Arial,sans-serif" font-size="16" font-weight="800">FINISH</text><circle cx="175" cy="88" r="24" fill="#d7b08a" stroke="#173c29" stroke-width="4"/><path d="M175 116l0 80m0-55l-58 20m0-34l58 20m-0 70l-42 73m0-64l47 73" stroke="#173c29" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M175 116l0 80" stroke="#eef4e8" stroke-width="28" stroke-linecap="round"/><path d="M175 116l0 80" stroke="#173c29" stroke-width="4" stroke-linecap="round"/><text x="20" y="248" fill="#53624d" font-family="Arial,sans-serif" font-size="13">stand controlled on step · lower under control</text></g></g><rect x="500" y="305" width="150" height="45" rx="8" fill="#8b9670"/><path d="M393 250h26m365 0h26" stroke="#c7eb16" stroke-width="7" stroke-linecap="round"/><path d="M411 242l9 8-9 8M802 242l9 8-9 8" fill="none" stroke="#c7eb16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>