<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Squat — START, MOVE, FINISH</title><desc id="desc">Three-state coaching sequence showing a standing start, hips sitting back and down with knees tracking over feet, then returning to tall standing.</desc><rect width="1200" height="420" rx="28" fill="#10261a"/><g font-family="Arial,sans-serif"><text x="48" y="54" fill="#c7eb16" font-size="18" font-weight="800">SHIFT FIT · SQUAT</text><text x="48" y="86" fill="#fff" font-size="20">Brace gently. Sit hips back and down. Keep knees tracking with toes. Stand tall.</text></g><g fill="#fffdf8" stroke="#173c29" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><rect x="38" y="112" width="350" height="270" rx="20" stroke="none"/><circle cx="213" cy="178" r="22" fill="#e9efe4"/><path d="M213 201v70m0-42-48 22m48-22 48 22m-48 20-34 68m34-68 34 68" fill="none"/><rect x="425" y="112" width="350" height="270" rx="20" stroke="none"/><circle cx="600" cy="184" r="22" fill="#e9efe4"/><path d="M600 207l-18 56m18-34-48 18m48-18 44 22m-62 12-54 42m54-42 58 42m-112 0-17 34m129-34 17 34" fill="none"/><rect x="812" y="112" width="350" height="270" rx="20" stroke="none"/><circle cx="987" cy="178" r="22" fill="#e9efe4"/><path d="M987 201v70m0-42-48 22m48-22 48 22m-48 20-34 68m34-68 34 68" fill="none"/></g><g font-family="Arial" font-size="16" font-weight="800" fill="#173c29"><text x="62" y="148">START</text><text x="449" y="148">MOVE</text><text x="836" y="148">FINISH</text></g><g font-family="Arial" font-size="14" fill="#53624d"><text x="62" y="360">Feet planted · ribs stacked</text><text x="449" y="360">Hips back/down · knees track toes</text><text x="836" y="360">Drive floor away · stand tall</text></g></svg>