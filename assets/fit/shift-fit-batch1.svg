idth="260" height="260"/><text class="n" x="40" y="285">BOX SQUAT</text></g><g transform="translate(290 60)"><use href="#wall-pushup" x="0" y="0" width="260" height="260"/><text class="n" x="30" y="285">WALL PUSH-UP</text></g><g transform="translate(580 60)"><use href="#band-row" x="0" y="0" width="260" height="260"/><text class="n" x="25" y="285">BAND ROW</text></g><g transform="translate(870 60)"><use href="#dead-bug" x="0" y="0" width="260" height="260"/><text class="n" x="45" y="285">DEAD BUG</text></g><text class="n" x="0" y="410">Purpose-built Shift instructional line system. Each exercise still requires human visual review before production publication.</text></g></svg>