name: Final V1 Gate 2 Reconciliation
on:
  pull_request:
    paths:
      - 'reconcile-final-v1-gate2-board.mjs'
      - 'final-v1-gate2-reconciliation-source-gate.mjs'
      - '.github/workflows/final-v1-production-publication.yml'
      - '.github/workflows/final-v1-gate2-reconciliation.yml'
      - 'docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md'
      - 'docs/LAUNCH-FINISH-LINE.md'
      - 'docs/V1-RELEASE-BLOCKER-BOARD-V2.md'
      - 'docs/V1-RELEASE-BLOCKER-COUNTS.txt'
  push:
    branches: [main]
    paths:
      - 'reconcile-final-v1-gate2-board.mjs'
      - 'final-v1-gate2-reconciliation-source-gate.mjs'
      - '.github/workflows/final-v1-production-publication.yml'
      - '.github/workflows/final-v1-gate2-reconciliation.yml'
permissions:
  contents: read
jobs:
  exact-final-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Prove exact-production evidence can reconcile only the final four AMBER rows
        run: node final-v1-gate2-reconciliation-source-gate.mjs
      - name: Preserve current authoritative pre-production scoreboard
        run: node finish-line-gate.mjs
