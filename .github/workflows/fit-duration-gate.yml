name: Fit Duration Gate
on:
  pull_request:
    paths:
      - 'fit-duration-v1.js'
      - 'fit-duration-unit-gate.mjs'
      - 'member-product-v8.js'
      - 'worker-entry-v6.js'
      - '.github/workflows/fit-duration-gate.yml'
  push:
    branches: [main]
    paths:
      - 'fit-duration-v1.js'
      - 'fit-duration-unit-gate.mjs'
      - 'member-product-v8.js'
      - 'worker-entry-v6.js'
      - '.github/workflows/fit-duration-gate.yml'
jobs:
  fit-duration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: 10/15/20/30/45/60-minute duration composition regression
        run: node fit-duration-unit-gate.mjs
      - name: Syntax-check duration-aware runtime layer
        run: node --check member-product-v8.js && node --check worker-entry-v6.js
