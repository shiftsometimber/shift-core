name: Current Pages and published catalogue inventory
on:
  push:
    branches: [codex/full-website-content-20261002]
    paths: [release/content-closeout/platform-inventory.mjs, .github/workflows/platform-content-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund
      - name: Read current Pages identity and database metadata
        run: node release/content-closeout/platform-inventory.mjs
      - name: Read published editorial records only
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT id,title,slug,category,author,status,summary,body,seo_title,publish_at,updated_at FROM knowledge_articles WHERE status='published' AND publish_at IS NOT NULL ORDER BY id;" > platform-content-inventory/articles.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT id,content_type,title,status,version,data_json,review_json FROM structured_content WHERE content_type IN ('recipe','exercise') AND status='published' ORDER BY content_type,id;" > platform-content-inventory/catalogue.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-content-inventory-${{ github.sha }}
          path: platform-content-inventory/
          retention-days: 90
