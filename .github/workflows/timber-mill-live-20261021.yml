name: Publish approved Timber Mill page
on:
  push:
    branches: [release/timber-mill-presentation-20261021]
    paths:
      - .github/workflows/timber-mill-live-20261021.yml
      - previews/timber-mill/deploy-live.mjs
      - previews/timber-mill/check-live.cjs
permissions:
  contents: read
  actions: read
concurrency:
  group: timber-mill-live-20261021
  cancel-in-progress: false
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          sparse-checkout: previews/timber-mill
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify the unchanged approved product code
        run: |
          node previews/timber-mill/build.cjs
          git diff --exit-code -- previews/timber-mill/content.mjs
          node --test previews/timber-mill/test.mjs
      - name: Use the official prebuilt browsers with the matching Playwright client
        run: |
          mkdir -p "$RUNNER_TEMP/timber-mill-browser"
          npm install --prefix "$RUNNER_TEMP/timber-mill-browser" playwright@1.58.2 --no-audit --no-fund
      - name: Publish only the exact accepted shop page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node previews/timber-mill/deploy-live.mjs release
      - name: Verify actual live colour selection on mobile and desktop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/timber-mill-browser/node_modules/playwright
        run: node previews/timber-mill/check-live.cjs
      - name: Restore only this release's routes if acceptance fails
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/timber-mill/deploy-live.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timber-mill-live-${{ github.sha }}
          path: timber-mill-live-evidence/
          if-no-files-found: warn
          retention-days: 90
