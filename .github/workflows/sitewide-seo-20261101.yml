name: Every public page SEO closeout
on:
  push:
    branches: [release/sitewide-seo-20261101]
    paths: ['sitewide-seo-20261101/**', '.github/workflows/sitewide-seo-20261101.yml']
permissions:
  contents: read
concurrency:
  group: sitewide-seo-read-only-20261101
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --check sitewide-seo-20261101/capture.mjs
      - name: Capture every public document and discover internal destinations
        run: node sitewide-seo-20261101/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-seo-${{ github.run_id }}
          path: sitewide-seo-evidence/
          retention-days: 90
