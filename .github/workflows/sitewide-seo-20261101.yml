name: Every public page SEO closeout
on:
  push:
    branches: [release/sitewide-seo-20261101]
    paths: ['sitewide-seo-20261101/**', '.github/workflows/sitewide-seo-20261101.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate and verify the bounded public SEO repairs
        run: |
          node --check sitewide-seo-20261101/runtime.mjs
          node --check sitewide-seo-20261101/deploy.mjs
          node --test sitewide-seo-20261101/*.test.mjs
      - name: Capture every public document and discover internal destinations
        if: contains(github.event.head_commit.message, '[seo capture]')
        run: node sitewide-seo-20261101/capture.mjs
      - name: Preserve current owners, deploy and verify public SEO repairs
        if: "!contains(github.event.head_commit.message, '[seo capture]')"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix seo-page-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node sitewide-seo-20261101/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-seo-${{ github.run_id }}
          path: sitewide-seo-evidence/
          retention-days: 90
