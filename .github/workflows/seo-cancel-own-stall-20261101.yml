name: Stop only the unpromoted stalled SEO check
on:
  push:
    branches: [release/sitewide-seo-20261101]
    paths: ['.github/workflows/seo-cancel-own-stall-20261101.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop-owned-unpromoted-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prove no SEO Worker was promoted before stopping this exact run
        run: |
          node seo-owner-state-20261101.mjs
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('seo-owner-evidence/owners.json'));assert(r.workers.length===21);assert(r.workers.every(w=>!w.seoInstalled));"
          cp seo-owner-evidence/owners.json seo-owner-evidence/owners-before.json
        env:
          SEO_OWNER_CHECK_ONLY: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Cancel only the known stalled unpromoted verification run
        run: gh api --method POST repos/shiftsometimber/shift-core/actions/runs/41338885199/cancel
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Confirm ordinary traffic still has no SEO promotion
        run: |
          node seo-owner-state-20261101.mjs
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const r=JSON.parse(fs.readFileSync('seo-owner-evidence/owners.json'));assert(r.workers.every(w=>!w.seoInstalled));"
        env:
          SEO_OWNER_CHECK_ONLY: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-stall-stop-${{ github.run_id }}
          path: seo-owner-evidence/
          retention-days: 30
