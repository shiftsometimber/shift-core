name: Matched homepage speed preview
on:
  push:
    branches: [fix/home-speed-20260927]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Freeze current public bytes and check CSS provenance
        run: node preview/home-speed/build.mjs
      - name: Deploy read-only matched preview
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          npx wrangler deploy --config preview/home-speed/wrangler.jsonc | tee reta-proof/deploy.log
          echo "PREVIEW_URL=$(grep -oE 'https://shift-home-speed-preview\.[a-z0-9-]+\.workers\.dev' reta-proof/deploy.log | head -1)" >> "$GITHUB_ENV"
      - run: npm install --prefix "$RUNNER_TEMP/perf" --no-audit --no-fund playwright@1.63.0 lighthouse@12.8.2
      - run: '"$RUNNER_TEMP/perf/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Verify exact appearance and public controls
        run: SEO_TOOLS="$RUNNER_TEMP/perf" node preview/home-speed/verify.cjs
      - name: Three interleaved mobile samples per variant
        run: |
          export CHROME_PATH=$(node -e "console.log(require(process.env.RUNNER_TEMP+'/perf/node_modules/playwright').chromium.executablePath())")
          for n in 1 2 3; do
            for mode in baseline candidate; do
              flag=0; if [ "$mode" = baseline ]; then flag=1; fi
              node "$RUNNER_TEMP/perf/node_modules/lighthouse/cli/index.js" "$PREVIEW_URL/?__seo_baseline=$flag" --only-categories=performance --output=json --output-path="reta-proof/$mode-$n.json" '--chrome-flags=--headless --no-sandbox' --quiet
            done
          done
          python3 - <<'PY'
          import pathlib,json,statistics
          out={}
          for mode in ['baseline','candidate']:
            rows=[]
            for n in [1,2,3]:
              d=json.loads(pathlib.Path(f'reta-proof/{mode}-{n}.json').read_text());assert not d.get('runtimeError');a=d['audits'];rows.append({'lcp':a['largest-contentful-paint']['numericValue'],'cls':a['cumulative-layout-shift']['numericValue'],'tbt':a['total-blocking-time']['numericValue'],'score':d['categories']['performance']['score']*100})
            out[mode]={'runs':rows,'median':{k:statistics.median(x[k] for x in rows) for k in rows[0]}}
          print(json.dumps(out,indent=2));pathlib.Path('reta-proof/matched-speed.json').write_text(json.dumps(out,indent=2))
          assert out['candidate']['median']['lcp']<out['baseline']['median']['lcp']
          assert out['candidate']['median']['cls']<=out['baseline']['median']['cls']+0.01
          PY
      - name: Checksum evidence
        if: always()
        run: find reta-proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > reta-proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-speed-preview-${{ github.sha }}
          path: reta-proof/
          retention-days: 90
