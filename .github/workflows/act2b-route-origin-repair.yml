name: Act2B Route Origin Repair
# The Pages fallthrough is already installed. Keep the diagnostic check without
# automatically rewriting and pushing the Worker after every production commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify retained Pages fallthrough
        shell: bash
        run: |
          set -euo pipefail
          node --check worker-entry-v6.js
          grep -q ACT2B_PAGES_CONTENT_FALLTHROUGH worker-entry-v6.js
      - name: Diagnose Pages origin and public FAQ and tools
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://projectshift.pages.dev https://shiftsometimber.co.uk; do
            for route in /faq/are-carbs-bad /tools/bmi; do
              code=$(curl --max-time 30 -sS -L -o /tmp/act2b-route -w '%{http_code}' "$origin$route")
              echo "$origin$route HTTP $code"
              if [ "$code" != "200" ] || [ ! -s /tmp/act2b-route ]; then
                echo 'Route probe failed. Source was not changed; investigate through a reviewed pull request.'
                exit 1
              fi
            done
          done
      - name: Verify working tree is unchanged
        run: git diff --exit-code
