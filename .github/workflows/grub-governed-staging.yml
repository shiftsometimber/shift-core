name: Shift Grub Governed Staging Gate
on:
  pull_request:
    paths:
      - 'industrial-grub-governed-staging-v1.mjs'
      - 'industrial-catalogue-v7.js'
      - 'industrial-grub-systemic-v3.mjs'
      - 'grub-canonical-approval-registry-v1.mjs'
      - 'cofid-industrial-extract.py'
      - 'structured-content-v1.js'
      - '.github/workflows/grub-governed-staging.yml'
jobs:
  governed-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Prepare authoritative CoFID 2021 index
        run: |
          python3 -m pip install --quiet openpyxl
          python3 cofid-industrial-extract.py /tmp/cofid-index.json
      - name: Stage current governed Grub cohort without publication bypass
        env:
          COFID_INDEX: /tmp/cofid-index.json
        run: node industrial-grub-governed-staging-v1.mjs
