name: Release approved Website Audit revision 1
on:
  push:
    branches: [release/website-audit-revision-1-20261107]
    paths: ['.github/workflows/website-audit-revision-1-release.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  public_release:
    if: github.repository == 'shiftsometimber/shift-core' && github.actor_id == '315011648'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CLOUDFLARE_ACCOUNT_ID: '9e5386dcf455be34c582d93f8bfc79e6'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Qualify the approved previews and verify live bodies and policy
        run: node release/website-audit-r1-20261107/publish.mjs
      - name: Restore this release's route changes on failure
        if: failure()
        run: node release/website-audit-r1-20261107/publish.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-audit-revision-1-${{ github.run_id }}
          path: website-audit-revision-1-proof/
          if-no-files-found: warn
          retention-days: 90
