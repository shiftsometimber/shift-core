name: Publish requested GLP-1 anaesthesia article
on:
  push:
    branches: [content/glp1-anaesthesia-20260918]
    paths:
      - '.github/workflows/glp1-anaesthesia-article.yml'
      - 'editorial/glp1-anaesthesia-20260918.mjs'
      - 'scripts/publish-glp1-anaesthesia-20260918.mjs'
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Guard source and content-only scope
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1db6f79484269266fdc95c52f4abf6ed1ac5a9ae
          python3 - <<'PY'
          import subprocess
          allowed={'.github/workflows/glp1-anaesthesia-article.yml','editorial/glp1-anaesthesia-20260918.mjs','scripts/publish-glp1-anaesthesia-20260918.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only','1db6f79484269266fdc95c52f4abf6ed1ac5a9ae','HEAD'],text=True).splitlines())
          assert changed<=allowed, changed-allowed
          PY
      - name: Verify article and existing publication path offline
        run: node scripts/publish-glp1-anaesthesia-20260918.mjs
      - name: Publish this article through existing publication core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publish-glp1-anaesthesia-20260918.mjs --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glp1-anaesthesia-publication-proof
          path: glp1-anaesthesia-publication-proof.json
