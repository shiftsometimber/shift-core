name: Growth and member experience PREVIEW ONLY
on:
  push:
    branches: [preview/growth-member-experience-20260927, release/growth-member-20260928]
permissions:
  contents: read
concurrency:
  group: stabilisation-life-back-preview-only
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      PREVIEW_SOURCE_SHA: ${{ github.sha }}
      PREVIEW_URL: https://shift-stabilisation-preview.matobrien.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Protect member loops and public shell
        run: node --test member-experience/tests/*.test.mjs member-experience/staging/*.test.mjs tests/public-shell-contract.test.mjs tests/public-continuity.test.mjs tests/growth-release.test.mjs
      - name: Capture current public pages and prepare isolated member source
        run: node preview/stabilisation/prepare.mjs
      - name: Apply only the reviewed growth copy to current captured pages
        run: node preview/growth-member/prepare.mjs
      - name: Use existing isolated fictional databases only
        run: node preview/five-points/provision.mjs
      - name: Deploy preview only
        run: npx wrangler deploy --config work/staging/generated/config.json
      - run: npm install --prefix "$RUNNER_TEMP/growth-tools" --no-audit --no-fund playwright@1.58.2
      - run: '"$RUNNER_TEMP/growth-tools/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Check public pages and actual negative-feedback persistence
        run: GROWTH_TOOLS="$RUNNER_TEMP/growth-tools" node preview/growth-member/verify.cjs
      - name: Evidence checksum
        if: always()
        run: |
          mkdir -p work/staging/generated/growth-evidence
          find work/staging/generated/growth-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > work/staging/generated/growth-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-member-preview-${{ github.sha }}
          path: work/staging/generated/growth-evidence/
          retention-days: 30
