name: Gate 1 Rendered Browser Acceptance
on:
  pull_request:
    paths:
      - 'gate1-rendered-browser-production.mjs'
      - 'gate1-authenticated-rendered-production.mjs'
      - 'gate1-overflow-diagnostic.mjs'
      - 'gate1-overflow-direct-diagnostic.mjs'
      - '.github/workflows/gate1-rendered-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  authenticated-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Run authenticated member rendered RC acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          AUTH_RENDER_EVIDENCE_DIR: auth-render-evidence
        run: node gate1-authenticated-rendered-production.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-authenticated-rendered-evidence
          path: auth-render-evidence
          retention-days: 14
  overflow-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Pinpoint populated authenticated horizontal overflow directly
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          OVERFLOW_EVIDENCE_DIR: overflow-evidence
        run: node gate1-overflow-direct-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-overflow-diagnostic-evidence
          path: overflow-evidence
          retention-days: 14
  live-static-source-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retain current production member shell and CSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-static-evidence
          curl -fsSL 'https://shiftsometimber.co.uk/member/dashboard?release=33d#today' -o live-static-evidence/member-dashboard.html
          curl -fsSL 'https://shiftsometimber.co.uk/styles.css?v=30n' -o live-static-evidence/styles.css
          curl -fsSL 'https://shiftsometimber.co.uk/member-product-v33d.css?v=33h' -o live-static-evidence/member-product-v33d.css
          curl -fsSL 'https://shiftsometimber.co.uk/one-shift-v34.css?v=34a' -o live-static-evidence/one-shift-v34.css
          printf 'Captured UTC: '; date -u +%FT%TZ
          wc -c live-static-evidence/*
      - uses: actions/upload-artifact@v4
        with:
          name: gate1-live-static-source-evidence
          path: live-static-evidence
          retention-days: 14
  public-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium firefox webkit
      - env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          RENDER_EVIDENCE_DIR: render-evidence
        run: node gate1-rendered-browser-production.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-rendered-production-evidence
          path: render-evidence
          retention-days: 14
