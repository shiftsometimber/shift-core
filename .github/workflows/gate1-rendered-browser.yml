name: Gate 1 Rendered Browser Acceptance
# Retained commissioning coverage: Gate 1 state/rendered + G2-012 Progress units + G3-008 authenticated accessibility
on:
  pull_request:
    paths:
      - 'gate1-rendered-browser-production.mjs'
      - 'gate1-state-system-production.mjs'
      - 'gate1-fit-network-diagnostic.mjs'
      - 'v1-accessibility-performance-production.mjs'
      - 'g2-012-progress-units-production.mjs'
      - 'g2-012-progress-units-rendered-v9.mjs'
      - 'g3-008-accessibility-production.mjs'
      - 'g3-008-stylesheet-source-proof.mjs'
      - 'frontend/member/member-p0-v1.css'
      - 'member-contrast-static-v1.js'
      - '.github/workflows/gate1-rendered-browser.yml'
  push:
    branches: [main]
    paths:
      - 'g3-008-accessibility-production.mjs'
      - 'g3-008-stylesheet-source-proof.mjs'
      - 'frontend/member/member-p0-v1.css'
      - 'member-contrast-static-v1.js'
      - '.github/workflows/gate1-rendered-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  accessibility-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run V1 accessibility performance floor
        run: node v1-accessibility-performance-production.mjs
      - name: Upload accessibility performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-accessibility-performance-evidence
          path: v1-ap-evidence
          if-no-files-found: warn
          retention-days: 14

  g2-012-progress-units:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc_progress
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run G2-012 rendered Progress unit retention acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc_progress.outputs.token }}
          PROGRESS_UNIT_EVIDENCE_DIR: progress-unit-evidence
        run: node g2-012-progress-units-production.mjs
      - name: Upload G2-012 rendered Progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-012-progress-unit-evidence
          path: progress-unit-evidence
          if-no-files-found: warn
          retention-days: 30

  rendered-state-system:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Verify candidate G3-008 repair is in Git authority
        run: |
          node -e "const fs=require('fs');const css=fs.readFileSync('frontend/member/member-p0-v1.css','utf8');const worker=fs.readFileSync('member-contrast-static-v1.js','utf8');for(const [n,s] of [['css primary','html body .mp-btn:not(.ghost)'],['css control','html body .member-form input'],['worker primary','html body .mp-btn:not(.ghost)'],['worker control','html body .member-form input']]){const src=n.startsWith('css')?css:worker;if(!src.includes(s))throw new Error('missing '+n+' '+s)}console.log('PASS candidate G3-008 high-specificity repair present in canonical asset + worker append')"
      - name: Install browser harness
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Run focused Fit production network diagnostic
        continue-on-error: true
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          STATE_EVIDENCE_DIR: state-system-evidence
        run: node gate1-fit-network-diagnostic.mjs
      - name: Run G1-008 rendered loading and empty-state acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          STATE_EVIDENCE_DIR: state-system-evidence
        run: node gate1-state-system-production.mjs
      - name: Prove live G3-008 stylesheet source
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
        run: node g3-008-stylesheet-source-proof.mjs
      - name: Run G3-008 authenticated accessibility production acceptance
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          G3_008_EVIDENCE_DIR: g3-008-accessibility-evidence
        run: node g3-008-accessibility-production.mjs
      - name: Upload G3-008 accessibility evidence
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: g3-008-accessibility-evidence
          path: g3-008-accessibility-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Upload state-system evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-state-system-production-evidence
          path: state-system-evidence
          if-no-files-found: warn
          retention-days: 14

  rendered-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install browser harness
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Run rendered production acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          RENDER_EVIDENCE_DIR: render-evidence
        run: node gate1-rendered-browser-production.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-rendered-production-evidence
          path: render-evidence
          if-no-files-found: warn
          retention-days: 14
