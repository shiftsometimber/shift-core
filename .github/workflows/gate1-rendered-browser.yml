name: Gate 1 Rendered Browser Acceptance
on:
  pull_request:
    paths:
      - 'gate1-rendered-browser-production.mjs'
      - 'v1-accessibility-performance-production.mjs'
      - 'v1-authenticated-accessibility-performance-production.mjs'
      - '.github/workflows/gate1-rendered-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  accessibility-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run V1 accessibility performance floor
        run: node v1-accessibility-performance-production.mjs
      - name: Upload accessibility performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-accessibility-performance-evidence
          path: v1-ap-evidence
          if-no-files-found: warn
          retention-days: 14
  authenticated-accessibility-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run authenticated member accessibility/performance acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
        run: node v1-authenticated-accessibility-performance-production.mjs
      - name: Upload authenticated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-accessibility-performance-evidence
          path: v1-auth-ap-evidence
          if-no-files-found: warn
          retention-days: 14
  rendered-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install browser harness
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium firefox webkit
      - name: Run rendered production acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          RENDER_EVIDENCE_DIR: render-evidence
        run: node gate1-rendered-browser-production.mjs
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-rendered-production-evidence
          path: render-evidence
          if-no-files-found: warn
          retention-days: 14
