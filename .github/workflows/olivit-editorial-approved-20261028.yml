name: Approved Olivit supplement explanations and discovery release
on:
  push:
    branches: [release/olivit-editorial-approved-20261028]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check scoped release code and install the pinned compiler
        run: |
          node --check release/olivit-nutrition-20261027/editorial-release.mjs
          npm ci --ignore-scripts
          node -e "require('node:assert/strict').equal(require('./node_modules/wrangler/package.json').version,'4.112.0')"
          npm install --prefix "$RUNNER_TEMP/shift-browser" --no-save --ignore-scripts puppeteer-core@25.12.0
          echo "SHIFT_PUPPETEER_MODULE=$RUNNER_TEMP/shift-browser/node_modules/puppeteer-core" >> "$GITHUB_ENV"
          echo "SHIFT_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify exact prior evidence, capture serving ownership and stage the approved version
        run: node release/olivit-nutrition-20261027/editorial-release.mjs settings
      - name: Promote the captured Health component only
        if: ${{ false }}
        run: node release/olivit-nutrition-20261027/editorial-release.mjs promote
      - name: Verify all eight live guides, sitemap and purchasing holds in Chrome
        if: ${{ false }}
        timeout-minutes: 3
        env:
          SHIFT_BROWSER_EVIDENCE: health-editorial-release/browser-live
        run: node release/olivit-nutrition-20261027/browser-integrated.mjs
      - name: Verify provider bytes and preservation after live browser checks
        if: ${{ false }}
        run: node release/olivit-nutrition-20261027/editorial-release.mjs verify
      - name: Restore only our own promoted component if verification fails
        if: ${{ always() && (failure() || cancelled()) }}
        run: node release/olivit-nutrition-20261027/editorial-release.mjs rollback
      - name: Retain exact release receipts and live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olivit-editorial-approved-${{ github.run_id }}
          path: health-editorial-release/
          if-no-files-found: warn
          retention-days: 90
