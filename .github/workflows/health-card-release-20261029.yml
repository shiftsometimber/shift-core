name: Approved SHIFT Health header and cards
on:
  push:
    branches: [release/health-cards-approved-20261029]
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check approved H6 and W1 scope
        run: node release/health-cards-20261029/check.mjs
      - name: Stage exact approved presentation modules, promote and verify the bounded Health change
        run: node release/health-cards-20261029/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-card-release-${{ github.run_id }}
          path: health-card-evidence/
          retention-days: 90

