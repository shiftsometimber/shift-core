name: Desktop Safari ticker diagnosis
on:
  push:
    branches: [diagnose/safari-ticker-20260917]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install webkit chromium
      - run: node scripts/diagnose-safari-ticker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-ticker-diagnosis
          path: safari-ticker-proof/
