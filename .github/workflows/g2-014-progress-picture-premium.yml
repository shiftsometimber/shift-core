name: G2-014 Progress Picture Premium Production Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'frontend/member/my-timber-preview.html'
      - 'member-login-fastpath-v1.js'
      - 'member-register-fastpath-v2.js'
      - 'frontend/member/member-progress-picture-premium-v1.js'
      - 'frontend/member/member-shell-v33g.js'
      - 'frontend/member/member-p0-v1.css'
      - 'worker-entry-v6.js'
      - 'wrangler.jsonc'
      - 'commissioning-identity-v1.js'
      - 'g2-014-progress-picture-premium-production.mjs'
      - '.github/workflows/g2-014-progress-picture-premium.yml'
permissions:
  contents: read
  id-token: write
jobs:
  g2-014-progress-picture-premium-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Wait for production propagation
        run: sleep 25
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run rendered premium Progress Picture journey
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          G2_014_EVIDENCE_DIR: g2-014-progress-picture-premium-evidence
        run: node g2-014-progress-picture-premium-production.mjs
      - name: Upload G2-014 premium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-014-progress-picture-premium-evidence
          path: g2-014-progress-picture-premium-evidence
          if-no-files-found: warn
          retention-days: 30
