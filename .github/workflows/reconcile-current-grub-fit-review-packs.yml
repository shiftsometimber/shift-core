name: Reconcile Current Grub Fit Review Packs
on:
  push:
    branches:
      - reconcile/current-grub-fit-review-packs
    paths:
      - 'scripts/reconcile-current-grub-fit-review-packs.mjs'
      - '.github/workflows/reconcile-current-grub-fit-review-packs.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/current-grub-fit-review-packs
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reconcile corrected review authorities
        run: node scripts/reconcile-current-grub-fit-review-packs.mjs
      - name: Assert unchanged authoritative scoreboard
        run: |
          grep -qx 'A=4' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -qx 'B=0' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -qx 'C=3' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -qx 'AUDIT_PASS=50' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -qx 'AUDIT_AMBER=4' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -qx 'AUDIT_BLOCKED=3' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -F '**806 clean recipes behind exactly 8 immutable editorial decisions**' docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md
          grep -F 'artifact `9218694338`' docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md
      - name: Commit reconciled evidence authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name shiftsometimber
          git config user.email shiftsometimber@gmail.com
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/LAUNCH-FINISH-LINE.md docs/MATT-FINAL-ACCEPTANCE-PACK.md docs/COMMISSIONING-EVIDENCE.md docs/evidence/2026-08-14-current-grub-fit-final-review-authority.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconcile corrected Grub and Fit final review authority'
          git push origin HEAD:reconcile/current-grub-fit-review-packs
