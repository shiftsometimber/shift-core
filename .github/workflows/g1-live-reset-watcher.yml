name: G1 Live Reset Watcher
on:
  pull_request:
    paths:
      - '.github/workflows/g1-live-reset-watcher.yml'
permissions:
  contents: read
jobs:
  watch-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for genuine reset completion and finish retained password lifecycle
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.shiftsometimber.co.uk'
          SITE='https://shiftsometimber.co.uk'
          EMAIL='shiftsometimber+realverify-31793828102-2@gmail.com'
          NEW_PASSWORD='Shift-Recovery-New-2026!'
          FINAL_PASSWORD='Shift-Recovery-Final-2026!'
          mkdir -p g1-live-reset-watcher
          echo "Waiting for the genuine inbox reset on ${EMAIL}"

          changed='false'
          for i in $(seq 1 120); do
            status=$(curl -sS -c /tmp/cookies.txt -o /tmp/new-login.json -w '%{http_code}' \
              -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
              -X POST "${API}/v1/auth/login" \
              --data "$(jq -nc --arg email "$EMAIL" --arg password "$NEW_PASSWORD" '{email:$email,password:$password}')")
            if [ "$status" = '200' ]; then changed='true'; break; fi
            test "$status" = '401'
            sleep 10
          done
          test "$changed" = 'true'

          change=$(curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt -o /tmp/change.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/change-password" \
            --data "$(jq -nc --arg currentPassword "$NEW_PASSWORD" --arg password "$FINAL_PASSWORD" '{currentPassword:$currentPassword,password:$password}')")
          test "$change" = '200'

          interim=$(curl -sS -o /tmp/interim.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/login" \
            --data "$(jq -nc --arg email "$EMAIL" --arg password "$NEW_PASSWORD" '{email:$email,password:$password}')")
          test "$interim" = '401'

          logout=$(curl -sS -b /tmp/cookies.txt -o /tmp/logout.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/logout")
          test "$logout" = '200'

          final=$(curl -sS -o /tmp/final.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/login" \
            --data "$(jq -nc --arg email "$EMAIL" --arg password "$FINAL_PASSWORD" '{email:$email,password:$password}')")
          test "$final" = '200'

          jq -nc --arg email "$EMAIL" '{proof:"G1_REAL_PASSWORD_RECOVERY_PRODUCTION_V1",status:"PASS",email:$email,genuineInboxReset:true,postResetLogin:{status:200},authenticatedChangePassword:{status:200},intermediatePasswordInvalidated:{status:401},logout:{status:200},retainedFinalLogin:{status:200},criterion:"genuine inbox reset token -> reset -> login -> authenticated change-password -> logout -> final retained login"}' > g1-live-reset-watcher/report.json
          cat g1-live-reset-watcher/report.json
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-live-reset-watcher
          path: g1-live-reset-watcher
          retention-days: 30
