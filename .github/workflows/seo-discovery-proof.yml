name: Exact technical discovery proof
on:
  push:
    branches: [codex/seo-discovery-20261006]
  pull_request:
    paths:
      - 'public-seo-discovery.mjs'
      - 'release/seo-discovery-scope.mjs'
      - 'tests/*discovery*.test.mjs'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check shift-coach/worker.mjs
      - run: node --test tests/public-seo-discovery.test.mjs tests/seo-discovery-release.test.mjs tests/public-seo-approved.test.mjs tests/approved-ranking-release.test.mjs tests/seo-technical-release.test.mjs tests/production-completion-release.test.mjs
      - run: node shift-coach/release-contract.mjs --require-launch
      - run: node scripts/b1-release-scope.mjs --check
