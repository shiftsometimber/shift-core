name: Approved PR794 release preflight
on:
  push:
    branches: [release/seo794-20260923]
    paths: [.github/workflows/seo794-preflight.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 13e74ceafc70dee7bc786de8c2584f84f3b06da1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Load release-only tooling from its committed authority
        run: |
          git fetch origin 8257612a46c1d9ae460529e14429fa2f7247a18f
          git show FETCH_HEAD:release/seo794-followthrough.mjs > release/seo794-followthrough.mjs
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: shiftsometimber/shift-core
          run-id: 35873626050
          name: seo-repair-final-f4052fff7670609f37e86f6324023cdf4baaea9a
          path: approved-preview
      - name: Verify original evidence and unpack only approved public-data fixtures
        run: |
          (cd approved-preview && sha256sum -c SHA256SUMS)
          tar xzf approved-preview/candidate-support.tar.gz preview/seo-repairs/generated/changes.json preview/seo-repairs/generated/render-manifest.json
          node --check release/seo794-followthrough.mjs
      - name: Prove exact login-page difference using recorded failed-release hashes
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const r=await fetch('https://shiftsometimber.co.uk/member-login');
          assert.equal(r.status,200);
          const html=await r.text(),old='<a href="/good-to-talk">Good to Talk</a>',current='<a href="/mens-mental-health">Good to Talk</a>';
          const hash=s=>createHash('sha256').update(s).digest('hex');
          const expectedBefore='c8a4c3dad41bd68c15bb1ead0c98054a6e22bff8b97157e1ac940581964c7673',expectedAfter='2fdc0eeb500fc7992712b15533bd2a59beb0eafb19ea9937c0cbe1d6d64d1a59';
          const proof={checkedAt:new Date().toISOString(),before:hash(html),afterExactTwoSupportLinks:hash(html.replaceAll(old,current)),count:html.split(old).length-1,expectedBefore,expectedAfter};
          mkdirSync('seo794-release-proof',{recursive:true});
          writeFileSync('seo794-release-proof/login-difference.json',JSON.stringify(proof,null,2));
          writeFileSync('seo794-release-proof/login-before.html',html);
          assert.equal(proof.count,2);assert.equal(proof.before,expectedBefore);assert.equal(proof.afterExactTwoSupportLinks,expectedAfter);
          console.log('PASS: recorded production difference is exactly two approved support-link destinations; all other response bytes identical.');
          JS
      - name: Read live identity and exact public records before authorised release
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node release/seo794-followthrough.mjs before
      - name: Checksum evidence
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('seo794-release-proof');p.mkdir(exist_ok=True)
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(x.read_bytes()).hexdigest()+'  '+str(x.relative_to(p))+'\n' for x in sorted(p.rglob('*')) if x.is_file() and x.name!='SHA256SUMS'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo794-preflight-${{ github.sha }}
          path: seo794-release-proof/
          retention-days: 90
