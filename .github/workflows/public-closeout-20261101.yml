name: Remaining public page closeout
on:
  push:
    branches: [release/public-closeout-20261101]
    paths: ['public-closeout-20261101/**', '.github/workflows/public-closeout-20261101.yml']
permissions:
  contents: read
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[pages preflight]') && 'public-closeout-read-only-preflight' || 'cloudflare-production-promote' }}
  cancel-in-progress: false
jobs:
  selected-pages:
    if: "!contains(github.event.head_commit.message, '[audit only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read current owners and page structures
        if: contains(github.event.head_commit.message, '[pages preflight]')
        run: node public-closeout-20261101/capture.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check and release Remaining public page closeout
        if: "!contains(github.event.head_commit.message, '[pages preflight]')"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix selected-pages-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node --check public-closeout-20261101/runtime.mjs
          node --check public-closeout-20261101/deploy.mjs
          node --test public-closeout-20261101/*.test.mjs
          if [[ "${{ contains(github.event.head_commit.message, '[pages preview]') }}" == "true" ]]; then
            node public-closeout-20261101/capture.mjs
            node public-closeout-20261101/source-preview.mjs
          else
            node public-closeout-20261101/deploy.mjs
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELECTED_PAGES_PREVIEW_ONLY: ${{ contains(github.event.head_commit.message, '[pages preview]') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-closeout-${{ github.run_id }}
          path: public-closeout-evidence/
          retention-days: 90
