name: Dave Synthetic Release Gate Source Check
on:
  pull_request:
    paths:
      - 'dave-release-gate-production.mjs'
      - '.github/workflows/dave-release-gate.yml'
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Validate release-gate source
        run: node --check dave-release-gate-production.mjs
