name: Continuity completion preview
on:
  push:
    branches: [fix/continuity-complete-20260918]
permissions:
  contents: read
concurrency:
  group: continuity-complete-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture immutable candidate source
        run: |
          mkdir -p continuity-proof
          git archive --format=tar.gz HEAD > continuity-proof/source.tar.gz
          git rev-parse HEAD > continuity-proof/source-sha.txt
      - name: Existing member and public regression checks
        run: |
          node --test member-experience/tests/*.test.mjs tests/my-journey-*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs
      - name: Capture read-only public entry and source mapping
        if: always()
        run: |
          mkdir -p continuity-proof
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const origin='https://shiftsometimber.co.uk';
          for(const path of ['/start-here','/member-login','/member/dashboard','/treatment-centre']){
            const r=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(30000)});
            const html=await r.text();
            writeFileSync('continuity-proof/'+path.slice(1).replaceAll('/','--')+'.html',html);
            const scripts=[...html.matchAll(/<script\b[^>]*src=["']([^"']+)["']/gi)].map(m=>m[1]);
            console.log(JSON.stringify({path,status:r.status,location:r.headers.get('location'),scripts}));
            if(path==='/start-here')for(const src of scripts){
              if(!/start|finder|route|decision|journey/i.test(src))continue;
              const u=new URL(src,origin);if(u.origin!==origin)continue;
              const sr=await fetch(u,{signal:AbortSignal.timeout(30000)});const body=await sr.text();
              writeFileSync('continuity-proof/'+u.pathname.split('/').at(-1),body);
              console.log(JSON.stringify({script:u.pathname,status:sr.status,bytes:Buffer.byteLength(body)}));
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuity-source-proof-${{ github.sha }}
          path: continuity-proof
          retention-days: 7
