name: Shift Humanness Quality Gate
on:
  pull_request:
    paths:
      - 'industrial-catalogue-v13.js'
      - 'industrial-grub-second-person-review-pack.mjs'
      - 'fit-canonical-guidance-v1.mjs'
      - 'humanness-quality-gate-v1.mjs'
      - 'docs/SHIFT-MEMBER-HUMANNESS-STANDARD.md'
      - '.github/workflows/humanness-quality.yml'
  workflow_dispatch:
jobs:
  humanness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Member must never feel the machine
        run: node humanness-quality-gate-v1.mjs
