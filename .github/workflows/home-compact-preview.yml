name: Compact My Timber homepage preview
on:
  push:
    branches: [preview/home-compact-20260930]
permissions:
  contents: read
concurrency:
  group: home-compact-signoff-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Preserve current homepage outside compact strip
        run: node preview/home-banner/build-compact.mjs
      - name: Deploy isolated read-only preview
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          npx wrangler deploy --config preview/home-banner/wrangler-compact.jsonc | tee home-compact-proof/deploy.log
          echo "PREVIEW_URL=$(grep -oE 'https://shift-home-compact-preview\.[a-z0-9-]+\.workers\.dev' home-compact-proof/deploy.log | head -1)" >> "$GITHUB_ENV"
      - run: npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.63.0
      - run: '"$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Desktop and mobile visual preservation checks
        run: BROWSER_TOOLS="$RUNNER_TEMP/browser" node preview/home-banner/verify-compact.cjs
      - name: Verify mobile loading budget before production
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund lighthouse@12.8.2
          export CHROME_PATH=$(node -e "console.log(require(process.env.RUNNER_TEMP+'/browser/node_modules/playwright').chromium.executablePath())")
          for n in 1 2 3; do
            node "$RUNNER_TEMP/browser/node_modules/lighthouse/cli/index.js" "$PREVIEW_URL" --only-categories=performance --output=json --output-path="home-compact-proof/speed-$n.json" '--chrome-flags=--headless --no-sandbox' --quiet
          done
          python3 - <<'PYCODE'
          import json,pathlib,statistics
          rows=[]
          for n in [1,2,3]:
            d=json.loads(pathlib.Path(f'home-compact-proof/speed-{n}.json').read_text());assert not d.get('runtimeError');a=d['audits'];rows.append({'lcp':a['largest-contentful-paint']['numericValue'],'cls':a['cumulative-layout-shift']['numericValue'],'tbt':a['total-blocking-time']['numericValue']})
          median={k:statistics.median(x[k] for x in rows) for k in rows[0]};print(median);pathlib.Path('home-compact-proof/speed-summary.json').write_text(json.dumps({'rows':rows,'median':median}))
          assert median['lcp']<=2500 and median['cls']<=0.1 and median['tbt']<=200
          PYCODE
      - name: Checksum evidence
        if: always()
        run: find home-compact-proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > home-compact-proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-compact-preview-${{ github.sha }}
          path: home-compact-proof/
          retention-days: 90
