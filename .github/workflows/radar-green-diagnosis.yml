name: Radar remaining blockers diagnosis
on:
  push:
    branches: [fix/radar-green-20260917]
permissions:
  contents: read
  actions: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read publication candidates and source renewal state without writes
        run: node scripts/radar-green-diagnosis.mjs
