name: Verify Scheduled Editorial Corpus Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-scheduled-editorial-corpus-production.yml'

permissions:
  contents: read

concurrency:
  group: scheduled-editorial-corpus-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
      DEPLOYED_SOURCE: 704e8111fe69007f14d549e5216b0d0023689bf1
      DEPLOYMENT_ID: fcf98f80-c88b-41e6-9e57-f49d1158982b
      VERSION_ID: 15777a76-4b92-48ac-a2c1-ba4c2b274f0a
      DEPLOYED_AT: 2026-10-29T23:29:45.331Z
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Prove current main retained the deployed scheduler bytes
        run: |
          git diff --exit-code "$DEPLOYED_SOURCE"..HEAD -- worker-entry-v6.js scheduled-knowledge-v1.js scheduled-public-fetch-v1.mjs scheduled-public-fetch-v1.test.mjs knowledge-flywheel-staging.mjs medicines-watch/scheduler.test.mjs
          node --test scheduled-public-fetch-v1.test.mjs
          node knowledge-flywheel-staging.mjs
          node --test medicines-watch/scheduler.test.mjs
      - name: Install exact Wrangler toolchain
        run: npm install --no-audit --no-fund
      - name: Inspect editorial schema read-only
        run: |
          mkdir -p scheduled-editorial-production-proof
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "PRAGMA table_info(knowledge_editorial_page_meta)" > scheduled-editorial-production-proof/page-meta-schema.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT sql FROM sqlite_master WHERE type='table' AND name IN ('knowledge_editorial_page_meta','knowledge_editorial_events','knowledge_editorial_briefs','knowledge_editorial_jobs','knowledge_editorial_releases')" > scheduled-editorial-production-proof/editorial-schema.json
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT event_type,release_day,details_json,created_at FROM knowledge_editorial_events ORDER BY created_at DESC LIMIT 20" > scheduled-editorial-production-proof/editorial-events.json || true
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT state,COUNT(*) AS n FROM knowledge_editorial_briefs GROUP BY state ORDER BY state" > scheduled-editorial-production-proof/brief-counts.json || true
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT job_key,state,reason,started_at,finished_at FROM knowledge_editorial_jobs ORDER BY started_at DESC LIMIT 20" > scheduled-editorial-production-proof/editorial-jobs.json || true

      - name: Verify the owned core deployment is still serving
        run: |
          mkdir -p scheduled-editorial-production-proof
          npx wrangler deployments list --config wrangler.jsonc --json > scheduled-editorial-production-proof/deployments.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const rows=JSON.parse(readFileSync('scheduled-editorial-production-proof/deployments.json','utf8'));
          const latest=rows.at(-1);
          assert.equal(latest.versions?.length,1);
          assert.equal(latest.versions[0].version_id,process.env.VERSION_ID);
          assert.equal(latest.versions[0].percentage,100);
          writeFileSync('scheduled-editorial-production-proof/provider.json',JSON.stringify({ok:true,source:process.env.DEPLOYED_SOURCE,deploymentId:latest.id,versionId:latest.versions[0].version_id,percentage:latest.versions[0].percentage,note:'Deployment identity may change when an independent guarded release restores the same verified version.'},null,2));
          JS
      - name: Verify public sitemap delivery
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://shiftsometimber.co.uk/sitemap.xml > scheduled-editorial-production-proof/sitemap.xml
          grep -q '<urlset\|<sitemapindex' scheduled-editorial-production-proof/sitemap.xml
      - name: Observe a post-deployment scheduled corpus cycle
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 1); do
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT id,job_key,started_at,completed_at,status,outcome,error_code FROM hq_service_job_runs WHERE job_key='core_knowledge' AND started_at >= '$DEPLOYED_AT' ORDER BY started_at DESC LIMIT 1" > scheduled-editorial-production-proof/scheduled-job.json
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT COUNT(*) AS n, SUM(CASE WHEN state='published_site' THEN 1 ELSE 0 END) AS published FROM knowledge_editorial_page_meta" > scheduled-editorial-production-proof/corpus-count.json || true
            if node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const rows=file=>{try{const x=JSON.parse(readFileSync(file,'utf8'));return (Array.isArray(x)?x:[x]).flatMap(v=>v?.results||[])}catch{return[]}};
          const job=rows('scheduled-editorial-production-proof/scheduled-job.json')[0];
          const corpus=rows('scheduled-editorial-production-proof/corpus-count.json')[0];
          process.exit(job?.status==='completed'&&Number(corpus?.n||0)>0?0:1);
          JS
            then
              node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const rows=file=>{const x=JSON.parse(readFileSync(file,'utf8'));return (Array.isArray(x)?x:[x]).flatMap(v=>v?.results||[])};
          const provider=JSON.parse(readFileSync('scheduled-editorial-production-proof/provider.json','utf8'));
          writeFileSync('scheduled-editorial-production-proof/result.json',JSON.stringify({ok:true,source:process.env.DEPLOYED_SOURCE,deploymentId:provider.deploymentId,versionId:provider.versionId,job:rows('scheduled-editorial-production-proof/scheduled-job.json')[0],corpus:rows('scheduled-editorial-production-proof/corpus-count.json')[0]},null,2));
          JS
              exit 0
            fi
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT event_type,release_day,details_json,created_at FROM knowledge_editorial_events WHERE created_at >= '$DEPLOYED_AT' ORDER BY created_at DESC LIMIT 20" > scheduled-editorial-production-proof/editorial-events.json || true
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT state,COUNT(*) AS n FROM knowledge_editorial_briefs GROUP BY state ORDER BY state" > scheduled-editorial-production-proof/brief-counts.json || true
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT job_key,state,reason,started_at,finished_at FROM knowledge_editorial_jobs ORDER BY started_at DESC LIMIT 20" > scheduled-editorial-production-proof/editorial-jobs.json || true
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT release_day,slug,state,reason,due_at,updated_at FROM knowledge_editorial_releases ORDER BY updated_at DESC LIMIT 20" > scheduled-editorial-production-proof/editorial-releases.json || true
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT day_key,status,target_url,reason,created_at,completed_at FROM knowledge_daily_content_runs ORDER BY created_at DESC LIMIT 20" > scheduled-editorial-production-proof/legacy-daily-runs.json || true
          done
          echo 'The owned deployment is live, but no completed post-deployment core_knowledge cycle with populated corpus was observed.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-editorial-production-proof-${{ github.run_id }}
          path: scheduled-editorial-production-proof/
          if-no-files-found: error
          retention-days: 90
