name: Nondevice live acceptance follow-through
on:
  push:
    branches: [codex/nondevice-completion-20261003]
    paths: [release/nondevice-closeout/**, .github/workflows/nondevice-acceptance-closeout.yml]
permissions:
  contents: read
  actions: read
jobs:
  public-consent:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix "$RUNNER_TEMP/content-tools" --no-audit --no-fund playwright@1.58.2
      - run: '"$RUNNER_TEMP/content-tools/node_modules/.bin/playwright" install --with-deps chromium'
      - run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/content-tools/node_modules/playwright" node release/nondevice-closeout/public-consent-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'public-consent-${{ github.sha }}', path: nondevice-proof/}
  live-followthrough:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      REVIEWED_RELEASE_SOURCE: 1b53f7ea87cf6b699a570f1eaf8d83b370131ae9
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node release/nondevice-closeout/live-followthrough.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'nondevice-live-${{ github.sha }}', path: nondevice-proof/}

  lossless-public-index:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      LOSSLESS_MAIN_SOURCE: 0a0521dfee2e3560cd75e0dc17578b99ecafc4e8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node release/nondevice-closeout/lossless-index-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'lossless-public-index-${{ github.sha }}', path: lossless-live-proof/}
