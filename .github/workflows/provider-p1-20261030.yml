name: Provider switching P1 presentation
on:
  push:
    branches: [design/provider-p1-20261030]
    paths: ['release/provider-p1-20261030/**', '.github/workflows/provider-p1-20261030.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check P1 source syntax
        run: |
          node --check release/provider-p1-20261030/layout.mjs
          node --check release/provider-p1-20261030/styles.mjs
          node --check release/provider-p1-20261030/overlay.mjs
          node --check release/provider-p1-20261030/check.mjs
          node --check release/provider-p1-20261030/deploy.mjs
      - name: Install the locked asset hashing dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage and verify Provider switching P1
        run: node release/provider-p1-20261030/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-p1-${{ github.run_id }}
          path: provider-p1-evidence/
          retention-days: 90
