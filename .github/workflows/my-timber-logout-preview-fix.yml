name: My Timber logout PREVIEW ONLY
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: ['.github/workflows/my-timber-logout-preview-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/preview/stabilisation-life-back-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stabilisation-life-back-20260917
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Add visible logout to the shared My Timber shell and upgrade browser proof
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview/stabilisation-life-back-20260917
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const chromePath='member-experience/chrome.mjs';
          let chrome=fs.readFileSync(chromePath,'utf8');
          const oldNav=`<a href="/member/ask-timber">Ask Timber</a>'+(work?'<a href="/member/work">My workplace programme</a>':'')+'</div></details>'`;
          const newNav=`<a href="/member/ask-timber">Ask Timber</a>'+(work?'<a href="/member/work">My workplace programme</a>':'')+'<button type="button" class="member-nav-logout" data-member-logout>Log out</button></div></details>'`;
          if(!chrome.includes(newNav)){
            assert(chrome.includes(oldNav),'Expected shared My Timber navigation baseline not found');
            chrome=chrome.replace(oldNav,newNav);
          }
          const oldCss=`html body[data-member-chrome="v1"][data-member-page] nav.sst-member-tabs .member-nav-more a{display:block!important;white-space:normal}`;
          const newCss=oldCss+`\nhtml body[data-member-chrome="v1"][data-member-page] nav.sst-member-tabs .member-nav-more .member-nav-logout{display:block;width:100%;box-sizing:border-box;margin:6px 0 0;padding:10px 14px;border:1px solid #707762;border-radius:6px;background:transparent;color:#e7e3da;font:700 15px/1.4 Arial,sans-serif;text-align:left;cursor:pointer}\nhtml body[data-member-chrome="v1"][data-member-page] nav.sst-member-tabs .member-nav-more .member-nav-logout:is(:hover,:focus-visible){background:#e7e3da;color:#050505;outline:2px solid #707762;outline-offset:2px}`;
          if(!chrome.includes('member-nav-logout:is(:hover,:focus-visible)')){
            assert(chrome.includes(oldCss),'Expected member More-menu CSS baseline not found');
            chrome=chrome.replace(oldCss,newCss);
          }
          const oldClient=` const more=document.querySelector('.member-nav-more');\n document.addEventListener('keydown'`;
          const logoutClient=` const more=document.querySelector('.member-nav-more');\n const logout=document.querySelector('[data-member-logout]');\n if(logout)logout.addEventListener('click',async()=>{\n  if(logout.disabled)return;const original=logout.textContent;logout.disabled=true;logout.textContent='Signing out…';\n  try{const response=await fetch('/v1/auth/logout',{method:'POST',credentials:'include',cache:'no-store'});if(!response.ok)throw Error('logout_failed');location.replace('/member-login')}\n  catch{logout.disabled=false;logout.textContent=original;let status=document.querySelector('[data-member-logout-status]');if(!status){status=document.createElement('p');status.dataset.memberLogoutStatus='1';status.setAttribute('role','alert');status.style.cssText='margin:8px 10px;color:#e7e3da;font:13px/1.4 Arial,sans-serif';logout.after(status)}status.textContent='Could not log out. Please try again.'}\n });\n document.addEventListener('keydown'`;
          if(!chrome.includes("fetch('/v1/auth/logout'")){
            assert(chrome.includes(oldClient),'Expected shared chrome client baseline not found');
            chrome=chrome.replace(oldClient,logoutClient);
          }
          fs.writeFileSync(chromePath,chrome);

          const proofPath='preview/stabilisation/browser-proof.mjs';
          let proof=fs.readFileSync(proofPath,'utf8');
          const oldProof=`row.phase='logout-and-return';await api(context,'/v1/auth/logout',{});await api(context,'/v1/life-back',undefined,'GET',401);await login(context,fixture.browserIds[index]);await today(page);assert((await page.locator('.mtm-next').innerText()).includes('Marked done'));`;
          const newProof=`row.phase='logout-and-return';await today(page);await page.locator('.member-nav-more summary').click();const logout=page.locator('[data-member-logout]');assert.equal(await logout.count(),1,'Exactly one shared logout control');assert(await logout.isVisible(),'Logout must be visible in the shared My Timber menu');await logout.click();await page.waitForURL(/\\/member-login(?:\\?|$)/,{timeout:30000});await api(context,'/v1/me',undefined,'GET',401);await api(context,'/v1/life-back',undefined,'GET',401);row.checks.push('Shared My Timber menu exposes Log out; click revokes the session, returns to sign-in and protected APIs reject the old session');await login(context,fixture.browserIds[index]);await today(page);assert((await page.locator('.mtm-next').innerText()).includes('Marked done'));`;
          if(!proof.includes(newProof)){
            assert(proof.includes(oldProof),'Expected browser logout proof baseline not found');
            proof=proof.replace(oldProof,newProof);
            fs.writeFileSync(proofPath,proof);
          }
          NODE
      - name: Static guard for exactly one shared logout implementation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {memberNavigation,memberChromeClient} from './member-experience/chrome.mjs';
          for(const work of [false,true]){
            const nav=memberNavigation(work);
            assert.equal((nav.match(/data-member-logout/g)||[]).length,1);
            assert(nav.includes('>Log out</button>'));
          }
          assert(memberChromeClient.includes("fetch('/v1/auth/logout'"));
          assert(memberChromeClient.includes("location.replace('/member-login')"));
          console.log('PASS: one visible shared logout control, existing auth endpoint, explicit sign-in redirect.');
          NODE
      - name: Commit preview-only change and trigger the existing full isolated preview gate
        run: |
          set -euo pipefail
          printf '\n# logout-preview-proof-trigger-20260917\n' >> .github/workflows/stabilisation-life-back-preview.yml
          git config user.name 'SHIFT preview verification'
          git config user.email 'it@shiftsometimber.co.uk'
          git add member-experience/chrome.mjs preview/stabilisation/browser-proof.mjs .github/workflows/stabilisation-life-back-preview.yml
          git commit -m 'Preview only: expose and prove My Timber logout'
          git push origin HEAD:refs/heads/preview/stabilisation-life-back-20260917
