name: My Timber logout PREVIEW ONLY
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: ['.github/workflows/my-timber-logout-preview-fix.yml']
permissions:
  contents: write
concurrency:
  group: my-timber-logout-preview-only
  cancel-in-progress: false
jobs:
  patch-and-prove:
    if: github.ref == 'refs/heads/preview/stabilisation-life-back-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stabilisation-life-back-20260917
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Make logout a normal shared-shell POST while keeping presentation code network-free
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview/stabilisation-life-back-20260917
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const chromePath='member-experience/chrome.mjs';
          let chrome=fs.readFileSync(chromePath,'utf8');
          const button='<button type="button" class="member-nav-logout" data-member-logout>Log out</button>';
          const form='<form class="member-nav-logout-form" method="post" action="/v1/auth/logout"><button type="submit" class="member-nav-logout" data-member-logout>Log out</button></form>';
          if(chrome.includes(button))chrome=chrome.replace(button,form);
          assert(chrome.includes(form),'Shared logout form was not installed');
          const direct=` const logout=document.querySelector('[data-member-logout]');\n if(logout)logout.addEventListener('click',async()=>{\n  if(logout.disabled)return;const original=logout.textContent;logout.disabled=true;logout.textContent='Signing out…';\n  try{const response=await fetch('/v1/auth/logout',{method:'POST',credentials:'include',cache:'no-store'});if(!response.ok)throw Error('logout_failed');location.replace('/member-login')}\n  catch{logout.disabled=false;logout.textContent=original;let status=document.querySelector('[data-member-logout-status]');if(!status){status=document.createElement('p');status.dataset.memberLogoutStatus='1';status.setAttribute('role','alert');status.style.cssText='margin:8px 10px;color:#e7e3da;font:13px/1.4 Arial,sans-serif';logout.after(status)}status.textContent='Could not log out. Please try again.'}\n });\n`;
          if(chrome.includes(direct))chrome=chrome.replace(direct,'');
          assert(!/\bfetch\s*\(/.test(chrome.match(/export const memberChromeClient=String\.raw`([\s\S]*?)`;/)?.[1]||''),'Presentation chrome must remain network-free');
          if(!chrome.includes('.member-nav-logout-form{'))chrome=chrome.replace('.member-nav-more .member-nav-logout{','.member-nav-more .member-nav-logout-form{margin:0;padding:0}\nhtml body[data-member-chrome="v1"][data-member-page] nav.sst-member-tabs .member-nav-more .member-nav-logout{');
          fs.writeFileSync(chromePath,chrome);

          const workerPath='worker.js';
          let worker=fs.readFileSync(workerPath,'utf8');
          const old=`  const response=json({ ok: true }, 200, { 'Set-Cookie': clearSessionCookie(request) });appendLegacyHostCookieClear(response,request);return response;`;
          const replacement=`  const browserNavigation=String(request.headers.get('Accept')||'').toLowerCase().includes('text/html');\n  const response=browserNavigation\n    ? new Response(null,{status:303,headers:{Location:'/member-login','Set-Cookie':clearSessionCookie(request)}})\n    : json({ ok: true }, 200, { 'Set-Cookie': clearSessionCookie(request) });\n  appendLegacyHostCookieClear(response,request);return response;`;
          if(worker.includes(old))worker=worker.replace(old,replacement);
          assert(worker.includes("browserNavigation=String(request.headers.get('Accept')"),'Browser logout redirect not installed');
          fs.writeFileSync(workerPath,worker);
          NODE
      - name: Static architecture guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {memberNavigation,memberChromeClient} from './member-experience/chrome.mjs';
          for(const work of [false,true]){
            const nav=memberNavigation(work);
            assert.equal((nav.match(/data-member-logout/g)||[]).length,1);
            assert(nav.includes('method="post" action="/v1/auth/logout"'));
            assert(nav.includes('>Log out</button>'));
          }
          assert.doesNotMatch(memberChromeClient,/\bfetch\s*\(|localStorage|sessionStorage|innerHTML/);
          const worker=fs.readFileSync('worker.js','utf8');
          assert(worker.includes("status:303"));assert(worker.includes("Location:'/member-login'"));
          console.log('PASS: shared logout is visible, browser-native, session-revoking and presentation code stays network-free.');
          NODE
      - name: Commit source changes to preview branch only
        run: |
          set -euo pipefail
          git config user.name 'SHIFT preview verification'
          git config user.email 'it@shiftsometimber.co.uk'
          git add member-experience/chrome.mjs worker.js preview/stabilisation/browser-proof.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Preview only: finish visible My Timber logout without shell network calls'
            git push origin HEAD:refs/heads/preview/stabilisation-life-back-20260917
          fi
          echo "PREVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require preview credential only
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Member regression gates
        run: node --test --test-reporter=tap member-experience/tests/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs tests/my-timber-analytics-privacy.test.mjs
      - name: Prepare fictional preview and verify preserved public shell
        run: |
          node preview/stabilisation/prepare.mjs
          node preview/stabilisation/verify-public.mjs
      - name: Provision separately named preview databases only
        run: node preview/stabilisation/provision.mjs
      - name: Deploy only isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('work/staging/generated/config.json'));
          assert.equal(c.name,'shift-stabilisation-preview');assert.equal(c.vars.SHIFT_ENVIRONMENT,'stabilisation-preview-20260917');
          assert(!c.routes&&!c.route&&!c.triggers&&!c.send_email&&!c.ai);assert.equal(c.workers_dev,true);
          NODE
          node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json > "$RUNNER_TEMP/shift-preview-deploy.txt" 2>&1
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const log=fs.readFileSync(process.env.RUNNER_TEMP+'/shift-preview-deploy.txt','utf8');
          const match=log.match(/https:\/\/shift-stabilisation-preview\.[a-z0-9-]+\.workers\.dev/);if(!match)throw Error('Isolated preview URL not returned');
          fs.appendFileSync(process.env.GITHUB_ENV,'PREVIEW_URL='+match[0]+'\n');console.log('PREVIEW ONLY',match[0]);
          NODE
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Prove visible logout revokes session and full Life Back loop still works
        run: node preview/stabilisation/browser-proof.mjs
      - name: Upload sanitised evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-timber-logout-preview-evidence
          retention-days: 14
          path: |
            work/staging/generated/public-proof.json
            work/staging/generated/review-evidence/**
          if-no-files-found: warn
