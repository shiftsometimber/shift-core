name: G2-011 Progress Production Acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  g2-011-progress-rendered-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Wait for Worker deployment propagation
        run: sleep 25
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run authenticated rendered Progress acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          G2_011_EVIDENCE_DIR: g2-011-progress-story-evidence
        run: node g2-011-progress-story-production.mjs
      - name: Upload G2-011 Progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-011-progress-story-evidence
          path: g2-011-progress-story-evidence
          if-no-files-found: warn
          retention-days: 30
