name: Radar discovery collector
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-discovery-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect public RSS leads without publishing or sending notifications
        run: node scripts/radar-discovery-collector.mjs --store
