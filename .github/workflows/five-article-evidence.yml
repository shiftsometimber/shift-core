name: Five Article Evidence Proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'editorial/five-articles/**'
      - 'editorial-resources-v1.js'
      - 'radar-editorial-trust-v1.js'
      - 'tests/five-article-evidence.test.mjs'
      - '.github/workflows/five-article-evidence.yml'
permissions:
  contents: read
concurrency:
  group: five-article-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Source-specific article and existing editorial/public regressions
        run: |
          mkdir -p five-article-proof
          set -o pipefail
          node --test tests/five-article-evidence.test.mjs tests/editorial-resources-v1.test.mjs tests/public-shell-contract.test.mjs tests/public-seo-closeout.test.mjs tests/public-audit-repair.test.mjs tests/public-continuity.test.mjs tests/radar-newsroom-*.test.mjs tests/radar-uk-editorial-v1.test.mjs tests/source-reuse*.test.mjs | tee five-article-proof/regressions.tap
      - name: Exact Worker compile without credentials or deployment
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir five-article-proof/worker | tee five-article-proof/compile.log
      - name: Fresh public baseline, bounded transformations and unchanged downloads
        run: node editorial/five-articles/proof.mjs
      - name: Install browser verifier
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Mobile and desktop readability with actual public styles
        run: python3 editorial/five-articles/browser-proof.py
      - name: Retain exact source and reviewable diff
        if: always()
        run: |
          mkdir -p five-article-proof
          git rev-parse HEAD > five-article-proof/source-sha.txt
          git diff 7ed49380288e9c1cd91fce49e63e81be9ecd94f6 -- editorial/five-articles/ editorial-resources-v1.js radar-editorial-trust-v1.js tests/five-article-evidence.test.mjs .github/workflows/ > five-article-proof/candidate.patch
          cp editorial/five-articles/README.md five-article-proof/README.md
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('five-article-proof/candidate-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for root in ['editorial/five-articles','editorial/statistics']:
              for p in pathlib.Path(root).glob('*'):
                if p.is_file():z.write(p,str(p))
            for p in ['editorial-resources-v1.js','radar-editorial-trust-v1.js','tests/five-article-evidence.test.mjs']:z.write(p,p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-article-evidence-${{ github.event.pull_request.head.sha }}
          path: five-article-proof/
          retention-days: 30
