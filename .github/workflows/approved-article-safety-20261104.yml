name: Approved article import safeguard 20261104
on:
  push:
    branches: [release/approved-article-safety-20261104]
    paths: ['.github/workflows/approved-article-safety-20261104.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  import-safeguard:
    if: github.repository == 'shiftsometimber/shift-core' && github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      APPROVED_BASE_SHA: 60ecf85d61848d64ab2ea5ba9037176721171131
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check unchanged source guards and release syntax
        run: |
          git diff --exit-code "$APPROVED_BASE_SHA" -- wrangler.jsonc package.json package-lock.json .nvmrc release/runtime-rollback-guard.mjs
          node --check release/approved-article-safety-20261104/gate-release.mjs
      - name: Capture serving bytes and qualify actual compiled handler
        id: capture
        run: |
          node release/approved-article-safety-20261104/gate-release.mjs capture
          SERVING_MODULE_PATH=/tmp/approved-article-gate-before.mjs node --test release/approved-article-safety-20261104/gate-package.test.mjs
      - name: Preserve source proof and predecessor before provider writes
        uses: actions/upload-artifact@v4
        with:
          name: approved-article-gate-before-${{ github.run_id }}
          path: article-gate-proof/
          retention-days: 90
          if-no-files-found: error
      - name: Stage only the approved import safeguard and verify provider bytes
        id: stage
        run: node release/approved-article-safety-20261104/gate-release.mjs stage
      - name: Promote the exact verified version under the captured serving lease
        id: promote
        run: node release/approved-article-safety-20261104/gate-release.mjs promote
      - name: Verify deployed source authentication security and protected pages
        run: node release/approved-article-safety-20261104/gate-release.mjs verify
      - name: Restore only this run's owned promotion if a gate fails
        if: ${{ failure() && steps.capture.outcome == 'success' }}
        run: node release/approved-article-safety-20261104/gate-release.mjs rollback
      - name: Preserve actual result and owned restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-article-gate-result-${{ github.run_id }}
          path: article-gate-proof/
          retention-days: 90
          if-no-files-found: warn
