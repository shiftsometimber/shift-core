name: Medicines Watch Production Proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medicines-watch-production-proof.yml'
      - 'frontend/member/member-medicines-watch-v1.js'
      - 'frontend/member/member-medicines-watch-v1.css'
      - 'radar-public-v1.js'
      - 'radar-medicine-seed-v1.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove visible asset and governed public feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p medicines-watch-production-evidence
          curl -fsSL 'https://shiftsometimber.co.uk/member-medicines-watch-v1.js?v=1' -o /tmp/watch.js
          grep -q 'Medicines & Peptides Watch' /tmp/watch.js
          curl -fsSL 'https://api.shiftsometimber.co.uk/v1/radar/cards' -o /tmp/cards.json
          curl -fsSL 'https://api.shiftsometimber.co.uk/v1/radar/ticker' -o /tmp/ticker.json
          node - <<'NODE'
          const fs=require('fs');
          const cards=JSON.parse(fs.readFileSync('/tmp/cards.json','utf8'));
          const ticker=JSON.parse(fs.readFileSync('/tmp/ticker.json','utf8'));
          if(!cards.ok||!Array.isArray(cards.cards)||!cards.cards.length)throw new Error('governed medicine cards unavailable');
          if(!ticker.ok||!ticker.freshness)throw new Error('governed ticker contract unavailable');
          const summary={at:new Date().toISOString(),visibleAsset:true,medicineCards:cards.cards.length,tickerCurrent:ticker.current===true,tickerStatus:ticker.status||null,ukStatusPresent:cards.cards.some(x=>x.uk_regulatory_status),verificationDatesPresent:cards.cards.some(x=>x.last_verified_at),provenancePresent:cards.cards.some(x=>x.provenance&&Object.keys(x.provenance).length)};
          fs.writeFileSync('medicines-watch-production-evidence/summary.json',JSON.stringify(summary,null,2));
          console.log('MEDICINES WATCH PRODUCTION PASS',JSON.stringify(summary));
          NODE
      - name: Upload sanitised proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicines-watch-production-evidence
          path: medicines-watch-production-evidence/summary.json
          if-no-files-found: error
          retention-days: 30
