name: Map remaining severe contrast roots
on:
  push:
    branches: [audit/full-live-contrast-20260917]
    paths: ['.github/workflows/contrast-severe-ancestor-map.yml']
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: |
          mkdir -p map && cd map
          npm init -y >/dev/null
          npm install playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture ancestor signatures for every severe live clash
        run: |
          mkdir -p map/out
          cat > map/run.mjs <<'JS'
          import{chromium}from'playwright';import fs from'node:fs';
          const O='https://shiftsometimber.co.uk';
          async function txt(u){const r=await fetch(u);if(!r.ok)throw new Error(`${u} ${r.status}`);return r.text()}
          async function urls(){const out=new Set(),seen=new Set();async function go(u,d=0){if(seen.has(u)||d>2)return;seen.add(u);const x=await txt(u),loc=[...x.matchAll(/<loc>\s*([^<]+?)\s*<\/loc>/gi)].map(m=>m[1].trim().replaceAll('&amp;','&'));if(/<sitemapindex\b/i.test(x))for(const l of loc)if(l.startsWith(O))await go(l,d+1);else;else for(const l of loc)if(l.startsWith(O))out.add(l)}await go(O+'/sitemap.xml');['/','/contact','/comparison-centre','/before-you-decide','/treatment-centre','/knowledge','/faq'].forEach(p=>out.add(O+p));return[...out].sort()}
          const inPage=()=>{function rgb(s){const m=String(s).match(/rgba?\((\d+(?:\.\d+)?)[ ,]+(\d+(?:\.\d+)?)[ ,]+(\d+(?:\.\d+)?)(?:[ ,\/]+(\d+(?:\.\d+)?))?\)/i);return m?{r:+m[1],g:+m[2],b:+m[3],a:m[4]==null?1:+m[4]}:null}function lum(c){const f=v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(c.r)+.7152*f(c.g)+.0722*f(c.b)}function ratio(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}function blend(f,b){const a=f.a??1;return{r:f.r*a+b.r*(1-a),g:f.g*a+b.g*(1-a),b:f.b*a+b.b*(1-a),a:1}}function vis(e){const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>.02&&r.width>1&&r.height>1}function dt(e){let t='';for(const n of e.childNodes)if(n.nodeType===3)t+=' '+n.textContent;return t.replace(/\s+/g,' ').trim()}function bg(e){let c=e;while(c){const s=getComputedStyle(c),v=rgb(s.backgroundColor);if(v&&v.a>.01)return{v:v.a<1?blend(v,{r:255,g:255,b:255,a:1}):v,src:c};c=c.parentElement}return{v:{r:255,g:255,b:255,a:1},src:null}}function node(n){if(!n)return'';let s=n.tagName.toLowerCase();if(n.id)s+='#'+n.id;if(n.classList?.length)s+='.'+[...n.classList].slice(0,8).join('.');return s}const out=[];for(const e of document.querySelectorAll('body *')){if(!vis(e))continue;const t=dt(e);if(!t)continue;const fg=rgb(getComputedStyle(e).color);if(!fg)continue;const B=bg(e),eff=fg.a<1?blend(fg,B.v):fg,cr=ratio(eff,B.v);if(cr>=2)continue;const chain=[];for(let n=e;n&&n!==document.body&&chain.length<7;n=n.parentElement)chain.push(node(n));out.push({text:t.slice(0,120),ratio:+cr.toFixed(2),fg:getComputedStyle(e).color,bg:getComputedStyle(B.src||document.body).backgroundColor,chain});if(out.length>200)break}return out};
          const b=await chromium.launch(),c=await b.newContext({viewport:{width:1440,height:1000}});await c.route(/\.(?:png|jpe?g|webp|gif|svg|ico|woff2?|ttf|mp4)(?:\?.*)?$/i,r=>r.abort());const list=await urls(),rows=[];let next=0;async function worker(){const p=await c.newPage();while(true){const i=next++;if(i>=list.length)break;const u=list[i];try{await p.goto(u,{waitUntil:'domcontentloaded',timeout:25000});await p.waitForTimeout(180);for(const x of await p.evaluate(inPage))rows.push({url:u,...x})}catch{}}await p.close()}await Promise.all(Array.from({length:6},worker));await b.close();
          const sig=new Map();for(const x of rows){const k=x.fg+'|'+x.bg+'|'+x.chain.join(' > ');const v=sig.get(k)||{count:0,fg:x.fg,bg:x.bg,chain:x.chain,examples:[]};v.count++;if(v.examples.length<5)v.examples.push({url:x.url,text:x.text});sig.set(k,v)}const top=[...sig.values()].sort((a,b)=>b.count-a.count);fs.writeFileSync('map/out/roots.json',JSON.stringify({rowCount:rows.length,top,rows},null,2));console.log(JSON.stringify({rowCount:rows.length,top:top.slice(0,80)},null,2));
          JS
          node map/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: contrast-severe-ancestor-map
          retention-days: 7
          path: map/out/roots.json
