name: Authority continuity branch gate
on:
  push:
    branches: [fix/authority-continuity-20260918]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Syntax check changed runtime modules
        run: |
          node --check public-shell-contract.mjs
          node --check worker-entry-v6.js
      - name: Focused public authority regression gate
        run: |
          node --test tests/public-audit-repair.test.mjs tests/public-shell-contract.test.mjs tests/seo-release-integrity.test.mjs tests/public-navigation-policy.test.mjs tests/public-seo-closeout.test.mjs
