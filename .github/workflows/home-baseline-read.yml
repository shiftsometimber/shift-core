name: Read homepage release baseline
on:
  push:
    branches: [fix/home-release-baseline-20261001]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Read active deployment and source provenance
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments list --json --config wrangler.jsonc
          npx wrangler versions view 6cbd35aa-5aa8-4cf9-a976-3e7d1663374d --json --config wrangler.jsonc
