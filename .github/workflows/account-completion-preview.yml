name: Account completion isolated verification
on:
  push:
    branches: [fix/account-completion-20260923]
permissions:
  contents: write
concurrency:
  group: stabilisation-life-back-preview-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-completion-20260923
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Guard source and install retained test toolchain
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/account-completion-20260923
          git merge-base --is-ancestor 4c014edce24bd9a37645dfbd6bad204ed3270091 HEAD
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 4c014edce24bd9a37645dfbd6bad204ed3270091
          mkdir -p account-completion-evidence
          npm ci --no-audit --no-fund
      - name: Apply guarded candidate source only on this draft branch
        run: |
          node account-completion/apply.mjs
          node account-completion/apply-email.mjs
          node account-completion/refine-email-gp.mjs
          node account-completion/apply-photon.mjs
      - name: Run retained member and new address/email security tests
        shell: bash
        run: |
          set -euo pipefail
          node --test member-experience/tests/*.test.mjs 2>&1 | tee account-completion-evidence/account-tests.tap
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir /tmp/account-completion-compile > account-completion-evidence/compile.txt 2>&1 || { tail -n 70 account-completion-evidence/compile.txt; exit 1; }
      - name: Commit exact tested modifications to the draft only
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const allowed=new Set(['member-experience/member-details-routes.mjs','member-experience/member-details.mjs','frontend/medicine-front-door/treatment-assessment.html','preview/member-details/worker.mjs','preview/member-details/provision.mjs','member-experience/member-email-change.mjs','member-experience/tests/member-email-change.test.mjs','preview/member-details/prepare.mjs','preview/member-details/gp-browser-proof.mjs','account-completion/delivery-browser.mjs','member-experience/member-delivery-client.mjs','member-experience/member-delivery-routes.mjs','member-experience/member-details-lookups.mjs','preview/member-details/browser-proof.mjs']);
          const changed=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);for(const p of changed)assert(allowed.has(p),'Unexpected change: '+p);
          if(changed.length)execFileSync('git',['add','--',...changed]);
          JS
          if ! git diff --cached --quiet; then
            git config user.name 'SHIFT preview verification'
            git config user.email 'it@shiftsometimber.co.uk'
            git commit -m 'Integrate tested open-source address suggestions in the existing account preview'
            git push origin HEAD:refs/heads/fix/account-completion-20260923
          fi
          echo "PREVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > account-completion-evidence/source-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Prepare and provision the existing fictional-account preview only
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          node preview/member-details/prepare.mjs
          node preview/member-details/provision.mjs
      - name: Guard and deploy only the named isolated preview
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/account-completion-20260923
          test "$(git rev-parse HEAD)" = "$PREVIEW_SOURCE_SHA"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';const c=JSON.parse(fs.readFileSync('work/staging/generated/config.json'));
          assert.equal(c.name,'shift-stabilisation-preview');assert.equal(c.main,'../../../preview/member-details/worker.mjs');assert(c.workers_dev);assert(!c.routes&&!c.route&&!c.triggers&&!c.send_email&&!c.ai);
          assert.deepEqual(c.d1_databases.map(x=>x.database_name).sort(),['shift-member-details-auth-20260922','shift-member-details-data-20260922']);for(const d of c.d1_databases)assert(!fs.readFileSync('wrangler.jsonc','utf8').includes(d.database_id));
          assert.equal(c.vars.PREVIEW_SOURCE_SHA,process.env.PREVIEW_SOURCE_SHA);assert.equal(c.vars.MEMBER_ADDRESS_PROVIDER,'photon');assert(!c.vars.MEMBER_ADDRESS_API_KEY);
          JS
          node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json > account-completion-evidence/deploy.txt 2>&1 || { tail -n 70 account-completion-evidence/deploy.txt; exit 1; }
          echo 'PREVIEW_URL=https://shift-stabilisation-preview.matobrien.workers.dev' >> "$GITHUB_ENV"
      - name: Install retained browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Existing Member Details browser regression matrix
        run: node preview/member-details/browser-proof.mjs
      - name: Existing GP form and bounded assurance matrix
        run: node preview/member-details/gp-browser-proof.mjs
      - name: Other existing GP form browser matrix
        env:
          GP_FORM_TEST_PATH: /__review/gp-form-alternate
        run: node preview/member-details/gp-browser-proof.mjs
      - name: Optional Photon suggestions; two real provider calls plus fixture failure cases
        run: node account-completion/photon-browser.mjs
      - name: Separate delivery address browser matrix
        run: node account-completion/delivery-browser.mjs
      - name: Dual-mailbox email-change browser matrix with simulated mail only
        run: node account-completion/email-browser.mjs
      - name: Retain actual reports and unchanged production identity
        if: always()
        run: |
          mkdir -p account-completion-evidence
          git rev-parse HEAD > account-completion-evidence/source-sha.txt
          git ls-remote origin refs/heads/main > account-completion-evidence/production-main.txt
          if test -d work/staging/generated/review-evidence; then cp -R work/staging/generated/review-evidence account-completion-evidence/; fi
          git diff 4c014edce24bd9a37645dfbd6bad204ed3270091 --stat > account-completion-evidence/delta.txt
          git diff a09a339c0cb312cca78dea9063eace8688843eda --stat > account-completion-evidence/photon-delta.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-completion-preview-${{ github.run_id }}
          path: account-completion-evidence/
          retention-days: 14
          if-no-files-found: error
