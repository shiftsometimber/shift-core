name: M04 Route Readiness Gate
on:
  pull_request:
    paths:
      - 'm04-product-analytics-production.mjs'
      - 'm04-route-readiness-gate.mjs'
      - 'package.json'
      - '.github/workflows/m04-route-readiness.yml'
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check m04-product-analytics-production.mjs
      - run: node m04-route-readiness-gate.mjs
      - run: npm run check
