name: Isolated Fit and Grub refinement preview
on:
  push:
    branches: [preview/fit-v3-approved-20260914, preview/grub-intelligence-20260915]
    paths: ['.github/workflows/fit-grub-refinement-preview.yml','preview/fit-grub/**','frontend/member/member-fit-programme-v1.js','frontend/member/member-grub-programme-v1.js','tests/member-refinements-preview.test.mjs']
permissions:
  contents: read
concurrency:
  group: fit-grub-refinement-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Test candidate and enforce isolated configuration
        run: |
          node preview/fit-grub/build.mjs
          node --test preview/fit-grub/session-builder.test.mjs preview/fit-grub/session-visuals.test.mjs preview/fit-grub/session-effort.test.mjs preview/fit-grub/v3.test.mjs preview/fit-grub/grub-intelligence-preview.test.mjs tests/member-refinements-preview.test.mjs preview/fit-grub/catalogue.test.mjs tests/grub-programme-v1.test.mjs tests/afternoon-ticket-c-fit.test.mjs tests/medicine-stripe-retry-v1.test.mjs
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict'),c=JSON.parse(fs.readFileSync('preview/fit-grub/wrangler.json'));
          assert.equal(c.name,'shift-fit-grub-refinement-preview');
          assert.deepEqual(Object.keys(c).sort(),['assets','compatibility_date','main','name','preview_urls','workers_dev'].sort());
          assert.deepEqual(c.assets,{directory:'./public',binding:'PREVIEW_ASSETS',run_worker_first:true});
          assert.equal(c.main,'worker.js');assert.equal(c.workers_dev,true);
          JS
          node preview/fit-grub/build.mjs
      - name: Publish preview only
        run: |
          set -euo pipefail
          npx wrangler deploy --config preview/fit-grub/wrangler.json 2>&1 | tee preview-deploy.txt
      - name: Verify read-only preview and absent production connections
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          (async()=>{const url=fs.readFileSync('preview-deploy.txt','utf8').split(String.fromCharCode(10)).map(x=>x.trim()).find(x=>x.startsWith('https://shift-fit-grub-refinement-preview.')&&x.endsWith('.workers.dev'));assert.ok(url);
          for(const path of ['/member/fit','/member/grub','/phone','/visuals','/visual-phone','/catalogue','/catalogue-summary.json','/fit-guidance-summary.json','/fit-session-builder.js','/fit-v3','/fit-v3-images/walk.png','/catalogue-images/catalogue-chicken-traybake.webp']){const r=await fetch(url+path);assert.equal(r.status,200);assert.ok(r.headers.get('content-security-policy').includes("connect-src 'none'"));assert.ok(r.headers.get('x-robots-tag').includes('noindex'));}
          assert.equal((await fetch(url+'/catalogue-images/catalogue-chicken-traybake.webp',{method:'POST'})).status,405);
          assert.equal((await fetch(url+'/v1/member/state',{method:'POST',body:'{}'})).status,405);
          fs.writeFileSync('fit-grub-preview-proof.json',JSON.stringify({url,productionChanged:false,databaseBindings:0,serviceBindings:0,externalConnectionsBlocked:true,readOnlyServer:true},null,2));console.log('PREVIEW_URL='+url);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify all corrected image bytes
        run: node preview/fit-grub/verify-corrections.mjs https://shift-fit-grub-refinement-preview.matobrien.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fit-grub-refinement-preview-evidence
          path: |
            fit-grub-preview-proof.json
            preview-deploy.txt
            fit-correction-proof.json
