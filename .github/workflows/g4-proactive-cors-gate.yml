name: G4-008 Proactive Browser CORS Gate
on:
  pull_request:
    paths:
      - 'member-experience-v2.js'
      - 'g4-proactive-cors-source-gate.mjs'
      - '.github/workflows/g4-proactive-cors-gate.yml'
  push:
    branches: ['main']
    paths:
      - 'member-experience-v2.js'
      - 'g4-proactive-cors-source-gate.mjs'
      - '.github/workflows/g4-proactive-cors-gate.yml'
jobs:
  cors-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Prove proactive browser CORS source contract
        run: node g4-proactive-cors-source-gate.mjs
