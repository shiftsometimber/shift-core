name: Final V1 Human Acceptance
on:
  pull_request:
    paths:
      - 'evidence/matt-v1-final-content-acceptance-2026-08-14.json'
      - 'evidence/grub-v1-final-decisions-2026-08-14.json'
      - 'evidence/fit-v1-final-decisions-2026-08-14.json'
      - 'final-v1-human-acceptance-gate.mjs'
      - '.github/workflows/final-v1-human-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'evidence/matt-v1-final-content-acceptance-2026-08-14.json'
      - 'evidence/grub-v1-final-decisions-2026-08-14.json'
      - 'evidence/fit-v1-final-decisions-2026-08-14.json'
      - 'final-v1-human-acceptance-gate.mjs'
      - '.github/workflows/final-v1-human-acceptance.yml'
permissions:
  contents: read
jobs:
  accept-and-bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Validate exact final human acceptance authority
        run: node final-v1-human-acceptance-gate.mjs
      - run: python3 -m pip install --quiet openpyxl
      - run: python3 cofid-industrial-extract.py /tmp/cofid-index.json
      - name: Propagate eight accepted Grub families into exact publication payload
        env:
          COFID_INDEX: /tmp/cofid-index.json
          GRUB_PUBLICATION_DIR: final-v1-acceptance-evidence/grub
        run: node grub-v1-publication-pack.mjs evidence/grub-v1-final-decisions-2026-08-14.json
      - name: Require exact 798-recipe fail-closed publication result
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('final-v1-acceptance-evidence/grub/grub-v1-publication-summary.json','utf8'));
          if(p.approvedRecipes!==798||p.heldRecipes!==0||p.allPass!==true||p.publicationReady!==true)throw new Error(`unexpected Grub publication summary: ${JSON.stringify(p)}`);
          console.log('PASS: 798/798 final Grub recipes are bound to all-eight human PASS decisions; 0 held.');
          NODE
      - name: Retain Fit domain/member acceptance evidence
        run: |
          mkdir -p final-v1-acceptance-evidence/fit
          cp evidence/fit-v1-final-decisions-2026-08-14.json final-v1-acceptance-evidence/fit/
          cp evidence/matt-v1-final-content-acceptance-2026-08-14.json final-v1-acceptance-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: final-v1-human-acceptance-evidence
          path: final-v1-acceptance-evidence/
          retention-days: 90
