name: Final live contrast closeout v2
on:
  push:
    branches: [audit/full-live-contrast-20260917]
    paths: ['.github/workflows/final-contrast-closeout-v2.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_MAIN: ce4cdc04c6a3e9ba4770cded4b89e09591ba1155
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock to current audited production source
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B contrast-final-v2 origin/main
          git config user.name 'SHIFT contrast closeout'
          git config user.email 'it@shiftsometimber.co.uk'
      - name: Apply root repairs and severe-clash guard
        run: |
          echo '' | base64 -d > /tmp/contrast_patch.py
          python /tmp/contrast_patch.py
      - name: Prove repair before main changes
        run: |
          set -euo pipefail
          node --check public-navigation-policy.mjs
          node --test tests/public-navigation-policy.test.mjs tests/public-ticker-contrast-safety.test.mjs
          git diff --check
      - name: Push guarded closeout to main
        run: |
          set -euo pipefail
          git add public-navigation-policy.mjs tests/public-ticker-contrast-safety.test.mjs
          git commit -m 'Close remaining severe public contrast collisions'
          git push origin HEAD:main
