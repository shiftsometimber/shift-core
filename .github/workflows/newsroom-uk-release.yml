name: Publish approved SHIFT Newsroom and UK coverage
on:
  push:
    branches: [fix/newsroom-uk-20260913]
    paths:
      - '.github/workflows/newsroom-uk-release.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Require current approved source
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 73c58c9d7c8b6865f69b34c128251a8151a95728
          git diff --exit-code 73c58c9d7c8b6865f69b34c128251a8151a95728 -- frontend wrangler.jsonc package.json package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Newsroom, review, navigation and security checks
        run: |
          node --check worker-entry-v6.js
          node --check radar-authoritative-scan-v1.js
          node --check radar-integration-v1.js
          node --test tests/radar-newsroom-filters-v1.test.mjs tests/radar-uk-editorial-v1.test.mjs tests/radar-newsroom-page-v1.test.mjs tests/hq-radar-review-queue-v1.test.mjs tests/shift-ai-newsroom-wire-v1.test.mjs tests/radar-freshness-v2.test.mjs
          node my-timber-navigation-gate.mjs
          node my-timber-final-source-gate.mjs
          node g5-012-login-fastpath-gate.mjs
          node --test tests/member-auth-ui-v2.test.mjs tests/turnstile-auth-v1.test.mjs tests/medicine-commerce-v1.test.mjs tests/medicine-front-door-v1.test.mjs tests/medicine-purchase-e2e.test.mjs
      - name: Guard active Worker version and record live source coverage
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > newsroom-deployment-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('newsroom-deployment-before.json'))
          latest=max(d,key=lambda x:x['created_on'])
          assert len(latest['versions'])==1 and latest['versions'][0]['version_id']=='611d6292-d1c7-42e0-b200-88d8fa196aff', 'Worker moved; refuse stale release'
          PY
          npx wrangler d1 execute shift-core-db --remote --command "SELECT id,authority,region,url,active FROM radar_sources ORDER BY id" --json > newsroom-sources-before.json
          node verification/rec035-newsroom-live.mjs before
      - name: Deploy only the approved newsroom runtime changes
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify newsroom and preservation after propagation
        run: |
          for attempt in 1 2 3 4; do
            if node verification/rec035-newsroom-live.mjs after; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REC-035-newsroom-evidence
          path: |
            newsroom-deployment-before.json
            newsroom-sources-before.json
            newsroom-public-before.json
            newsroom-live-proof.json
