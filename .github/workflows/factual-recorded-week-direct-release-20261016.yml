name: Factual Recorded Week Direct Runtime Release
on:
  push:
    branches: [release/factual-recorded-week-direct-20261016]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reproduce the unchanged production compiler environment
        run: |
          npm ci --ignore-scripts
          node -e "require('node:assert/strict').equal(require('./node_modules/wrangler/package.json').version,'4.112.0')"
      - name: Verify native W source, all original factual runtime controls and owned provider guards before upload
        run: |
          node --test --test-concurrency=1 --test-reporter=tap tests/recorded-week-direct-source-20261016.test.mjs member-experience/tests/treatment-week-route.test.mjs tests/recorded-week-live-20261014.test.mjs tests/recorded-week-direct-owned-release-20261016.test.mjs
      - name: Verify the exact Core W upload and retained accepted HQ before traffic
        id: prepare
        run: node release/recorded-week-direct-owned-release-20261016.mjs prepare
      - name: Deploy only the exact prepared recorded-week Core version
        id: deploy
        run: node release/recorded-week-direct-owned-release-20261016.mjs deploy
      - name: Verify owned W Core, retained HQ, protected stock and unchanged GP controls
        run: node release/recorded-week-direct-owned-release-20261016.mjs verify
      - name: Restore only the exact failed W Core ownership to its captured H predecessor
        # Cancellation is handled while the runner is available. A hard job
        # timeout does not guarantee that any cleanup step can execute.
        if: ${{ always() && (failure() || cancelled()) && steps.prepare.outcome == 'success' }}
        run: node release/recorded-week-direct-owned-release-20261016.mjs rollback
      - name: Retain actual provider evidence and owned rollback results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-week-direct-runtime-release-${{ github.run_id }}
          path: recorded-week-direct-runtime-release/
          if-no-files-found: warn
          retention-days: 90
