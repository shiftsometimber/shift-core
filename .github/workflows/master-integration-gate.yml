name: Shift Master Integration Gate
on:
  pull_request:
    paths:
      - '**.js'
      - '**.mjs'
      - 'docs/COMMISSIONING-EVIDENCE.md'
      - 'docs/FINISH-LINE.md'
      - 'docs/LAUNCH-FINISH-LINE.md'
      - '.github/workflows/master-integration-gate.yml'
jobs:
  integration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: V1 finish-line and auth delivery contract
        run: node finish-line-gate.mjs
      - name: Toolchain source gate
        run: node toolchain-source-gate.mjs
      - name: Gate 1 persistence/source contract
        run: node gate1-persistence-source-gate.mjs
      - name: Gate 1 auth security source contract
        run: node gate1-auth-security-source-gate.mjs
      - name: Gate 2 Grub/Fit source contract
        run: node gate2-product-source-gate.mjs
      - name: Gate 2 durable learning contract
        run: node gate2-learning-source-gate.mjs
      - name: Gate 2 Today/Progress/Plans contract
        run: node gate2-daily-source-gate.mjs
      - name: Gate 2 practical tools contract
        run: node gate2-practical-source-gate.mjs
      - name: Gate 4 One Shift Brain architecture contract
        run: node gate4-one-shift-brain-gate.mjs
      - name: Gate 4/5 Knowledge Radar Watchtower lifecycle contract
        run: node gate45-knowledge-radar-watchtower-gate.mjs
      - name: Gate 5 Watchtower analytics outcomes contract
        run: node gate5-watchtower-analytics-gate.mjs
      - name: Gate 5 parallel trust scale contract
        run: node gate5-trust-scale-gate.mjs
      - name: Gate 5 full assault contract
        run: node gate5-full-assault-gate.mjs
      - name: Gate 5 persisted probe history contract
        run: node gate5-probe-history-gate.mjs
      - name: Adversarial break/security state transitions
        run: node adversarial-commissioning-v1.mjs
      - name: Longitudinal cross-system adversarial commissioning
        run: node adversarial-longitudinal-v2.mjs
      - name: Structured content 10k load benchmark
        run: node structured-content-load-v1.mjs
      - name: Live runtime auth abuse probe
        run: node runtime-auth-abuse-v1.mjs
      - name: Dave progressive journey
        run: node dave-journey-v1.mjs
      - name: Syntax checks
        run: |
          set -e
          for f in $(find . -maxdepth 1 \( -name '*.js' -o -name '*.mjs' \) -print); do echo "Syntax: $f"; node --check "$f"; done
      - name: Existing Shift Academy source gate
        run: node academy-source-gate.mjs
      - name: Master integration source gate
        run: node integration-source-gate.mjs
      - name: Existing core check
        run: npm run check
      - name: Staged Radar end-to-end commissioning
        run: node radar-e2e-staging.mjs
      - name: Gate 1 public production probe
        run: node gate1-production-journey-probe.mjs
      - name: Finish-line authenticated production isolation and retained state
        run: node finish-authenticated-production.mjs
