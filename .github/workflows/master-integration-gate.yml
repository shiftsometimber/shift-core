name: Shift Master Integration Gate
on:
  pull_request:
    paths:
      - '**.js'
      - '**.mjs'
      - 'content/**'
      - 'assets/fit/**'
      - 'docs/COMMISSIONING-EVIDENCE.md'
      - 'docs/FINISH-LINE.md'
      - 'docs/LAUNCH-FINISH-LINE.md'
      - 'docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md'
      - 'docs/ACTIVE-RECOVERY.md'
      - '.github/workflows/master-integration-gate.yml'
      - '.github/workflows/production-commissioning.yml'
jobs:
  integration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: V1 finish-line, 57-row audit crosswalk and auth delivery contract
        run: node finish-line-gate.mjs
      - name: Toolchain source gate
        run: node toolchain-source-gate.mjs
      - name: Gate 1 persistence/source contract
        run: node gate1-persistence-source-gate.mjs
      - name: Gate 1 auth security source contract
        run: node gate1-auth-security-source-gate.mjs
      - name: Gate 1 / M09 explicit email verification lifecycle
        run: node gate1-email-verification-e2e.mjs
      - name: Secure production commissioning identity contract
        run: node commissioning-identity-gate.mjs
      - name: Gate 2 Grub/Fit source contract
        run: node gate2-product-source-gate.mjs
      - name: M11/M12 content-factory authoring quality contract
        run: node content-factory-gate.mjs
      - name: Industrial 224+224 authored-universe quality gate
        run: node industrial-factory-gate.mjs
      - name: Industrial 448-object structured staging ingest
        run: node industrial-factory-staging.mjs
      - name: M11 CoFID ingredient-level nutrition validation
        run: node grub-nutrition-gate.mjs
      - name: M12 Fit authored-vs-member-QA visual reconciliation
        run: node fit-visual-reconciliation-gate.mjs
      - name: M07 structured publication barrier
        run: node structured-content-publication-gate.mjs
      - name: M07 structured commissioning-floor runtime contract
        run: node structured-runtime-staging.mjs
      - name: M11/M12 longitudinal catalogue capacity simulator
        run: node content-factory-simulator.mjs
      - name: Gate 2 durable learning contract
        run: node gate2-learning-source-gate.mjs
      - name: Gate 2 Today/Progress/Plans contract
        run: node gate2-daily-source-gate.mjs
      - name: Gate 2 practical tools contract
        run: node gate2-practical-source-gate.mjs
      - name: Gate 4 One Shift Brain architecture contract
        run: node gate4-one-shift-brain-gate.mjs
      - name: Gate 4/5 Knowledge Radar Watchtower lifecycle contract
        run: node gate45-knowledge-radar-watchtower-gate.mjs
      - name: Gate 5 Watchtower analytics outcomes contract
        run: node gate5-watchtower-analytics-gate.mjs
      - name: Gate 5 parallel trust scale contract
        run: node gate5-trust-scale-gate.mjs
      - name: M14 member memory inspect/correct/delete commissioning
        run: node memory-controls-e2e-staging.mjs
      - name: M15 mocked partner Health MOT -> Progress -> Today commissioning
        shell: bash
        run: |
          set +e
          node health-mot-e2e-staging.mjs > /tmp/m15.log 2>&1
          rc=$?
          cat /tmp/m15.log
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -n 12 /tmp/m15.log | tr '\n' ' ')
            echo "::error file=health-mot-e2e-staging.mjs::$msg"
            exit "$rc"
          fi
      - name: M16 governed outcomes member-one/cohort proof
        run: node outcomes-e2e-staging.mjs
      - name: Gate 5 full assault contract
        run: node gate5-full-assault-gate.mjs
      - name: Gate 5 persisted probe history contract
        run: node gate5-probe-history-gate.mjs
      - name: B07 controlled Watchtower degradation and recovery fire drill
        run: node watchtower-fire-drill-staging.mjs
      - name: Adversarial break/security state transitions
        run: node adversarial-commissioning-v1.mjs
      - name: Longitudinal cross-system adversarial commissioning
        run: node adversarial-longitudinal-v2.mjs
      - name: Structured content 10k load benchmark
        run: node structured-content-load-v1.mjs
      - name: Live runtime auth abuse probe
        run: node runtime-auth-abuse-v1.mjs
      - name: Dave progressive journey
        run: node dave-journey-v1.mjs
      - name: Syntax checks
        run: |
          set -e
          for f in $(find . -maxdepth 1 \( -name '*.js' -o -name '*.mjs' \) -print); do echo "Syntax: $f"; node --check "$f"; done
      - name: Existing Shift Academy source gate
        run: node academy-source-gate.mjs
      - name: Master integration source gate
        run: node integration-source-gate.mjs
      - name: Existing core check
        run: npm run check
      - name: Staged Radar end-to-end commissioning
        run: node radar-e2e-staging.mjs
      - name: M03 scheduled authoritative Radar scan
        run: node radar-scheduled-scan-staging.mjs
      - name: Gate 1 public production health probe
        run: node gate1-production-journey-probe.mjs
