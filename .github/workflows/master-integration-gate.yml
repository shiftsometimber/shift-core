name: Shift Master Integration Gate
on:
  pull_request:
    paths:
      - 'personal-platform-v1.js'
      - 'member-commissioning-v1.js'
      - 'member-product-v4.js'
      - 'gate2-product-source-gate.mjs'
      - 'knowledge-graph-v1.js'
      - 'radar-integration-v1.js'
      - 'radar-public-v1.js'
      - 'radar-e2e-staging.mjs'
      - 'radar-medicine-seed-v1.js'
      - 'integration-source-gate.mjs'
      - 'toolchain-source-gate.mjs'
      - 'gate1-persistence-source-gate.mjs'
      - 'gate1-auth-security-source-gate.mjs'
      - 'gate1-production-journey-probe.mjs'
      - 'package.json'
      - '.nvmrc'
      - 'worker.js'
      - 'auth-recovery-v1.js'
      - 'shift-ai-v3.js'
      - 'worker-entry-v6.js'
      - 'academy-source-gate.mjs'
      - 'migrations/002_personal_knowledge_radar.sql'
      - '.github/workflows/master-integration-gate.yml'
jobs:
  integration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Toolchain source gate
        run: node toolchain-source-gate.mjs
      - name: Gate 1 persistence/source contract
        run: node gate1-persistence-source-gate.mjs
      - name: Gate 1 auth security source contract
        run: node gate1-auth-security-source-gate.mjs
      - name: Gate 2 Grub/Fit source contract
        run: node gate2-product-source-gate.mjs
      - name: Syntax — personal platform
        run: node --check personal-platform-v1.js
      - name: Syntax — member commissioning
        run: node --check member-commissioning-v1.js
      - name: Syntax — member product V4
        run: node --check member-product-v4.js
      - name: Syntax — Gate 2 source gate
        run: node --check gate2-product-source-gate.mjs
      - name: Syntax — knowledge graph
        run: node --check knowledge-graph-v1.js
      - name: Syntax — Radar integration
        run: node --check radar-integration-v1.js
      - name: Syntax — Radar public
        run: node --check radar-public-v1.js
      - name: Syntax — Radar staging
        run: node --check radar-e2e-staging.mjs
      - name: Syntax — Shift AI
        run: node --check shift-ai-v3.js
      - name: Syntax — production entry
        run: node --check worker-entry-v6.js
      - name: Syntax — integration source gate
        run: node --check integration-source-gate.mjs
      - name: Syntax — toolchain source gate
        run: node --check toolchain-source-gate.mjs
      - name: Syntax — Gate 1 persistence gate
        run: node --check gate1-persistence-source-gate.mjs
      - name: Syntax — Gate 1 auth gate
        run: node --check gate1-auth-security-source-gate.mjs
      - name: Syntax — Gate 1 production probe
        run: node --check gate1-production-journey-probe.mjs
      - name: Existing Shift Academy source gate
        run: node academy-source-gate.mjs
      - name: Master integration source gate
        run: node integration-source-gate.mjs
      - name: Existing core check
        run: npm run check
      - name: Staged Radar end-to-end commissioning
        run: node radar-e2e-staging.mjs
      - name: Gate 1 public production probe
        run: node gate1-production-journey-probe.mjs
