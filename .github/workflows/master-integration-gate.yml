name: Shift Master Integration Gate
on:
  pull_request:
    paths:
      - 'personal-platform-v1.js'
      - 'member-commissioning-v1.js'
      - 'member-product-v4.js'
      - 'member-product-v5.js'
      - 'member-product-v6.js'
      - 'member-daily-v2.js'
      - 'member-daily-v3.js'
      - 'member-practical-v1.js'
      - 'member-experience-v2.js'
      - 'shift-visualise-v2.js'
      - 'shift-brain-v1.js'
      - 'shift-ai-v5.js'
      - 'shift-ai-v6.js'
      - 'shift-ai.js'
      - 'hq-ai-v2.js'
      - 'product-analytics-v1.js'
      - 'watchtower-v1.js'
      - 'outcomes-v1.js'
      - 'gate2-product-source-gate.mjs'
      - 'gate2-learning-source-gate.mjs'
      - 'gate2-daily-source-gate.mjs'
      - 'gate2-practical-source-gate.mjs'
      - 'gate4-one-shift-brain-gate.mjs'
      - 'gate5-watchtower-analytics-gate.mjs'
      - 'knowledge-graph-v1.js'
      - 'radar-integration-v1.js'
      - 'radar-public-v1.js'
      - 'radar-e2e-staging.mjs'
      - 'radar-medicine-seed-v1.js'
      - 'integration-source-gate.mjs'
      - 'toolchain-source-gate.mjs'
      - 'gate1-persistence-source-gate.mjs'
      - 'gate1-auth-security-source-gate.mjs'
      - 'gate1-production-journey-probe.mjs'
      - 'package.json'
      - '.nvmrc'
      - 'worker.js'
      - 'auth-recovery-v1.js'
      - 'shift-ai-v3.js'
      - 'worker-entry-v6.js'
      - 'academy-source-gate.mjs'
      - 'migrations/002_personal_knowledge_radar.sql'
      - '.github/workflows/master-integration-gate.yml'
jobs:
  integration-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Toolchain source gate
        run: node toolchain-source-gate.mjs
      - name: Gate 1 persistence/source contract
        run: node gate1-persistence-source-gate.mjs
      - name: Gate 1 auth security source contract
        run: node gate1-auth-security-source-gate.mjs
      - name: Gate 2 Grub/Fit source contract
        run: node gate2-product-source-gate.mjs
      - name: Gate 2 durable learning contract
        run: node gate2-learning-source-gate.mjs
      - name: Gate 2 Today/Progress/Plans contract
        run: node gate2-daily-source-gate.mjs
      - name: Gate 2 practical tools contract
        run: node gate2-practical-source-gate.mjs
      - name: Gate 4 One Shift Brain architecture contract
        run: node gate4-one-shift-brain-gate.mjs
      - name: Gate 5 Watchtower analytics outcomes contract
        run: node gate5-watchtower-analytics-gate.mjs
      - name: Syntax checks
        run: |
          set -e
          for f in personal-platform-v1.js member-commissioning-v1.js member-product-v4.js member-product-v5.js member-product-v6.js member-daily-v2.js member-daily-v3.js member-practical-v1.js member-experience-v2.js shift-visualise-v2.js shift-brain-v1.js shift-ai-v3.js shift-ai-v5.js shift-ai-v6.js hq-ai-v2.js product-analytics-v1.js watchtower-v1.js outcomes-v1.js gate2-product-source-gate.mjs gate2-learning-source-gate.mjs gate2-daily-source-gate.mjs gate2-practical-source-gate.mjs gate4-one-shift-brain-gate.mjs gate5-watchtower-analytics-gate.mjs knowledge-graph-v1.js radar-integration-v1.js radar-public-v1.js radar-e2e-staging.mjs worker-entry-v6.js integration-source-gate.mjs toolchain-source-gate.mjs gate1-persistence-source-gate.mjs gate1-auth-security-source-gate.mjs gate1-production-journey-probe.mjs; do
            echo "Syntax: $f"
            node --check "$f"
          done
      - name: Existing Shift Academy source gate
        run: node academy-source-gate.mjs
      - name: Master integration source gate
        run: node integration-source-gate.mjs
      - name: Existing core check
        run: npm run check
      - name: Staged Radar end-to-end commissioning
        run: node radar-e2e-staging.mjs
      - name: Gate 1 public production probe
        run: node gate1-production-journey-probe.mjs
