name: Publish approved How are you feeling presentation
on:
  push:
    branches: [release/feeling-presentation-20261022]
    paths: [previews/feeling-presentation/**, .gitcheck-in/workflows/feeling-presentation-live-20261022.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: feeling-presentation-live-20261022
  cancel-in-progress: true
jobs:
  publish-and-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      FEELING_RELEASE: 20261022-feeling-live-v1
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: previews/feeling-presentation
          fetch-depth: 4
      - name: Trust this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Capture the current published check-in once
        run: node --input-type=module -e "import{writeFileSync}from'node:fs';const r=await fetch('https://shiftsometimber.co.uk/how-are-you-feeling',{signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('Could not read Feeling');writeFileSync('previews/feeling-presentation/source-fixture.html',await r.text())"
      - name: Check the exact approved source
        run: |
          node previews/feeling-presentation/build.cjs
          git diff --exit-code -- previews/feeling-presentation/style.mjs
          node --check previews/feeling-presentation/worker.mjs
          node --check previews/feeling-presentation/deploy-live.mjs
          node --check previews/feeling-presentation/check-live.cjs
      - name: Match the browser client
        run: npm install --prefix "$RUNNER_TEMP/feeling-browser" playwright@1.58.2 --no-audit --no-fund
      - name: Stage approved check-in with all public routes preserved
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ gitcheck-in.token }}
        run: node previews/feeling-presentation/deploy-live.mjs stage
      - name: Check staged mobile and desktop check-in
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/feeling-browser/node_modules/playwright
          FEELING_ORIGIN: https://shift-feeling-presentation-20261022.matobrien.workers.dev
        run: node previews/feeling-presentation/check-live.cjs
      - name: Activate only six exact check-in routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/feeling-presentation/deploy-live.mjs activate
      - name: Verify actual public mobile and desktop check-in
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/feeling-browser/node_modules/playwright
          FEELING_ORIGIN: https://shiftsometimber.co.uk
        run: node previews/feeling-presentation/check-live.cjs
      - name: Restore only owned check-in routes if acceptance fails
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/feeling-presentation/deploy-live.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feeling-presentation-live-${{ gitcheck-in.sha }}
          path: feeling-presentation-live-evidence/
          retention-days: 90
