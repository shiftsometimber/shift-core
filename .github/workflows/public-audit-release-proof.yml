name: Public Audit Release Proof
on:
  push:
    branches: [fix/public-audit-evidence-20260916]
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Obtain unchanged original before and after release snapshots
        run: gh run download 35154786479 --name member-public-preservation-35154786479 --dir proof
      - name: Capture fresh post-deployment hashes without changing the retained baseline
        run: node member-experience/public-preservation.mjs proof/public-after.json
      - name: Prove nine unchanged responses and exactly two owner-requested changes
        run: node scripts/verify-public-audit-preservation.mjs proof/public-before.json proof/public-after.json | tee public-audit-preservation.json
      - name: Prove all four public repairs on live traffic
        run: node scripts/verify-public-audit-live.mjs | tee public-audit-live.json
      - name: Prove unchanged member and Medicines Watch paths
        run: |
          node member-experience/verify-production-member.mjs
          node medicines-watch/verify-live.mjs
          node g2-012-production-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-audit-release-evidence
          path: |
            public-audit-*.json
            member-live-proof.json
            medicines-watch-live-proof.json
