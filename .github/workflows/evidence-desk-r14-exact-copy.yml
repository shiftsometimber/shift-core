name: Evidence Desk R1.4 Non-Production Exact Copy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-desk-r14-nonprod-copy
  cancel-in-progress: false

jobs:
  commission:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      R14_D1_ID: 8cbbd1f2-86bb-47a3-9b1a-e4735c3252c3
      PRODUCTION_D1_ID: 88f40aed-cb23-4372-8c94-8a73f48bc847
      DB_NAME: shift-evidence-desk-r12-nonprod-db
      CONFIG: wrangler.evidence-desk-r14.generated.jsonc
      R14_URL: https://shift-evidence-desk-r12-nonprod.matobrien.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Fail closed without the exact isolated database
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$R14_D1_ID" != "$PRODUCTION_D1_ID"
          npx --yes wrangler@4.112.0 d1 list --json >/tmp/r14-d1-list.json
          jq -e --arg id "$R14_D1_ID" --arg name "$DB_NAME" '.[] | select((.uuid // .database_id // .id)==$id and .name==$name)' /tmp/r14-d1-list.json
          sed "s/__EVIDENCE_R12_D1_DATABASE_ID__/$R14_D1_ID/" wrangler.evidence-desk-r12.template.jsonc > "$CONFIG"
          jq -e --arg id "$R14_D1_ID" '.vars.EVIDENCE_DESK_ENV=="non-production" and .d1_databases[0].database_id==$id and (.ai|not)' "$CONFIG"

      - name: Run repository and Evidence Desk gates
        run: |
          npm install --no-audit --no-fund
          node --test tests/*.test.mjs
          node tests/evidence-desk-source-gate.mjs

      - name: Prove the inherited amend state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config "$CONFIG" --json --command "SELECT p.id,p.status AS package_status,e.status AS event_status,p.risk_lane,p.communication_class,p.web_eligible,p.newsletter_eligible,p.social_eligible,p.qualified_review_ref,p.communications_review_ref FROM evidence_desk_packages p JOIN evidence_desk_events e ON e.id=p.event_id ORDER BY p.id DESC LIMIT 1;" | tee /tmp/r14-before.json
          jq -e '[.. | objects | select(.package_status=="changes_required" and .event_status=="changes_required" and .risk_lane=="red" and .communication_class=="clinical_safety" and .web_eligible==0 and .newsletter_eligible==0 and .social_eligible==0 and .qualified_review_ref==null and .communications_review_ref==null)] | length==1' /tmp/r14-before.json

      - name: Deploy review-only candidate and rotate token
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config "$CONFIG" >/tmp/r14-deploy.txt 2>&1
          grep -F "$R14_URL" /tmp/r14-deploy.txt
          token=$(openssl rand -hex 32)
          printf '%s' "$token" | npx wrangler secret put EVIDENCE_DESK_COMMISSION_TOKEN --config "$CONFIG" >/tmp/r14-secret.txt
          echo "R14_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Attach exact copy and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $R14_TOKEN"
          curl --fail-with-body --retry 6 --retry-all-errors -sS -X POST -H "$auth" "$R14_URL/v1/evidence-desk/r1-4/replacement" | tee /tmp/r14-attach.json
          jq -e '.ok==true and .idempotent==false and .state=="awaiting_specialist_review" and .revision.revisionId=="R1.4-MHRA-NAION-2026-02-05-V1" and (.revision.copyHash|length)==64 and .locks.qualifiedReview==true and .locks.communicationsReview==true and .locks.website==true and .locks.newsletter==true and .locks.social==true and .locks.model==true' /tmp/r14-attach.json
          curl --fail-with-body -sS -X POST -H "$auth" "$R14_URL/v1/evidence-desk/r1-4/replacement" | tee /tmp/r14-replay.json
          jq -e '.ok==true and .idempotent==true and .state=="awaiting_specialist_review"' /tmp/r14-replay.json

      - name: Prove specialist packet and all locks
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $R14_TOKEN"
          curl --fail-with-body -sS -H "$auth" "$R14_URL/v1/evidence-desk/r1-3/checklist" | tee /tmp/r14-checklist.json
          jq -e '.complete==true and .missing==[] and .recommendedDecision=="send_for_qualified_review" and .controls.enabled==false and .controls.ingestionEnabled==false' /tmp/r14-checklist.json
          curl --fail-with-body -sS -H "$auth" "$R14_URL/v1/evidence-desk/r1-4/review-packet" | tee /tmp/r14-packet.json
          jq -e '.mode=="specialist_review_packet" and .integrity.exactRevision==true and .specialistReviews.qualifiedClinical.approved==false and .specialistReviews.medicinesCommunications.approved==false and .distribution.web=="locked" and .distribution.newsletter=="locked" and .distribution.social=="locked" and .preflight.ready==false and .preflight.blockers==["qualified_clinical_review","medicines_communications_review","page_baseline_and_rollback_capture","publication_authority_disabled"] and .capabilities.publish==false and .capabilities.model==false' /tmp/r14-packet.json
          npx wrangler d1 execute DB --remote --config "$CONFIG" --json --command "SELECT p.status AS package_status,e.status AS event_status,p.web_eligible,p.newsletter_eligible,p.social_eligible,p.qualified_review_ref,p.communications_review_ref FROM evidence_desk_packages p JOIN evidence_desk_events e ON e.id=p.event_id ORDER BY p.id DESC LIMIT 1; SELECT decision,authority_ref,COUNT(*) AS total FROM evidence_desk_decisions WHERE decision='exact_replacement_attached' GROUP BY decision,authority_ref; SELECT enabled,ingestion_enabled,decision_email_enabled,website_publish_enabled,newsletter_enabled,social_enabled FROM evidence_desk_control WHERE id=1;" | tee /tmp/r14-d1-final.json
          jq -e '[.. | objects | select(.package_status=="awaiting_specialist_review" and .event_status=="awaiting_specialist_review" and .web_eligible==0 and .newsletter_eligible==0 and .social_eligible==0 and .qualified_review_ref==null and .communications_review_ref==null)] | length==1' /tmp/r14-d1-final.json
          jq -e '[.. | objects | select(.decision=="exact_replacement_attached" and .authority_ref=="R1.4-MHRA-NAION-2026-02-05-V1" and .total==1)] | length==1' /tmp/r14-d1-final.json
          jq -e '[.. | objects | select(.enabled==0 and .ingestion_enabled==0 and .decision_email_enabled==0 and .website_publish_enabled==0 and .newsletter_enabled==0 and .social_enabled==0)] | length==1' /tmp/r14-d1-final.json

      - name: Upload sealed proof
        uses: actions/upload-artifact@v4
        with:
          name: shift-evidence-desk-r14-proof
          path: /tmp/r14-*.json
          retention-days: 30
