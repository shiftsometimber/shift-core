name: Approved book voice isolated preview
on:
  push:
    branches: [preview/book-voice-a9c990-20261002]
permissions:
  contents: read
concurrency:
  group: book-voice-a9c990-preview-only
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      PREVIEW_SOURCE_SHA: ${{ github.sha }}
      PREVIEW_URL: https://shift-book-voice-a9c990.matobrien.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: node --test tests/book-voice.test.mjs tests/public-treatment-guidance.test.mjs tests/promise-accuracy.test.mjs
      - run: node preview/stabilisation/prepare.mjs
      - run: node preview/book-voice/provision.mjs
      - run: npx wrangler deploy --config work/staging/generated/config.json
      - run: npm install --prefix "$RUNNER_TEMP/voice-tools" --no-audit --no-fund playwright@1.58.2
      - run: '"$RUNNER_TEMP/voice-tools/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - run: APP_TOOLS="$RUNNER_TEMP/voice-tools" node preview/book-voice/verify.cjs
      - name: Evidence checksums
        if: always()
        run: find work/staging/generated/book-voice-evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > work/staging/generated/book-voice-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-voice-preview-${{ github.sha }}
          path: work/staging/generated/book-voice-evidence/
          retention-days: 90
