name: Stabilisation preview completion gate
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: [.github/workflows/stabilisation-preview-complete.yml]
permissions:
  contents: write
concurrency:
  group: stabilisation-life-back-preview-only
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/preview/stabilisation-life-back-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stabilisation-life-back-20260917
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Apply diagnosed fixes and commit only the preview branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview/stabilisation-life-back-20260917
          test "$(git branch --show-current)" = preview/stabilisation-life-back-20260917
          node preview/stabilisation/browser-repairs.mjs
          node member-experience/prepare-life-back.mjs
          git config user.name 'SHIFT preview verification'
          git config user.email 'it@shiftsometimber.co.uk'
          git add preview/stabilisation public-shell-contract.mjs member-experience/life-back-assets.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Correct preview-only browser entry and shared footer dependency'
            git push origin HEAD:refs/heads/preview/stabilisation-life-back-20260917
          fi
          echo "PREVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Application and regression gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/staging/generated/review-evidence
          node --test --test-reporter=tap member-experience/tests/*.test.mjs member-experience/staging/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs tests/public-ticker-*.test.mjs tests/public-continuity.test.mjs tests/adaptive-treatment-integrity.test.mjs tests/my-timber-analytics-privacy.test.mjs tests/schema-readiness.test.mjs tests/scheduled-intelligence-delivery.test.mjs tests/fit-reminders-delivery.test.mjs 2>&1 | tee work/staging/generated/review-evidence/unit-regression.tap
      - name: Prepare fictional accounts and read-only public capture
        run: node preview/stabilisation/prepare.mjs
      - name: Prove shared navigation, preserved content and exact sitemap delta
        run: node preview/stabilisation/verify-public.mjs
      - name: Provision separately named preview databases only
        run: node preview/stabilisation/provision.mjs
      - name: Guard and deploy the single isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('work/staging/generated/config.json'));
          assert.equal(c.name,'shift-stabilisation-preview');assert.equal(c.vars.SHIFT_ENVIRONMENT,'stabilisation-preview-20260917');assert(c.workers_dev);
          assert(!c.routes&&!c.route&&!c.triggers&&!c.send_email&&!c.ai);
          assert.deepEqual(c.d1_databases.map(d=>d.database_name).sort(),['shift-stabilisation-preview-auth-20260917','shift-stabilisation-preview-data-20260917']);
          for(const d of c.d1_databases)assert(!fs.readFileSync('wrangler.jsonc','utf8').includes(d.database_id));
          JS
          if ! node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json > "$RUNNER_TEMP/preview-deploy.txt" 2>&1; then tail -n 70 "$RUNNER_TEMP/preview-deploy.txt"; exit 1; fi
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const url=fs.readFileSync(process.env.RUNNER_TEMP+'/preview-deploy.txt','utf8').match(/https:\/\/shift-stabilisation-preview\.[a-z0-9-]+\.workers\.dev/)?.[0];if(!url)throw Error('Isolated preview URL not returned');
          fs.appendFileSync(process.env.GITHUB_ENV,'PREVIEW_URL='+url+'\n');
          fs.writeFileSync('work/staging/generated/review-evidence/deployment.json',JSON.stringify({previewOnly:true,url,source:process.env.PREVIEW_SOURCE_SHA,productionWrites:0},null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Preview ONLY: '+url+'/__review\nSource: '+process.env.PREVIEW_SOURCE_SHA+'\n');
          JS
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Prove the complete hosted member loop
        run: node preview/stabilisation/browser-proof.mjs
      - name: Upload sanitised evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilisation-life-back-preview-evidence
          retention-days: 14
          path: |
            work/staging/generated/public-proof.json
            work/staging/generated/public-summary.json
            work/staging/generated/review-evidence/**
          if-no-files-found: warn
