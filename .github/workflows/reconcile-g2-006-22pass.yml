name: Reconcile G2-006 Board
on:
  push:
    branches:
      - reconcile/g2-006-22pass
    paths:
      - 'reconcile-g2-006-22pass.mjs'
      - '.github/workflows/reconcile-g2-006-22pass.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/g2-006-22pass
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reconcile demonstrated evidence
        run: node reconcile-g2-006-22pass.mjs
      - name: Commit authoritative board
        run: |
          git config user.name "shift-commissioning-bot"
          git config user.email "shiftsometimber@gmail.com"
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/LAUNCH-FINISH-LINE.md docs/COMMISSIONING-EVIDENCE.md docs/ACTIVE-RECOVERY.md finish-line-gate.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile G2-006 production PASS and V6 Grub evidence"
          git push origin HEAD:reconcile/g2-006-22pass
