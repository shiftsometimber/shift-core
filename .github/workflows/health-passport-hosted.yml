name: Health Passport full hosted integration
on:
  push:
    branches: ['feat/health-passport-v1-20260919']
    paths:
      - '.github/workflows/health-passport-hosted.yml'
      - 'health-passport/**'
      - 'frontend/member/member-my-journey-v2.js'
permissions:
  contents: read
concurrency:
  group: health-passport-full-hosted
  cancel-in-progress: false
jobs:
  hosted:
    if: github.repository == 'shiftsometimber/shift-core' && github.ref == 'refs/heads/feat/health-passport-v1-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install openpyxl==3.1.5
      - name: Verify existing source gates before any isolated deployment
        run: |
          mkdir -p passport-hosted-proof
          set -o pipefail
          node --test health-passport/*.test.mjs tests/my-journey*.test.mjs member-experience/tests/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs | tee passport-hosted-proof/regressions.tap
          node my-journey-integration-gate.mjs
          node my-timber-final-source-gate.mjs
      - name: Prepare original complete scripts and fictional password accounts
        run: node health-passport/hosted/prepare.mjs
      - name: Initialise only the explicitly separate preview database
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node health-passport/hosted/provision.mjs
      - name: Deploy only the named expiring workers.dev preview
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          node node_modules/wrangler/bin/wrangler.js deploy --config health-passport/hosted/generated/config.json > health-passport/hosted/generated/deploy.log 2>&1 || { tail -n 50 health-passport/hosted/generated/deploy.log; exit 1; }
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          const log=readFileSync('health-passport/hosted/generated/deploy.log','utf8');
          const url=log.match(/https:\/\/shift-passport-preview-20260919\.[a-z0-9-]+\.workers\.dev/)?.[0];
          if(!url)throw Error('Exact isolated deployment URL missing');
          appendFileSync(process.env.GITHUB_ENV,'PASSPORT_PREVIEW_URL='+url+'\n');
          writeFileSync('passport-hosted-proof/deployment.json',JSON.stringify({candidate:process.env.GITHUB_SHA,url,worker:'shift-passport-preview-20260919',productionChanged:false,previewOnly:true},null,2));
          NODE
      - name: Install browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Real sign-in, complete dashboard, persistent saves, logout and account boundaries
        run: node health-passport/hosted/browser-proof.mjs
      - name: Record current production branch without changing it
        if: always()
        run: |
          mkdir -p passport-hosted-proof
          git ls-remote origin refs/heads/main > passport-hosted-proof/production-main.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passport-full-hosted-${{ github.sha }}
          path: passport-hosted-proof/
          if-no-files-found: error
