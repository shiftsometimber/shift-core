name: Configure Turnstile Production

on:
  push:
    branches: [main]
    paths: ['.github/workflows/configure-turnstile-production.yml']

permissions:
  contents: read

concurrency:
  group: configure-turnstile-production
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install exact Wrangler toolchain
        run: npm install --no-audit --no-fund
      - name: Deploy the checked-in Worker version before attaching secrets
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Create the production authentication widget and attach its secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          widget_file=$(mktemp)
          http_code=$(curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"domains":["shiftsometimber.co.uk","www.shiftsometimber.co.uk","hq.shiftsometimber.co.uk"],"mode":"managed","name":"Shift authentication — production"}' \
            --output "$widget_file" --write-out '%{http_code}')
          if [ "$http_code" != '200' ]; then
            jq '{success,errors}' "$widget_file"
            exit 1
          fi
          sitekey=$(jq -r '.result.sitekey // empty' "$widget_file")
          secret=$(jq -r '.result.secret // empty' "$widget_file")
          test -n "$sitekey"
          test -n "$secret"
          echo "::add-mask::$sitekey"
          echo "::add-mask::$secret"
          secrets_file=$(mktemp)
          jq -n \
            --arg sitekey "$sitekey" \
            --arg secret "$secret" \
            --arg hostnames 'shiftsometimber.co.uk,www.shiftsometimber.co.uk,hq.shiftsometimber.co.uk' \
            '{TURNSTILE_SITE_KEY:$sitekey,TURNSTILE_SECRET_KEY:$secret,TURNSTILE_ALLOWED_HOSTNAMES:$hostnames,TURNSTILE_REQUIRED:"true"}' \
            > "$secrets_file"
          npx wrangler secret bulk "$secrets_file" --config wrangler.jsonc
          rm -f "$secrets_file" "$widget_file"
      - name: Verify the live public configuration is enabled
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            config=$(curl --fail --silent --show-error https://api.shiftsometimber.co.uk/v1/auth/turnstile-config)
            if [ "$(printf '%s' "$config" | jq -r '.enabled')" = 'true' ] && [ "$(printf '%s' "$config" | jq -r '.required')" = 'true' ]; then
              echo 'Turnstile is required and enabled.'
              exit 0
            fi
            sleep 5
          done
          echo 'Turnstile did not become live.'
          exit 1
