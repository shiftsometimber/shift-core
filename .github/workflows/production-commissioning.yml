name: Shift Production Commissioning
on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.mjs'
      - '.github/workflows/production-commissioning.yml'
jobs:
  production-commissioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Wait for Worker deployment propagation
        run: sleep 20
      - name: Core production health and route contract
        run: node gate1-production-journey-probe.mjs
      - name: M09 production unverified-session boundary
        run: node email-verification-production-boundary.mjs
      # Fresh-account authenticated product probes previously depended on registration
      # returning an authenticated cookie. Explicit email verification intentionally
      # removes that behaviour. Historical B02/B03 production evidence stays locked;
      # those scripts remain in-repo until a secret-safe verified synthetic account
      # harness replaces their obsolete registration bootstrap.
      - name: M03 production Radar freshness
        run: node radar-production-freshness.mjs
