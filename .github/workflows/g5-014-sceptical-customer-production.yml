name: G5-014 Sceptical Customer Production
on:
  pull_request:
    paths:
      - 'g5-014-sceptical-customer-production.mjs'
      - '.github/workflows/g5-014-sceptical-customer-production.yml'
  push:
    branches: ['main']
    paths:
      - 'g5-014-sceptical-customer-production.mjs'
      - '.github/workflows/g5-014-sceptical-customer-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sceptical-customer-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run current Shift vs Numan sceptical-customer acceptance
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          NUMAN_WEIGHT_LOSS_URL: https://www.numan.com/weight-loss
          G5_014_EVIDENCE_DIR: g5-014-sceptical-customer-evidence
        run: node g5-014-sceptical-customer-production.mjs
      - name: Upload G5-014 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-014-sceptical-customer-evidence
          path: g5-014-sceptical-customer-evidence
          if-no-files-found: warn
          retention-days: 30
