name: NICE GPhC Source Proof
on:
  push:
    branches: ['fix/nice-gphc-source-policy-20260919']
  pull_request:
    branches: [main]
    paths:
      - 'radar-*.js'
      - 'tests/source-reuse*.mjs'
      - 'tests/radar*.mjs'
      - '.github/workflows/nice-gphc-source-proof.yml'
permissions:
  contents: read
concurrency:
  group: nice-gphc-source-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Record exact candidate; no repository or production writes
        run: |
          mkdir -p source-proof
          test ! -f scripts/source-policy-edits.json
          git rev-parse HEAD > source-proof/candidate-sha.txt
      - run: npm ci --no-audit --no-fund
      - name: Newsroom source, publication, email and permission regressions
        run: |
          set -o pipefail
          node --test tests/source-reuse*.test.mjs tests/radar*.test.mjs | tee source-proof/regressions.tap
      - name: Compile without deploying or production credentials
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir source-proof/worker | tee source-proof/compile.log
      - name: Retain readable source and exact bounded change
        if: always()
        run: |
          mkdir -p source-proof
          git diff c478c969ae74a67906b0d3beac2d22a079a3ce71 -- radar-*.js tests/source-reuse*.mjs tests/radar-discovery-pipeline.test.mjs > source-proof/candidate.patch
          cp radar-source-policy-v1.js source-proof/
          cp docs/source-permissions-nice-gphc.md source-proof/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nice-gphc-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: source-proof/
          retention-days: 30
