name: Rendered Member Production Acceptance

on:
  push:
    branches: [verification/member-design-20261002, release/gp-priority-direct-20261016]
  workflow_run:
    workflows: ['Cloudflare Production Promote']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rendered-member-production-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rendered-member-production-acceptance:
    if: github.ref != 'refs/heads/release/gp-priority-direct-20261016' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Check committed acceptance scripts
        run: |
          node --test tests/rendered-member-acceptance-support.test.mjs
          node --check g2-011-progress-story-production.mjs
          node --check g2-013-progress-picture-rendered-production.mjs
          node --check g2-014-progress-picture-premium-production.mjs
          node --check g2-015-plan-manager-production.mjs
      - name: Install Chromium once
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Acquire growth-loop commissioning identity
        id: oidc_growth
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Prove approved growth feedback through fresh live sign-in
        id: growth_loop
        continue-on-error: true
        env:
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc_growth.outputs.token }}
        run: node release/growth-member-live.mjs
      - name: Retain growth-loop live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-member-live-${{ github.sha }}
          path: growth-member-live-evidence/
          if-no-files-found: error
      - name: Acquire G2-011 commissioning identity
        id: oidc_011
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run G2-011 Progress acceptance
        id: g2_011
        continue-on-error: true
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc_011.outputs.token }}
          G2_011_EVIDENCE_DIR: g2-011-progress-story-evidence
        run: node g2-011-progress-story-production.mjs
      - name: Acquire G2-013 commissioning identity
        id: oidc_013
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run G2-013 Progress Picture acceptance
        id: g2_013
        continue-on-error: true
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc_013.outputs.token }}
          G2_013_EVIDENCE_DIR: g2-013-progress-picture-evidence
        run: node g2-013-progress-picture-rendered-production.mjs
      - name: Acquire G2-014 commissioning identity
        id: oidc_014
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run G2-014 premium Progress Picture acceptance
        id: g2_014
        continue-on-error: true
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc_014.outputs.token }}
          G2_014_EVIDENCE_DIR: g2-014-progress-picture-premium-evidence
        run: node g2-014-progress-picture-premium-production.mjs
      - name: Acquire G2-015 commissioning identity
        id: oidc_015
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run G2-015 premium My Plans acceptance
        id: g2_015
        continue-on-error: true
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc_015.outputs.token }}
          G2_015_EVIDENCE_DIR: g2-015-plan-manager-evidence
        run: node g2-015-plan-manager-production.mjs
      - name: Upload rendered member evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-member-production-evidence
          path: |
            g2-011-progress-story-evidence
            g2-013-progress-picture-evidence
            g2-014-progress-picture-premium-evidence
            g2-015-plan-manager-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce all five acceptance results
        if: always()
        env:
          GROWTH_OUTCOME: ${{ steps.growth_loop.outcome }}
          G2_011_OUTCOME: ${{ steps.g2_011.outcome }}
          G2_013_OUTCOME: ${{ steps.g2_013.outcome }}
          G2_014_OUTCOME: ${{ steps.g2_014.outcome }}
          G2_015_OUTCOME: ${{ steps.g2_015.outcome }}
        run: |
          printf 'G2-011=%s G2-013=%s G2-014=%s G2-015=%s\n' "$G2_011_OUTCOME" "$G2_013_OUTCOME" "$G2_014_OUTCOME" "$G2_015_OUTCOME"
          test "$GROWTH_OUTCOME" = success
          test "$G2_011_OUTCOME" = success
          test "$G2_013_OUTCOME" = success
          test "$G2_014_OUTCOME" = success
          test "$G2_015_OUTCOME" = success

  gp-code-off-member:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/gp-priority-direct-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Wait for the actual same-source owned GP OFF release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release/gp-member-code-off-live-20261016.mjs --wait-off
      - name: Install the unchanged production compiler and isolated browser runtime
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.58.2
          node -e "require('node:assert/strict').equal(require('./node_modules/wrangler/package.json').version,'4.112.0')"
          npx playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/gp-workerd-4146" --ignore-scripts --package-lock=false wrangler@4.146.0
          echo "TREATMENT_MINIFLARE=$RUNNER_TEMP/gp-workerd-4146/node_modules/miniflare" >> "$GITHUB_ENV"
      - name: Acquire the original allowed-workflow commissioning identity
        id: gp_oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Verify the genuine fictional member and exact GP OFF assets
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHIFT_COMMISSIONING_OIDC: ${{ steps.gp_oidc.outputs.token }}
        run: node release/gp-member-code-off-live-20261016.mjs --verify-off
      - name: Preserve source after the bounded read-only member proof
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Retain actual member code-OFF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-member-code-off-live-${{ github.run_id }}
          path: gp-member-code-off-live-evidence/
          if-no-files-found: warn
          retention-days: 30
