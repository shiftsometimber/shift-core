name: My Treatment signed-in production acceptance
on:
  push:
    branches: [verification/my-treatment-live-20261009]
permissions:
  contents: read
  id-token: write
concurrency:
  group: my-treatment-signed-in-acceptance
  cancel-in-progress: true
jobs:
  treatment-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require unchanged candidate runtime
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const allowed=new Set(['.github/workflows/rendered-member-production-acceptance.yml','member-experience/verify-treatment-browser.mjs']);
          const paths=execFileSync('git',['diff','--name-only','8f9b060409346e9290640e9b30ae9f489c32ad3f','HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.equal(paths.length,2);assert(paths.every(x=>allowed.has(x)));
          console.log('Verification-only branch; runtime source unchanged.');
          JS
      - name: Require exact successful guarded release and owned deployment receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const base='https://api.github.com/repos/shiftsometimber/shift-core',runId=37935819106,source='8f9b060409346e9290640e9b30ae9f489c32ad3f';
          const get=async path=>{const r=await fetch(base+path,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN},signal:AbortSignal.timeout(30000)});assert(r.ok);return r;};
          const run=await (await get('/actions/runs/'+runId)).json();assert.equal(run.head_sha,source);assert.equal(run.conclusion,'success');assert.equal(run.status,'completed');assert.equal(run.head_branch,'main');assert.equal(run.event,'push');assert.equal(run.path,'.github/workflows/cloudflare-production-promote.yml');assert.equal(run.run_attempt,1);
          const jobs=await (await get('/actions/runs/'+runId+'/jobs?filter=latest&per_page=100')).json(),job=jobs.jobs.find(j=>j.name==='promote'&&j.conclusion==='success');assert(job);
          for(const [number,name,conclusion]of [[63,'Deploy current main to production','success'],[84,'Verify live My Treatment delivery and private APIs','success'],[114,'Restore the captured runtime if a post-deployment gate failed','skipped']])assert(job.steps.some(s=>s.number===number&&s.name===name&&s.conclusion===conclusion));
          const logs=await (await get('/actions/jobs/'+job.id+'/logs')).text(),receipts=logs.split('\n').flatMap(line=>{const i=line.indexOf('{"kind":"owned_runtime_deployment"');if(i<0)return [];try{return [JSON.parse(line.slice(i))]}catch{return []}});
          assert.equal(receipts.length,1);const receipt=receipts[0];assert.equal(receipt.source,source);assert.equal(String(receipt.run),String(runId));assert.equal(receipt.dataRestored,false);
          mkdirSync('my-treatment-browser-evidence',{recursive:true});writeFileSync('my-treatment-browser-evidence/guarded-deployment.json',JSON.stringify({run:runId,job:job.id,source,receipt},null,2));console.log(JSON.stringify({run:runId,source,deployment:receipt.deploymentId,version:receipt.versionId}));
          JS
      - name: Wait for exact guarded My Treatment deployment
        timeout-minutes: 18
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {treatmentRuntime} from './member-experience/treatment-page.mjs';
          const site='https://shiftsometimber.co.uk';
          let ready=false;
          for(let i=0;i<1;i++){
            try {
              const api=await fetch(site+'/v1/member/treatment',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              const asset=await fetch(site+'/assets/member-experience/treatment.mjs',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              const text=await asset.text();console.log(JSON.stringify({apiStatus:api.status,assetStatus:asset.status,bytes:text.length,expectedBytes:treatmentRuntime.length,exact:text===treatmentRuntime,prefix:text.slice(0,100)}));
              if(api.status===401&&asset.ok&&text===treatmentRuntime){ready=true;break;}
            }catch{}
            console.log('Waiting for guarded deployment, attempt '+(i+1));
            await new Promise(resolve=>setTimeout(resolve,10));
          }
          assert(ready,'Exact My Treatment runtime did not become live');
          JS
      - name: Install acceptance browser
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Acquire existing synthetic commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Prove private treatment journeys on mobile and desktop
        env:
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          TREATMENT_RELEASE_SHA: 8f9b060409346e9290640e9b30ae9f489c32ad3f
        run: node member-experience/verify-treatment-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-treatment-signed-in-${{ github.run_id }}
          path: my-treatment-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
