name: Shared footer read-only preview
on:
  push:
    branches: [fix/shared-footer-every-page-20261001]
    paths:
      - .github/workflows/shared-footer-preview.yml
permissions:
  contents: read
concurrency:
  group: shared-footer-read-only-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/shared-footer.test.mjs
      - name: Publish isolated read-only footer preview
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: npx wrangler deploy --config preview/shared-footer/wrangler.jsonc

