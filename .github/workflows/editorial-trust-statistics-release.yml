name: Release approved editorial trust and statistics
on:
  push:
    branches: [feat/newsroom-trust-statistics-20260913]
    paths: ['.github/workflows/editorial-trust-statistics-release.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Guard approved main and bounded source change
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 8fb4951578afd8b90e0345e6b271e7655da7a158
          python3 - <<'PY'
          import subprocess
          allowed={'editorial/statistics/hse-2024.json', 'verification/rec039-editorial-live.mjs', 'editorial-resources-v1.js', 'editorial/statistics/build.py', 'docs/rec039-editorial-trust-statistics.md', 'editorial/statistics/hse-2024.svg', 'worker-entry-v6.js', '.github/workflows/editorial-trust-statistics-release.yml', 'tests/editorial-resources-v1.test.mjs', 'radar-editorial-trust-v1.js', 'editorial/statistics/hse-2024.csv', 'editorial/statistics/assets.js', 'radar-news-pages-v1.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only','8fb4951578afd8b90e0345e6b271e7655da7a158'],text=True).splitlines())
          assert changed <= allowed, changed-allowed
          PY
      - run: npm ci --no-audit --no-fund
      - name: Verify scoped changes and existing source gates
        run: |
          node --test tests/editorial-resources-v1.test.mjs tests/radar-newsroom-discovery-v1.test.mjs tests/uk-depth-editorial.test.mjs tests/radar-newsroom-filters-v1.test.mjs tests/radar-uk-editorial-v1.test.mjs tests/radar-newsroom-page-v1.test.mjs tests/hq-radar-review-queue-v1.test.mjs tests/shift-ai-newsroom-wire-v1.test.mjs tests/radar-freshness-v2.test.mjs
          node my-timber-navigation-gate.mjs
          node my-timber-final-source-gate.mjs
          node g5-012-login-fastpath-gate.mjs
      - name: Guard current runtime and capture live baseline
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > editorial-deployment-before.json
          python3 - <<'PY'
          import json
          latest=max(json.load(open('editorial-deployment-before.json')),key=lambda x:x['created_on'])
          assert len(latest['versions'])==1 and latest['versions'][0]['version_id']=='0596c9a3-42f9-4a67-ae3b-8cb311437fec', 'Worker moved; refuse stale release'
          PY
          node verification/rec035-newsroom-live.mjs before
          node verification/rec039-editorial-live.mjs before
      - name: Deploy approved editorial resources
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify released pages and preservation
        run: |
          for attempt in 1 2 3 4; do
            if node verification/rec035-newsroom-live.mjs after && node verification/rec039-editorial-live.mjs after; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REC-039-editorial-trust-release
          path: |
            editorial-deployment-before.json
            newsroom-public-before.json
            newsroom-live-proof.json
            editorial-before.json
            editorial-live-proof.json
