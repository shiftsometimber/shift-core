name: Scoped SEO repair verified preview
on:
  push:
    branches: [fix/seo-repairs-20260923]
    paths: [.github/workflows/seo-repair-preview-continue.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: seo-repair-preview-20260923
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seo-repairs-20260923
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 323f2409c0bd7f719abb05969fe9aeb2a827261b
          mkdir -p seo-repair-proof/source
          npm ci --no-audit --no-fund
          python3 -m pip install --quiet Pillow==11.3.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: shiftsometimber/shift-core
          run-id: 35866531018
          name: seo-news-snapshot-9c806f3e6c7b769d2df70f471c6a5553c6ca2130
          path: seo-news-snapshot
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: shiftsometimber/shift-core
          run-id: 35865332010
          name: seo-repair-source-df642cb3bdcb45096a4e06c356108884de853b92
          path: pages-byte-cache
      - name: Verify original source cache and prepare bounded implementation
        run: |
          set -euo pipefail
          (cd seo-news-snapshot && sha256sum -c SHA256SUMS)
          (cd pages-byte-cache && sha256sum -c SHA256SUMS)
          mkdir -p pages-artwork
          tar -xzf pages-byte-cache/pages-current.tar.gz -C pages-artwork ./assets/7B503EDB-D4E0-4F92-B45D-1D5A50AE2597.png ./assets/home-hero-men-v32o.jpg
          python3 - <<'PY'
          import pathlib
          edits={
           'scripts/seo-repairs-20260923/build-news.mjs':[("prepareNews(snapshot,'2026-09-23T14:00:00.000Z')",'prepareNews(snapshot,new Date().toISOString())')],
           'preview/seo-repairs/build.mjs':[("tag.replaceAll('SHIFT Health | Wider Men’s Health',title)","tag.replaceAll('SHIFT Health | Wider Men’s Health',title.replaceAll('&amp;','&'))"),("const origin='https://shiftsometimber.co.uk',realFetch=globalThis.fetch;","const origin='https://shiftsometimber.co.uk',sourceFetch=globalThis.fetch;\nconst realFetch=(input,options={})=>sourceFetch(input,{...options,headers:{'User-Agent':'SHIFT-Owner-SEO-Repair/1.0',...(options.headers||{})}});")]
          }
          for name,changes in edits.items():
           p=pathlib.Path(name);s=p.read_text()
           for old,new in changes:
            assert old in s or new in s,name
            s=s.replace(old,new)
           p.write_text(s)
          PY
          SEO_PAGES_ROOT="$PWD/pages-artwork" python3 scripts/seo-repairs-20260923/prepare-source.py | tee seo-repair-proof/source-prepare.log
          node scripts/seo-repairs-20260923/build-news.mjs | tee seo-repair-proof/news-prepare.log
      - name: Scoped tests, regression tests and production-bundle compile only
        run: |
          set -euo pipefail
          node --test tests/seo-repairs-20260923.test.mjs | tee seo-repair-proof/scoped-tests.log
          node --test babylove/*.test.mjs tests/radar-newsroom-*.test.mjs tests/radar-auto-news*.test.mjs tests/radar-editorial-trust*.test.mjs tests/public-shell-contract.test.mjs tests/public-navigation-policy*.test.mjs tests/public-seo-closeout.test.mjs tests/seo-release-integrity.test.mjs tests/shift-health*.test.mjs | tee seo-repair-proof/regression-tests.log
          npx wrangler deploy --dry-run --outdir seo-repair-proof/worker-dry-run | tee seo-repair-proof/dry-run.log
      - name: Retain exact tested generated source on the repair branch, never main
        run: |
          set -euo pipefail
          git fetch --quiet origin fix/seo-repairs-20260923 main
          test "$(git rev-parse origin/fix/seo-repairs-20260923)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = 323f2409c0bd7f719abb05969fe9aeb2a827261b
          git add public-shell-contract.mjs public-navigation-policy.mjs shift-health-public.mjs radar-editorial-trust-v1.js radar-auto-news-v1.js public-seo-assets-data.mjs scripts/seo-repairs-20260923/source-manifest.json scripts/seo-repairs-20260923/build-news.mjs preview/seo-repairs/build.mjs
          python3 - <<'PY'
          import subprocess
          allowed={'public-shell-contract.mjs','public-navigation-policy.mjs','shift-health-public.mjs','radar-editorial-trust-v1.js','radar-auto-news-v1.js','public-seo-assets-data.mjs','scripts/seo-repairs-20260923/source-manifest.json','scripts/seo-repairs-20260923/build-news.mjs','preview/seo-repairs/build.mjs'}
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines());assert staged<=allowed,staged-allowed
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m 'Retain tested SEO repairs and byte-identified optimised existing artwork'
            git push origin HEAD:refs/heads/fix/seo-repairs-20260923
          fi
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Capture actual public baseline and candidate renderers
        run: |
          set -euo pipefail
          node preview/seo-repairs/build.mjs | tee seo-repair-proof/render-build.log
      - name: Deploy only the isolated read-only preview
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config preview/seo-repairs/wrangler.jsonc --var "CANDIDATE_SHA:$CANDIDATE_SHA" | tee seo-repair-proof/preview-deploy.log
      - name: Isolated test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-tools" --no-audit --no-fund playwright@1.63.0 lighthouse@12.8.2
          "$RUNNER_TEMP/seo-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
          echo "SEO_TOOLS=$RUNNER_TEMP/seo-tools" >> "$GITHUB_ENV"
      - name: Rendered acceptance and matched mobile measurements
        run: |
          set -euo pipefail
          node preview/seo-repairs/verify.cjs | tee seo-repair-proof/browser-summary.log
          node preview/seo-repairs/lab.cjs | tee seo-repair-proof/mobile-summary.log
      - name: Independently recheck deployment identity through the authorised control plane
        if: always()
        env:
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,pathlib,os
          url='https://api.cloudflare.com/client/v4/accounts/9e5386dcf455be34c582d93f8bfc79e6/pages/projects/projectshift'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CF_READ_TOKEN'],'User-Agent':'SHIFT-Owner-SEO-Repair/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          assert p['success'];d=p['result']['canonical_deployment'];report={'deployment':{k:d.get(k) for k in ['id','url','environment','created_on','deployment_trigger']},'unchanged':d['id']=='036d3a83-2a22-4d52-8e83-b29ad6905898','productionDeployments':0,'databaseWrites':0,'analyticsChanges':0}
          pathlib.Path('seo-repair-proof/production-preservation.json').write_text(json.dumps(report,indent=2));assert report['unchanged'];print('Production Pages deployment unchanged; no application/database deployment was requested')
          PY
      - name: Evidence, exact source and failures
        if: always()
        run: |
          mkdir -p seo-repair-proof/source
          for file in public-shell-contract.mjs public-navigation-policy.mjs shift-health-public.mjs radar-editorial-trust-v1.js radar-auto-news-v1.js public-seo-assets-data.mjs public-seo-presentation.mjs; do test ! -f "$file" || cp "$file" seo-repair-proof/source/; done
          tar -czf seo-repair-proof/candidate-support.tar.gz scripts/seo-repairs-20260923 preview/seo-repairs editorial/seo-repairs-20260923 tests/seo-repairs-20260923.test.mjs
          git diff 323f2409c0bd7f719abb05969fe9aeb2a827261b -- . ':!public-seo-assets-data.mjs' > seo-repair-proof/candidate.diff
          git rev-parse HEAD > seo-repair-proof/candidate-commit.txt
          python3 - <<'PY'
          import pathlib,hashlib,json,os
          p=pathlib.Path('seo-repair-proof');(p/'execution.json').write_text(json.dumps({'run':os.environ['GITHUB_RUN_ID'],'triggerCommit':os.environ['GITHUB_SHA'],'candidateCommit':os.environ.get('CANDIDATE_SHA'),'preview':'https://shift-seo-repair-preview.matobrien.workers.dev','production_deployments':0,'database_writes':0,'earlier_public_fetch_failure_run':'35869389897'},indent=2));files=sorted(x for x in p.rglob('*') if x.is_file() and x.name!='SHA256SUMS');(p/'SHA256SUMS').write_text(''.join(hashlib.sha256(x.read_bytes()).hexdigest()+'  '+str(x.relative_to(p))+'\n' for x in files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-repair-preview-${{ github.sha }}
          path: seo-repair-proof/
          retention-days: 30
          if-no-files-found: error
