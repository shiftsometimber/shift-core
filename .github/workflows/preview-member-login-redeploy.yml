name: My Timber login PREVIEW redeploy
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths:
      - '.github/workflows/preview-member-login-redeploy.yml'
      - 'preview/stabilisation/worker.mjs'
permissions:
  contents: read
jobs:
  redeploy-and-prove:
    if: github.ref == 'refs/heads/preview/stabilisation-life-back-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stabilisation-life-back-20260917
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: echo "PREVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Confirm final response repair guarantees the same-origin auth adapter
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const worker=fs.readFileSync('preview/stabilisation/worker.mjs','utf8');
          assert(worker.includes('data-shift-auth-adapter'),'Final-response adapter repair missing');
          assert(worker.includes("if(path==='/member-login')"),'Member-login finalizer missing');
          assert(worker.includes("body=baseScript.test(body)?body.replace(baseScript,match=>match+adapter)"),'Adapter ordering repair missing');
          console.log('PASS: final preview response guarantees api-adapter-v33d.js after safety stripping.');
          NODE
      - name: Regression gates
        run: node --test --test-reporter=tap member-experience/tests/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs tests/my-timber-analytics-privacy.test.mjs
      - name: Prepare and verify isolated preview
        run: |
          node preview/stabilisation/prepare.mjs
          node preview/stabilisation/verify-public.mjs
      - name: Provision only separately named preview databases
        run: node preview/stabilisation/provision.mjs
      - name: Deploy isolated preview only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const c=JSON.parse(fs.readFileSync('work/staging/generated/config.json'));assert.equal(c.name,'shift-stabilisation-preview');assert.equal(c.vars.SHIFT_ENVIRONMENT,'stabilisation-preview-20260917');assert(!c.routes&&!c.route&&!c.triggers&&!c.send_email&&!c.ai);assert.equal(c.workers_dev,true);
          NODE
          node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json > "$RUNNER_TEMP/deploy.txt" 2>&1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const log=fs.readFileSync(process.env.RUNNER_TEMP+'/deploy.txt','utf8');const m=log.match(/https:\/\/shift-stabilisation-preview\.[a-z0-9-]+\.workers\.dev/);if(!m)throw Error('Preview URL missing');fs.appendFileSync(process.env.GITHUB_ENV,'PREVIEW_URL='+m[0]+'\n');console.log('PREVIEW ONLY',m[0]);
          NODE
      - name: Confirm deployed login now contains the adapter
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch(process.env.PREVIEW_URL+'/member-login?verify='+Date.now(),{headers:{'cache-control':'no-cache'}});const h=await r.text();const m=h.match(/<script\b[^>]*\bsrc=["']\/api-adapter-v33d\.js(?:\?[^"']*)?["'][^>]*>/i),a=m?.index??-1,c=h.search(/\bSST_API(?:\.|\[)/);if(!r.ok||a<0||c<0||a>=c)throw Error('Deployed member-login still does not load the adapter first');console.log('PASS: deployed login contains auth adapter before SST_API consumer');
          NODE
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Prove actual UI login and full connected loop
        run: node preview/stabilisation/browser-proof.mjs
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-timber-ui-login-preview-evidence-final
          retention-days: 14
          path: |
            work/staging/generated/public-proof.json
            work/staging/generated/review-evidence/**
          if-no-files-found: warn
