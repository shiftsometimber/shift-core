name: Fit Premium V1 Review Pack
on:
  push:
    branches: [main]
    paths:
      - 'fit-premium-v1-review-pack.mjs'
      - 'fit-premium-generate-all.mjs'
      - 'fit-premium-generate-v3.mjs'
      - 'fit-premium-movement-geometry-v3.mjs'
      - 'fit-premium-candidate-gate.mjs'
      - 'content/fit/premium-v1-render-contracts.json'
      - 'content/fit/premium-visual-production-v1.json'
      - 'assets/fit/premium/**'
      - '.github/workflows/fit-premium-v1-review-pack.yml'
  pull_request:
    paths:
      - 'fit-premium-v1-review-pack.mjs'
      - 'fit-premium-generate-all.mjs'
      - 'fit-premium-generate-v3.mjs'
      - 'fit-premium-movement-geometry-v3.mjs'
      - 'fit-premium-candidate-gate.mjs'
      - 'content/fit/premium-v1-render-contracts.json'
      - 'content/fit/premium-visual-production-v1.json'
      - 'assets/fit/premium/**'
      - '.github/workflows/fit-premium-v1-review-pack.yml'
jobs:
  build-review-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Build finite 26-family review pack from current render authority
        run: node fit-premium-v1-review-pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fit-premium-v1-26-review-pack
          path: fit-premium-v1-review-pack/
          retention-days: 30
