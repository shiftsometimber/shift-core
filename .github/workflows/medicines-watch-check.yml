name: Medicines Watch checks
on:
  pull_request:
    paths:
      - 'medicines-watch/**'
      - 'member-experience/public-preservation.mjs'
      - 'worker-entry-v6.js'
      - '.github/workflows/medicines-watch-check.yml'
permissions:
  contents: read
jobs:
  evidence-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --test medicines-watch/*.test.mjs tests/late-watch-composition.test.mjs
      - name: Read current public Watch without writes or review renewal
        run: |
          node --input-type=module - <<'JS'
          const base='https://shiftsometimber.co.uk';
          const read=async path=>{const r=await fetch(base+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});if(r.status!==200)throw Error(path+' HTTP '+r.status);return r};
          const health=await (await read('/v1/medicines-watch/health')).json();
          const page=await (await read('/treatment-centre/medicines-watch')).text();
          const hub=await (await read('/treatment-centre')).text();
          console.log('WATCH_GET_ONLY_RECEIPT '+JSON.stringify({checkedAt:new Date().toISOString(),health,pageBytes:page.length,hubEntry:hub.includes('/treatment-centre/medicines-watch'),existingPsoriaticEntry:page.includes('Ixekizumab with tirzepatide'),biomarkersAlreadyLive:page.includes('circulating proteins and blood gene expression'),reviewRenewals:false,baselineChanges:false,industryComplete:false}));
          JS
