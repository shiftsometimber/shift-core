name: Release approved UK newsroom discovery
on:
  push:
    branches: [feat/uk-newsroom-discovery-20260913]
    paths: ['.github/workflows/uk-newsroom-discovery-release.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Guard approved main and bounded source change
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 51342daaa3ca7f0bd95f337af7f2e8d2fe82bf32
          python3 - <<'PY'
          import subprocess
          allowed={'worker-entry-v6.js','radar-newsroom-discovery-v1.js','tests/radar-newsroom-discovery-v1.test.mjs','.github/workflows/uk-newsroom-discovery-check.yml','.github/workflows/uk-newsroom-discovery-release.yml','docs/rec038-uk-newsroom-discovery-preview.md','verification/rec038-newsroom-discovery-live.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only','51342daaa3ca7f0bd95f337af7f2e8d2fe82bf32'],text=True).splitlines())
          assert changed <= allowed, changed-allowed
          PY
      - run: npm ci --no-audit --no-fund
      - name: Verify scoped changes and existing source gates
        run: |
          node --test tests/radar-newsroom-discovery-v1.test.mjs tests/uk-depth-editorial.test.mjs tests/radar-newsroom-filters-v1.test.mjs tests/radar-uk-editorial-v1.test.mjs tests/radar-newsroom-page-v1.test.mjs tests/hq-radar-review-queue-v1.test.mjs tests/shift-ai-newsroom-wire-v1.test.mjs tests/radar-freshness-v2.test.mjs
          node my-timber-navigation-gate.mjs
          node my-timber-final-source-gate.mjs
          node g5-012-login-fastpath-gate.mjs
      - name: Guard current runtime and capture live baseline
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > newsroom-discovery-deployment-before.json
          python3 - <<'PY'
          import json
          latest=max(json.load(open('newsroom-discovery-deployment-before.json')),key=lambda x:x['created_on'])
          assert len(latest['versions'])==1 and latest['versions'][0]['version_id']=='0606c30d-ddab-4db7-87e5-a5fca54e5dbf', 'Worker moved; refuse stale release'
          PY
          node verification/rec035-newsroom-live.mjs before
          node verification/rec038-newsroom-discovery-live.mjs before
      - name: Deploy user-approved newsroom links
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify released pages and preservation
        run: |
          for attempt in 1 2 3 4; do
            if node verification/rec035-newsroom-live.mjs after && node verification/rec038-newsroom-discovery-live.mjs after; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REC-038-newsroom-discovery-release
          path: |
            newsroom-discovery-deployment-before.json
            newsroom-public-before.json
            newsroom-live-proof.json
            newsroom-discovery-before.json
            newsroom-discovery-live-proof.json
