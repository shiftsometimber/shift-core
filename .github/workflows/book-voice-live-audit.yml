name: Book voice read-only live audit
on:
  workflow_run:
    workflows: [Cloudflare Production Promote]
    types: [completed]
permissions:
  contents: read
jobs:
  audit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/voice-tools" --no-audit --no-fund playwright@1.58.2
      - run: '"$RUNNER_TEMP/voice-tools/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - run: APP_TOOLS="$RUNNER_TEMP/voice-tools" node editorial/book-voice/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-voice-live-${{ github.event.workflow_run.head_sha }}
          path: book-voice-live-proof/
          retention-days: 90
