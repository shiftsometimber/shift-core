name: Reconcile Final Review Authority
on:
  push:
    branches: [commissioning/reconcile-final-798-fit-authority]
    paths:
      - 'scripts/reconcile-final-review-authority.mjs'
      - '.github/workflows/reconcile-final-review-authority.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commissioning/reconcile-final-798-fit-authority
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reconcile final human-review authority
        run: node scripts/reconcile-final-review-authority.mjs
      - name: Commit reconciled authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name shift-commissioning-bot
          git config user.email shiftsometimber@gmail.com
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/LAUNCH-FINISH-LINE.md docs/MATT-FINAL-ACCEPTANCE-PACK.md docs/COMMISSIONING-EVIDENCE.md docs/evidence/2026-08-14-final-grub-fit-review-authority.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconcile final Grub 798 and Fit review authority [skip ci]'
          git push origin HEAD:commissioning/reconcile-final-798-fit-authority
