name: Publish approved treatment options and inline provider guidance
on:
  push:
    branches: [release/treatment-options-20261022]
    paths: [previews/treatment-options/**, .github/workflows/treatment-options-live-20261022.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: treatment-options-live-20261022
  cancel-in-progress: false
jobs:
  publish-and-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: previews/treatment-options
          fetch-depth: 4
      - name: Trust this checkout inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify approved presentation and live-data boundaries
        run: |
          node previews/treatment-options/build.cjs
          node previews/treatment-options/build-production.cjs
          git diff --exit-code -- previews/treatment-options/page.mjs previews/treatment-options/style.mjs previews/treatment-options/client.mjs previews/treatment-options/production-page.mjs previews/treatment-options/production-ticker.mjs
          node --test previews/treatment-options/test.mjs previews/treatment-options/production.test.mjs
      - name: Match the browser client
        run: npm install --prefix "$RUNNER_TEMP/options-browser" playwright@1.58.2 --no-audit --no-fund
      - name: Stage accepted design with the authoritative live catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node previews/treatment-options/deploy-live.mjs stage
      - name: Check hosted release before public activation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/options-browser/node_modules/playwright
        run: node previews/treatment-options/check-production.cjs
      - name: Activate only treatment browsing routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/treatment-options/deploy-live.mjs activate
      - name: Verify the actual live page on mobile and desktop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/options-browser/node_modules/playwright
          TREATMENT_OPTIONS_ORIGIN: https://shiftsometimber.co.uk
        run: node previews/treatment-options/check-production.cjs
      - name: Restore only this release's routes if acceptance fails
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/treatment-options/deploy-live.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treatment-options-live-${{ github.sha }}
          path: treatment-options-live-evidence/
          retention-days: 90
