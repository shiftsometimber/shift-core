name: SHIFT AI backend context evaluation
on:
  pull_request:
    branches: [main]
    paths:
      - 'member-experience/ai-practical-context.mjs'
      - 'tests/ai-connected-member.test.mjs'
      - '.github/workflows/shift-ai-context-evaluation.yml'
permissions:
  contents: read
jobs:
  synthetic-real-model:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/shift-ai-context-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Real AI with isolated in-memory fictional member records
        env:
          SHIFT_AI_REAL_PROBE: 'true'
          CLOUDFLARE_ACCOUNT_ID: '9e5386dcf455be34c582d93f8bfc79e6'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: node --test --test-name-pattern='real-model practical pilot' tests/ai-connected-member.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shift-ai-synthetic-real-model-${{ github.event.pull_request.head.sha }}
          path: evidence/shift-ai-real-probe/
          retention-days: 14
