name: Approved Ask Timber A4 design
on:
  push:
    branches: [design/ask-timber-a4-20261030]
    paths: ['release/ask-timber-a4-20261030/**', '.github/workflows/ask-timber-a4-20261030.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check A4 source syntax
        run: |
          node --check release/ask-timber-a4-20261030/layout.mjs
          node --check release/ask-timber-a4-20261030/styles.mjs
          node --check release/ask-timber-a4-20261030/overlay.mjs
          node --check release/ask-timber-a4-20261030/check.mjs
          node --check release/ask-timber-a4-20261030/deploy.mjs
      - name: Stage, preserve current runtime and verify approved A4
        run: node release/ask-timber-a4-20261030/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ask-timber-a4-${{ github.run_id }}
          path: ask-a4-evidence/
          retention-days: 90
