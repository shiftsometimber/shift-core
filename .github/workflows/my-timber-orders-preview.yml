name: My Timber Orders isolated preview
on:
  push:
    branches: [fix/my-timber-orders-20260925]
    paths:
      - member-experience/orders.mjs
      - member-experience/entry.mjs
      - member-experience/chrome.mjs
      - member-experience/tests/orders.test.mjs
      - work/staging/worker.mjs
      - preview/stabilisation/orders-proof.mjs
      - preview/stabilisation/orders-provision.mjs
      - preview/stabilisation/orders-schema.sql
      - .github/workflows/my-timber-orders-preview.yml
permissions:
  contents: read
concurrency:
  group: my-timber-orders-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/fix/my-timber-orders-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Focused and shared member checks
        run: node --test member-experience/tests/*.test.mjs tests/commerce-stripe-v1.test.mjs
      - name: Require isolated preview credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Prepare fictional preview and read-only public capture
        run: |
          node preview/stabilisation/prepare.mjs
          cat preview/stabilisation/orders-schema.sql >> work/staging/generated/auth.sql
      - name: Provision separately named preview databases
        run: node preview/stabilisation/orders-provision.mjs
      - name: Verify preview boundaries and deploy
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('work/staging/generated/config.json'));
          assert.equal(c.name,'shift-stabilisation-preview-v2');assert.equal(c.vars.SHIFT_ENVIRONMENT,'stabilisation-preview-20260917');
          assert(c.workers_dev&&!c.routes&&!c.route&&!c.triggers&&!c.send_email&&!c.ai);
          assert.deepEqual(c.d1_databases.map(d=>d.database_name).sort(),['shift-orders-preview-auth-'+process.env.GITHUB_RUN_ID,'shift-orders-preview-data-'+process.env.GITHUB_RUN_ID]);
          NODE
          node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json
          echo 'PREVIEW_URL=https://shift-stabilisation-preview-v2.matobrien.workers.dev' >> "$GITHUB_ENV"
      - name: Browser proof on fictional account
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node preview/stabilisation/orders-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-timber-orders-preview-evidence
          retention-days: 14
          path: work/staging/generated/review-evidence/orders-*
          if-no-files-found: warn
