name: Approved Treatments TR3 design
on:
  push:
    branches: [design/treatments-tr3-20261030]
    paths: ['release/treatments-tr3-20261030/**', '.github/workflows/treatments-tr3-20261030.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check TR3 source syntax
        run: |
          node --check release/treatments-tr3-20261030/layout.mjs
          node --check release/treatments-tr3-20261030/styles.mjs
          node --check release/treatments-tr3-20261030/overlay.mjs
          node --check release/treatments-tr3-20261030/check.mjs
          node --check release/treatments-tr3-20261030/deploy.mjs
      - name: Install the locked asset hashing dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage and verify Matt’s approved Treatments TR3
        run: node release/treatments-tr3-20261030/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: treatments-tr3-${{ github.run_id }}
          path: treatments-tr3-evidence/
          retention-days: 90
