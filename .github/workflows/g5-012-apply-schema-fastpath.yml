name: G5-012 Apply Schema Fastpath
on:
  push:
    branches: [fix/g5-012-schema-cold-path]
    paths:
      - '.github/workflows/g5-012-apply-schema-fastpath.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/g5-012-schema-cold-path
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Insert fail-safe schema readiness sentinel
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='worker.js';
          let s=fs.readFileSync(p,'utf8');
          if(s.includes('G5_012_SCHEMA_READINESS_V1')) process.exit(0);
          const start=s.indexOf('async function ensureSchema(DB) {');
          const marker=s.indexOf('  const statements = [',start);
          const end=s.indexOf('  ];',marker);
          if(start<0||marker<0||end<0) throw new Error('ensureSchema anchors missing');
          const statements=s.slice(marker,end);
          const names=[...statements.matchAll(/CREATE\s+(?:TABLE|(?:UNIQUE\s+)?INDEX)\s+IF\s+NOT\s+EXISTS\s+([A-Za-z0-9_]+)/g)].map(m=>m[1]);
          const unique=[...new Set(names)];
          if(unique.length<20) throw new Error(`unexpected required schema count ${unique.length}`);
          const insertion=`  // G5_012_SCHEMA_READINESS_V1 — deployed schema is authoritative on normal requests.\n  // One cheap sqlite_master probe replaces the large cold-isolate DDL loop when every\n  // object this legacy bootstrap owns already exists. Any missing object or probe error\n  // falls through to the unchanged idempotent CREATE TABLE/INDEX bootstrap below.\n  try {\n    const required=${JSON.stringify(unique)};\n    const placeholders=required.map(()=>'?').join(',');\n    const row=await DB.prepare(\`SELECT COUNT(*) AS count FROM sqlite_master WHERE name IN (\${placeholders})\`).bind(...required).first();\n    if(Number(row?.count||0)===required.length){schemaReady=true;return;}\n  } catch (e) { console.warn('schema_readiness_probe_fallback',e?.message); }\n`;
          s=s.slice(0,marker)+insertion+s.slice(marker);
          fs.writeFileSync(p,s);
          fs.writeFileSync('g5-012-schema-fastpath-proof.json',JSON.stringify({proof:'G5_012_SCHEMA_READINESS_V1',requiredObjectCount:unique.length,requiredObjects:unique,passwordKdfChanged:false,fallbackPreserved:true},null,2)+'\n');
          NODE
          node --check worker.js
          git diff --check
      - name: Commit exact generated patch
        shell: bash
        run: |
          git config user.name shiftsometimber
          git config user.email shiftsometimber@gmail.com
          git add worker.js g5-012-schema-fastpath-proof.json
          git diff --cached --quiet && exit 0
          git commit -m 'G5-012: remove redundant cold-isolate DDL from normal requests'
          git push origin HEAD:fix/g5-012-schema-cold-path
