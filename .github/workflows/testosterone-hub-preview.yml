name: Testosterone hub preview only
on:
  push:
    branches: [preview/testosterone-hub-20260917]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/testosterone-hub-preview.test.mjs tests/health-commerce.test.mjs
      - name: Resolve isolated preview database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          db_id=$(jq -r '.[] | select(.name=="shift-testosterone-preview-db") | (.uuid // .database_id // .id)' /tmp/d1-list.json | head -n1)
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            npx wrangler d1 create shift-testosterone-preview-db --location weur
            npx wrangler d1 list --json > /tmp/d1-list.json
            db_id=$(jq -r '.[] | select(.name=="shift-testosterone-preview-db") | (.uuid // .database_id // .id)' /tmp/d1-list.json | head -n1)
          fi
          test -n "$db_id" && test "$db_id" != "null"
          sed -i "s/__PREVIEW_D1_DATABASE_ID__/$db_id/" preview/testosterone-hub/wrangler.jsonc
      - name: Initialise isolated schema
        run: npx wrangler d1 execute DB --remote --file preview/testosterone-hub/bootstrap.sql --config preview/testosterone-hub/wrangler.jsonc
      - name: Deploy isolated preview without production bindings
        run: npx wrangler deploy --config preview/testosterone-hub/wrangler.jsonc
