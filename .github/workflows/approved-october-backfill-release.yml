name: Release approved October backfill repairs
on:
  push:
    branches: [main]
    paths: [.github/workflows/approved-october-backfill-release.yml]
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OCTOBER_BASELINE_SOURCE: b73f057d917ae1b5aa5a8e240782348f1cd9d626
      OCTOBER_BASELINE_VERSION: 8a7e03bb-7ced-421e-aba8-87bca1494ff2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact approved repair delta and current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$OCTOBER_BASELINE_SOURCE" HEAD
          python3 - <<'PY'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['OCTOBER_BASELINE_SOURCE'],'HEAD'],text=True).splitlines())
          expected=set(["bloods-approved-faq-20261031.mjs","public-bloods/approved-faq.test.mjs","public-bloods/public-response-policy.mjs","public-bloods/shift-bloods-marketing-worker.mjs","public-bloods/shift-bloods-public.mjs","public-bloods/wrangler.jsonc","public-seo-technical.mjs","radar-integration-v1.js","radar-official-intake-v1.js","release/approved-bloods-faq-deploy.mjs","release/approved-october-package-deploy.mjs","release/selected-tools-preservation-20261031.mjs","tests/bloods-approved-faq-20261031.test.mjs","tests/public-seo-technical.test.mjs","tests/radar-official-intake-v1.test.mjs",".github/workflows/approved-october-backfill-release.yml"])
          assert changed==expected,(changed,expected)
          pins={"bloods-approved-faq-20261031.mjs":"2289f9a938e10e8161f4642d8a4e3fa6e05cdcff","public-bloods/approved-faq.test.mjs":"b8b16b4f9401db0e68ae9a45fa6bb45323edf6d6","public-bloods/public-response-policy.mjs":"1b171a2d6c5892ddb28caadd88305e9a4eb489cd","public-bloods/shift-bloods-marketing-worker.mjs":"5121833775c2de240f1791ff2cdaa9bb09d31f18","public-bloods/shift-bloods-public.mjs":"b06d5fcd129b07db8b491dcf1dfaa442c7724a25","public-bloods/wrangler.jsonc":"e96ab0c671770b5275d55cde0575ee0f4d6a5483","public-seo-technical.mjs":"8b947984fe76b5a2c803e7676d4e30aa5ca0bd01","radar-integration-v1.js":"b52451478f4f17278887884ae56b1bceb9590514","radar-official-intake-v1.js":"409c0acf8f7d5debc00689c4dc6d241e4f6d1267","release/approved-bloods-faq-deploy.mjs":"d51b3112c086e41ea56e8d857a43225c2ce745c3","release/approved-october-package-deploy.mjs":"a14dd64d8045ec15fc6eb16ffb1bbf97a8f51e65","release/selected-tools-preservation-20261031.mjs":"33d344de147a0966dfd1d4b20a1118681dedd3ad","tests/bloods-approved-faq-20261031.test.mjs":"e8867a2f7909f5e75cb66fa5547167c8529b5a80","tests/public-seo-technical.test.mjs":"cf8d0b6fd40bf505ccb1e70710bc368e3fb70494","tests/radar-official-intake-v1.test.mjs":"39f0108c41a3be9f2de553f156f7950952f71a9b"}
          for path,sha in pins.items():assert subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()==sha,path
          PY
      - name: Run approved repair regressions and retained build preservation checks
        run: |
          npm ci --no-audit --no-fund
          node --check radar-integration-v1.js
          node --check radar-official-intake-v1.js
          node --check public-seo-technical.mjs
          node --test tests/radar-official-intake-v1.test.mjs tests/bloods-approved-faq-20261031.test.mjs tests/public-seo-technical.test.mjs tests/radar-new-publication-email.test.mjs tests/radar-live-email-v1.test.mjs tests/radar-live-email-redirect-v1.test.mjs
          node --test tests/canonical-runtime-build.test.mjs tests/independent-presentation-preservation.test.mjs
          node --test public-bloods/approved-faq.test.mjs
          node --check release/approved-october-package-deploy.mjs
          node --check release/approved-bloods-faq-deploy.mjs
      - name: Capture and qualify the latest verified runtime
        id: capture
        run: |
          mkdir -p october-release-proof b1-runtime-release
          npx wrangler deployments list --config wrangler.jsonc --json > deployment-before.json
          cp deployment-before.json october-release-proof/
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {latestDeployment} from './release/runtime-rollback-guard.mjs';
          const before=latestDeployment(JSON.parse(readFileSync('deployment-before.json')));
          assert.equal(before.versions.length,1);
          assert.equal(before.versions[0].version_id,process.env.OCTOBER_BASELINE_VERSION,'Serving runtime changed; reconcile before upload');
          assert.equal(before.versions[0].percentage,100);
          const clean=s=>s.replace(/<script\b[^>]*\bsrc=["']https:\/\/static.cloudflareinsights.com[^"']*["'][\s\S]*?<\/script>/gi,'').replace(/<script\b[^>]*>[\s\S]*?window\.__CF\$cv\$params[\s\S]*?<\/script>/gi,'');
          const pages={};
          for(const path of ['/','/about','/member-login','/tools','/tools?utm_source=october-release-check']){
            const r=await fetch('https://shiftsometimber.co.uk'+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path);pages[path]=createHash('sha256').update(clean(await r.text())).digest('hex');
          }
          writeFileSync('october-release-proof/before.json',JSON.stringify(pages,null,2));
          JS
      - name: Promote the exact current source through the existing owned runtime helper
        id: publish
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node release/approved-october-package-deploy.mjs
      - name: Verify provider selection, exact bundle and unchanged public pages
        id: verifycore
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > october-release-proof/deployment-after.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {latestDeployment} from './release/runtime-rollback-guard.mjs';
          const receipt=JSON.parse(readFileSync('b1-runtime-release/owned-runtime-deployment.json')),active=latestDeployment(JSON.parse(readFileSync('october-release-proof/deployment-after.json')));
          assert.equal(receipt.source,process.env.GITHUB_SHA);assert.equal(active.id,receipt.deploymentId);assert.equal(active.versions.length,1);assert.equal(active.versions[0].version_id,receipt.versionId);assert.equal(active.versions[0].percentage,100);
          const bundle=readFileSync('b1-runtime-release/staged-runtime/worker.js');
          assert.equal(createHash('sha256').update(bundle).digest('hex'),receipt.buildSHA256);
          assert(bundle.includes(Buffer.from('not_first_publication')));assert(bundle.includes(Buffer.from('publication_before_notification_policy')));assert(bundle.includes(Buffer.from('source_date_not_found')));assert(bundle.includes(Buffer.from('nhs-home-test-20261029')));
          const clean=s=>s.replace(/<script\b[^>]*\bsrc=["']https:\/\/static.cloudflareinsights.com[^"']*["'][\s\S]*?<\/script>/gi,'').replace(/<script\b[^>]*>[\s\S]*?window\.__CF\$cv\$params[\s\S]*?<\/script>/gi,'');
          const before=JSON.parse(readFileSync('october-release-proof/before.json')),after={};
          for(const path of Object.keys(before)){
            const r=await fetch('https://shiftsometimber.co.uk'+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path);after[path]=createHash('sha256').update(clean(await r.text())).digest('hex');
          }
          assert.deepEqual(after,before,'Unrelated public pages changed');
          const sr=await fetch('https://shiftsometimber.co.uk/sitemap.xml',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});assert.equal(sr.status,200);
          const sitemap=await sr.text();writeFileSync('october-release-proof/sitemap-after.xml',sitemap);
          const {repairTechnicalSitemap}=await import('./public-seo-technical.mjs');
          assert.equal(repairTechnicalSitemap(sitemap),sitemap,'Sitemap must already satisfy the retained exclusions and verified owners');
          const locs=[...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
          assert.equal(locs.filter(x=>x.endsWith('/medicine-news/uk-archive-pharmacy-cholesterol-pilot-england')).length,1);
          writeFileSync('october-release-proof/verification.json',JSON.stringify({verified:true,source:receipt.source,version:receipt.versionId,buildSHA256:receipt.buildSHA256,publicPages:after,noRealTestEmail:true},null,2));
          JS
      - name: Publish and verify the exact FAQ through its current Bloods owner
        if: steps.verifycore.outcome == 'success'
        run: node release/approved-bloods-faq-deploy.mjs
      - name: Restore only this owned runtime if verification fails
        if: ${{ failure() && steps.capture.outcome == 'success' && steps.verifycore.outcome != 'success' }}
        run: |
          if test -s b1-runtime-release/promotion-intent.json; then
            node release/member-details-rollback.mjs
          fi
      - name: Retain source, deployment and rollback evidence
        if: always()
        run: |
          mkdir -p october-release-proof
          git rev-parse HEAD > october-release-proof/commit.txt
          cp -r b1-runtime-release october-release-proof/ 2>/dev/null || true
          find october-release-proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > october-release-proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-october-backfill-live-${{ github.sha }}
          path: october-release-proof/
          retention-days: 30
