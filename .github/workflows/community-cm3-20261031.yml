name: Community CM3
on:
  push:
    branches: [release/community-cm3-20261031]
    paths: ['community-cm3-20261031/**', '.github/workflows/community-cm3-20261031.yml']
permissions:
  contents: read
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[pages preflight]') && 'community-cm3-read-only-preflight' || 'cloudflare-production-promote' }}
  cancel-in-progress: false
jobs:
  selected-pages:
    if: "!contains(github.event.head_commit.message, '[audit only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read current owners and page structures
        if: contains(github.event.head_commit.message, '[pages preflight]')
        run: node community-cm3-20261031/capture.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check and release Community CM3
        if: "!contains(github.event.head_commit.message, '[pages preflight]')"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix selected-pages-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node --check community-cm3-20261031/runtime.mjs
          node --check community-cm3-20261031/deploy.mjs
          node --test community-cm3-20261031/*.test.mjs
          node community-cm3-20261031/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELECTED_PAGES_PREVIEW_ONLY: ${{ contains(github.event.head_commit.message, '[pages preview]') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-cm3-${{ github.run_id }}
          path: community-cm3-evidence/
          retention-days: 90
