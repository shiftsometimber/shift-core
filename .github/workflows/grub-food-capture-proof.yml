name: Shift AI food and research proof
on:
  push:
    branches: ['feature/grub-food-capture-20261031']
  pull_request:
    paths:
      - 'member-experience/food-capture*.mjs'
      - 'member-experience/food-entry-nutrition.mjs'
      - 'member-experience/food-diary-client.mjs'
      - 'member-experience/food-log*.mjs'
      - 'member-experience/ai-context.mjs'
      - 'member-experience/ai-practical-context.mjs'
      - 'member-experience/ai-fast-answers.mjs'
      - 'member-experience/journey-context.mjs'
      - 'member-experience/entry.mjs'
      - 'member-experience/tests/food-log.test.mjs'
      - 'member-experience/tests/food-log-delivery.test.mjs'
      - 'tests/ai-connected-member.test.mjs'
      - 'member-experience/journey-portability.mjs'
      - 'member-experience/tests/food-capture.test.mjs'
      - 'member-experience/ai-research.mjs'
      - 'member-experience/ai-public-retrieval.mjs'
      - 'member-experience/tests/shift-ai-capabilities.test.mjs'
      - 'shift-ai*.js'
      - 'shift-ai-capabilities.mjs'
      - 'shift-ai-food-model/**'
      - 'ask-timber-v1.js'
      - 'frontend/member/assets/ask-timber-v1.*'
      - 'tests/shift-ai-research-route.test.mjs'
      - '.github/workflows/grub-food-capture-proof.yml'
permissions:
  contents: read
concurrency:
  group: grub-food-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  member-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Check changed JavaScript
        run: |
          node --check member-experience/food-capture.mjs
          node --check member-experience/food-capture-client.mjs
          node --check member-experience/food-entry-nutrition.mjs
          node --check member-experience/food-diary-client.mjs
          node --check member-experience/journey-portability.mjs
          node --check shift-coach/worker.mjs
          node --check shift-ai-capabilities.mjs
          node --check shift-ai-food-model/verify_binding.mjs
          node --check member-experience/ai-research.mjs
          node --check member-experience/ai-public-retrieval.mjs
          node --check ask-timber-v1.js
          node --check shift-ai-v6.js
          node --check frontend/member/assets/ask-timber-v1.js
          node --check member-experience/food-log.mjs
          node --check member-experience/food-log-client.mjs
          node --check member-experience/ai-context.mjs
          node --check member-experience/ai-fast-answers.mjs
          node --check member-experience/ai-practical-context.mjs
          node --check member-experience/journey-context.mjs
          node --check member-experience/entry.mjs
      - name: Check food capture and real diary compatibility
        run: node --test member-experience/tests/food-capture.test.mjs member-experience/tests/food-log.test.mjs member-experience/tests/food-log-delivery.test.mjs member-experience/tests/food-diary-london-date-20261015.test.mjs member-experience/tests/journey-portability.test.mjs member-experience/tests/shift-ai-capabilities.test.mjs tests/shift-ai-research-route.test.mjs tests/ask-timber-conversation-boundaries.test.mjs tests/ask-timber-public.test.mjs tests/ai-connected-member.test.mjs tests/ai-connected-legacy.test.mjs tests/ai-practical-context.test.mjs shift-ai-food-model/tests/recipe-log-integration.test.mjs
      - name: Build the actual Worker without uploading or changing production
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/grub-worker-build"
      - name: Check live public PubMed connectivity (diagnostic, no account or model)
        continue-on-error: true
        run: node preview/shift-ai-research/public-proof.mjs
      - name: Check existing member regression suite
        run: node --test --test-concurrency=2 member-experience/tests/*.test.mjs
      - name: Diagnose the same CSV checks on the unchanged source base
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/grub-capture-source-base"
          git worktree add --detach "$baseline" 589a8ce131af1b5074b62328964f344d33043faf
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          cd "$baseline"
          node --test member-experience/tests/weight-import-mapping-ui.test.mjs
  food-model-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the image parser for qualification checks
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - name: Parse training and inference code without downloading a model
        run: |
          python -m compileall -q shift-ai-food-model
          node --check shift-ai-food-model/recipe_catalogue.mjs
      - name: Check governed recipe links and explicit serving confirmation
        run: node --test shift-ai-food-model/tests/recipe-catalogue.test.mjs
      - name: Check data separation, evaluation and the private recognition contract
        run: python -m unittest discover -s shift-ai-food-model/tests -v
