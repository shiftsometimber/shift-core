name: Tablet wording release composition proof
on:
  pull_request:
    paths:
      - 'release/approved-runtime-composition.mjs'
      - 'release/approved-runtime-composition.json'
      - 'tests/tablet-wording-release.test.mjs'
      - '.github/workflows/tablet-wording-release-proof.yml'
permissions:
  contents: read
jobs:
  exact-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tablet-wording.test.mjs tests/tablet-wording-release.test.mjs tests/promise-accuracy.test.mjs tests/public-treatment-guidance.test.mjs
      - name: Verify exact current release and pinned tablet proof
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {verifyReconciledRelease,TABLET_WORDING_RUN,TABLET_WORDING_SOURCE} from './release/approved-runtime-composition.mjs';
          verifyReconciledRelease();
          const r=await fetch('https://api.github.com/repos/shiftsometimber/shift-core/actions/runs/'+TABLET_WORDING_RUN,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN}});
          assert(r.ok);const proof=await r.json();assert.equal(proof.head_sha,TABLET_WORDING_SOURCE);assert.equal(proof.path,'.github/workflows/tablet-wording-proof.yml');assert.equal(proof.event,'pull_request');assert.equal(proof.conclusion,'success');
          JS
