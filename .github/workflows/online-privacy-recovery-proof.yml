name: Online analytics privacy and rollback ownership proof
on:
  push:
    branches: [codex/privacy-recovery-closeout-20261003]
  pull_request:
    paths: [product-analytics-v1.js, tests/general-analytics-privacy.test.mjs, release/runtime-rollback-guard.mjs, release/member-runtime-deploy.mjs, release/member-details-rollback.mjs]
permissions:
  contents: read
jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund
      - name: Execute private-payload and recovery race regressions
        run: |
          mkdir -p online-privacy-recovery-proof
          node --test tests/general-analytics-privacy.test.mjs tests/my-timber-analytics-privacy.test.mjs tests/runtime-rollback-guard.test.mjs tests/discovery-repairs.test.mjs shift-coach/integration.test.mjs > online-privacy-recovery-proof/tests.txt
      - name: Compile exact production entrypoint without credentials or deployment
        run: npx wrangler deploy --dry-run --outdir online-privacy-recovery-proof/bundle > online-privacy-recovery-proof/compile.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-privacy-recovery-${{ github.sha }}
          path: online-privacy-recovery-proof/
