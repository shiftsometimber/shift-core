name: Online analytics privacy and rollback ownership proof
on:
  push:
    branches: [codex/privacy-recovery-closeout-20261003]
  pull_request:
    paths: [product-analytics-v1.js, tests/general-analytics-privacy.test.mjs, release/runtime-rollback-guard.mjs, release/member-runtime-deploy.mjs, release/member-details-rollback.mjs, tests/b1-release-scope.test.mjs, tests/member-details-release.test.mjs, shift-coach/release-contract.mjs, babylove/release-quality.test.mjs, tests/catalogue-publication-client.test.mjs]
permissions:
  contents: read
jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund
      - name: Prepare the original catalogue test fixture
        run: |
          mkdir -p online-privacy-recovery-proof
          node grub-expansion-review-pack.mjs > online-privacy-recovery-proof/fixture-preparation.txt
      - name: Execute every original privacy and production test command with two slots
        run: node release/bounded-source-checks-20261016.mjs privacy
      - run: node gate1-release-security-privacy-gate.mjs
      - name: Compile exact production entrypoint without credentials or deployment
        run: npx wrangler deploy --dry-run --outdir online-privacy-recovery-proof/bundle > online-privacy-recovery-proof/compile.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-privacy-recovery-${{ github.sha }}
          path: online-privacy-recovery-proof/
