name: Online analytics privacy and rollback ownership proof
on:
  push:
    branches: [codex/privacy-recovery-closeout-20261003]
  pull_request:
    paths: [product-analytics-v1.js, tests/general-analytics-privacy.test.mjs, release/runtime-rollback-guard.mjs, release/member-runtime-deploy.mjs, release/member-details-rollback.mjs, tests/b1-release-scope.test.mjs, tests/member-details-release.test.mjs, shift-coach/release-contract.mjs, babylove/release-quality.test.mjs, tests/catalogue-publication-client.test.mjs]
permissions:
  contents: read
jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund
      - name: Execute private-payload and recovery race regressions
        run: |
          mkdir -p online-privacy-recovery-proof
          node --test tests/general-analytics-privacy.test.mjs tests/my-timber-analytics-privacy.test.mjs tests/runtime-rollback-guard.test.mjs tests/discovery-repairs.test.mjs shift-coach/integration.test.mjs shift-coach/release.test.mjs shift-coach/public-font-delivery.test.mjs shift-coach/cancelled-release-recovery.test.mjs tests/b1-release-scope.test.mjs tests/member-details-release.test.mjs > online-privacy-recovery-proof/tests.txt
      - name: Run every production unit-test command before promotion
        run: |
          python3 - <<'PYTEST'
          import re, glob, subprocess
          from pathlib import Path
          source=Path('.github/workflows/cloudflare-production-promote.yml').read_text()
          commands=re.findall(r'^\s*(?:run:\s*)?node --test (.+)$',source,re.M)
          assert len(commands)>=25
          with Path('online-privacy-recovery-proof/production-tests.txt').open('w') as out:
              for command in commands:
                  assert re.fullmatch(r'[-a-zA-Z0-9_/*?. ]+',command), command
                  paths=[p for token in command.split() for p in (glob.glob(token) if '*' in token or '?' in token else [token])]
                  assert paths
                  out.write('COMMAND: node --test '+command+'\n');out.flush()
                  result=subprocess.run(['node','--test',*paths],stdout=out,stderr=subprocess.STDOUT)
                  assert result.returncode==0, command
          PYTEST
      - run: node gate1-release-security-privacy-gate.mjs
      - name: Compile exact production entrypoint without credentials or deployment
        run: npx wrangler deploy --dry-run --outdir online-privacy-recovery-proof/bundle > online-privacy-recovery-proof/compile.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-privacy-recovery-${{ github.sha }}
          path: online-privacy-recovery-proof/
