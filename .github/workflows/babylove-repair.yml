name: BabyLove publication repair evidence
on:
  push:
    branches: [fix/babylove-publication, fix/babylove-email-proof, fix/oral-article-image, fix/babylove-arrival-email]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Read only the affected imported article and receipt
        run: |
          mkdir -p babylove-proof
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT id,title,slug,author,status,summary,body,seo_title,publish_at FROM knowledge_articles WHERE slug='oral-semaglutide-for-weight-loss'; SELECT source_id,slug,payload_hash,payload_json,created_at FROM babylove_receipts WHERE slug='oral-semaglutide-for-weight-loss';" > babylove-proof/before.json
      - uses: actions/upload-artifact@v4
        with:
          name: babylove-repair-snapshot
          path: babylove-proof/

  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Verify publication, retries, email and existing editorial gates
        run: node --test babylove/*.test.mjs tests/knowledge-editorial-*.test.mjs tests/public-shell-contract.test.mjs tests/public-seo-closeout.test.mjs
      - name: Deploy isolated article preview and verify real D1 import/retry
        run: node babylove/repair-preview.mjs
      - name: Build full production candidate without deployment
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Verify recovered Mounjaro article on live traffic
        run: |
          curl -fsS -o /tmp/article.html https://shiftsometimber.co.uk/articles/mounjaro-cost-uk
          grep -q "NICE List vs Private Prices: Mounjaro Cost in the UK" /tmp/article.html
          grep -q "primary-care rollout" /tmp/article.html
          curl -fsS -o /tmp/sitemap.xml https://shiftsometimber.co.uk/sitemap.xml
          grep -q "https://shiftsometimber.co.uk/articles/mounjaro-cost-uk" /tmp/sitemap.xml
          curl -fsS -o /tmp/knowledge.html https://shiftsometimber.co.uk/explore-knowledge
          grep -q 'data-babylove-dynamic="mounjaro-cost-uk"' /tmp/knowledge.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babylove-repair-preview
          path: babylove/generated/preview-proof.json
