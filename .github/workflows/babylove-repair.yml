name: BabyLove publication repair evidence
on:
  push:
    branches: [fix/babylove-publication]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Read only the affected imported article and receipt
        run: |
          mkdir -p babylove-proof
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT id,title,slug,author,status,summary,body,seo_title,publish_at FROM knowledge_articles WHERE slug='oral-semaglutide-for-weight-loss'; SELECT source_id,slug,payload_hash,payload_json,created_at FROM babylove_receipts WHERE slug='oral-semaglutide-for-weight-loss';" > babylove-proof/before.json
      - uses: actions/upload-artifact@v4
        with:
          name: babylove-repair-snapshot
          path: babylove-proof/
