name: My Timber PWA Production Release
on:
  push:
    branches: [main]
    paths:
      - 'my-timber-pwa/**'
      - 'app-store-public-v1.js'
      - 'tests/app-store-public.test.mjs'
      - 'worker-entry-v6.js'
      - '.github/workflows/my-timber-pwa-production-release.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE_MY_TIMBER_PWA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'RELEASE_MY_TIMBER_PWA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Require deploy credential and exact current main
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refuse stale PWA release'; exit 1; }
      - name: Install exact toolchain
        run: npm ci --no-audit --no-fund
      - name: Focused PWA, privacy and preservation gates
        run: |
          node --test my-timber-pwa/pwa.test.mjs my-timber-pwa/preservation.test.mjs my-timber-pwa/push-protocol.test.mjs tests/app-store-public.test.mjs
          node my-timber-final-source-gate.mjs
          node my-timber-navigation-gate.mjs
      - name: Capture active Worker deployment for rollback evidence
        run: npx wrangler deployments list --config wrangler.jsonc --json > pwa-deployment-before.json
      - name: Deploy exact current main
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait for propagation
        run: sleep 15
      - name: Verify exact PWA assets and safe live routes
        run: |
          node my-timber-pwa/verify-live.mjs
          node - <<'NODE'
          const base='https://shiftsometimber.co.uk';
          const checks=[
            ['/member/dashboard','id="pwaReminderFirstRun"'],
            ['/member/settings','id="pwaReminderSettings"'],
            ['/account-deletion','Request account deletion'],
            ['/my-timber/privacy','My Timber privacy notice']
          ];
          for (const [path,needle] of checks) {
            const r=await fetch(base+path); if(r.status!==200) throw Error(path+' HTTP '+r.status);
            const body=await r.text(); if(!body.includes(needle)) throw Error(path+' missing '+needle);
            if(body.includes('Send test notification')) throw Error(path+' still exposes test-notification control');
          }
          console.log('PASS: Today one-time choice, Settings management, privacy/deletion URLs; no test-notification control.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-timber-pwa-production-${{ github.sha }}
          path: |
            pwa-deployment-before.json
            b1-runtime-release/pwa-live.json
            b1-runtime-release/pwa-live.sha256
          if-no-files-found: warn
          retention-days: 30
