name: Reconcile G1-012 PASS
on:
  push:
    branches: [reconcile/g1-012-dave-pass]
    paths:
      - '.github/workflows/reconcile-g1-012-pass.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/g1-012-dave-pass
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Cash exact earned G1-012 evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files={
            matrix:'docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md',
            launch:'docs/LAUNCH-FINISH-LINE.md',
            evidence:'docs/COMMISSIONING-EVIDENCE.md',
            board:'docs/V1-RELEASE-BLOCKER-BOARD-V2.md',
            gate:'finish-line-gate.mjs'
          };
          const replaceExact=(file,from,to)=>{let s=fs.readFileSync(file,'utf8');if(!s.includes(from))throw new Error(`${file}: anchor missing: ${from.slice(0,80)}`);s=s.replace(from,to);fs.writeFileSync(file,s)};
          replaceExact(files.matrix,'**Current reconciled scoreboard: 57 total / 28 PASS / 26 AMBER / 3 BLOCKED / 0 unmapped.**','**Current reconciled scoreboard: 57 total / 29 PASS / 25 AMBER / 3 BLOCKED / 0 unmapped.**');
          replaceExact(files.matrix,'| G1-012 | Synthetic member commissioning is incomplete as release gate | AMBER | Authenticated production isolation/retention and the six-case rendered browser/device member journey are green; fresh unassisted B08 remains. |','| G1-012 | Synthetic member commissioning is incomplete as release gate | **PASS** | Authoritative main production commissioning run `31747143306` / job `94604287540` executed every currently automatable Dave release lane afresh in one unattended job and completed GREEN: discovery/trust/anonymous boundaries; authenticated isolation/onboarding/Today/Progress retention; Grub/Fit learning and leave/return; Hydration/My Plans/Today/Progress safe state; Progress Picture + Shift AI provenance/return + clinical boundary. Real-inbox registration/verification/recovery and external treatment support remain explicitly outside this synthetic row. Evidence: `docs/evidence/2026-08-13-g1-012-dave-release-gate.md`. |');
          replaceExact(files.matrix,'PASS rows: 28. AMBER rows: 26. BLOCKED rows: 3.','PASS rows: 29. AMBER rows: 25. BLOCKED rows: 3.');
          replaceExact(files.launch,'28 PASS / 26 AMBER / 3 BLOCKED','29 PASS / 25 AMBER / 3 BLOCKED');
          replaceExact(files.evidence,'**57 total / 28 PASS / 26 AMBER / 3 BLOCKED / 0 abstraction orphans.**','**57 total / 29 PASS / 25 AMBER / 3 BLOCKED / 0 abstraction orphans.**');
          replaceExact(files.board,'**A — V1 RELEASE BLOCKERS: 23 AMBER rows / 7 active shared clusters.**','**A — V1 RELEASE BLOCKERS: 22 AMBER rows / 7 active shared clusters.**');
          replaceExact(files.board,'**A CLOSED: 4 — G5-005 public trust architecture, G1-002 production email binding/delivery, G1-009 authenticated cross-browser/mobile regression acceptance, G1-008 rendered loading/empty/success state system.**','**A CLOSED: 5 — G5-005 public trust architecture, G1-002 production email binding/delivery, G1-009 authenticated cross-browser/mobile regression acceptance, G1-008 rendered loading/empty/success state system, G1-012 unattended synthetic Dave release gate.**');
          replaceExact(files.board,'G1-001, G1-003, G1-004, G1-012, G5-013.','G1-001, G1-003, G1-004, G5-013.');
          replaceExact(files.gate,'must(counts.PASS===28,`original matrix PASS count is 28 (found ${counts.PASS||0})`);','must(counts.PASS===29,`original matrix PASS count is 29 (found ${counts.PASS||0})`);');
          replaceExact(files.gate,'must(counts.AMBER===26,`original matrix AMBER count is 26 (found ${counts.AMBER||0})`);','must(counts.AMBER===25,`original matrix AMBER count is 25 (found ${counts.AMBER||0})`);');
          replaceExact(files.gate,"must(matrix.includes('PASS rows: 28. AMBER rows: 26. BLOCKED rows: 3.'),'matrix reconciliation summary matches enforced counts');","must(matrix.includes('PASS rows: 29. AMBER rows: 25. BLOCKED rows: 3.'),'matrix reconciliation summary matches enforced counts');");
          replaceExact(files.gate,"must(launchFinish.includes('28 PASS / 26 AMBER / 3 BLOCKED'),'launch board scoreboard matches enforced counts');","must(launchFinish.includes('29 PASS / 25 AMBER / 3 BLOCKED'),'launch board scoreboard matches enforced counts');");
          NODE
          node finish-line-gate.mjs
          git diff --check
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name shiftsometimber
          git config user.email shiftsometimber@gmail.com
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/LAUNCH-FINISH-LINE.md docs/COMMISSIONING-EVIDENCE.md docs/V1-RELEASE-BLOCKER-BOARD-V2.md finish-line-gate.mjs
          git commit -m 'Reconcile G1-012 production PASS to 29/25/3 and A=22'
          git push origin HEAD:reconcile/g1-012-dave-pass
