name: My Treatment production integration check
on:
  push:
    branches: [feat/my-treatment-production-20261008, feat/my-treatment-release-20261009]
  pull_request:
    paths: ['member-experience/treatment*', 'member-experience/tests/treatment*', 'privacy-health-erasure-route-v1.js']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --check worker-entry-v6.js
      - run: node --test tests/my-treatment-release.test.mjs
      - run: node --test member-experience/tests/*.test.mjs tests/discovery-repairs.test.mjs tests/ai-connected-member.test.mjs
