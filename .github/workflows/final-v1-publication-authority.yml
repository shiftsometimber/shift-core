name: Final V1 Publication Authority
on:
  pull_request:
    paths:
      - 'final-v1-publication-authority-gate.mjs'
      - 'final-v1-human-acceptance-gate.mjs'
      - 'evidence/grub-v1-final-decisions-2026-08-14.json'
      - 'evidence/fit-v1-final-decisions-2026-08-14.json'
      - 'content/fit/premium-visual-production-v1.json'
      - 'content/fit/premium-v1-render-contracts.json'
      - 'grub-v1-publication-pack.mjs'
      - '.github/workflows/final-v1-publication-authority.yml'
  push:
    branches: [main]
    paths:
      - 'final-v1-publication-authority-gate.mjs'
      - 'final-v1-human-acceptance-gate.mjs'
      - 'evidence/grub-v1-final-decisions-2026-08-14.json'
      - 'evidence/fit-v1-final-decisions-2026-08-14.json'
      - 'content/fit/premium-visual-production-v1.json'
      - 'content/fit/premium-v1-render-contracts.json'
      - 'grub-v1-publication-pack.mjs'
      - '.github/workflows/final-v1-publication-authority.yml'
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: python3 -m pip install --quiet openpyxl
      - run: python3 cofid-industrial-extract.py /tmp/cofid-index.json
      - name: Prove accepted Grub and Fit publication authority
        env:
          COFID_INDEX: /tmp/cofid-index.json
        run: node final-v1-publication-authority-gate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-v1-publication-authority-evidence
          path: final-v1-publication-evidence/
          retention-days: 30
