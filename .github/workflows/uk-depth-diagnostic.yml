name: Diagnose UK archive review visibility
on:
  push:
    branches: [feat/uk-newsroom-depth-20260913]
    paths: ['.github/workflows/uk-depth-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Inspect runtime and exact public editorial rows
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json
          npx wrangler d1 execute shift-core-db --remote --command "SELECT id,headline,region,regulator,status FROM radar_events WHERE id BETWEEN 310 AND 336 ORDER BY id"
          node --input-type=module - <<'JS'
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/shift-core',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          if(!response.ok)throw Error('Script inspection HTTP '+response.status);
          const code=await response.text();
          console.log(JSON.stringify({compiledScriptContainsNewAuthorities:code.includes('Public Health Scotland'),compiledScriptContainsADHD:code.includes('GP walk-in|ADHD|HeartFlow'),ukHealthPattern:code.match(/(?:var|const) UK_HEALTH[^;]+/)?.[0],authorityPattern:code.match(/(?:var|const) UK_HEALTH_AUTHORITIES[^;]+/)?.[0],length:code.length}));
          const domains=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/domains',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
          const db=await domains.json();console.log('API domain mapping',JSON.stringify(db.result?.filter(d=>d.hostname==='api.shiftsometimber.co.uk')||{status:domains.status,errors:db.errors}));
          for(const host of ['shiftsometimber.co.uk','api.shiftsometimber.co.uk']){
            const r=await fetch('https://'+host+'/shift-newsroom?runtime-probe=rec037');
            const h=await r.text();console.log(host,JSON.stringify({status:r.status,newFilter:h.includes('gambling'),length:h.length}));
          }
          JS
