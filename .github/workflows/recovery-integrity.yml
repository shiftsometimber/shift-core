name: Recovery Integrity Gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  recovery-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node recovery-integrity-gate.mjs
