name: Grub Editorial Review Surface
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: python3 -m pip install --quiet openpyxl
      - run: python3 cofid-industrial-extract.py /tmp/cofid-index.json
      - run: node grub-v1-editorial-defect-gate.mjs
      - run: COFID_INDEX=/tmp/cofid-index.json REVIEW_PACK_DIR=review-evidence node grub-editorial-review-surface.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: grub-101-editorial-review-surface
          path: review-evidence/
          retention-days: 30
