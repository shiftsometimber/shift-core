name: Synthetic Production Safety Drills

on:
  pull_request:
    paths:
      - '.github/workflows/synthetic-production-safety-drills.yml'
      - 'commissioning-identity-v1.js'
      - 'commissioning-ops-v1.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/synthetic-production-safety-drills.yml'
      - 'commissioning-identity-v1.js'
      - 'commissioning-ops-v1.js'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: synthetic-production-safety-drills
  cancel-in-progress: false

jobs:
  tap-room-and-health-erasure:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: https://api.shiftsometimber.co.uk
      SITE: https://shiftsometimber.co.uk
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONFIG: wrangler.jsonc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Acquire short-lived commissioning identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Register isolated synthetic member
        id: member
        shell: bash
        env:
          OIDC: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p synthetic-production-drill-evidence
          email="shiftsometimber+safety-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@gmail.com"
          password="Sst-$(openssl rand -hex 18)-Aa1!"
          echo "::add-mask::$email"
          echo "::add-mask::$password"
          status=0
          for attempt in $(seq 1 18); do
            status=$(curl -sS -D /tmp/register.headers -o /tmp/register.json -w '%{http_code}' \
              -H "Origin: $SITE" -H 'Content-Type: application/json' -H "X-Shift-Commissioning-OIDC: $OIDC" \
              -X POST "$API/v1/auth/register" \
              --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,firstName:"SyntheticDrill",source:"commissioning-synthetic-safety-drills"}')")
            if [ "$status" = "201" ]; then break; fi
            if [ "$status" != "403" ]; then break; fi
            sleep 20
          done
          jq -n --argjson status "$status" --arg error "$(jq -r '.error // "none"' /tmp/register.json 2>/dev/null || echo unreadable)" '{httpStatus:$status,error:$error}' > synthetic-production-drill-evidence/registration-attempt.json
          test "$status" = "201"
          user_id=$(jq -er '.user.id|tonumber' /tmp/register.json)
          cookie=$(tr -d '\r' </tmp/register.headers | awk -F': ' 'tolower($1)=="set-cookie"{print $2;exit}' | cut -d';' -f1)
          test -n "$cookie"
          echo "::add-mask::$cookie"
          echo "user_id=$user_id" >> "$GITHUB_OUTPUT"
          echo "cookie=$cookie" >> "$GITHUB_OUTPUT"
          jq '{status:201,userId:(.user.id|tonumber),synthetic:true}' /tmp/register.json > synthetic-production-drill-evidence/registration.json

      - name: Recover any interrupted prior labelled drill
        shell: bash
        env:
          OIDC: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/prior-cleanup.json -w '%{http_code}' -H "Origin: $SITE" -H 'Content-Type: application/json' -H "X-Shift-Commissioning-OIDC: $OIDC" -X POST "$API/v1/commissioning/synthetic-safety-drill" --data '{"action":"cleanup_previous"}')
          test "$status" = "200"
          jq -e '.ok==true' /tmp/prior-cleanup.json
          jq . /tmp/prior-cleanup.json > synthetic-production-drill-evidence/prior-cleanup.json

      - name: Trigger labelled Tap Room P0 incident
        id: tap
        shell: bash
        env:
          COOKIE: ${{ steps.member.outputs.cookie }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/tap-post.json -w '%{http_code}' \
            -H "Origin: $SITE" -H 'Content-Type: application/json' -H "Cookie: $COOKIE" \
            -X POST "$API/v1/tap-room/rooms/general-life/posts" \
            --data '{"body":"TEST INCIDENT — synthetic safeguarding delivery drill only. This is not a real person or real crisis. Test phrase: I am going to kill myself now."}')
          test "$status" = "201"
          jq -e '.ok==true and .status=="held" and .flagged==true and (.crisisSupport|length)>0' /tmp/tap-post.json
          post_id=$(jq -er '.id|tonumber' /tmp/tap-post.json)
          echo "post_id=$post_id" >> "$GITHUB_OUTPUT"
          jq '{httpStatus:201,postId:.id,status,flagged,reviewMessage,crisisSupport,synthetic:true}' /tmp/tap-post.json > synthetic-production-drill-evidence/tap-trigger.json

      - name: Prove P0 queue then sanitise and close test incident
        shell: bash
        env:
          OIDC: ${{ steps.oidc.outputs.token }}
          USER_ID: ${{ steps.member.outputs.user_id }}
          POST_ID: ${{ steps.tap.outputs.post_id }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/tap-close.json -w '%{http_code}' -H "Origin: $SITE" -H 'Content-Type: application/json' -H "X-Shift-Commissioning-OIDC: $OIDC" -X POST "$API/v1/commissioning/synthetic-safety-drill" --data "$(jq -nc --argjson userId "$USER_ID" --argjson postId "$POST_ID" '{action:"inspect_and_close_tap",userId:$userId,postId:$postId}')")
          test "$status" = "200"
          jq -e '.ok==true and .before.status=="held" and .before.priority=="P0" and .before.reportStatus=="open" and .after.body=="[TEST INCIDENT CLOSED]" and .after.status=="hidden_by_moderator" and .after.report_status=="reviewed" and .after.outcome=="synthetic_drill_closed" and .after.action=="synthetic_p0_drill_close"' /tmp/tap-close.json
          jq . /tmp/tap-close.json > synthetic-production-drill-evidence/tap-closure.json

      - name: Seed synthetic optional health rows
        shell: bash
        env:
          OIDC: ${{ steps.oidc.outputs.token }}
          USER_ID: ${{ steps.member.outputs.user_id }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/health-seed.json -w '%{http_code}' -H "Origin: $SITE" -H 'Content-Type: application/json' -H "X-Shift-Commissioning-OIDC: $OIDC" -X POST "$API/v1/commissioning/synthetic-safety-drill" --data "$(jq -nc --argjson userId "$USER_ID" '{action:"seed_health",userId:$userId}')")
          test "$status" = "200"
          jq -e '.ok==true and .progressRows==1 and .checkInRows==1' /tmp/health-seed.json
          jq . /tmp/health-seed.json > synthetic-production-drill-evidence/health-before.json

      - name: Exercise authenticated health-tracking erasure
        shell: bash
        env:
          OIDC: ${{ steps.oidc.outputs.token }}
          COOKIE: ${{ steps.member.outputs.cookie }}
          USER_ID: ${{ steps.member.outputs.user_id }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/health-erasure.json -w '%{http_code}' -H "Origin: $SITE" -H "Cookie: $COOKIE" -X DELETE "$API/v1/privacy/health-tracking")
          test "$status" = "200"
          jq -e '.ok==true and .consentWithdrawn==true and (.deleted|map(.table)|index("progress_entries")!=null) and (.deleted|map(.table)|index("check_ins")!=null)' /tmp/health-erasure.json
          jq '{httpStatus:200,ok,erasedAt,deleted,consentWithdrawn,synthetic:true}' /tmp/health-erasure.json > synthetic-production-drill-evidence/health-erasure-response.json
          verify=$(curl -sS -o /tmp/health-after.json -w '%{http_code}' -H "Origin: $SITE" -H 'Content-Type: application/json' -H "X-Shift-Commissioning-OIDC: $OIDC" -X POST "$API/v1/commissioning/synthetic-safety-drill" --data "$(jq -nc --argjson userId "$USER_ID" '{action:"verify_health_erasure",userId:$userId}')")
          test "$verify" = "200"
          jq -e '.ok==true and .progressRows==0 and .checkInRows==0 and .withdrawalRows>=1 and .auditRows>=1' /tmp/health-after.json
          jq . /tmp/health-after.json > synthetic-production-drill-evidence/health-after.json

      - name: Write combined proof summary
        shell: bash
        env:
          USER_ID: ${{ steps.member.outputs.user_id }}
          POST_ID: ${{ steps.tap.outputs.post_id }}
        run: |
          jq -n --arg proof 'SYNTHETIC_PRODUCTION_SAFETY_DRILLS_2026_09_02' --argjson userId "$USER_ID" --argjson postId "$POST_ID" \
            '{proof:$proof,status:"PASS",syntheticMemberId:$userId,tapRoom:{postId:$postId,labelledTest:true,held:true,p0Queue:true,contentSanitised:true,reportClosed:true,auditRetained:true,emailTriggerInvoked:true,inboxReceiptRequiresHumanConfirmation:true},healthErasure:{seededSyntheticRows:true,authenticatedDelete:true,progressRowsAfter:0,checkInRowsAfter:0,consentWithdrawalRetained:true,auditRetained:true},realMemberDataTouched:false}' \
            | tee synthetic-production-drill-evidence/summary.json
          cat synthetic-production-drill-evidence/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-production-safety-drills
          path: synthetic-production-drill-evidence
          if-no-files-found: error
          retention-days: 30
