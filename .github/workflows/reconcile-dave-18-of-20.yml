name: Reconcile Dave 18 of 20
on:
  push:
    branches: [reconcile/dave-verification-18-of-20]
    paths:
      - 'dave-evidence-reconciliation.mjs'
      - 'scripts/reconcile-dave-18-of-20.mjs'
      - '.github/workflows/reconcile-dave-18-of-20.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/dave-verification-18-of-20
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node scripts/reconcile-dave-18-of-20.mjs
      - run: node dave-evidence-reconciliation.mjs
      - name: Assert status is unchanged but Dave evidence moved
        run: |
          grep -qx 'A=6' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -qx 'AUDIT_PASS=48' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -qx 'AUDIT_AMBER=6' docs/V1-RELEASE-BLOCKER-COUNTS.txt
          grep -F '**18/20 non-duplicated Dave journey legs (90%)**' docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md
      - name: Commit evidence reconciliation
        run: |
          git config user.name shiftsometimber
          git config user.email shiftsometimber@gmail.com
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/V1-RELEASE-BLOCKER-BOARD-V2.md docs/LAUNCH-FINISH-LINE.md docs/COMMISSIONING-EVIDENCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Dave: reconcile genuine verification to 18 of 20'
          git push origin HEAD:reconcile/dave-verification-18-of-20
