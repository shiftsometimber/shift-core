name: About book copy release
on:
  push:
    branches: [copy/about-pages-20260926]
    paths: ['.github/workflows/about-book-preview.yml', 'release/about-20260926/**']
permissions:
  contents: read
concurrency:
  group: verified-public-pages-repair
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 2311dc84089b0fdc853f5e86663c9e6acd7b7adc
          path: reta-authority
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Read current Pages provenance
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          u='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/pages/projects/projectshift'
          r=json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})))['result']
          d=r['canonical_deployment']
          print(json.dumps({'deployment':d['url'],'trigger':d['deployment_trigger'],'source':r.get('source')}))
          assert d['deployment_trigger']['metadata']['commit_hash']=='2311dc84089b0fdc853f5e86663c9e6acd7b7adc', 'Pages authority moved again'
          PY
      - name: Reproduce authoritative Pages source
        run: |
          python3 release/public-pages-20260911/prepare-start-here.py
          python3 release/public-pages-20260911/prepare-work-public.py
          python3 release/header-20260912/prepare-header.py
      - name: Apply book copy and verify complete source
        run: |
          python3 reta-authority/editorial/retatrutide/build-preview.py --pages-root . --out retatrutide-baseline
          python3 release/about-20260926/prepare.py
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('release/public-pages-20260911/control.json');c=json.loads(p.read_text())
          assert c['source_fingerprint']=='a60508c8321efc654c3b5b234e41b297359961e6d5f192b07fc08f5b1fae4d9f'
          c.update(mode='production',approved_preview_url='https://1565d797.projectshift.pages.dev',preview_browser_checks_passed=True)
          p.write_text(json.dumps(c,indent=2)+'\n')
          PY
          python3 release/public-pages-20260911/assemble-pages.py
      - run: npm ci --no-audit --no-fund
      - name: Publish exact checked About revision
        run: |
          mkdir -p "$RUNNER_TEMP/about-command"
          cd "$RUNNER_TEMP/about-command"
          node "$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js" pages deploy "$SST_RELEASE_DIR" --project-name projectshift --branch main --commit-hash "$GITHUB_SHA" 2>&1 | tee "$GITHUB_WORKSPACE/release/about-20260926/deploy.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: about-book-preview-evidence
          path: release/about-20260926/
