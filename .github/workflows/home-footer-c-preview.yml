name: Homepage footer C sign-off preview
on:
  push:
    branches: [preview/home-footer-c-20261001]
permissions:
  contents: read
concurrency:
  group: home-footer-c-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: node preview/home-banner/build-footer-c.mjs
      - name: Deploy read-only preview only
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: npx wrangler deploy --config preview/home-banner/wrangler-footer-c.jsonc | tee home-banner-proof/deploy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-footer-c-preview
          path: home-banner-proof/
