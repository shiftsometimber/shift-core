name: Authenticated Accessibility Performance
on:
  pull_request:
    paths:
      - 'v1-authenticated-accessibility-performance-production.mjs'
      - '.github/workflows/authenticated-accessibility-performance.yml'
permissions:
  contents: read
jobs:
  wiring-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Validate authenticated accessibility harness syntax
        run: node --check v1-authenticated-accessibility-performance-production.mjs
      - name: Confirm authorised Gate 1 production runner owns execution
        run: grep -q 'v1-authenticated-accessibility-performance-production.mjs' .github/workflows/gate1-rendered-browser.yml
