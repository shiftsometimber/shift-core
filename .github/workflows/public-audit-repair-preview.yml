name: Public Audit Repair Preview
on:
  push:
    branches: [fix/public-health-contact-security-20260916]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Prove scoped public repairs and existing security contracts
        run: node --test tests/public-audit-repair.test.mjs medicines-watch/*.test.mjs tests/turnstile*.test.mjs tests/continuity*.test.mjs tests/seo-release-integrity.test.mjs tests/hq-catalogue-v1.test.mjs tests/medicine-commerce-v1.test.mjs tests/medicine-purchase-e2e.test.mjs tests/technical-9-closeout.test.mjs tests/act2b-workflow-preservation.test.mjs
      - name: Publish read-only Health preview without production bindings
        run: npx wrangler deploy --config preview/public-audit/wrangler.jsonc
