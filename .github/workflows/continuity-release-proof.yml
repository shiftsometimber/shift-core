name: Authority Continuity Release Proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/current-main-guard.mjs'
      - 'scripts/catalogue-publication-client.mjs'
      - 'member-experience/health-interest-store.mjs'
      - 'member-experience/health-routes.mjs'
      - 'my-journey-v1.js'
      - 'medicines-watch/preservation*'
      - 'tests/my-journey*'
      - 'tests/catalogue-publication-main-read.test.mjs'
      - '.github/workflows/continuity-release-proof.yml'
permissions:
  contents: read
concurrency:
  group: continuity-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain exact historical recipe image proof prerequisites
        run: |
          git fetch --no-tags origin 67635799d3647172cc38f60137052f0c68b33b82 2b727bff6a33adb9bc37716314a0ace19e141bdb
          git cat-file -e 67635799d3647172cc38f60137052f0c68b33b82^{commit}
          git cat-file -e 2b727bff6a33adb9bc37716314a0ace19e141bdb^{commit}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Real database and preserved-page regression tests
        run: |
          set -o pipefail
          node --test tests/catalogue-publication*.test.mjs tests/my-journey*.test.mjs medicines-watch/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs member-experience/tests/*.test.mjs | tee continuity-proof.tap
      - name: Existing integration gates
        run: |
          node my-journey-integration-gate.mjs
          node my-timber-final-source-gate.mjs
      - name: Read-only preservation preflight against current public responses
        run: node member-experience/public-preservation.mjs public-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuity-proof-${{ github.event.pull_request.head.sha }}
          path: |
            continuity-proof.tap
            public-baseline.json
