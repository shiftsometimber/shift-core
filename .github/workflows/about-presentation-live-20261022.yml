name: Publish approved About presentation
on:
  push:
    branches: [release/about-presentation-20261022]
    paths: [previews/about-presentation/**, .github/workflows/about-presentation-live-20261022.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: about-presentation-live-20261022
  cancel-in-progress: true
jobs:
  publish-and-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      ABOUT_EVIDENCE_DIR: about-presentation-live-evidence
      ABOUT_RELEASE: 20261022-about-live-v1
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: previews/about-presentation
          fetch-depth: 4
      - name: Trust this checkout inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Capture the current published index once
        run: node --input-type=module -e "import{writeFileSync}from'node:fs';const r=await fetch('https://shiftsometimber.co.uk/about',{signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('Could not read About');writeFileSync('previews/about-presentation/source-fixture.html',await r.text())"
      - name: Verify approved source and production boundaries
        run: |
          node previews/about-presentation/build.cjs
          git diff --exit-code -- previews/about-presentation/style.mjs previews/about-presentation/menu-client.mjs
          node --test previews/about-presentation/test.mjs
      - name: Match the browser client
        run: npm install --prefix "$RUNNER_TEMP/about-browser" playwright@1.58.2 --no-audit --no-fund
      - name: Stage approved About without changing public routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node previews/about-presentation/deploy-live.mjs stage
      - name: Check hosted release before public activation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/about-browser/node_modules/playwright
          ABOUT_ORIGIN: https://shift-about-presentation-20261022.matobrien.workers.dev
          ABOUT_CHECK_LINKS: '0'
        run: node previews/about-presentation/check-live.cjs
      - name: Activate only the two About route families
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/about-presentation/deploy-live.mjs activate
      - name: Verify the actual public About on mobile and desktop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/about-browser/node_modules/playwright
          ABOUT_ORIGIN: https://shiftsometimber.co.uk
        run: node previews/about-presentation/check-live.cjs
      - name: Restore only this release's routes if acceptance fails
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/about-presentation/deploy-live.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: about-presentation-live-${{ github.sha }}
          path: about-presentation-live-evidence/
          retention-days: 90
