name: Shift Fit 44-Family Visual Review Pack
on:
  pull_request:
    paths:
      - 'fit-44-family-visual-acceptance-pack.mjs'
      - 'industrial-catalogue-v3.js'
      - '.github/workflows/fit-44-family-review-pack.yml'
jobs:
  build-review-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: REVIEW_PACK_DIR=review-evidence node fit-44-family-visual-acceptance-pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fit-44-family-visual-review-pack
          path: review-evidence/
          retention-days: 30
