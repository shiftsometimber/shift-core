name: Portable Continuity Proof
on:
  push:
    branches: ['feat/portable-continuity-sprint-20260919']
  pull_request:
    branches: [main]
    paths:
      - 'public-continuity.mjs'
      - 'public-shell-contract.mjs'
      - 'tests/public-continuity.test.mjs'
      - 'tests/public-shell-contract.test.mjs'
      - '.github/workflows/portable-continuity-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Continuity and shell regressions
        run: node --test tests/public-continuity.test.mjs tests/public-shell-contract.test.mjs tests/continuity-content-20261009.test.mjs tests/continuity-content-composition.test.mjs tests/male-obesity-composition.test.mjs
      - name: Compile exact Worker without deploying
        run: npx wrangler deploy --dry-run --outdir continuity-proof
      - name: Render exact candidate body in public shell on mobile and desktop
        run: |
          npm install --prefix "$RUNNER_TEMP/continuity-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/continuity-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/continuity-browser/node_modules/playwright/index.mjs" node scripts/verify-continuity-content-browser.mjs
      - name: Retain exact diff
        run: git diff --no-index /dev/null public-continuity.mjs > continuity-proof.patch || test $? -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-continuity-${{ github.sha }}
          path: |
            continuity-proof.patch
            continuity-proof/
            continuity-content-browser/
          retention-days: 30
