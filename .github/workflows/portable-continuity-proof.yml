name: Portable Continuity Proof
on:
  push:
    branches: ['feat/portable-continuity-sprint-20260919']
  pull_request:
    branches: [main]
    paths:
      - 'public-continuity.mjs'
      - 'public-shell-contract.mjs'
      - 'tests/public-continuity.test.mjs'
      - 'tests/public-shell-contract.test.mjs'
      - '.github/workflows/portable-continuity-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Continuity and shell regressions
        run: node --test tests/public-continuity.test.mjs tests/public-shell-contract.test.mjs
      - name: Compile exact Worker without deploying
        run: npx wrangler deploy --dry-run --outdir continuity-proof
      - name: Retain exact diff
        run: git diff HEAD^ -- public-continuity.mjs public-shell-contract.mjs tests/public-continuity.test.mjs tests/public-shell-contract.test.mjs > continuity-proof.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-continuity-${{ github.sha }}
          path: |
            continuity-proof.patch
            continuity-proof/
          retention-days: 30
