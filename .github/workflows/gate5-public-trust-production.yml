name: Gate 5 Public Trust Production
on:
  pull_request:
    paths:
      - 'gate5-public-trust-production.mjs'
      - '.github/workflows/gate5-public-trust-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trust-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Audit public non-clinical trust presentation
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          TRUST_EVIDENCE_DIR: trust-evidence
        run: node gate5-public-trust-production.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate5-public-trust-production-evidence
          path: trust-evidence
          retention-days: 30