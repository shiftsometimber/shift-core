name: SHIFT Contact Email Closeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contact-email-closeout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Apply canonical email map and routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new, required=True):
              p=Path(path)
              if not p.exists():
                  if required: raise SystemExit(f'missing file {path}')
                  return
              s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f'missing anchor {path}: {old[:80]}')
                  return
              p.write_text(s.replace(old,new))

          # Canonical transactional mailbox map.
          p=Path('transactional-email-v1.js'); s=p.read_text()
          s=s.replace("  accounts:'accounts@shiftsometimber.co.uk'\n", "  accounts:'accounts@shiftsometimber.co.uk',\n  feedback:'feedback@shiftsometimber.co.uk',\n  hq:'hq@shiftsometimber.co.uk',\n  it:'it@shiftsometimber.co.uk'\n")
          s=s.replace("  accounts:[SHIFT_MAILBOXES.accounts]\n", "  accounts:[SHIFT_MAILBOXES.accounts],\n  feedback:[SHIFT_MAILBOXES.feedback],\n  hq:[SHIFT_MAILBOXES.hq],\n  it:[SHIFT_MAILBOXES.it]\n")
          p.write_text(s)

          # Production email config: no old welcome@ or spare Gmail for operational routing.
          for path in ['wrangler.jsonc','wrangler-shift-me.jsonc']:
              if Path(path).exists():
                  s=Path(path).read_text()
                  s=s.replace('welcome@shiftsometimber.co.uk','hello@shiftsometimber.co.uk')
                  s=s.replace('"ADMIN_NOTIFICATION_EMAIL": "shiftsometimber@gmail.com"','"ADMIN_NOTIFICATION_EMAIL": "hq@shiftsometimber.co.uk"')
                  s=s.replace('"ORDER_NOTIFICATION_EMAIL": "shiftsometimber@gmail.com"','"ORDER_NOTIFICATION_EMAIL": "orders@shiftsometimber.co.uk"')
                  s=s.replace('"RADAR_ALERT_TO": "shiftsometimber@gmail.com"','"RADAR_ALERT_TO": "hq@shiftsometimber.co.uk"')
                  s=s.replace('"EVIDENCE_DESK_ALERT_TO": "shiftsometimber@gmail.com"','"EVIDENCE_DESK_ALERT_TO": "hq@shiftsometimber.co.uk"')
                  s=s.replace('"TAP_ROOM_P0_EMAIL": "shiftsometimber@gmail.com"','"TAP_ROOM_P0_EMAIL": "hq@shiftsometimber.co.uk"')
                  Path(path).write_text(s)

          # Runtime fallbacks.
          for path in ['fit-reminders-v1.js','tap-room-v1.js','integration-source-gate.mjs']:
              if Path(path).exists():
                  s=Path(path).read_text().replace('welcome@shiftsometimber.co.uk','hello@shiftsometimber.co.uk')
                  Path(path).write_text(s)
          for path in ['commerce-stripe-v1.js','evidence-desk-v1.js','hq-commerce-content-v1.js','radar-authoritative-scan-v1.js']:
              if Path(path).exists():
                  s=Path(path).read_text()
                  if path=='commerce-stripe-v1.js': s=s.replace("env.ORDER_NOTIFICATION_EMAIL||env.ADMIN_NOTIFICATION_EMAIL||'shiftsometimber@gmail.com'", "env.ORDER_NOTIFICATION_EMAIL||env.ADMIN_NOTIFICATION_EMAIL||'orders@shiftsometimber.co.uk'")
                  else: s=s.replace("env.ADMIN_NOTIFICATION_EMAIL||'shiftsometimber@gmail.com'", "env.ADMIN_NOTIFICATION_EMAIL||'hq@shiftsometimber.co.uk'").replace("env.ADMIN_NOTIFICATION_EMAIL||'shiftsometimber@gmail.com'", "env.ADMIN_NOTIFICATION_EMAIL||'hq@shiftsometimber.co.uk'")
                  Path(path).write_text(s)

          # Human/media public links go to their actual lane.
          for path in ['frontend/member/my-timber-v11.js']:
              if Path(path).exists():
                  s=Path(path).read_text().replace('mailto:hello@shiftsometimber.co.uk?subject=Coming%20off%20support%20-%20Message%20for%20Matt','mailto:matt@shiftsometimber.co.uk?subject=Coming%20off%20support%20-%20Message%20for%20Matt').replace('mailto:hello@shiftsometimber.co.uk?subject=My%20Timber%20-%20Message%20for%20Matt','mailto:matt@shiftsometimber.co.uk?subject=My%20Timber%20-%20Message%20for%20Matt')
                  Path(path).write_text(s)
          if Path('apply-earned-authority-v1.mjs').exists():
              s=Path('apply-earned-authority-v1.mjs').read_text().replace('mailto:hello@shiftsometimber.co.uk"><strong>hello@shiftsometimber.co.uk</strong>', 'mailto:press@shiftsometimber.co.uk"><strong>press@shiftsometimber.co.uk</strong>')
              Path('apply-earned-authority-v1.mjs').write_text(s)

          # Preview template should reflect operational routing too.
          if Path('wrangler.my-timber-preview.template.jsonc').exists():
              s=Path('wrangler.my-timber-preview.template.jsonc').read_text().replace('"ADMIN_NOTIFICATION_EMAIL": "shiftsometimber@gmail.com"','"ADMIN_NOTIFICATION_EMAIL": "hq@shiftsometimber.co.uk"').replace('"TAP_ROOM_P0_EMAIL": "shiftsometimber@gmail.com"','"TAP_ROOM_P0_EMAIL": "hq@shiftsometimber.co.uk"')
              Path('wrangler.my-timber-preview.template.jsonc').write_text(s)
          PY

          node --check transactional-email-v1.js
          node --check fit-reminders-v1.js
          node --check commerce-stripe-v1.js
          node --check evidence-desk-v1.js
          node --check hq-commerce-content-v1.js
          node --check radar-authoritative-scan-v1.js
          grep -q "feedback:'feedback@shiftsometimber.co.uk'" transactional-email-v1.js
          grep -q "hq:'hq@shiftsometimber.co.uk'" transactional-email-v1.js
          grep -q "it:'it@shiftsometimber.co.uk'" transactional-email-v1.js
          grep -q '"AUTH_EMAIL_FROM": "hello@shiftsometimber.co.uk"' wrangler.jsonc
          ! git grep -n 'welcome@shiftsometimber.co.uk' -- '*.js' '*.jsonc' ':!evidence/**'
          ! git grep -n 'shiftsometimber@gmail.com' -- 'wrangler.jsonc' 'commerce-stripe-v1.js' 'evidence-desk-v1.js' 'hq-commerce-content-v1.js' 'radar-authoritative-scan-v1.js'
      - name: Commit and self-remove
        shell: bash
        run: |
          rm .github/workflows/contact-email-closeout.yml .github/workflows/contact-email-audit.yml
          git config user.name 'shift-technical9-bot'
          git config user.email 'it@shiftsometimber.co.uk'
          git add -A
          git commit -m 'Lock canonical website email routing'
          git push origin HEAD:main
