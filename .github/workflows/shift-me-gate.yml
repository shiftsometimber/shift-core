name: Shift Me Source, Privacy and Production Gate
on:
  pull_request:
    paths:
      - 'shift-me-v1.js'
      - 'shift-me-production-proof.mjs'
      - 'shift-me-production-proof-runner.mjs'
      - 'shift-me-source-gate.mjs'
      - 'worker-entry-v6.js'
      - 'wrangler.jsonc'
      - 'frontend/member/shift-me-api-v1.js'
      - 'frontend/member/member-shift-me-premium-v1.js'
      - 'frontend/member/member-shift-me-premium-v1.css'
      - 'frontend/member/member-shell-v33g.js'
      - 'commissioning-identity-v1.js'
      - '.github/workflows/shift-me-gate.yml'
  push:
    branches: [main]
    paths:
      - 'shift-me-v1.js'
      - 'shift-me-production-proof.mjs'
      - 'shift-me-production-proof-runner.mjs'
      - 'shift-me-source-gate.mjs'
      - 'worker-entry-v6.js'
      - 'wrangler.jsonc'
      - 'frontend/member/shift-me-api-v1.js'
      - 'frontend/member/member-shift-me-premium-v1.js'
      - 'frontend/member/member-shift-me-premium-v1.css'
      - 'frontend/member/member-shell-v33g.js'
      - 'commissioning-identity-v1.js'
      - '.github/workflows/shift-me-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  shift-me-source-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Syntax-check member creator
        run: node --check frontend/member/member-shift-me-premium-v1.js
      - name: Run Shift Me source/privacy/member-journey contract
        run: node shift-me-source-gate.mjs

  shift-me-production-technical:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Run Shift Me authenticated production render/privacy proof
        env:
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          NODE_OPTIONS: --import=./commissioning-fetch-hook.mjs
          SHIFT_ME_EVIDENCE_DIR: shift-me-production-evidence
        run: node shift-me-production-proof-runner.mjs
      - name: Upload Shift Me production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-me-production-evidence
          path: shift-me-production-evidence
          if-no-files-found: warn
          retention-days: 30
