name: Stabilisation and Life Back PREVIEW ONLY
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: ['.github/workflows/stabilisation-life-back-preview.yml']
permissions:
  contents: read
concurrency:
  group: stabilisation-life-back-preview-only
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/preview/stabilisation-life-back-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture authoritative source and read-only public baseline; no deployments or writes
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, subprocess, urllib.request, urllib.parse, xml.etree.ElementTree as ET, zipfile, datetime
          root=pathlib.Path('.'); out=root/'preview-capture'; out.mkdir()
          base='https://shiftsometimber.co.uk'
          def get(path):
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'SHIFT-Preview-ReadOnly-Verification/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      data=response.read(2000000); return {'path':path,'url':response.url,'status':response.status,'headers':dict(response.headers),'sha256':hashlib.sha256(data).hexdigest()},data
              except Exception as e:
                  return {'path':path,'error':str(e)},b''
          record,sitemap=get('/sitemap.xml'); (out/'sitemap.xml').write_bytes(sitemap)
          urls=['/','/programme','/start-here','/about','/contact','/shift-health','/shift-health/erectile-dysfunction','/shift-health/testosterone-energy','/shift-health/health-mot','/treatment-centre','/treatment-centre/medicines-watch','/knowledge','/shift-newsroom','/medicine-news','/shop','/shift-for-work','/member-login','/life-back','/mens-mental-health','/good-to-talk']
          try:
              tree=ET.fromstring(sitemap)
              for el in tree.iter():
                  if el.tag.endswith('loc') and el.text:
                      u=urllib.parse.urlparse(el.text)
                      if u.netloc=='shiftsometimber.co.uk' and not u.path.endswith('.xml') and not u.path.startswith(('/v1/','/member/','/hq/')): urls.append(u.path)
          except Exception: pass
          urls=list(dict.fromkeys(urls))[:700]; report=[record]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for i,(meta,data) in enumerate(pool.map(get,urls)):
                  fname='page-'+str(i)+'.html'; meta['file']=fname; report.append(meta)
                  if data: (out/fname).write_bytes(data)
          (out/'baseline.json').write_text(json.dumps({'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'baseSha':'e64cbf56032efc7fe727cb52b5832530e632824d','method':'GET only; no production mutations','pages':report},indent=2))
          selected={'.js','.mjs','.cjs','.json','.jsonc','.css','.html','.yml','.yaml','.sql','.md','.txt','.py','.csv','.toml','.xml','.sh'}
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('preview-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in tracked:
                  if not name: continue
                  p=root/name
                  if p.is_file() and (p.suffix in selected or p.name in ['.nvmrc','.gitignore','_headers','_redirects']): z.write(p,'source/'+name)
              for p in out.iterdir(): z.write(p,'baseline/'+p.name)
          print(json.dumps({'pages':len(report),'archiveBytes':pathlib.Path('preview-source.zip').stat().st_size,'productionWrites':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stabilisation-source-and-live-baseline
          path: preview-source.zip
          retention-days: 7
          if-no-files-found: error
