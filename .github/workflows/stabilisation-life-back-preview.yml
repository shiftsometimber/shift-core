name: Stabilisation and Life Back PREVIEW ONLY
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: ['.github/workflows/stabilisation-life-back-preview.yml']
permissions:
  contents: write
concurrency:
  group: stabilisation-life-back-preview-only
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/preview/stabilisation-life-back-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stabilisation-life-back-20260917
          fetch-depth: 1
      - name: Apply exact checksum-verified source changes only on preview branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview/stabilisation-life-back-20260917
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,re,subprocess
          root=pathlib.Path('.')
          digest=lambda s:hashlib.sha256(s.encode()).hexdigest()
          parts=[('1','e1ae700b4dfcbadd69a517b55fd0c2107b113e580fa5ad560c9c05c47c97df23'),('2a','86bc2cc9ce687c304b4697846fecad5382a7622f7e7e8004e59203359dc1387b'),('2b','a85e06829bdbedbc700b6010b863b9a2842e32c6fe18093f158cae7b76ce87d1'),('3a','4a8d7e9018e25e75a04899515074fd34abe06d584ccda92bcfeb77ee2443f655'),('3b','39169ab1758356c94fc260c6679ece81f299e038b2e0fce34e12a33bda33ac9d'),('4a','31434c31bea44fa3642516fd8d8b1de829ed795b8cd3e3c75f812be906824a07'),('4b','1cba84bba5aaef521ab3183300bf63f60088531a66c19a2bc18c47996722640e')]
          marker=root/'preview/stabilisation/SOURCE-APPLIED.json'
          if marker.exists():
              print('Verified source was already applied; running the preview checks again.')
          else:
              strings=[]
              for name,expected in parts:
                  p=root/('preview/stabilisation/transport-'+name+'.txt');s=p.read_text()
                  if name=='4b':
                      s=s.replace('VHbSi1S+zwu','VHmSi1S+zwu').replace('Jhq7faw7HXtg','Jhq7faw9HXtg')
                  actual=digest(s)
                  print('Transport',name,'length',len(s),'sha256',actual)
                  assert actual==expected,'Transport checksum mismatch: '+name
                  strings.append(s)
              raw=gzip.decompress(base64.b64decode(''.join(strings),validate=True))
              assert hashlib.sha256(raw).hexdigest()=='8229250b922db8d43f00923b583d469f32aa81dafe3cd032ec43d25141bee499','Manifest checksum mismatch'
              changes=json.loads(raw)
              allowed={'frontend/member/member-my-timber-problem-v1.js','member-experience/home-styles.mjs','member-experience/journey-context.mjs','member-experience/life-back-routes.mjs','member-experience/life-back/client.mjs','member-experience/life-back/index.html','member-experience/life-back/next-shift.mjs','member-experience/life-back/style.css','member-experience/staging/connected.mjs','member-experience/staging/pins.json','member-experience/tests/next-shift-loop.test.mjs','preview/stabilisation/browser-proof.mjs','preview/stabilisation/prepare.mjs','preview/stabilisation/provision.mjs','preview/stabilisation/verify-public.mjs','preview/stabilisation/worker.mjs','public-continuity.mjs','public-navigation-policy.mjs','public-shell-contract.mjs','tests/public-shell-contract.test.mjs','work/staging/worker.mjs','worker-entry-v6.js'}
              assert {x['path'] for x in changes}==allowed
              prepared=[]
              for change in changes:
                  p=root/change['path'];old=p.read_text() if p.exists() else ''
                  assert digest(old)==change['oldSha256'],'Source baseline differs: '+str(p)
                  tokens=re.findall(r'\w+|\W',old)
                  for i,j,replacement in reversed(change['edits']):tokens[i:j]=[replacement]
                  new=''.join(tokens)
                  assert digest(new)==change['newSha256'],'New source checksum failed: '+str(p)
                  prepared.append((p,new))
              for p,text in prepared:p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              marker.write_text(json.dumps({'base':'e64cbf56032efc7fe727cb52b5832530e632824d','manifestSha256':hashlib.sha256(raw).hexdigest(),'files':[{'path':c['path'],'sha256':c['newSha256']} for c in changes]},indent=2))
              for p in (root/'preview/stabilisation').glob('transport-*.txt'):p.unlink()
              print('Applied all 22 source changes after validating every before/after checksum. No deployment.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Regenerate reviewed Life Back assets and commit only the isolated preview branch
        run: |
          set -euo pipefail
          node member-experience/prepare-life-back.mjs
          test "$(git branch --show-current)" = preview/stabilisation-life-back-20260917
          git config user.name 'SHIFT preview verification'
          git config user.email 'it@shiftsometimber.co.uk'
          git add frontend/member/member-my-timber-problem-v1.js member-experience preview/stabilisation public-continuity.mjs public-navigation-policy.mjs public-shell-contract.mjs tests/public-shell-contract.test.mjs work/staging/worker.mjs worker-entry-v6.js
          if ! git diff --cached --quiet; then
            git commit -m 'Implement connected Life Back and public shell reconciliation in isolated preview only'
            git push origin HEAD:refs/heads/preview/stabilisation-life-back-20260917
          fi
          echo "PREVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require preview credential only; never fall back to production
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Unit and regression evidence before any preview provisioning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/staging/generated/review-evidence
          node --test --test-reporter=tap member-experience/tests/*.test.mjs member-experience/staging/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs tests/public-ticker-*.test.mjs tests/public-continuity.test.mjs tests/adaptive-treatment-integrity.test.mjs tests/my-timber-analytics-privacy.test.mjs tests/schema-readiness.test.mjs tests/scheduled-intelligence-delivery.test.mjs tests/fit-reminders-delivery.test.mjs 2>&1 | tee work/staging/generated/review-evidence/unit-regression.tap
      - name: Prepare fictional accounts and read-only public capture
        run: node preview/stabilisation/prepare.mjs
      - name: Prove public content preservation, shared navigation and exact sitemap change
        run: node preview/stabilisation/verify-public.mjs
      - name: Provision only two separately named preview databases
        run: node preview/stabilisation/provision.mjs
      - name: Deploy only the isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const c=JSON.parse(fs.readFileSync('work/staging/generated/config.json'));
          assert.equal(c.name,'shift-stabilisation-preview');assert.equal(c.vars.SHIFT_ENVIRONMENT,'stabilisation-preview-20260917');
          assert(!c.routes&&!c.route&&!c.triggers&&!c.send_email&&!c.ai);assert.equal(c.workers_dev,true);
          assert.deepEqual(c.d1_databases.map(d=>d.database_name).sort(),['shift-stabilisation-preview-auth-20260917','shift-stabilisation-preview-data-20260917']);
          for(const d of c.d1_databases)assert(!fs.readFileSync('wrangler.jsonc','utf8').includes(d.database_id));
          NODE
          if ! node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json > "$RUNNER_TEMP/shift-preview-deploy.txt" 2>&1; then tail -n 70 "$RUNNER_TEMP/shift-preview-deploy.txt"; exit 1; fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const log=fs.readFileSync(process.env.RUNNER_TEMP+'/shift-preview-deploy.txt','utf8');
          const match=log.match(/https:\/\/shift-stabilisation-preview\.[a-z0-9-]+\.workers\.dev/);if(!match)throw Error('Isolated preview URL not returned');
          fs.appendFileSync(process.env.GITHUB_ENV,'PREVIEW_URL='+match[0]+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'PREVIEW ONLY: '+match[0]+'/__review\nSource: '+process.env.PREVIEW_SOURCE_SHA+'\nNo main merge, live routes, production data, email or payment changes.\n');
          fs.writeFileSync('work/staging/generated/review-evidence/deployment.json',JSON.stringify({previewOnly:true,url:match[0],source:process.env.PREVIEW_SOURCE_SHA,productionWrites:0},null,2));
          NODE
      - name: Install Chromium and WebKit for desktop and phone proof
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Prove the complete remote member loop and isolation
        run: node preview/stabilisation/browser-proof.mjs
      - name: Upload non-secret proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stabilisation-life-back-preview-evidence
          retention-days: 14
          path: |
            work/staging/generated/public-proof.json
            work/staging/generated/public-summary.json
            work/staging/generated/review-evidence/**
          if-no-files-found: warn
