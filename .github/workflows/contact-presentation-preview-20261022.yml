name: Preview Contact presentation
on:
  push:
    branches: [preview/contact-presentation-20261022]
    paths: [previews/contact-presentation/**, .github/workflows/contact-presentation-preview-20261022.yml]
permissions:
  contents: read
concurrency:
  group: contact-presentation-preview-20261022
  cancel-in-progress: true
jobs:
  preview-and-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: previews/contact-presentation
      - name: Trust this checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build scoped style and check source
        run: |
          node previews/contact-presentation/build.cjs
          git diff --exit-code -- previews/contact-presentation/style.mjs
          node --check previews/contact-presentation/worker.mjs
          node --check previews/contact-presentation/deploy-preview.mjs
          node --check previews/contact-presentation/check-browser.cjs
      - name: Match the browser client
        run: npm install --prefix "$RUNNER_TEMP/contact-browser" playwright@1.58.2 --no-audit --no-fund
      - name: Stage Contact preview with copy and form preserved
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/contact-presentation/deploy-preview.mjs
      - name: Check desktop, mobile, Safari engine, form structure and enquiry routing
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/contact-browser/node_modules/playwright
        run: node previews/contact-presentation/check-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-preview-${{ github.sha }}
          path: contact-presentation-preview-evidence/
          retention-days: 90
