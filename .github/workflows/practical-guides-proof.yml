name: Practical SEO guides isolated runtime proof
on:
  pull_request:
    paths:
      - public-practical-guides.mjs
      - public-seo-closeout.mjs
      - tests/practical-guides.test.mjs
      - scripts/verify-practical-guides*.mjs
      - .github/workflows/practical-guides-proof.yml
  push:
    branches: ['seo/practical-guides-live-20261006']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts
      - name: Require the exact isolated runtime scope
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'public-practical-guides.mjs','public-seo-closeout.mjs','tests/practical-guides.test.mjs','scripts/verify-practical-guides.mjs','scripts/verify-practical-guides-handler.mjs','.github/workflows/practical-guides-proof.yml','docs/seo/2026-10-06-practical-guides.md'}
          import os
          tablet=os.environ.get('GITHUB_HEAD_REF') == 'codex/tablet-guidance-20261006'
          baseline='4460ea56f931da4003ace68d5d404831c47e08f7' if tablet else '15194faf31d710f1fc5f31036af149d5925d3998'
          if tablet:
            allowed={'public-practical-guides.mjs','tests/practical-guides.test.mjs','scripts/verify-practical-guides.mjs','scripts/verify-practical-guides-handler.mjs','.github/workflows/practical-guides-proof.yml','release/seo-follow-through-scope.mjs','release/six-topic-seo-scope.mjs','tests/seo-follow-through-release.test.mjs','docs/seo/2026-10-06-practical-guides.md','shift-coach/worker.mjs','tests/approved-ranking-release.test.mjs','tests/production-completion-release.test.mjs','shift-coach/release-manifest.json'}
          usefulness=os.environ.get('GITHUB_HEAD_REF') == 'codex/tablet-usefulness-review-20261006'
          if usefulness:
            baseline='7befa850f2a77a38bfd08637184a1952fdf92483'
            allowed={'release/seo-follow-through-scope.mjs', 'shift-coach/release-manifest.json', 'scripts/verify-practical-guides.mjs', 'tests/seo-follow-through-release.test.mjs', 'tests/tablet-routine.test.mjs', 'shift-coach/recover-cancelled-release.mjs', 'release/fit-300-scope.mjs', 'shift-coach/release-contract.mjs', 'member-experience/tablet-routine-client.mjs', 'tests/tablet-routine-browser.mjs', 'scripts/verify-practical-guides-handler.mjs', 'member-experience/tablet-routine.mjs', 'public-practical-guides.mjs', 'release/growth-adopt-deployment.mjs', 'shift-coach/cancelled-release-recovery.mjs', '.github/workflows/practical-guides-proof.yml', 'shift-coach/cancelled-release-recovery.test.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          assert changed == allowed, changed
          protected=['wrangler.jsonc','frontend/member','medicines-watch']+([] if usefulness else ['member-experience'])
          assert subprocess.check_output(['git','diff',baseline,'HEAD','--',*protected]).decode() == ''
          open('/tmp/practical-baseline-ref','w').write(baseline)
          PY
      - name: Rebuild existing recipe test fixtures without production access
        run: |
          node grub-expansion-review-pack.mjs > /tmp/grub-fixture-build.log
          node scripts/verify-grub-closeout-reviews.mjs
      - name: Run the existing production unit-test groups and new content tests
        run: |
          mkdir -p practical-guides-proof
          python3 - <<'PY'
          from pathlib import Path
          commands=[l.strip().removeprefix('run: ') for l in Path('.github/workflows/cloudflare-production-promote.yml').read_text().splitlines() if 'node --test ' in l]
          assert len(commands)==28
          Path('/tmp/practical-unit-groups.sh').write_text('set -eu\n'+'\n'.join(commands)+'\nnode --test tests/practical-guides.test.mjs\n')
          PY
          bash /tmp/practical-unit-groups.sh > practical-guides-proof/unit-tests.log 2>&1
      - name: Compare full handlers with the actual deployed source
        run: |
          git worktree add --detach /tmp/practical-baseline "$(cat /tmp/practical-baseline-ref)"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/practical-baseline/node_modules
          TABLET_USEFULNESS_PROOF=1 BASELINE_WORKER=/tmp/practical-baseline/shift-coach/worker.mjs node scripts/verify-practical-guides-handler.mjs
      - name: Verify tablet routine in the full browser
        run: |
          npm install --prefix "$RUNNER_TEMP/tablet-qa" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/tablet-qa/node_modules/.bin/playwright" install --with-deps chromium
          node --test tests/tablet-routine.test.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/tablet-qa/node_modules/playwright" node tests/tablet-routine-browser.mjs
      - name: Verify current destinations and candidate documents
        run: BASELINE_GUIDES=/tmp/practical-baseline/public-practical-guides.mjs node scripts/verify-practical-guides.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-guides-proof-${{ github.sha }}
          path: practical-guides-proof/
          retention-days: 30
