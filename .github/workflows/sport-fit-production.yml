name: Sport and Fit Production Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'frontend/member/member-sport-v1.js'
      - 'frontend/member/member-sport-v1.css'
      - 'frontend/member/member-life-back-v1.js'
      - 'frontend/member/member-life-back-v1.css'
      - 'frontend/member/member-medicines-watch-v1.js'
      - 'frontend/member/member-medicines-watch-v1.css'
      - 'frontend/member/member-product-v33d.js'
      - 'frontend/member/member-shell-v33g.js'
      - 'frontend/member/api-adapter-v33d.js'
      - 'worker-entry-v6.js'
      - 'wrangler.jsonc'
      - 'sport-fit-production.mjs'
      - '.github/workflows/sport-fit-production.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire short-lived commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - run: sleep 20
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Run complete visible member journey on desktop and mobile
        env:
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
        run: node sport-fit-production.mjs
      - name: Retain sanitised evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sport-fit-production-evidence
          path: sport-fit-production-evidence
          if-no-files-found: error
          retention-days: 30
