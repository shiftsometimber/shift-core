name: Knowledge health approved release
on:
  push:
    branches: [work/knowledge-health-expansion-20261029]
    paths: ['knowledge-health/**/*.mjs', '.github/workflows/knowledge-health-expansion.yml']
  pull_request:
    paths: ['knowledge-health/**', 'ask-timber-v1.js', 'shift-coach/worker.mjs', '.github/workflows/knowledge-health-expansion.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test knowledge-health/knowledge-health.test.mjs knowledge-health/release.test.mjs tests/ask-timber-public.test.mjs tests/ask-timber-cors-v1.test.mjs ask-timber-multi-intent-gate.mjs tests/ai-site-knowledge.test.mjs tests/ai-connected*.test.mjs
      - run: npx wrangler deploy --dry-run --outdir /tmp/knowledge-health-compiled
        env:
          WRANGLER_SEND_METRICS: 'false'
  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-production-promote
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Stage, promote and verify the owner-approved Knowledge expansion
        run: node knowledge-health/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-health-release-${{ github.run_id }}
          path: knowledge-health-evidence/*.json
          retention-days: 90
