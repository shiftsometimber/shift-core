name: Knowledge health expansion checks
on:
  pull_request:
    paths: ['knowledge-health/**', 'ask-timber-v1.js', 'shift-coach/worker.mjs', '.github/workflows/knowledge-health-expansion.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test knowledge-health/knowledge-health.test.mjs tests/ask-timber-public.test.mjs tests/ask-timber-cors-v1.test.mjs ask-timber-multi-intent-gate.mjs tests/ai-site-knowledge.test.mjs tests/ai-connected*.test.mjs
      - run: npx wrangler deploy --dry-run --outdir /tmp/knowledge-health-compiled
        env:
          WRANGLER_SEND_METRICS: 'false'
