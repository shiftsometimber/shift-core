name: Reconcile G5-012 Board
# Installed-workflow trigger: no product or threshold change.
on:
  push:
    branches: ['main']
    paths:
      - 'reconcile-g5-012-board.mjs'
      - '.github/workflows/reconcile-g5-012-board.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reconcile authoritative commissioning state
        run: node reconcile-g5-012-board.mjs
      - name: Prove 57-row crosswalk remains exact
        run: node finish-line-gate.mjs
      - name: Commit reconciled matrix and ledger
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/LAUNCH-FINISH-LINE.md docs/COMMISSIONING-EVIDENCE.md docs/V1-RELEASE-BLOCKER-BOARD-V2.md docs/V1-RELEASE-BLOCKER-COUNTS.txt finish-line-gate.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconcile G5-012 to 37 PASS / 17 AMBER and A=15'
          git push origin HEAD:main
