name: Continuity Live Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/continuity-live-acceptance.yml'
      - 'member-experience/verify-production-member.mjs'
permissions:
  contents: read
concurrency:
  group: continuity-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Select and retain the source that is currently eligible for live verification
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p live-acceptance/source
          git rev-parse HEAD > live-acceptance/candidate-head.txt
          git diff --name-only "$PR_BASE_SHA" HEAD -- frontend/member/ member-experience/ my-journey-v1.js public-shell-contract.mjs worker-entry-v6.js scripts/ ':!member-experience/verify-production-member.mjs' > live-acceptance/application-changes.txt
          git diff "$PR_BASE_SHA" HEAD -- member-experience/verify-production-member.mjs > live-acceptance/verifier.patch
          if [ -s live-acceptance/application-changes.txt ]; then
            # An undeployed application candidate cannot match production bytes.
            # Prove the live base here; hosted staging proves the candidate and
            # Production Promote runs its exact verifier after deployment.
            git checkout --detach "$PR_BASE_SHA"
            echo 'Live base verified; application candidate requires isolated staging and post-deploy exact verification.' > live-acceptance/scope.txt
          else
            git diff --exit-code "$PR_BASE_SHA" -- frontend/member/ member-experience/ my-journey-v1.js public-shell-contract.mjs worker-entry-v6.js scripts/ ':!member-experience/verify-production-member.mjs'
            echo 'Verifier-only candidate; application bytes match the PR base.' > live-acceptance/scope.txt
          fi
          git rev-parse HEAD > live-acceptance/checked-head.txt
          cp member-experience/verify-production-member.mjs scripts/verify-public-audit-live.mjs live-acceptance/source/
      - name: Independently verify exact assets and live routes
        if: always()
        run: |
          mkdir -p live-acceptance
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {legacyAuthorityRedirects,relatedGuideGroups} from './public-shell-contract.mjs';
          const origin='https://shiftsometimber.co.uk',hash=b=>createHash('sha256').update(b).digest('hex');
          const proof={checkedAt:new Date().toISOString(),release:readFileSync('live-acceptance/checked-head.txt','utf8').trim(),checks:[]};
          const get=(path,options={})=>fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(30000),cache:'no-store',...options});
          const check=async(name,fn)=>{try{proof.checks.push({name,pass:true,...await fn()})}catch(e){proof.checks.push({name,pass:false,error:e.message})}};
          for(const name of ['api-adapter-v33d.js','member-shell-v33g.js','member-my-journey-v1.js'])for(const fresh of [false,true])await check((fresh?'Fresh ':'Ordinary ')+name,async()=>{const expected=readFileSync('frontend/member/'+name),r=await get('/'+name+(fresh?'?verify='+Date.now():'')),actual=Buffer.from(await r.arrayBuffer());writeFileSync('live-acceptance/'+(fresh?'fresh-':'plain-')+name,actual);writeFileSync('live-acceptance/source-'+name,expected);assert.equal(r.status,200);assert.match(r.headers.get('content-type')||'',/javascript|ecmascript/);assert.ok(actual.equals(expected),'Exact source bytes differ');return {status:r.status,sha256:hash(actual),expectedSha256:hash(expected)}});
          for(const [from,to] of Object.entries(legacyAuthorityRedirects))for(const method of ['GET','HEAD'])await check(method+' '+from,async()=>{const r=await get(from+'?source=release-proof',{method});assert.equal(r.status,301);assert.equal(r.headers.get('location'),origin+to+'?source=release-proof');return {status:r.status,location:r.headers.get('location')}});
          for(const path of ['/treatment-centre','/mens-weight-management','/weight-loss-injections-for-men'])await check('Contextual links '+path,async()=>{const r=await get(path),html=await r.text();assert.equal(r.status,200);const block=html.match(/<section\b[^>]*\bdata-shift-link-repair[^>]*>[\s\S]*?<\/section>/i)?.[0];assert.ok(block,'Missing contextual section');const links=relatedGuideGroups[path].flatMap(g=>g.links.map(x=>x.path));for(const link of links)assert.ok(block.includes('href="'+link+'"'),link);return {status:r.status,links}});
          await check('Sitemap destinations, duplicates and retired routes',async()=>{const r=await get('/sitemap.xml'),xml=await r.text();assert.equal(r.status,200);const urls=[...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map(m=>m[1]);assert.ok(urls.length);assert.equal(urls.length,new Set(urls).size);for(const from of Object.keys(legacyAuthorityRedirects))assert.ok(!urls.includes(origin+from),'Redirect source '+from);for(const path of ['/shift-health','/shift-health/health-mot','/programme','/treatment-centre','/comparisons/surgery/gastric-band-vs-sleeve'])assert.ok(urls.includes(origin+path),'Missing '+path);return {status:r.status,urlCount:urls.length,mentalHealthCount:urls.filter(x=>x.startsWith(origin+'/mental-health/')).length}});
          for(const path of ['/member/dashboard','/member/life-back','/member/grub','/member/fit'])await check('Private shell '+path,async()=>{const r=await get(path);assert.ok([200,301,302].includes(r.status));if(r.status===200){const text=await r.text();assert.ok(/noindex/i.test(r.headers.get('x-robots-tag')||'')||/<meta\b(?=[^>]*name=["']robots["'])(?=[^>]*content=["'][^"']*noindex)[^>]*>/i.test(text),'Missing noindex')}return {status:r.status}});
          for(const path of ['/v1/journey','/v1/life-back'])await check('Unauthenticated '+path,async()=>{const r=await get(path);assert.equal(r.status,401);return {status:r.status}});
          await check('Unauthenticated health priority write blocked',async()=>{const r=await get('/v1/health-passport/interest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:'health-mot'})});assert.equal(r.status,401);return {status:r.status}});
          proof.pass=proof.checks.every(x=>x.pass);writeFileSync('live-acceptance/independent-evidence.json',JSON.stringify(proof,null,2));console.log(JSON.stringify(proof,null,2));if(!proof.pass)process.exitCode=1;
          NODE
      - name: Exact rendered member delivery verifier
        if: always()
        run: |
          set -o pipefail
          node member-experience/verify-production-member.mjs 2>&1 | tee live-acceptance/member-verifier.log
      - name: Existing public audit verifier without modification
        if: always()
        run: |
          set -o pipefail
          node scripts/verify-public-audit-live.mjs 2>&1 | tee live-acceptance/public-verifier.log
      - name: Existing SEO closeout verifier without modification
        if: always()
        run: |
          set -o pipefail
          node scripts/verify-seo-closeout-live.mjs 2>&1 | tee live-acceptance/seo-verifier.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuity-live-${{ github.event.pull_request.head.sha }}
          path: |
            live-acceptance/
            member-live-proof.json
            public-audit-live.json
            seo-closeout-live-proof.json
