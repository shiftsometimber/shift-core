name: Act2B Live Serving Closeout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Route Programme through canonical raw HTML authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          w=Path('worker-entry-v6.js')
          s=w.read_text()
          handler='''    if (\n      (request.method === "GET" || request.method === "HEAD") &&\n      (path === "/programme" || path === "/programme.html")\n    ) {\n      return rewritePublicLoungeChrome(await act2bPagesContent(request));\n    }\n'''
          anchor='''    if (\n      (request.method === "GET" || request.method === "HEAD") &&\n      (path === "/shift-health" || path === "/shift-health.html")\n    ) {\n'''
          if '(path === "/programme" || path === "/programme.html")' not in s:
              if anchor not in s: raise SystemExit('programme handler anchor missing')
              s=s.replace(anchor,handler+anchor,1)
          w.write_text(s)

          r=Path('wrangler.jsonc')
          c=r.read_text()
          routes='''    {\n      "pattern": "shiftsometimber.co.uk/programme*",\n      "zone_name": "shiftsometimber.co.uk",\n    },\n    {\n      "pattern": "www.shiftsometimber.co.uk/programme*",\n      "zone_name": "shiftsometimber.co.uk",\n    },\n'''
          if 'shiftsometimber.co.uk/programme*' not in c:
              marker='  "routes": [\n'
              if marker not in c: raise SystemExit('wrangler routes anchor missing')
              c=c.replace(marker,marker+routes,1)
          r.write_text(c)
          PY
          node --check worker-entry-v6.js
          grep -q 'path === "/programme"' worker-entry-v6.js
          grep -q 'shiftsometimber.co.uk/programme\*' wrangler.jsonc
      - name: Commit Programme route authority
        shell: bash
        run: |
          git config user.name 'shift-act2b-bot'
          git config user.email 'it@shiftsometimber.co.uk'
          git add worker-entry-v6.js wrangler.jsonc
          git diff --cached --quiet && exit 0
          git commit -m 'Act2B route Programme through canonical HTML authority'
          git push origin HEAD:main
