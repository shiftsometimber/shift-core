name: Act2B Live Serving Closeout
# The historical recovery has landed. Verify the checked-out source; never restore
# an old Worker or commit automatic rewrites over the approved production baseline.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/act2b-live-serving-closeout.yml
      - .github/workflows/act2b-route-origin-repair.yml
      - .github/workflows/p0-contact-menu-footer-audit.yml
      - tests/act2b-workflow-preservation.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify retained Worker authority
        shell: bash
        run: |
          set -euo pipefail
          node --check worker-entry-v6.js
          grep -q 'const GIT_MEMBER_ASSETS = new Map' worker-entry-v6.js
          grep -q 'const commissioningOidc' worker-entry-v6.js
          grep -q 'path === "/member/today"' worker-entry-v6.js
          grep -q 'const publicHost' worker-entry-v6.js
          grep -Fq '"pattern": "shiftsometimber.co.uk/*"' wrangler.jsonc
          grep -Fq '"pattern": "www.shiftsometimber.co.uk/*"' wrangler.jsonc
      - name: Verify member source contract without rewriting it
        run: node frontend-member-source-gate.mjs
      - name: Prevent obsolete workflows from rewriting the baseline
        run: node --test tests/act2b-workflow-preservation.test.mjs
      - name: Verify working tree is unchanged
        run: git diff --exit-code
