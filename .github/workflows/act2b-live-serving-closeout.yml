name: Act2B Live Serving Closeout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Canonicalise raw public HTML chrome and keep v42 neutralised
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          w=Path('worker-entry-v6.js')
          s=w.read_text()
          start=s.index('async function rewritePublicLoungeChrome(response) {')
          end=s.index('\nconst PUBLIC_CHROME_PATCH', start)
          fn=r'''async function rewritePublicLoungeChrome(response) {
            const type = String(response.headers.get("Content-Type") || "").toLowerCase();
            if (!response.ok || !type.includes("text/html")) return response;
            const source = await response.text();
            const nav = '<nav class="desktop-nav" aria-label="Primary"><a href="/start-here">Start Here</a><a href="/programme">The Programme</a><a href="/shift-health">SHIFT Health</a><a href="/explore-knowledge">Knowledge</a><a href="/about">About</a><a href="/member/dashboard">My Timber</a></nav>';
            const drawer = '<nav aria-label="Mobile primary"><a href="/start-here">Start Here</a><a href="/programme">The Programme</a><a href="/shift-health">SHIFT Health</a><a href="/explore-knowledge">Knowledge</a><a href="/about">About</a><a href="/member/dashboard">My Timber</a></nav>';
            let body = source
              .replaceAll('href="/tap-room"', 'href="/lounge"')
              .replaceAll('href="/tap-room.html"', 'href="/lounge"')
              .replaceAll(">The Tap Room<", ">The Lounge<")
              .replaceAll(">Tap Room<", ">The Lounge<")
              .replaceAll(">TAP ROOM<", ">THE LOUNGE<");
            body = body.replace(/<nav[^>]*class="[^"]*desktop-nav[^"]*"[^>]*>[\s\S]*?<\/nav>/i, nav);
            body = body.replace(/(<[^>]*class="[^"]*site-drawer[^"]*"[^>]*>[\s\S]*?)<nav[^>]*>[\s\S]*?<\/nav>/i, '$1'+drawer);
            const headers = new Headers(response.headers);
            headers.delete("Content-Length"); headers.delete("ETag"); headers.delete("Last-Modified");
            headers.set("Cache-Control", "no-store, must-revalidate");
            headers.set("X-Shift-HTML-Chrome", "act2b-canonical-v1");
            return new Response(body, { status: response.status, statusText: response.statusText, headers });
          }
          '''
          s=s[:start]+fn+s[end:]
          w.write_text(s)
          PY
          node --check worker-entry-v6.js
          grep -q 'act2b-canonical-v1' worker-entry-v6.js
          grep -q 'The Programme' worker-entry-v6.js
      - name: Commit canonical raw HTML fix
        shell: bash
        run: |
          git config user.name 'shift-act2b-bot'
          git config user.email 'it@shiftsometimber.co.uk'
          git add worker-entry-v6.js
          git diff --cached --quiet && exit 0
          git commit -m 'Act2B canonical raw HTML navigation'
          git push origin HEAD:main
