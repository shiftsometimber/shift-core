name: Publish approved Knowledge presentation
on:
  push:
    branches: [release/knowledge-presentation-20261022]
    paths: [previews/knowledge-presentation/**, .github/workflows/knowledge-presentation-live-20261022.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: knowledge-presentation-live-20261022
  cancel-in-progress: true
jobs:
  publish-and-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      KNOWLEDGE_EVIDENCE_DIR: knowledge-presentation-live-evidence
      KNOWLEDGE_RELEASE: 20261022-knowledge-live-v1
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            previews/knowledge-presentation
            previews/about-presentation
          fetch-depth: 4
      - name: Trust this checkout inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Capture the current published index once
        run: node --input-type=module -e "import{writeFileSync}from'node:fs';const r=await fetch('https://shiftsometimber.co.uk/explore-knowledge',{signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('Could not read Knowledge');writeFileSync('previews/knowledge-presentation/source-fixture.html',await r.text())"
      - name: Verify approved source and production boundaries
        run: |
          node previews/knowledge-presentation/build.cjs
          git diff --exit-code -- previews/knowledge-presentation/style.mjs
          node --test previews/knowledge-presentation/test.mjs previews/knowledge-presentation/live-test.mjs
      - name: Match the browser client
        run: npm install --prefix "$RUNNER_TEMP/explore-knowledge-browser" playwright@1.58.2 --no-audit --no-fund
      - name: Stage approved Knowledge without changing public routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node previews/knowledge-presentation/deploy-live.mjs stage
      - name: Check hosted release before public activation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/explore-knowledge-browser/node_modules/playwright
          KNOWLEDGE_ORIGIN: https://shift-knowledge-presentation-20261022.matobrien.workers.dev
          KNOWLEDGE_CHECK_LINKS: '0'
        run: node previews/knowledge-presentation/check-live.cjs
      - name: Activate only the two Knowledge route families
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/knowledge-presentation/deploy-live.mjs activate
      - name: Verify the actual public Knowledge on mobile and desktop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/explore-knowledge-browser/node_modules/playwright
          KNOWLEDGE_ORIGIN: https://shiftsometimber.co.uk
        run: node previews/knowledge-presentation/check-live.cjs
      - name: Restore only this release's routes if acceptance fails
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/knowledge-presentation/deploy-live.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-presentation-live-${{ github.sha }}
          path: knowledge-presentation-live-evidence/
          retention-days: 90
