name: Article sitemap isolated preview
on:
  push:
    branches: [fix/article-sitemap-20260924]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Sitemap, publication and public SEO regression gates
        run: |
          mkdir -p article-sitemap-proof
          node --check worker-entry-v6.js
          node --test babylove/*.test.mjs tests/seo-release-integrity.test.mjs tests/public-seo-closeout.test.mjs tests/public-shell-contract.test.mjs tests/public-navigation-policy*.test.mjs
          npx wrangler deploy --dry-run --outdir article-sitemap-proof/compiled
      - name: Deploy read-only isolated preview
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: npx wrangler deploy --config preview/article-sitemap/wrangler.jsonc
      - name: Verify valid XML and exact live article subset including publication dates
        run: python3 scripts/article-sitemap/verify.py https://shift-article-sitemap-preview.matobrien.workers.dev
      - name: Record candidate and evidence checksums
        if: always()
        run: |
          mkdir -p article-sitemap-proof
          git rev-parse HEAD > article-sitemap-proof/commit.txt
          find article-sitemap-proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > article-sitemap-proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-sitemap-preview-${{ github.sha }}
          path: article-sitemap-proof/
