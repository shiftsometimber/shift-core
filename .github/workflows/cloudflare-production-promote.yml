name: Cloudflare Production Promote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-production-promote.yml'
      - 'wrangler.jsonc'
      - 'worker-entry-v6.js'
      - 'worker.js'
      - 'ask-timber-v1.js'
      - 'ask-timber-multi-intent-gate.mjs'
      - 'commerce-stripe-v1.js'
      - 'migrations/**'
      - 'shift-me-3d-proof-v1.js'
      - 'public/shift-me-3d/**'
      - 'frontend/member/assets/fit/premium/**'
      - 'fit-reminders-v1.js'
      - 'daily-reminder-copy-v1.js'
      - 'fit-reminders-source-gate.mjs'
      - 'frontend/member/member-fit.html'
      - 'frontend/member/member-fit-programme-v1.js'
      - 'frontend/member/member-fit-programme-v1.css'
      - 'frontend/member/member-grub-programme-v1.js'
      - 'frontend/member/member-grub-programme-v1.css'
      - 'member-daily-v3.js'
      - 'shift-fit-uk-programme-gate.mjs'
      - 'frontend/member/shift-push-sw-v1.js'
      - 'package.json'
      - 'package-lock.json'
      - 'structured-content-v1.js'
      - 'member-product-v7.js'
      - 'member-product-v8.js'
      - 'daily-shift-frontdoor-gate.mjs'
      - 'my-timber-75-green-gate.mjs'
      - 'my-timber-final-source-gate.mjs'
      - 'my-timber-final-production.mjs'
      - '.github/workflows/my-timber-final-production.yml'
      - 'member-quality-v1.js'
      - 'commissioning-identity-v1.js'
      - 'commissioning-ops-v1.js'
      - 'shift-me-v1.js'
      - 'frontend/member/shift-me-api-v1.js'
      - 'frontend/member/member-shift-me-premium-v1.js'
      - 'frontend/member/member-shift-me-premium-v1.css'
      - 'frontend/member/member-product-v33d.js'
      - 'frontend/member/api-adapter-v33d.js'
      - 'frontend/member/member-shell-v33g.js'
      - 'frontend/member/member-progress-v1.js'
      - 'frontend/member/member-p0-v1.css'
      - 'frontend/member/member-today-premium-v1.js'
      - 'frontend/member/member-my-timber-problem-v1.js'
      - 'frontend/member/my-timber-preview.html'
      - 'my-timber-navigation-gate.mjs'
      - 'member-login-fastpath-v1.js'
      - 'member-register-fastpath-v2.js'
      - 'member-state-fast-v1.js'
      - 'auth-email-verification-v1.js'
      - 'g5-012-login-fastpath-gate.mjs'
      - 'frontend/member/member-today-premium-v1.css'
      - 'frontend/member/member-today-final-v1.css'
      - 'frontend/member/member-life-back-v1.js'
      - 'frontend/member/member-life-back-v1.css'
      - 'frontend/member/member-medicines-watch-v1.js'
      - 'frontend/member/member-medicines-watch-v1.css'
      - 'frontend/member/member-sport-v1.js'
      - 'frontend/member/member-sport-v1.css'
      - 'radar-public-v1.js'
      - 'radar-medicine-seed-v1.js'
      - 'sport-clubhouse-v1.js'
      - 'personal-platform-v1.js'
      - 'fit-canonical-guidance-v1.mjs'
      - 'final-v1-production-serving.mjs'
      - 'final-v1-worker-publication-payload.mjs'
      - 'finish-line-gate.mjs'
      - 'reconcile-final-v1-gate2-board.mjs'
      - 'reconcile-final-v1-recovery-pointers.mjs'
      - '.github/workflows/final-v1-production-publication.yml'
  # Repository changes made through the connected GitHub integration do not
  # emit a normal push event. A merged same-repository PR is therefore also a
  # governed production promotion signal; the job still checks current main.
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROMOTE_CURRENT_MAIN to deploy current main to production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository) || inputs.confirm == 'PROMOTE_CURRENT_MAIN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Fail closed when deploy credential is absent
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret is not configured'; exit 1; }
      - name: Install exact Wrangler toolchain
        run: npm install --no-audit --no-fund
      - name: Prove Daily Shift is a fluid one-thumb front door
        run: node daily-shift-frontdoor-gate.mjs
      - name: Prove My Timber has reached the 75 percent all-green bar
        run: node my-timber-75-green-gate.mjs
      - name: Prove the My Timber production candidate is complete
        run: node my-timber-final-source-gate.mjs
      - name: Prove signed-in members can reach the site and Tap Room
        run: node my-timber-navigation-gate.mjs
      - name: Prove persistent member login remains secure
        run: node g5-012-login-fastpath-gate.mjs
      - name: Prove Ask Timber handles every explicit request part
        run: node --test ask-timber-multi-intent-gate.mjs
      - name: Deploy current main to production
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Wait briefly for route propagation
        run: sleep 10
      - name: Prove newer restricted routes are on live traffic
        shell: bash
        run: |
          set -euo pipefail
          for path in /v1/shift-me/render /v1/commissioning/product-events; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' "https://api.shiftsometimber.co.uk${path}" || true)
            echo "$path -> HTTP $code"
            cat /tmp/resp || true
            echo
            if [ "$code" = "404" ]; then
              echo "Route still missing after explicit deploy: $path"
              exit 1
            fi
          done
          code=$(curl -sS -X POST -H 'content-type: application/json' -d '{}' -o /tmp/resp -w '%{http_code}' 'https://api.shiftsometimber.co.uk/v1/commissioning/final-v1-publication' || true)
          echo "/v1/commissioning/final-v1-publication [POST] -> HTTP $code"
          cat /tmp/resp || true
          echo
          if [ "$code" = "404" ]; then
            echo 'POST-only final publication route still missing after explicit deploy'
            exit 1
          fi
          echo 'Explicit production promotion reached the newer route graph.'
      - name: Prove Shift Me premium static assets are actually published
        shell: bash
        run: |
          set -euo pipefail
          js_type=$(curl -sSI 'https://shiftsometimber.co.uk/member-shift-me-premium-v1.js?v=1' | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2);exit}')
          css_type=$(curl -sSI 'https://shiftsometimber.co.uk/member-shift-me-premium-v1.css?v=1' | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2);exit}')
          echo "Shift Me JS content-type: $js_type"
          echo "Shift Me CSS content-type: $css_type"
          [[ "$js_type" == *javascript* ]] || { echo 'Shift Me JS is not published with JavaScript MIME'; exit 1; }
          [[ "$css_type" == text/css* ]] || { echo 'Shift Me CSS is not published with CSS MIME'; exit 1; }
          echo 'Shift Me premium static assets are published with correct MIME types.'
