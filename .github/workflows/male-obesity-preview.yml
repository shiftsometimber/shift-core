name: Male obesity read-only preview
on:
  push:
    branches: [review/obesity-awareness-20261009]
permissions:
  contents: read
  actions: read
concurrency:
  group: male-obesity-readonly-preview
  cancel-in-progress: false
jobs:
  rendered-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SOURCE: 78c515b7c49bcf309941a53c2f87c6e94e76d6b7
      RELEASE_RUN: '38004309288'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require the exact successful guarded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const r=await fetch('https://api.github.com/repos/shiftsometimber/shift-core/actions/runs/'+process.env.RELEASE_RUN,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN}});
          assert(r.ok);const run=await r.json();
          assert.equal(run.head_sha,process.env.RELEASE_SOURCE);assert.equal(run.head_branch,'main');assert.equal(run.path,'.github/workflows/cloudflare-production-promote.yml');assert.equal(run.conclusion,'success');
          JS
      - name: Prepare the existing public browser test environment
        run: |
          npm install --prefix "$RUNNER_TEMP/pillar-tools" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pillar-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify the released public journey and consented collector without deployment
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/pillar-tools/node_modules/playwright" node obesity-awareness/rendered-live-proof.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: male-obesity-rendered-live-38004309288
          path: male-obesity-rendered-live/
