name: Food entry and password recovery preview
on:
  push:
    branches: [fix/food-entry-20260921]
permissions:
  contents: read
concurrency:
  group: stabilisation-life-back-preview-only
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      PREVIEW_SOURCE_SHA: ${{ github.sha }}
      PREVIEW_URL: https://shift-stabilisation-preview.matobrien.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Verify exact source, catalogue import, constraints and account regressions
        run: |
          node scripts/b1-release-scope.mjs
          node --test tests/b1-release-scope.test.mjs tests/catalogue-publication-d1-import.test.mjs tests/nutrition-mytimber.test.mjs member-experience/tests/*.test.mjs tests/ask-timber-public.test.mjs tests/member-auth-regression.test.mjs
      - name: Prepare current source and exact authorised recipes in isolated fixtures
        run: node preview/stabilisation/prepare.mjs
      - name: Provision only named fictional-account databases
        run: node preview/five-points/provision.mjs
      - name: Deploy isolated candidate
        run: npx wrangler deploy --config work/staging/generated/config.json
      - name: Install desktop and phone browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Check ingredient suggestions and both password recovery entrances
        run: node preview/food-entry/browser-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: food-entry-${{ github.sha }}
          path: work/staging/generated/five-points-evidence/food-entry/
          retention-days: 14
