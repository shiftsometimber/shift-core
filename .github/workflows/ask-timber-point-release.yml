name: Ask Timber serving-version inspection
on:
  push:
    branches: ['fix/ask-timber-live-patch-20261031']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '9e5386dcf455be34c582d93f8bfc79e6'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Read serving version and modules without mutation
        run: node release/ask-timber-point-release/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ask-timber-serving-inspection-${{ github.sha }}
          path: evidence/ask-timber-point-release/
          retention-days: 7
