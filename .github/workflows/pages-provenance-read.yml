name: Read current Pages provenance
on:
  push:
    branches: [fix/audit-21sep]
    paths: ['.github/workflows/pages-provenance-read.yml']
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'shiftsometimber/shift-core' && github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Read only the current project metadata using existing release access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {mkdirSync,writeFileSync,readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const report={at:new Date().toISOString(),candidate:process.env.GITHUB_SHA,project:'projectshift',credential:'existing_release_credential',productionWrites:0};
          try {
            if(!process.env.CLOUDFLARE_API_TOKEN) throw Error('missing credential');
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/9e5386dcf455be34c582d93f8bfc79e6/pages/projects/projectshift',{
              method:'GET',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}
            });
            report.httpStatus=r.status;
            const data=await r.json();
            if(!r.ok||!data.success){report.available=false;report.errorCodes=(data.errors||[]).map(e=>e.code);report.reason='Existing release access cannot read Pages project metadata.'}
            else {
              const p=data.result,d=p.canonical_deployment,s=p.source?.config;
              report.available=Boolean(d?.id);
              report.deployment=d?{id:d.id,url:d.url,environment:d.environment,createdOn:d.created_on,commit:d.deployment_trigger?.metadata?.commit_hash,branch:d.deployment_trigger?.metadata?.branch,trigger:d.deployment_trigger?.type,status:d.latest_stage?.status}:null;
              report.source=s?{type:p.source.type,owner:s.owner,repo:s.repo_name,productionBranch:s.production_branch}:{type:'unavailable',reason:'No connected source repository returned; the current approved upload artifact must be established.'};
              report.sameAsVerifiedPreviewBaseline=d?.url?.replace(/\/$/,'')==='https://95e283ac.projectshift.pages.dev';
              if(d?.id==='0da69833-83f7-4c70-9c7a-bceab7de1660'&&d.url==='https://0da69833.projectshift.pages.dev'&&d.deployment_trigger?.metadata?.commit_hash==='c733bf03834d93154a51a0db6ef05dbebb3c7cb3'){
                const sha=b=>createHash('sha256').update(b).digest('hex');
                const get=async path=>{const r=await fetch(d.url+'/'+path,{redirect:'follow',signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error('Source asset unavailable');return Buffer.from(await r.arrayBuffer())};
                const bytes=await get('DEPLOYMENT-FINGERPRINT.json'),fp=JSON.parse(bytes);
                if(fp.aggregate_sha256!=='1ec46ba5f5383cf02c5379cabc6ad20877a8dc6193abd8cc852b1ede43a9dcc0'||sha(fp.files.map(e=>`${e.sha256}  ${e.path}\n`).join(''))!==fp.aggregate_sha256)throw Error('Source fingerprint mismatch');
                const entries=new Map(fp.files.map(e=>[e.path,e]));
                const member=JSON.parse(readFileSync('member-experience/staging/pins.json')),work=JSON.parse(readFileSync('work/staging/pinned-assets.json'));
                if(!member.some(p=>p.path==='assets/header-navigation-v2.css'))member.push({path:'assets/header-navigation-v2.css'});
                const paths=[...new Set([...member.filter(p=>p.source!=='worker'),...work].map(p=>p.path))];
                const changes=[];let cursor=0;
                await Promise.all(Array.from({length:6},async()=>{while(cursor<paths.length){const path=paths[cursor++],expected=entries.get(path);if(!expected)throw Error('Missing manifest entry');const data=await get(path);if(sha(data)!==expected.sha256||data.length!==expected.bytes)throw Error('Source bytes mismatch');for(const pins of [member,work])for(const p of pins.filter(p=>p.path===path)){if(p.sha256!==expected.sha256)changes.push({path,before:p.sha256||null,after:expected.sha256});p.sha256=expected.sha256}}}));
                report.fingerprint={aggregate:fp.aggregate_sha256,manifestSha256:sha(bytes),fileCount:fp.file_count,previewAssetsVerified:paths.length};
                report.pinChanges=changes;report.updatedPins={member,work};
                mkdirSync('pages-provenance',{recursive:true});writeFileSync('pages-provenance/DEPLOYMENT-FINGERPRINT.json',bytes);
              }
            }
          } catch {report.available=false;report.reason='The read-only Pages metadata request could not complete.'}
          mkdirSync('pages-provenance',{recursive:true});
          writeFileSync('pages-provenance/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(!report.available) process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-provenance-${{ github.sha }}
          path: pages-provenance/
          retention-days: 30
