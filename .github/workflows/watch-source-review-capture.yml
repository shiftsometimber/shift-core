name: Capture Changed Access Source
on:
  push:
    branches: ['verify/passport-live-closeout-20260919']
    paths: ['.github/workflows/watch-source-review-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Capture two current responses using the unchanged source fingerprinting function
        run: |
          mkdir -p access-source-review
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {sources} from './medicines-watch/data.mjs';
          import {fingerprintSource} from './medicines-watch/monitor.mjs';
          const s=sources.find(x=>x.id==='wegovy-tablet-private');
          const report={source:s,checkedAt:new Date().toISOString(),automaticallyApproved:false,productionWrites:false,responses:[]};
          for(let i=0;i<2;i++){
            const r=await fetch(s.checkUrl,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200);assert.equal(new URL(r.url).hostname,'onlinedoctor.asda.com');
            const body=await r.text();assert.ok(Buffer.byteLength(body)<2*1024*1024);
            const result=await fingerprintSource(s,body,r.headers.get('content-type'));
            writeFileSync('access-source-review/source-'+i+'.html',body);
            report.responses.push({status:r.status,url:r.url,bodySha256:createHash('sha256').update(body).digest('hex'),...result});
          }
          assert.equal(report.responses[0].fingerprint,report.responses[1].fingerprint,'Source body is not stable enough to review');
          writeFileSync('access-source-review/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-source-review-${{ github.sha }}
          path: access-source-review/
          retention-days: 30
