name: Public ticker motion preview
on:
  push:
    branches: [fix/ticker-motion-20260917]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify motion controls, route exclusions and exact preservation
        run: node --test tests/public-navigation-policy.test.mjs tests/public-ticker-*.test.mjs tests/public-continuity.test.mjs tests/radar-published-ticker-v1.test.mjs tests/radar-newsroom-page-v1.test.mjs
      - name: Deploy read-only ticker preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: npx wrangler deploy --config preview/radar-ticker-recovery/wrangler.jsonc
      - name: Wait for route propagation
        run: sleep 10
      - name: Confirm the preview serves the new motion controls
        run: |
          curl --fail --silent --show-error https://shift-radar-ticker-preview.matobrien.workers.dev/treatment-centre > /tmp/ticker-page.html
          grep -q public-news-20260917-r4 /tmp/ticker-page.html
          curl --fail --silent --show-error https://shift-radar-ticker-preview.matobrien.workers.dev/assets/public-news-ticker-v1.js > /tmp/ticker-client.js
          grep -q 'Play news ticker' /tmp/ticker-client.js
