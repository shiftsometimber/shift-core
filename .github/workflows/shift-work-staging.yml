name: SHIFT for Work isolated hosted staging
on:
  push:
    branches: [feature/shift-for-work-20260912, feature/member-completion-20260912, preview/life-back-connected-20260915, feature/shift-ai-connected-20260915, feat/my-timber-master-live-20260916, fix/readiness-preservation-20260916, feat/member-shared-header-20260917, codex/profile-password-reset, codex/checkin-followup, codex/member-walk-fixes]
    paths:
      - 'work/staging/**'
      - 'worker.js'
      - 'scheduled-intelligence.js'
      - 'fit-reminders-v1.js'
      - 'tests/*delivery.test.mjs'
      - 'tests/pilot-monitor*.test.mjs'
      - 'tests/schema-readiness.test.mjs'
      - 'ask-timber-v1.js'
      - 'shift-brain-v1.js'
      - 'shift-ai-v6.js'
      - 'medicines-watch/**'
      - 'tests/ai-connected*.test.mjs'
      - 'member-experience/**'
      - 'frontend/member/member-my-timber-problem-v1.js'
      - 'frontend/member/member-product-v33d.js'
      - 'frontend/member/member-progress*.js'
      - 'frontend/member/member-plans-premium-v1.*'
      - 'member-product-v8.js'
      - 'my-journey*.js'
      - '.github/workflows/shift-work-staging.yml'
permissions:
  contents: read
concurrency:
  group: shift-work-hosted-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Require the existing preview credential — no fallback
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the recipe publication reader
        run: python -m pip install openpyxl==3.1.5
      - name: Test connected member journey
        run: |
          node --test tests/member-checkin-preflight.test.mjs
          node member-experience/prepare-life-back.mjs
          node --test member-experience/tests/*.test.mjs member-experience/staging/*.test.mjs medicines-watch/*.test.mjs tests/ai-connected*.test.mjs tests/adaptive-treatment-integrity.test.mjs tests/my-timber-analytics-privacy.test.mjs tests/schema-readiness.test.mjs tests/scheduled-intelligence-delivery.test.mjs tests/fit-reminders-delivery.test.mjs tests/pilot-monitor*.test.mjs
          node gate4-one-shift-brain-gate.mjs
          node ask-timber-multi-intent-gate.mjs
      - name: Verify pinned assets and prepare fictional fixtures
        run: node work/staging/prepare.mjs
      - name: Prepare real AI and read-only source checks in staging
        run: node work/staging/prepare-ai.mjs
      - name: Provision only separately named staging databases
        run: node work/staging/provision.mjs
      - name: Deploy only the isolated Worker
        shell: bash
        run: |
          set -euo pipefail
          if ! node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json > "$RUNNER_TEMP/work-staging-deploy.txt" 2>&1; then
            tail -n 60 "$RUNNER_TEMP/work-staging-deploy.txt"
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const log=fs.readFileSync(process.env.RUNNER_TEMP+'/work-staging-deploy.txt','utf8');
          const url=log.match(/https:\/\/shift-core-work-staging\.[a-z0-9-]+\.workers\.dev/);
          if(!url)throw Error('The isolated deployment URL was not returned');
          fs.appendFileSync(process.env.GITHUB_ENV,'WORK_STAGING_URL='+url[0]+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Fictional staging: '+url[0]+'\n');
          NODE
      - name: Install isolated member browser verifier
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify restored tools and preserve current Today at desktop and 390px
        run: node work/staging/member-tools-browser-proof.mjs
      - name: Verify shared member headers and banners at desktop and phone width
        run: node work/staging/member-chrome-browser-proof.mjs
      - name: Verify profile password reset controls with fictional requests only
        run: node work/staging/password-settings-browser-proof.mjs
      - name: Verify consented check-in save and next-step response on fictional accounts
        run: node work/staging/checkin-save-browser-proof.mjs
      - name: Prove reported member-walk repairs on desktop and mobile
        run: node work/staging/member-walk-browser-proof.mjs
      - name: Verify real remote persistence and access boundaries
        run: node work/staging/probe.mjs
      - name: Save non-secret verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shift-work-staging-evidence
          path: |
            work/staging/generated/probe-result.json
            work/staging/generated/ai-connected-proof.json
            work/staging/generated/watch-observations.sql.json
            work/staging/generated/current-tool-assets.json
            work/staging/generated/member-tools-proof/report.json
            work/staging/generated/member-tools-proof/*.png
            work/staging/generated/member-chrome-proof/report.json
            work/staging/generated/member-chrome-proof/*.png
            work/staging/generated/password-settings-proof/**
            work/staging/generated/member-walk-proof/
            work/staging/generated/checkin-save-proof/**
          if-no-files-found: error
