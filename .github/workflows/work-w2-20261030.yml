name: Approved SHIFT for Work W2
on:
  push:
    branches: [release/shift-for-work-w2-20261030]
    paths: ['work-w2-20261030/**', '.github/workflows/work-w2-20261030.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  work-w2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read current route owners
        if: contains(github.event.head_commit.message, '[work preflight]')
        run: node work-w2-20261030/capture.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check and release selected W2
        if: "!contains(github.event.head_commit.message, '[work preflight]')"
        run: |
          npm install --prefix work-w2-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node --check work-w2-20261030/runtime.mjs
          node --check work-w2-20261030/deploy.mjs
          node --test work-w2-20261030/*.test.mjs
          node work-w2-20261030/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLAYWRIGHT_CHANNEL: chrome
          WORK_W2_PREVIEW_ONLY: ${{ contains(github.event.head_commit.message, '[work preview]') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-w2-${{ github.run_id }}
          path: work-w2-evidence/
          retention-days: 90
