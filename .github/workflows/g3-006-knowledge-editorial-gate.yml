name: G3-006 Knowledge Editorial Gate
on:
  pull_request:
    paths:
      - 'knowledge-editorial-v1.js'
      - 'g3-006-knowledge-editorial-staging.mjs'
      - 'g3-006-knowledge-editorial-source-gate.mjs'
      - 'worker-entry-v6.js'
      - '.github/workflows/g3-006-knowledge-editorial-gate.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge-editorial-v1.js'
      - 'g3-006-knowledge-editorial-staging.mjs'
      - 'g3-006-knowledge-editorial-source-gate.mjs'
      - 'worker-entry-v6.js'
      - '.github/workflows/g3-006-knowledge-editorial-gate.yml'
jobs:
  governed-editorial-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Editorial source contract
        run: node g3-006-knowledge-editorial-source-gate.mjs
      - name: Authenticated retained-review editorial journey
        run: node g3-006-knowledge-editorial-staging.mjs
      - name: Syntax
        run: |
          node --check knowledge-editorial-v1.js
          node --check worker-entry-v6.js
          node --check g3-006-knowledge-editorial-staging.mjs
