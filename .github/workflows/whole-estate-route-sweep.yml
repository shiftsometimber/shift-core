name: Shift Whole-Estate Route Sweep
on:
  pull_request:
  push:
    branches: [main]
jobs:
  route-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify bounded whole-estate crawler scheduling and timeout rejection
        run: node --test tests/whole-estate-route-sweep.test.mjs
      - name: Whole-estate production routes, links and blank-page sweep
        env:
          SHIFT_SWEEP_MAX: '20000'
          SHIFT_SWEEP_CONCURRENCY: '12'
          SHIFT_SWEEP_TIMEOUT_MS: '30000'
        run: node gate1-whole-estate-production-sweep.mjs
      - name: Pre-merge member failure-envelope source contract
        if: github.event_name == 'pull_request'
        env:
          SHIFT_ERROR_CONTRACT_SOURCE_ONLY: '1'
        run: node gate1-production-error-contract.mjs
      - name: Wait for production Worker deployment propagation
        if: github.event_name == 'push'
        run: sleep 25
      - name: Deployed production member/HQ failure-contract sweep
        if: github.event_name == 'push'
        run: node gate1-production-error-contract.mjs
