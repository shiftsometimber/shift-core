name: September audit repair preview
on:
  push:
    branches: [fix/audit-21sep, fix/discovery-audit-21sep, fix/b1-member-recovery-21sep]
permissions:
  contents: read
concurrency:
  group: stabilisation-life-back-preview-only
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      PREVIEW_SOURCE_SHA: ${{ github.sha }}
      PREVIEW_URL: https://shift-stabilisation-preview.matobrien.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Member, consent, context and preservation regressions
        run: |
          node --test member-experience/tests/*.test.mjs member-experience/staging/*.test.mjs tests/ai-connected*.test.mjs tests/public-shell-contract.test.mjs tests/public-continuity.test.mjs tests/progress-summary-audit.test.mjs tests/progress-renderer-audit.test.mjs tests/rendered-member-acceptance-support.test.mjs
          node --test tests/discovery-repairs.test.mjs tests/pen-day-v1.test.mjs tests/my-timber-analytics-privacy.test.mjs tests/public-ticker-contrast-safety.test.mjs
          node my-timber-final-source-gate.mjs
          node daily-shift-frontdoor-gate.mjs
          node gate4-one-shift-brain-gate.mjs
      - name: B1 atomicity, ordinary authentication and recovery regressions
        run: |
          node --test tests/b1-reliability.test.mjs tests/b1-reset-page.test.mjs tests/member-auth-regression.test.mjs tests/turnstile-auth-v1.test.mjs tests/my-journey-health-interest-atomic.test.mjs health-passport/records.test.mjs activation-measurement/ordinary-auth.test.mjs
          node member-state-fast-source-gate.mjs
          node frontend-member-source-gate.mjs
          node auth-recovery-registration-gate.mjs
          node gate1-email-verification-e2e.mjs
          node g5-012-login-fastpath-gate.mjs
      - name: Read current Pages provenance without modifying production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node preview/audit-repair/source-proof.mjs
      - name: Prepare current source and read-only public pages
        run: node preview/stabilisation/prepare.mjs
      - name: Provision isolated fictional-account databases
        run: |
          node preview/five-points/provision.mjs
          npx wrangler d1 execute DB --remote --config work/staging/generated/config.json --file member-experience/checkin-followup.sql
      - name: Seed isolated audit reproductions
        run: node preview/audit-repair/fixtures.mjs
      - name: Prepare B1 isolated reset and email fixtures
        run: node preview/b1-repair/prepare.mjs
      - name: Deploy the single preview only
        run: npx wrangler deploy --config work/staging/generated/config.json
      - name: Install phone and desktop browser engines
        id: browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Verify B1 real D1 saves and rendered recovery in Chromium and WebKit
        run: node preview/b1-repair/browser-proof.mjs
      - name: Prove five-point journey with real saves in Chromium and WebKit
        run: node preview/five-points/browser-proof.mjs
      - name: Verify audited Progress and retained Fit in phone and desktop browsers
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node preview/audit-repair/browser-proof.mjs
      - name: Verify discovery repairs across desktop and phone browsers
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node preview/discovery-repair/browser-proof.mjs
      - name: Actual reset email and received-link password login
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node preview/b1-repair/email-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-repair-${{ github.sha }}
          path: work/staging/generated/five-points-evidence/
          retention-days: 14
