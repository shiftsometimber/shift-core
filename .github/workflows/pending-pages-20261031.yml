name: Approved FS1 PW2 MO3 TC2 pages
on:
  push:
    branches: [release/pending-pages-20261031]
    paths: ['pending-pages-20261031/**', '.github/workflows/pending-pages-20261031.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  selected-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read current owners and page structures
        if: contains(github.event.head_commit.message, '[pages preflight]')
        run: node pending-pages-20261031/capture.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check and release four selected page designs
        if: "!contains(github.event.head_commit.message, '[pages preflight]')"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix selected-pages-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node --check pending-pages-20261031/runtime.mjs
          node --check pending-pages-20261031/deploy.mjs
          node --test pending-pages-20261031/*.test.mjs
          node pending-pages-20261031/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELECTED_PAGES_PREVIEW_ONLY: ${{ contains(github.event.head_commit.message, '[pages preview]') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-pages-${{ github.run_id }}
          path: pending-pages-evidence/
          retention-days: 90
