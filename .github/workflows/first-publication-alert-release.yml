name: Release first-publication alert correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/first-publication-alert-release.yml]
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALERT_BASELINE_SOURCE: 21244beae16edaa9328f06b81f7ad649a8d844a8
      ALERT_BASELINE_VERSION: 22fcbc37-2f6d-4c7e-9f25-d607d92fb868
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact alert-only delta and current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$ALERT_BASELINE_SOURCE" HEAD
          python3 - <<'PY'
          import os,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['ALERT_BASELINE_SOURCE'],'HEAD'],text=True).splitlines())
          expected={'.github/workflows/first-publication-alert-release.yml','radar-live-email-v1.js','tests/radar-new-publication-email.test.mjs'}
          assert changed==expected,(changed,expected)
          pins={'radar-live-email-v1.js':'6a53f885b94ca6e6365f534bbd81a7b16cc93096','tests/radar-new-publication-email.test.mjs':'b0d8f145e9743358c10b4ccb3d991d549e9790ad'}
          for path,sha in pins.items():assert subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()==sha,path
          PY
      - name: Run alert regressions and retained build preservation checks
        run: |
          npm ci --no-audit --no-fund
          node --check radar-live-email-v1.js
          node --test tests/radar-new-publication-email.test.mjs tests/radar-live-email-v1.test.mjs tests/radar-live-email-redirect-v1.test.mjs
          node --test tests/canonical-runtime-build.test.mjs tests/independent-presentation-preservation.test.mjs
      - name: Capture and qualify the latest verified runtime
        id: capture
        run: |
          mkdir -p alert-release-proof b1-runtime-release
          npx wrangler deployments list --config wrangler.jsonc --json > deployment-before.json
          cp deployment-before.json alert-release-proof/
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {latestDeployment} from './release/runtime-rollback-guard.mjs';
          const before=latestDeployment(JSON.parse(readFileSync('deployment-before.json')));
          assert.equal(before.versions.length,1);
          assert.equal(before.versions[0].version_id,process.env.ALERT_BASELINE_VERSION,'Serving runtime changed; reconcile before upload');
          assert.equal(before.versions[0].percentage,100);
          const clean=s=>s.replace(/<script\b[^>]*\bsrc=["']https:\/\/static.cloudflareinsights.com[^"']*["'][\s\S]*?<\/script>/gi,'').replace(/<script\b[^>]*>[\s\S]*?window\.__CF\$cv\$params[\s\S]*?<\/script>/gi,'');
          const pages={};
          for(const path of ['/','/about','/member-login']){
            const r=await fetch('https://shiftsometimber.co.uk'+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path);pages[path]=createHash('sha256').update(clean(await r.text())).digest('hex');
          }
          writeFileSync('alert-release-proof/before.json',JSON.stringify(pages,null,2));
          JS
      - name: Promote the exact current source through the existing owned runtime helper
        id: publish
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node release/member-runtime-deploy.mjs
      - name: Verify provider selection, exact bundle and unchanged public pages
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > alert-release-proof/deployment-after.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {latestDeployment} from './release/runtime-rollback-guard.mjs';
          const receipt=JSON.parse(readFileSync('b1-runtime-release/owned-runtime-deployment.json')),active=latestDeployment(JSON.parse(readFileSync('alert-release-proof/deployment-after.json')));
          assert.equal(receipt.source,process.env.GITHUB_SHA);assert.equal(active.id,receipt.deploymentId);assert.equal(active.versions.length,1);assert.equal(active.versions[0].version_id,receipt.versionId);assert.equal(active.versions[0].percentage,100);
          const bundle=readFileSync('b1-runtime-release/staged-runtime/worker.js');
          assert.equal(createHash('sha256').update(bundle).digest('hex'),receipt.buildSHA256);
          assert(bundle.includes(Buffer.from('not_first_publication')));assert(bundle.includes(Buffer.from('publication_before_notification_policy')));
          const clean=s=>s.replace(/<script\b[^>]*\bsrc=["']https:\/\/static.cloudflareinsights.com[^"']*["'][\s\S]*?<\/script>/gi,'').replace(/<script\b[^>]*>[\s\S]*?window\.__CF\$cv\$params[\s\S]*?<\/script>/gi,'');
          const before=JSON.parse(readFileSync('alert-release-proof/before.json')),after={};
          for(const path of Object.keys(before)){
            const r=await fetch('https://shiftsometimber.co.uk'+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path);after[path]=createHash('sha256').update(clean(await r.text())).digest('hex');
          }
          assert.deepEqual(after,before,'Unrelated public pages changed');
          writeFileSync('alert-release-proof/verification.json',JSON.stringify({verified:true,source:receipt.source,version:receipt.versionId,buildSHA256:receipt.buildSHA256,publicPages:after,noRealTestEmail:true},null,2));
          JS
      - name: Restore only this owned runtime if verification fails
        if: ${{ failure() && steps.capture.outcome == 'success' }}
        run: |
          if test -s b1-runtime-release/promotion-intent.json; then
            node release/member-details-rollback.mjs
          fi
      - name: Retain source, deployment and rollback evidence
        if: always()
        run: |
          mkdir -p alert-release-proof
          git rev-parse HEAD > alert-release-proof/commit.txt
          cp -r b1-runtime-release alert-release-proof/ 2>/dev/null || true
          find alert-release-proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > alert-release-proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-publication-alert-live-${{ github.sha }}
          path: alert-release-proof/
          retention-days: 30
