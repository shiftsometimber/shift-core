name: G1 Live API Source Capture
# 2026-08-13 post-deploy recapture trigger for canonical adapter route
on:
  pull_request:
    paths:
      - '.github/workflows/g1-live-api-source-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture deployed member API adapter
        shell: bash
        run: |
          mkdir -p live-api-source
          curl -fLsS --retry 3 --max-time 30 'https://shiftsometimber.co.uk/api-adapter-v33d.js' -o live-api-source/api-adapter-v33d.js
          wc -c live-api-source/api-adapter-v33d.js
          grep -nE 'generateFit|fit/plan|AbortController|AbortSignal|15000|15_000|setTimeout|timeout' live-api-source/api-adapter-v33d.js > live-api-source/timeout-hits.txt || true
          cat live-api-source/timeout-hits.txt
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: g1-live-api-source
          path: live-api-source
          if-no-files-found: error
          retention-days: 14
