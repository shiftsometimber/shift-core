name: Approved Knowledge K3 design
on:
  push:
    branches: [design/knowledge-k3-20261030]
    paths: ['release/knowledge-k3-20261030/**', '.github/workflows/knowledge-k3-20261030.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check K3 source syntax
        run: |
          node --check release/knowledge-k3-20261030/layout.mjs
          node --check release/knowledge-k3-20261030/styles.mjs
          node --check release/knowledge-k3-20261030/overlay.mjs
          node --check release/knowledge-k3-20261030/check.mjs
          node --check release/knowledge-k3-20261030/deploy.mjs
      - name: Stage and verify Matt's approved K3 design
        run: node release/knowledge-k3-20261030/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-k3-${{ github.run_id }}
          path: knowledge-k3-evidence/
          retention-days: 90
