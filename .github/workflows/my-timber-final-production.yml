name: My Timber Premortem Current Runtime Acceptance
on:
  push:
    branches: [verification/premortem-current-20261009]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: premortem-current-20261009
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACCEPTANCE_SOURCE: 834680b4353551b257fe0094e834fa827c86ad70
      ACCEPTANCE_RUN: '38012358318'
      EXPECTED_SERVING_DEPLOYMENT: 7dab9b86-13a2-49f0-a1cb-8837e4fdc75b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact unchanged serving source and successful owned release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const allowed=new Set(['.github/workflows/my-timber-final-production.yml','tests/premortem-production.mjs','tests/premortem-runtime-receipt.mjs','member-experience/verify-treatment-browser.mjs']);
          const changed=execFileSync('git',['diff','--name-only',process.env.ACCEPTANCE_SOURCE,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.equal(changed.length,3);assert(changed.every(x=>allowed.has(x)),'Application source changed');
          let run;for(let i=0;i<90;i++){const r=await fetch('https://api.github.com/repos/shiftsometimber/shift-core/actions/runs/'+process.env.ACCEPTANCE_RUN,{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN}});assert(r.ok);run=await r.json();assert.equal(run.head_sha,process.env.ACCEPTANCE_SOURCE);if(run.status==='completed')break;await new Promise(resolve=>setTimeout(resolve,10000));}
          assert.equal(run.conclusion,'success','Pinned release must finish successfully');console.log('PASS exact test-only delta and successful owned source receipt');
          NODE
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: shiftsometimber/shift-core
          run-id: 38012358318
          name: b1-runtime-release-38012358318
          path: owned-release
      - name: Provider GET verifies exact receipt active at 100 percent
        id: serving_before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tests/premortem-runtime-receipt.mjs before
      - name: Install browser for only the new reliability journey
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Current commissioning timings and persisted legacy return
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tests/premortem-production.mjs
      - name: Verify same runtime still serves after acceptance
        if: always() && steps.serving_before.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tests/premortem-runtime-receipt.mjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premortem-current-runtime-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            runtime-acceptance-evidence/
            reliability-evidence/
            premortem-evidence/
            my-treatment-browser-evidence/
            b1-runtime-release/my-treatment-live.json
          retention-days: 30
