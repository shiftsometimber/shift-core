name: My Timber Final Production Candidate

on:
  push:
    branches: [verification/rollout-grub-20261006, main, verification/member-design-20261002, verification/member-finish-20261002, release/internal-closeout-20261004]
    paths:
      - 'my-timber-final-production.mjs'
      - 'release/app-member-live.mjs'
      - 'rendered-member-acceptance-support.mjs'
      - 'health-passport/production-browser.mjs'
      - 'my-timber-google-play-screenshots.mjs'
      - '.github/workflows/my-timber-final-production.yml'
  workflow_run:
    workflows: ['Cloudflare Production Promote']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: my-timber-final-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  billy-iphone-candidate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Prove prior successful runtime and test-only verification delta
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const internal=process.env.GITHUB_REF==='refs/heads/release/internal-closeout-20261004',diagnostic=process.env.GITHUB_REF==='refs/heads/verification/rollout-grub-20261006',baseline=diagnostic?'4460ea56f931da4003ace68d5d404831c47e08f7':internal?'ccb669ea75837fd8c713a899a76956b2b3b5808a':'dc02728aaa6637e1e2570f66af83d594a4176f54',allowed=new Set(diagnostic?['my-timber-final-production.mjs','.github/workflows/my-timber-final-production.yml']:internal?["release/app-member-live.mjs","shift-coach/browser-proof.mjs",".github/workflows/my-timber-final-production.yml","my-timber-final-source-gate.mjs","shift-coach/release-manifest.json"]:["rendered-member-acceptance-support.mjs","tests/rendered-member-acceptance-support.test.mjs","health-passport/production-browser.mjs","my-timber-final-production.mjs",".github/workflows/rendered-member-production-acceptance.yml",".github/workflows/my-timber-final-production.yml","g2-014-progress-picture-premium-production.mjs","my-timber-final-source-gate.mjs","release/app-member-live.mjs"]);

          const changed=execFileSync('git',['diff','--name-only',baseline,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert(changed.every(p=>allowed.has(p)),'Verification branch changes serving application source');
          const r=await fetch('https://api.github.com/repos/shiftsometimber/shift-core/actions/runs/'+(diagnostic?'37525779266':internal?'37194594995':'36947732832'),{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN}});
          assert(r.ok);const receipt=await r.json();assert.equal(receipt.head_sha,baseline);assert.equal(receipt.conclusion,'success');
          console.log('PASS unchanged serving source and exact prior successful production receipt before test authentication');
          NODE
      - name: Install phone journey browser
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Install MP4 evidence encoder
        if: github.ref != 'refs/heads/verification/rollout-grub-20261006' && ( github.event_name != 'push' || (github.ref == 'refs/heads/verification/rollout-grub-20261006' || github.ref == 'refs/heads/verification/member-design-20261002' || github.ref == 'refs/heads/verification/member-finish-20261002' || github.ref == 'refs/heads/release/internal-closeout-20261004'))
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Prove activated Passport with synthetic production accounts
        if: ${{ github.ref != 'refs/heads/verification/rollout-grub-20261006' && (github.event_name != 'push' || (github.ref == 'refs/heads/verification/rollout-grub-20261006' || github.ref == 'refs/heads/verification/member-design-20261002' || github.ref == 'refs/heads/verification/member-finish-20261002' || github.ref == 'refs/heads/release/internal-closeout-20261004')) && hashFiles('health-passport/production-browser.mjs') != '' }}
        env:
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          PASSPORT_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node health-passport/production-browser.mjs
      - name: Retain Passport signed-in production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passport-signed-in-production-${{ github.run_id }}
          path: passport-production-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Capture eight Google Play screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          MY_TIMBER_FINAL_EVIDENCE_DIR: my-timber-final-evidence
        run: node my-timber-google-play-screenshots.mjs
      - name: Record and prove Billy's live production journey
        if: github.event_name != 'push' || (github.ref == 'refs/heads/verification/rollout-grub-20261006' || github.ref == 'refs/heads/verification/member-design-20261002' || github.ref == 'refs/heads/verification/member-finish-20261002' || github.ref == 'refs/heads/release/internal-closeout-20261004')
        env:
          SHIFT_SITE_BASE: https://shiftsometimber.co.uk
          SHIFT_API_BASE: https://api.shiftsometimber.co.uk
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          MY_TIMBER_FINAL_EVIDENCE_DIR: my-timber-final-evidence
        run: node my-timber-final-production.mjs
      - name: Encode walkthrough video
        if: github.ref != 'refs/heads/verification/rollout-grub-20261006' && (github.event_name != 'push' || (github.ref == 'refs/heads/verification/rollout-grub-20261006' || github.ref == 'refs/heads/verification/member-design-20261002' || github.ref == 'refs/heads/verification/member-finish-20261002' || github.ref == 'refs/heads/release/internal-closeout-20261004'))
        run: ffmpeg -y -i my-timber-final-evidence/my-timber-billy-iphone.webm -movflags +faststart -pix_fmt yuv420p my-timber-final-evidence/my-timber-billy-iphone.mp4
      - name: Upload production candidate and phone video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-timber-final-production-candidate
          path: my-timber-final-evidence
          if-no-files-found: error
          retention-days: 30
