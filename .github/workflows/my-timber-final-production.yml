name: My Timber Premortem Secure Expiry Handoff
on:
  push:
    branches: [verification/premortem-current-20261009]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: premortem-current-20261009
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCEPTANCE_SOURCE: 5753da269d0f5f45b7ad572dc7ecde73e2c0fde9
      HOLDER_MODE: diagnostic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact test-only scope, preserve serving application
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
          const allowed=new Set(['.github/workflows/my-timber-final-production.yml','tests/premortem-production.mjs','tests/premortem-holder-public.pem']);
          const changed=execFileSync('git',['diff','--name-only',process.env.ACCEPTANCE_SOURCE,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          assert.equal(changed.length,3);assert(changed.every(x=>allowed.has(x)));console.log('PASS three test-only files; serving code unchanged');
          NODE
      - name: Normally issued session, exact provider timing and encrypted handoff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tests/premortem-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premortem-secure-holder-${{ github.run_id }}
          path: premortem-holder-evidence/
          retention-days: 2
