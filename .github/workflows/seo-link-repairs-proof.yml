name: Approved two-link repair proof
on:
  push:
    branches: [codex/seo-link-repairs-20261007]
  pull_request:
    paths: ['public-seo-link-repairs.mjs', 'public-seo-context.mjs', 'release/seo-link-repairs*', 'release/metrics-connection-scope.mjs', 'release/seo-growth-scope.mjs', 'member-experience/public-preservation.mjs', 'tests/*link-repairs*']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/public-seo-link-repairs.test.mjs tests/seo-link-repairs-release.test.mjs acquisition-activation/metrics-release.test.mjs tests/seo-growth-release.test.mjs tests/seo-context-release.test.mjs tests/seo-discovery-release.test.mjs tests/approved-ranking-release.test.mjs shift-coach/release.test.mjs tests/b1-release-scope.test.mjs
      - run: node shift-coach/release-contract.mjs --require-launch
      - run: node scripts/b1-release-scope.mjs --check
