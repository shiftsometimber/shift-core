name: Knowledge cards serving preflight
on:
  push:
    branches: [release/knowledge-cards-preflight-20261107]
    paths: ['.github/workflows/knowledge-cards-serving-preflight.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'shiftsometimber/shift-core' && github.actor_id == '315011648'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '9e5386dcf455be34c582d93f8bfc79e6'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read active and recent provider version metadata
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const {CLOUDFLARE_ACCOUNT_ID: account,CLOUDFLARE_API_TOKEN: token}=process.env;
          assert(account&&token,'Provider authentication unavailable');
          const root='https://api.cloudflare.com/client/v4/accounts/'+account;
          const get=async(path)=>{
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(45000)});
            const j=await r.json();
            assert(r.ok&&j.success,'Cloudflare GET returned '+r.status+' ('+(j.errors||[]).map(e=>e.code)+')');
            return j.result;
          };
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const {deployments}=await get('/workers/scripts/shift-core/deployments');
          const active=deployments.sort((a,b)=>Date.parse(b.created_on)-Date.parse(a.created_on))[0];
          assert(active?.versions?.length===1&&active.versions[0].percentage===100,'Expected a single active version');
          const activeId=active.versions[0].version_id;
          const version='/workers/workers/shift-core/versions/';
          const listing=await get(version.slice(0,-1));
          const current=await get(version+activeId+'?include=modules');
          const latest=await get(version+'latest');
          const worker=current.modules.find(m=>m.name==='worker.js');
          const review=current.modules.find(m=>m.name==='article-publication-review-20261104.mjs');
          assert(worker&&review,'Expected guarded serving modules');
          const assets=v=>v.assets?{present:true,keys:Object.keys(v.assets).sort(),sha256:sha(JSON.stringify(v.assets))}:{present:false};
          const summary=v=>({id:v.id,created:v.metadata?.created_on??v.created_on,assets:assets(v),assetBindings:(v.bindings||[]).filter(b=>b.type==='assets').map(b=>b.name),keys:Object.keys(v).filter(k=>k!=='modules').sort(),annotations:v.annotations});
          console.log('KNOWLEDGE_SERVING_PREFLIGHT '+JSON.stringify({
            activeDeployment:active.id, active:summary(current), latest:summary(latest),
            recent:(listing.items??listing.versions??(Array.isArray(listing)?listing:[])).slice(0,12).map(v=>({id:v.id,created:v.metadata?.created_on??v.created_on,annotations:v.annotations})),
            main:current.main_module,modules:current.modules.length,
            workerSHA256:sha(Buffer.from(worker.content_base64,'base64')),
            safeguardSHA256:sha(Buffer.from(review.content_base64,'base64'))
          }));
          NODE
