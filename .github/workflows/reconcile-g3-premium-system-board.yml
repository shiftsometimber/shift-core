name: Reconcile Gate 3 Premium System
on:
  push:
    branches: ['main']
    paths:
      - 'reconcile-g3-premium-system-board.mjs'
      - '.github/workflows/reconcile-g3-premium-system-board.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reconcile six earned Gate 3 rows
        run: node reconcile-g3-premium-system-board.mjs
      - name: Prove exact 57-row crosswalk
        run: node finish-line-gate.mjs
      - name: Commit authoritative matrix, ledger and evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/LAUNCH-FINISH-LINE.md docs/COMMISSIONING-EVIDENCE.md docs/V1-RELEASE-BLOCKER-BOARD-V2.md docs/evidence/2026-08-14-g3-premium-system-production-pass.md finish-line-gate.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconcile Gate 3 premium system to 43 PASS / 11 AMBER'
          git push origin HEAD:main
