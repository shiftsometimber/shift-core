name: Verified public Pages repair
on:
  push:
    branches: [recovery/pages-access-20260911]
    paths:
      - '.github/workflows/pages-repair-release.yml'
      - 'release/public-pages-20260911/**'
permissions:
  contents: read
concurrency:
  group: verified-public-pages-repair
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reproduce and verify the exact reviewed Pages source
        run: python3 release/public-pages-20260911/assemble-pages.py
      - name: Install the existing locked deployment toolchain
        run: npm ci --no-audit --no-fund
      - name: Upload only the verified Pages directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sst-pages-command"
          cd "$RUNNER_TEMP/sst-pages-command"
          node "$GITHUB_WORKSPACE/node_modules/wrangler/bin/wrangler.js" pages deploy "$SST_RELEASE_DIR" --project-name projectshift --branch "$SST_PAGES_BRANCH" --commit-hash "$GITHUB_SHA" --commit-message "Reviewed public site repair"
