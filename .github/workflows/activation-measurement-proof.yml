name: Activation and Measurement Proof
on:
  push:
    branches: ['fix/activation-measurement-20260919']
  pull_request:
    branches: [main]
    paths:
      - 'activation-measurement/**'
      - 'journey-analytics-v1.js'
      - 'auth-email-verification-v1.js'
      - 'turnstile-auth-v1.js'
      - 'worker-entry-v6.js'
      - '.github/workflows/activation-measurement-proof.yml'
permissions:
  contents: write
concurrency:
  group: activation-measurement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    if: github.repository == 'shiftsometimber/shift-core' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply only the exact readable three-file patch in this isolated working tree
        run: |
          mkdir -p activation-proof
          python3 - <<'PY'
          import pathlib,subprocess,hashlib,json
          p=pathlib.Path('activation-measurement/runtime.patch')
          if p.exists():
            assert hashlib.sha256(p.read_bytes()).hexdigest()=='b1137b12873e50d9c3ee81e980fd7fe3b2db6687c0188287bd0701c5e1b6086b'
            expected={'worker-entry-v6.js':'166027863b0a6d2f37e0c8f6d532421a2fe3f01c8096227fda31c520882bf7b3','auth-email-verification-v1.js':'e586bd59a9e1b9a470816af6be3050df623f0c5b993f49e1a7487d010c6bb140','turnstile-auth-v1.js':'7379b3a314f3ef66cee2012d1ef3a70198ebd990727bb6176aa6a7dca325330e'}
            for f,sha in expected.items():assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==sha,f+' base changed'
            subprocess.check_call(['git','apply','--check',str(p)])
            subprocess.check_call(['git','apply',str(p)])
            assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(expected)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Actual account, consent, database and existing member regression tests
        run: |
          set -o pipefail
          node --test activation-measurement/*.test.mjs tests/member-auth*.test.mjs tests/turnstile-auth-v1.test.mjs health-passport/*.test.mjs tests/my-journey*.test.mjs member-experience/tests/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs | tee activation-proof/regressions.tap
          for f in gate1-email-verification-e2e.mjs auth-recovery-registration-gate.mjs g5-012-login-fastpath-gate.mjs my-journey-integration-gate.mjs my-timber-final-source-gate.mjs gate5-trust-scale-gate.mjs; do node "$f"; done | tee activation-proof/source-gates.log
      - name: Compile the real Worker without deployment credentials
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir activation-proof/worker | tee activation-proof/compile.log
      - name: Install isolated browser runner
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Test browser consent and privacy boundaries without third-party delivery
        run: python3 activation-measurement/browser-proof.py
      - name: Commit verified patch to this branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/activation-measurement-20260919'
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          if test -f activation-measurement/runtime.patch; then
            test "$(git ls-remote origin refs/heads/fix/activation-measurement-20260919 | cut -f1)" = "$EXPECTED_HEAD"
            test "$(git ls-remote origin refs/heads/main | cut -f1)" = "c478c969ae74a67906b0d3beac2d22a079a3ce71"
            git add -- worker-entry-v6.js auth-email-verification-v1.js turnstile-auth-v1.js
            git rm -- activation-measurement/runtime.patch
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply the tested activation and privacy runtime changes'
            git push origin HEAD:refs/heads/fix/activation-measurement-20260919
          fi
      - name: Retain exact tested source and readable change
        if: always()
        run: |
          mkdir -p activation-proof
          git rev-parse HEAD > activation-proof/source-sha.txt
          git diff c478c969ae74a67906b0d3beac2d22a079a3ce71 -- activation-measurement/ worker-entry-v6.js auth-email-verification-v1.js turnstile-auth-v1.js journey-analytics-v1.js > activation-proof/candidate.patch
          cp activation-measurement/README.md activation-proof/README.md
          python3 - <<'PY'
          import hashlib,json,pathlib
          files=list(pathlib.Path('activation-measurement').glob('*'))+[pathlib.Path(p) for p in ['worker-entry-v6.js','auth-email-verification-v1.js','turnstile-auth-v1.js','journey-analytics-v1.js']]
          pathlib.Path('activation-proof/source-hashes.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-measurement-${{ github.event.pull_request.head.sha || github.sha }}
          path: activation-proof/
          retention-days: 30
