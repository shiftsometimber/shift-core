name: SEO follow-through live evidence (read only)
on:
  push:
    branches: [audit/seo-followthrough-20260923]
    paths: [.github/workflows/seo-followthrough-audit.yml, scripts/seo-followthrough-audit.cjs]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install isolated measurement tools
        run: |
          npm install --prefix "$RUNNER_TEMP/seo-followthrough" --no-audit --no-fund playwright@1.63.0 lighthouse@12.8.2
          "$RUNNER_TEMP/seo-followthrough/node_modules/.bin/playwright" install --with-deps chromium
          echo "SEO_TOOLS=$RUNNER_TEMP/seo-followthrough" >> "$GITHUB_ENV"
      - name: Capture public responses and current mobile laboratory performance
        run: node scripts/seo-followthrough-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-followthrough-${{ github.sha }}
          path: seo-followthrough-proof/
          retention-days: 30
          if-no-files-found: error
