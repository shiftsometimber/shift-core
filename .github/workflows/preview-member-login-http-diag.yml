name: Preview member-login HTTP diagnostics
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: ['.github/workflows/preview-member-login-http-diag.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Inspect member-login HTML and same-origin scripts
        run: |
          node --input-type=module <<'NODE'
          const origin='https://shift-stabilisation-preview.matobrien.workers.dev';
          const res=await fetch(origin+'/member-login',{headers:{'user-agent':'SST-preview-diagnostic'}});
          const html=await res.text();
          console.log('LOGIN_STATUS',res.status,res.headers.get('content-type'));
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].map((m,i)=>({i,attrs:m[1],body:m[2].slice(0,1000),src:(m[1].match(/\bsrc=["']([^"']+)/i)||[])[1]||''}));
          console.log('SCRIPTS',JSON.stringify(scripts,null,2));
          for(const s of scripts.filter(x=>x.src)){
            const u=new URL(s.src,origin);if(u.origin!==origin)continue;
            const r=await fetch(u);const t=await r.text();console.log('SCRIPT_FETCH',u.pathname,r.status,r.headers.get('content-type'),'LEN',t.length,'HAS_SST_API',t.includes('SST_API'),'HEAD',JSON.stringify(t.slice(0,220)));
          }
          console.log('INLINE_SST_API_CONTEXTS',JSON.stringify([...html.matchAll(/.{0,160}SST_API.{0,240}/g)].map(x=>x[0]).slice(0,20),null,2));
          NODE
