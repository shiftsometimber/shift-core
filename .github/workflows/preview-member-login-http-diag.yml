name: Preview member-login asset diagnostics
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: ['.github/workflows/preview-member-login-http-diag.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stabilisation-life-back-20260917
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Generate preview assets locally without deploying
        run: node preview/stabilisation/prepare.mjs
      - name: Compare generated member-login asset with currently deployed preview
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const inspect=(label,html)=>{const adapters=[...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']*api-adapter-v33d\.js[^"']*)["'][^>]*>/gi)];const consumer=html.search(/\bSST_API(?:\.|\[)/);const pos=adapters[0]?.index??-1;console.log(label,{adapterCount:adapters.length,adapterPos:pos,consumerPos:consumer,orderOK:pos>=0&&consumer>=0&&pos<consumer,scripts:[...html.matchAll(/<script\b([^>]*)>/gi)].map(m=>(m[1].match(/\bsrc=["']([^"']+)/i)||[])[1]||'[inline]').slice(0,12)});};
          const generated=fs.readFileSync('work/staging/generated/assets/public-documents/member-login.html','utf8');inspect('GENERATED',generated);
          const origin='https://shift-stabilisation-preview.matobrien.workers.dev';const r=await fetch(origin+'/member-login?diag='+Date.now(),{headers:{'cache-control':'no-cache'}});const deployed=await r.text();console.log('DEPLOYED_STATUS',r.status);inspect('DEPLOYED',deployed);
          NODE
