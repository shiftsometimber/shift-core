name: Fit Premium Public Serving Gate
on:
  pull_request:
    paths:
      - 'assets/fit/premium/**'
      - 'frontend/member/assets/fit/premium/**'
      - 'frontend/member/fit-premium/**'
      - 'frontend/member/member-shell-v33g.js'
      - 'commissioning-ops-v1.js'
      - 'wrangler.jsonc'
      - 'fit-premium-assets-production.mjs'
      - 'fit-premium-public-serving-gate.mjs'
      - '.github/workflows/final-v1-production-publication.yml'
      - '.github/workflows/fit-premium-public-serving-gate.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/member/assets/fit/premium/**'
      - 'frontend/member/member-shell-v33g.js'
      - 'commissioning-ops-v1.js'
      - 'wrangler.jsonc'
      - 'fit-premium-public-serving-gate.mjs'
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node --check frontend/member/member-shell-v33g.js
      - run: node --check commissioning-ops-v1.js
      - run: node fit-premium-public-serving-gate.mjs
