name: Reconcile G5-005 Authoritative Matrix
on:
  pull_request:
    paths:
      - 'reconcile-g5-005-matrix.mjs'
      - '.github/workflows/reconcile-g5-005-matrix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node reconcile-g5-005-matrix.mjs
      - name: Commit reconciled matrix if changed
        shell: bash
        run: |
          if git diff --quiet -- docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md; then
            echo 'Matrix already reconciled.'
            exit 0
          fi
          git config user.name 'shift-release-bot'
          git config user.email 'shiftsometimber@gmail.com'
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md
          git commit -m 'Audit: reconcile G5-005 PASS and launch cohort evidence'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}