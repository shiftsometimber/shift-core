name: Scheduled Editorial Corpus Production

on:
  pull_request:
    paths:
      - '.github/workflows/scheduled-editorial-corpus-production.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-editorial-corpus-production.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_SCHEDULED_EDITORIAL_CORPUS'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false

jobs:
  source-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify the bounded scheduler repair
        run: |
          node --check scheduled-public-fetch-v1.mjs
          node --check scheduled-knowledge-v1.js
          node --check daily-content/editorial.mjs
          node --test scheduled-public-fetch-v1.test.mjs
          node knowledge-flywheel-staging.mjs
          grep -q "corpus_failed" daily-content/editorial.mjs
          node --test medicines-watch/scheduler.test.mjs

  deploy-and-verify:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'DEPLOY_SCHEDULED_EDITORIAL_CORPUS' }}
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Refuse an absent credential or stale source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Install the repository's exact toolchain
        run: npm install --no-audit --no-fund
      - name: Prepare deterministic runtime fixtures
        run: |
          node member-experience/prepare-life-back.mjs
          git diff --exit-code -- member-experience/life-back-assets.mjs
          node grub-expansion-review-pack.mjs
          node babylove/prepare-public-bundle.mjs
          git diff --exit-code -- babylove/editorial/public-bundle.mjs
      - name: Recheck current source and canonical runtime
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node --test tests/canonical-runtime-build.test.mjs tests/independent-presentation-preservation.test.mjs
          node --test scheduled-public-fetch-v1.test.mjs
          node knowledge-flywheel-staging.mjs
          node --test medicines-watch/scheduler.test.mjs
      - name: Capture the exact rollback deployment
        run: npx wrangler deployments list --config wrangler.jsonc --json > deployment-before.json
      - name: Deploy current main through the owned runtime guard
        id: runtime_deploy
        run: node release/member-runtime-deploy.mjs
      - name: Verify the owned provider deployment
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > b1-runtime-release/deployments-after.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync('b1-runtime-release/owned-runtime-deployment.json','utf8'));
          const rows=JSON.parse(readFileSync('b1-runtime-release/deployments-after.json','utf8'));
          const latest=rows.at(-1);
          assert.equal(receipt.source,process.env.GITHUB_SHA);
          assert.equal(latest.id,receipt.deploymentId);
          assert.equal(latest.versions?.length,1);
          assert.equal(latest.versions[0].version_id,receipt.versionId);
          assert.equal(latest.versions[0].percentage,100);
          JS
      - name: Verify public sitemap delivery
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://shiftsometimber.co.uk/sitemap.xml > b1-runtime-release/sitemap.xml
          grep -q '<urlset\|<sitemapindex' b1-runtime-release/sitemap.xml
      - name: Observe a new scheduled corpus cycle
        shell: bash
        run: |
          set -euo pipefail
          deploy_at=$(node -e "console.log(JSON.parse(require('fs').readFileSync('b1-runtime-release/owned-runtime-deployment.json','utf8')).at)")
          for attempt in $(seq 1 20); do
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT id,job_key,started_at,completed_at,status,outcome,error_code FROM hq_service_job_runs WHERE job_key='core_knowledge' AND started_at >= '$deploy_at' ORDER BY started_at DESC LIMIT 1" > b1-runtime-release/scheduled-job.json
            npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT COUNT(*) AS n, SUM(CASE WHEN state='published_site' THEN 1 ELSE 0 END) AS published FROM knowledge_editorial_page_meta" > b1-runtime-release/corpus-count.json || true
            if node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const rows=file=>{const x=JSON.parse(readFileSync(file,'utf8'));return (Array.isArray(x)?x:[x]).flatMap(v=>v?.results||[])};
          const job=rows('b1-runtime-release/scheduled-job.json')[0];
          const corpus=rows('b1-runtime-release/corpus-count.json')[0];
          process.exit(job?.status==='completed'&&Number(corpus?.n||0)>0?0:1);
          JS
            then
              node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const rows=file=>{const x=JSON.parse(readFileSync(file,'utf8'));return (Array.isArray(x)?x:[x]).flatMap(v=>v?.results||[])};
          writeFileSync('b1-runtime-release/scheduled-editorial-verification.json',JSON.stringify({ok:true,job:rows('b1-runtime-release/scheduled-job.json')[0],corpus:rows('b1-runtime-release/corpus-count.json')[0]},null,2));
          JS
              exit 0
            fi
            sleep 60
          done
          echo 'No completed post-deployment core_knowledge cycle with a populated corpus was observed.'
          exit 1
      - name: Roll back this owned runtime if verification fails
        if: ${{ always() && failure() }}
        shell: bash
        run: |
          if [ -f b1-runtime-release/owned-runtime-deployment.json ]; then
            node release/member-details-rollback.mjs
          else
            echo 'No owned runtime mutation receipt; rollback is not required.'
          fi
      - name: Retain deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-editorial-corpus-production-${{ github.run_id }}
          path: |
            deployment-before.json
            b1-runtime-release/
          if-no-files-found: error
          retention-days: 90
