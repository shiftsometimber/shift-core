name: Read-only public Pages access check
on:
  push:
    branches: [recovery/pages-access-20260911]
    paths: ['.github/workflows/pages-access-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read only the existing projectshift Pages project
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          if not token:
              print(json.dumps({'ok': False, 'reason': 'existing repository credential is absent'}))
              raise SystemExit(1)
          endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/pages/projects/projectshift'
          request = urllib.request.Request(endpoint, headers={'Authorization': 'Bearer ' + token}, method='GET')
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status, body = response.status, json.load(response)
          except urllib.error.HTTPError as error:
              status = error.code
              try: body = json.load(error)
              except Exception: body = {}
          result = body.get('result') or {}
          report = {'method': 'GET', 'http_status': status, 'success': bool(body.get('success')),
                    'project': result.get('name'), 'production_branch': result.get('production_branch'),
                    'source_type': (result.get('source') or {}).get('type'),
                    'latest_deployment_id': (result.get('latest_deployment') or {}).get('id'),
                    'error_codes': [e.get('code') for e in body.get('errors', [])]}
          print(json.dumps(report, sort_keys=True))
          if status != 200 or not body.get('success'): raise SystemExit(1)
          PY
