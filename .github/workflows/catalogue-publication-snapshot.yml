name: Catalogue Publication Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalogue-publication-snapshot.yml'
      - 'catalogue-publication-*.mjs'
      - 'scripts/catalogue-publication-snapshot.mjs'
      - 'grub-expansion-serving-manifest-v1.mjs'
      - 'fit-expansion-serving-manifest-v1.mjs'

permissions:
  contents: read

concurrency:
  group: catalogue-publication-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main' && github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install the pinned toolchain
        run: npm install --no-audit --no-fund
      - name: Validate publication boundaries
        run: node --test tests/catalogue-publication*.test.mjs
      - name: Read only the catalogue columns from production
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/catalogue-publication-client.mjs --verify-main
          node scripts/catalogue-publication-snapshot.mjs --sql > "$RUNNER_TEMP/catalogue-readonly.sql"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json --command="$(cat "$RUNNER_TEMP/catalogue-readonly.sql")" > "$RUNNER_TEMP/catalogue-readonly.json"
          node scripts/catalogue-publication-snapshot.mjs "$RUNNER_TEMP/catalogue-readonly.json" catalogue-publication-snapshot
      - name: Retain exact snapshot and fixed approved release candidate
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-publication-snapshot-${{ github.sha }}
          path: catalogue-publication-snapshot/
          if-no-files-found: error
          retention-days: 30
