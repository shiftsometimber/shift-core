name: Shift Member Frontend Source Gate

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'frontend-member-source-gate.mjs'
      - 'member-state-fast-source-gate.mjs'
      - 'member-state-fast-v1.js'
      - 'worker-entry-v6.js'
      - '.github/workflows/frontend-member-source-gate.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend-member-source-gate.mjs'
      - 'member-state-fast-source-gate.mjs'
      - 'member-state-fast-v1.js'
      - 'worker-entry-v6.js'
      - '.github/workflows/frontend-member-source-gate.yml'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prove member frontend P0 source
        run: node frontend-member-source-gate.mjs
      - name: Prove fast member-state security and persistence source
        run: node member-state-fast-source-gate.mjs
      - name: Syntax-check Life Back member experience
        run: node --check frontend/member/member-life-back-v1.js
      - name: Syntax-check Medicines Watch member experience
        run: node --check frontend/member/member-medicines-watch-v1.js
