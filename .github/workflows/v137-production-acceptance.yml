name: V1.37 Production Acceptance
# Technical 9 closeout evidence refresh: 2026-09-08
on:
  pull_request:
    paths:
      - 'v137-production-acceptance.mjs'
      - '.github/workflows/v137-production-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'v137-production-acceptance.mjs'
      - '.github/workflows/v137-production-acceptance.yml'
permissions:
  contents: read
jobs:
  five-width-and-sitewide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium
      - name: Render five widths and scan whole public estate
        run: node v137-production-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v137-production-acceptance
          path: v137-production-acceptance/
          retention-days: 90