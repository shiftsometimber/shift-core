name: Release approved Reta speed and original illustration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reta-speed-image-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      APPROVED_PREVIEW_COMMIT: 6c0d04b829f9b044233d41f36c8304a73cc64c03
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require current main and exactly the preview-tested application
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          import subprocess,os
          names=subprocess.check_output(['git','diff','--name-only',os.environ['APPROVED_PREVIEW_COMMIT'],'HEAD'],text=True).splitlines()
          permitted={'.github/workflows/reta-speed-image-release.yml','scripts/reta-20260924/live-proof.mjs'}
          assert set(names)<=permitted, 'Application drift since tested preview: '+repr(names)
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: shiftsometimber/shift-core
          run-id: 35987764842
          name: reta-preview-6c0d04b829f9b044233d41f36c8304a73cc64c03
          path: approved-preview
      - name: Verify preview evidence and measured mobile improvement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,os,hashlib,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/shiftsometimber/shift-core/actions/runs/35987764842',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          run=json.load(urllib.request.urlopen(req));assert run['conclusion']=='success' and run['head_sha']==os.environ['APPROVED_PREVIEW_COMMIT']
          p=pathlib.Path('approved-preview')
          for line in (p/'SHA256SUMS').read_text().splitlines():
            digest,name=line.split('  ',1);assert hashlib.sha256((p/name.removeprefix('reta-proof/')).read_bytes()).hexdigest()==digest
          assert (p/'commit.txt').read_text().strip()==os.environ['APPROVED_PREVIEW_COMMIT']
          assert not (p/'browser-error.txt').exists()
          b=json.loads((p/'browser.json').read_text());assert len(b['results'])==8 and all(x['status']=='pass' for x in b['results'])
          d=json.loads((p/'mobile-comparison.json').read_text());assert not d['failures']
          for row in d['pages']:
            assert len(row['baseline']['runs'])==len(row['candidate']['runs'])==3
            a,z=row['baseline']['median'],row['candidate']['median']
            assert z['lcpMs']<=a['lcpMs']*.95 and z['cls']<=a['cls']+.02
          PY
      - run: npm ci --no-audit --no-fund
      - name: Recheck regression gates on exact merged source
        run: |
          node --test tests/reta-presentation-repair.test.mjs tests/public-shell-contract.test.mjs tests/public-seo-closeout.test.mjs tests/seo-release-integrity.test.mjs tests/public-navigation-policy*.test.mjs babylove/*.test.mjs my-timber-pwa/*.test.mjs tests/app-store-public.test.mjs
          npx wrangler deploy --dry-run --outdir reta-proof/compiled
      - run: npm install --prefix "$RUNNER_TEMP/perf" --no-audit --no-fund playwright@1.63.0 lighthouse@12.8.2
      - run: '"$RUNNER_TEMP/perf/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Repeated production mobile baseline before any mutation
        run: |
          export CHROME_PATH=$(node -e "console.log(require(process.env.RUNNER_TEMP+'/perf/node_modules/playwright').chromium.executablePath())")
          for repeat in 1 2 3; do
            for page in home reta; do
              route=/; if [ "$page" = reta ]; then route=/guides/retatrutide-uk-guide; fi
              node "$RUNNER_TEMP/perf/node_modules/lighthouse/cli/index.js" "https://shiftsometimber.co.uk$route" --only-categories=performance --output=json --output-path="reta-proof/$page-baseline-$repeat.json" '--chrome-flags=--headless --no-sandbox' --quiet
            done
          done
      - name: Capture rollback identity and current public/member routes
        run: |
          node scripts/reta-20260924/live-proof.mjs before
          npx wrangler deployments list --config wrangler.jsonc --json > reta-proof/worker-before.json
      - name: Publish the verified current Worker without data or Pages changes
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          npx wrangler deploy --config wrangler.jsonc | tee reta-proof/deploy.log
          sleep 15
          npx wrangler deployments list --config wrangler.jsonc --json > reta-proof/worker-after.json
      - name: Exact live preservation, sitemap, asset and header checks
        run: node scripts/reta-20260924/live-proof.mjs after
      - name: Live browser verification and repeated live mobile reports
        run: |
          export SEO_TOOLS="$RUNNER_TEMP/perf"
          VERIFY_BASE=https://shiftsometimber.co.uk node preview/reta-20260924/verify.cjs
          export CHROME_PATH=$(node -e "console.log(require(process.env.RUNNER_TEMP+'/perf/node_modules/playwright').chromium.executablePath())")
          for repeat in 1 2 3; do
            for page in home reta; do
              route=/; if [ "$page" = reta ]; then route=/guides/retatrutide-uk-guide; fi
              node "$RUNNER_TEMP/perf/node_modules/lighthouse/cli/index.js" "https://shiftsometimber.co.uk$route" --only-categories=performance --output=json --output-path="reta-proof/$page-live-$repeat.json" '--chrome-flags=--headless --no-sandbox' --quiet
            done
          done
      - name: Evidence and checksum
        if: always()
        run: |
          mkdir -p reta-proof
          git rev-parse HEAD > reta-proof/commit.txt
          find reta-proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > reta-proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reta-live-${{ github.sha }}
          path: reta-proof/
          retention-days: 30
