name: Daily SEO independent verification 2026-10-01
on:
  push:
    branches:
      - verify/daily-seo-20261001
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full delivered HTML crawl
        shell: bash
        run: |
          mkdir -p audit-out
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ORIGIN='https://shiftsometimber.co.uk';
          const clean=s=>String(s||'').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'").replace(/\s+/g,' ').trim();
          async function grab(url,redirect='manual'){const t=Date.now();try{const r=await fetch(url,{redirect,headers:{'user-agent':'ShiftSomeTimber-DailySEO/2026-10-01'},signal:AbortSignal.timeout(25000)});return {ok:true,status:r.status,location:r.headers.get('location'),headers:Object.fromEntries(r.headers),text:await r.text(),ms:Date.now()-t}}catch(e){return {ok:false,status:0,error:String(e),headers:{},text:'',ms:Date.now()-t}}}
          const sm=await grab(ORIGIN+'/sitemap.xml','follow');
          const urls=[...sm.text.matchAll(/<loc>\s*([^<]+)\s*<\/loc>/gi)].map(m=>m[1].replace(/&amp;/g,'&').trim());
          const unique=[...new Set(urls)];
          const results=[]; const linkSet=new Set();
          let cursor=0;
          async function worker(){while(true){const i=cursor++; if(i>=unique.length)return; const url=unique[i]; const f=await grab(url,'manual'); let html=f.text||''; const heads=[...html.matchAll(/<h1\b[^>]*>/gi)].length; const title=clean((html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]); const desc=(html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)["'][^>]*>/i)||html.match(/<meta[^>]+content=["']([^"']*)["'][^>]+name=["']description["'][^>]*>/i)||[])[1]||''; const canon=(html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["'][^>]*>/i)||html.match(/<link[^>]+href=["']([^"']+)["'][^>]+rel=["']canonical["'][^>]*>/i)||[])[1]||''; const robots=((html.match(/<meta[^>]+name=["']robots["'][^>]+content=["']([^"']+)["'][^>]*>/i)||[])[1]||'')+' '+(f.headers['x-robots-tag']||''); const imgs=[...html.matchAll(/<img\b[^>]*>/gi)].map(m=>m[0]); const missingAlt=imgs.filter(t=>!(/\salt\s*=/i.test(t))).length; const json=[]; let jsonErr=0; for(const m of html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)){try{json.push(JSON.parse(m[1]))}catch{jsonErr++}} const ogTitle=/<meta[^>]+property=["']og:title["']/i.test(html); const ogDesc=/<meta[^>]+property=["']og:description["']/i.test(html); const twCard=/<meta[^>]+name=["']twitter:card["']/i.test(html); const twTitle=/<meta[^>]+name=["']twitter:title["']/i.test(html); for(const m of html.matchAll(/<a\b[^>]+href=["']([^"']+)["']/gi)){try{const u=new URL(m[1],url); if(u.origin===ORIGIN && !u.pathname.startsWith('/cdn-cgi/')){u.hash='';linkSet.add(u.href)}}catch{}} const main=clean((html.match(/<main\b[^>]*>([\s\S]*?)<\/main>/i)||[])[1]||html); results.push({url,status:f.status,redirect:f.location||null,indexable:!/(noindex)/i.test(robots),canonical:canon,title,description:desc,h1:heads,missingAlt,jsonLdBlocks:json.length,jsonLdErrors:jsonErr,ogTitle,ogDesc,twitterCard:twCard,twitterTitle:twTitle,words:main?main.split(/\s+/).length:0,ms:f.ms});}}
          await Promise.all(Array.from({length:12},worker));
          const sitemapSet=new Set(unique.map(x=>{const u=new URL(x);u.hash='';return u.href}));
          const extras=[...linkSet].filter(x=>!sitemapSet.has(x)).sort();
          const extraResults=[]; cursor=0;
          async function extraWorker(){while(true){const i=cursor++;if(i>=extras.length)return;const url=extras[i];const f=await grab(url,'manual');extraResults.push({url,status:f.status,redirect:f.location||null,ms:f.ms,error:f.error||null})}}
          await Promise.all(Array.from({length:10},extraWorker));
          const dup=(key)=>{const m=new Map();for(const r of results){const v=String(r[key]||'').trim().toLowerCase();if(!v)continue;(m.get(v)||m.set(v,[]).get(v)).push(r.url)}return [...m.entries()].filter(([,a])=>a.length>1).map(([value,urls])=>({value,urls}))};
          const flags=results.filter(r=>r.status!==200||r.redirect||!r.indexable||!r.title||!r.description||r.h1!==1||!r.canonical||new URL(r.canonical,r.url).href!==r.url||r.missingAlt||r.jsonLdErrors).map(r=>({url:r.url,status:r.status,redirect:r.redirect,indexable:r.indexable,title:!!r.title,description:!!r.description,h1:r.h1,canonical:r.canonical,missingAlt:r.missingAlt,jsonLdErrors:r.jsonLdErrors}));
          const social={missingOgTitle:results.filter(r=>!r.ogTitle).map(r=>r.url),missingOgDescription:results.filter(r=>!r.ogDesc).map(r=>r.url),missingTwitterCard:results.filter(r=>!r.twitterCard).map(r=>r.url),missingTwitterTitle:results.filter(r=>!r.twitterTitle).map(r=>r.url)};
          const thin=results.filter(r=>r.words<150).map(r=>({url:r.url,words:r.words}));
          const reta=results.find(r=>r.url===ORIGIN+'/guides/retatrutide-uk-guide');
          const retaHtml=reta?await grab(reta.url,'follow'):null;
          const retaDates=retaHtml?{datePublished:(retaHtml.text.match(/"datePublished"\s*:\s*"([^"]+)"/i)||[])[1]||null,dateModified:(retaHtml.text.match(/"dateModified"\s*:\s*"([^"]+)"/i)||[])[1]||null,externalCitations:[...retaHtml.text.matchAll(/<a\b[^>]+href=["'](https?:\/\/[^"']+)["']/gi)].map(m=>m[1]).filter(x=>!x.startsWith(ORIGIN)).length}:null;
          const hubLinks={};
          for(const p of ['/explore-knowledge','/glp1-knowledge-centre']){const h=await grab(ORIGIN+p,'follow');hubLinks[p]=(h.text.match(/href=["'][^"']*\/guides\/retatrutide-uk-guide(?:["'#?])/gi)||[]).length}
          const robots=await grab(ORIGIN+'/robots.txt','follow'); const http=await grab('http://shiftsometimber.co.uk/','manual'); const home=await grab(ORIGIN+'/','follow');
          const report={capturedAt:new Date().toISOString(),sitemap:{status:sm.status,count:urls.length,unique:unique.length},flags,duplicates:{title:dup('title'),description:dup('description')},social,thin,extras:extraResults,brokenExtras:extraResults.filter(x=>x.status>=400||x.status===0),retatrutide:{page:reta||null,dates:retaDates,competingUrls:unique.filter(x=>/retatrutide|ly3437943/i.test(x)&&x!==ORIGIN+'/guides/retatrutide-uk-guide'),hubLinks},robots:{status:robots.status,hasSitemap:/sitemap:/i.test(robots.text),text:robots.text},httpRedirect:{status:http.status,location:http.location},security:{hsts:home.headers['strict-transport-security']||null,csp:home.headers['content-security-policy']||null,xcto:home.headers['x-content-type-options']||null,referrer:home.headers['referrer-policy']||null,permissions:home.headers['permissions-policy']||null,frame:home.headers['x-frame-options']||null},results};
          fs.writeFileSync('audit-out/audit.json',JSON.stringify(report,null,2));
          fs.writeFileSync('audit-out/summary.json',JSON.stringify({capturedAt:report.capturedAt,urlCount:unique.length,flags:flags.length,brokenExtras:report.brokenExtras.length,duplicates:{title:report.duplicates.title.length,description:report.duplicates.description.length},social:{missingOgTitle:social.missingOgTitle.length,missingOgDescription:social.missingOgDescription.length,missingTwitterCard:social.missingTwitterCard.length,missingTwitterTitle:social.missingTwitterTitle.length},thin:thin.length,retatrutide:report.retatrutide},null,2));
          console.log(fs.readFileSync('audit-out/summary.json','utf8'));
          NODE
      - name: Three-run mobile Lighthouse
        shell: bash
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 https://shiftsometimber.co.uk/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance --form-factor=mobile --throttling-method=simulate --output=json --output-path="audit-out/lighthouse-$i.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows=[1,2,3].map(i=>{const j=JSON.parse(fs.readFileSync('audit-out/lighthouse-'+i+'.json'));return {run:i,score:j.categories.performance.score*100,LCP:j.audits['largest-contentful-paint'].numericValue,FCP:j.audits['first-contentful-paint'].numericValue,CLS:j.audits['cumulative-layout-shift'].numericValue,TBT:j.audits['total-blocking-time'].numericValue,SI:j.audits['speed-index'].numericValue};});
          const median=k=>rows.map(x=>x[k]).sort((a,b)=>a-b)[1];
          const out={capturedAt:new Date().toISOString(),tool:'Lighthouse 12.8.2 simulated mobile',runs:rows,median:{score:median('score'),LCP:median('LCP'),FCP:median('FCP'),CLS:median('CLS'),TBT:median('TBT'),SI:median('SI')}};
          fs.writeFileSync('audit-out/lighthouse-summary.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          NODE
      - name: Checksums
        run: |
          cd audit-out
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: daily-seo-20261001
          path: audit-out/
          retention-days: 14
