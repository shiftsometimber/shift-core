name: Automatic article quality and latency proof
on:
  push:
    branches: [fix/automatic-article-quality-20260921]
permissions:
  contents: read
concurrency:
  group: automatic-article-quality-preview
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Block regressions before preview deployment
        run: node --test babylove/*.test.mjs tests/radar-newsroom-*.test.mjs tests/public-shell-contract.test.mjs tests/public-seo-closeout.test.mjs tests/seo-release-integrity.test.mjs
      - name: Compile production candidate without deployment
        run: npx wrangler deploy --dry-run --outdir article-quality-build
      - name: Read only the four public preview records
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node babylove/quality-preview-snapshot.mjs
      - name: Deploy isolated read-only preview without production bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: npx wrangler deploy --config preview/article-quality/wrangler.jsonc
      - name: Verify preview metadata, headers and preserved public content
        run: node scripts/verify-article-quality.mjs https://shift-article-quality-preview.matobrien.workers.dev
      - name: Measure live HTTP phases independently of the audit proxy
        run: node scripts/measure-public-latency.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-quality-proof-${{ github.sha }}
          path: article-quality-proof/
          retention-days: 30
