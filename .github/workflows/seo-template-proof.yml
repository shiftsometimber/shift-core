name: SEO template repair proof
on:
  push:
    branches: [fix/seo-template-repair-20260919]
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Test article, shell, sharing, link and preservation contracts
        run: node --test tests/public-seo-closeout.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs tests/five-article-evidence.test.mjs tests/editorial-resources-v1.test.mjs tests/radar-newsroom-*.test.mjs babylove/*.test.mjs medicines-watch/preservation.test.mjs tests/public-continuity.test.mjs tests/seo-release-integrity.test.mjs
      - name: Compile exact production Worker without deployment
        run: npx wrangler deploy --dry-run --outdir seo-template-build
      - name: Prove changes against fresh live documents and real FAQ redirects
        run: node scripts/verify-seo-template.mjs
      - name: Deploy isolated public preview without production bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: npx wrangler deploy --config preview/seo-template/wrangler.jsonc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-template-candidate-${{ github.sha }}
          path: seo-template-candidate-proof/
          retention-days: 30
