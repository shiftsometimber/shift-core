name: Shift Watchtower Fire Drill
on:
  pull_request:
    paths:
      - 'watchtower-fire-drill-staging.mjs'
      - 'watchtower-v1.js'
      - 'synthetic-probes-v1.js'
      - 'probe-history-v1.js'
      - 'operational-slos-v1.js'
      - '.github/workflows/watchtower-fire-drill.yml'
  push:
    branches: [main]
    paths:
      - 'watchtower-fire-drill-staging.mjs'
      - 'watchtower-v1.js'
      - 'synthetic-probes-v1.js'
      - 'probe-history-v1.js'
      - 'operational-slos-v1.js'
jobs:
  fire-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Controlled Watchtower degradation, history, operator action and recovery
        run: node watchtower-fire-drill-staging.mjs
