name: My Timber login fix PREVIEW ONLY
on:
  push:
    branches: [preview/stabilisation-life-back-20260917]
    paths: ['.github/workflows/preview-member-login-fix.yml']
permissions:
  contents: write
concurrency:
  group: my-timber-login-fix-preview-only
  cancel-in-progress: false
jobs:
  patch-and-prove:
    if: github.ref == 'refs/heads/preview/stabilisation-life-back-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stabilisation-life-back-20260917
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Inject existing auth adapter before the real member-login script and upgrade browser proof
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/preview/stabilisation-life-back-20260917
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const shellPath='public-shell-contract.mjs';let shell=fs.readFileSync(shellPath,'utf8');
          const anchor=` else if(path==='/member-login')html=html.replace('</body>',()=>current(publicFooter,path)+'</body>');\n if(!html.includes('data-shared-footer-dependency'))`;
          const replacement=` else if(path==='/member-login')html=html.replace('</body>',()=>current(publicFooter,path)+'</body>');\n if(path==='/member-login'&&!/<script\\b[^>]*\\bsrc=["']\\/api-adapter-v33d\\.js(?:\\?[^"']*)?["'][^>]*>/i.test(html)){\n  const adapter='<script src="/api-adapter-v33d.js" data-shift-auth-adapter></script>',baseScript=/<script\\b[^>]*>\\s*window\\.SST_API_BASE\\s*=\\s*location\\.origin\\s*;?\\s*<\\/script>/i;\n  html=baseScript.test(html)?html.replace(baseScript,match=>match+adapter):html.replace('</head>',()=>adapter+'</head>');\n }\n if(!html.includes('data-shared-footer-dependency'))`;
          if(!shell.includes('data-shift-auth-adapter')){assert(shell.includes(anchor),'member-login shell anchor changed');shell=shell.replace(anchor,replacement);fs.writeFileSync(shellPath,shell)}

          const proofPath='preview/stabilisation/browser-proof.mjs';let proof=fs.readFileSync(proofPath,'utf8');
          const loginFn=`async function login(ctx,id){await api(ctx,'/v1/auth/login',{email:'probe'+id+'@example.invalid',password:fixture.password},'POST',200);const me=await api(ctx,'/v1/me');assert.equal(Number(me.user.id),id)}\n`;
          const uiFn=`async function login(ctx,id){await api(ctx,'/v1/auth/login',{email:'probe'+id+'@example.invalid',password:fixture.password},'POST',200);const me=await api(ctx,'/v1/me');assert.equal(Number(me.user.id),id)}\nasync function uiLogin(page,ctx,id){\n await api(ctx,'/v1/auth/logout',{},'POST',200);await open(page,'/member-login');\n await page.waitForFunction(()=>typeof window.SST_API==='object',null,{timeout:15000});\n const adapters=page.locator('script[src^="/api-adapter-v33d.js"]');assert.equal(await adapters.count(),1,'Exactly one member auth adapter must load');\n const order=await page.locator('script').evaluateAll(nodes=>nodes.map((s,i)=>({i,src:s.getAttribute('src')||'',text:s.src?'':s.textContent||''})));\n const adapterIndex=order.find(x=>x.src.startsWith('/api-adapter-v33d.js'))?.i,consumerIndex=order.find(x=>/SST_API(?:\\.|\\[)/.test(x.text)&&!x.text.includes('SST_API_BASE'))?.i;\n assert(Number.isInteger(adapterIndex)&&Number.isInteger(consumerIndex)&&adapterIndex<consumerIndex,'Auth adapter must execute before inline SST_API consumer');\n const form=page.locator('#previewRegister');assert.equal(await form.count(),1,'Real My Timber login form missing');\n await form.locator('input[type="email"]').fill('probe'+id+'@example.invalid');await form.locator('input[type="password"]').fill(fixture.password);\n await form.locator('button[type="submit"],input[type="submit"]').first().click();\n await page.locator('#previewMember.is-ready').waitFor({state:'visible',timeout:30000});const me=await api(ctx,'/v1/me');assert.equal(Number(me.user.id),id);\n}\n`;
          if(!proof.includes('async function uiLogin(')){assert(proof.includes(loginFn),'browser login helper baseline changed');proof=proof.replace(loginFn,uiFn)}
          const initial=`row.phase='fictional-member-login';await login(context,fixture.browserIds[index]);await api(context,'/v1/consents'`;
          const initialNew=`row.phase='fictional-member-login';await uiLogin(page,context,fixture.browserIds[index]);row.checks.push('Actual My Timber form loads SST_API adapter first and signs in successfully');await api(context,'/v1/consents'`;
          if(!proof.includes(initialNew)){assert(proof.includes(initial),'initial direct API login baseline changed');proof=proof.replace(initial,initialNew)}
          const relog=`row.checks.push('Shared My Timber menu exposes Log out; click revokes the session, returns to sign-in and protected APIs reject the old session');await login(context,fixture.browserIds[index]);await today(page);`;
          const relogNew=`row.checks.push('Shared My Timber menu exposes Log out; click revokes the session, returns to sign-in and protected APIs reject the old session');await uiLogin(page,context,fixture.browserIds[index]);await today(page);`;
          if(!proof.includes(relogNew)){assert(proof.includes(relog),'logout re-login baseline changed');proof=proof.replace(relog,relogNew)}
          fs.writeFileSync(proofPath,proof);

          const testPath='tests/public-shell-contract.test.mjs';let tests=fs.readFileSync(testPath,'utf8');
          const testLine=`\ntest('member login loads the existing auth adapter before any SST_API consumer and only once',()=>{const input='<html><head><script>window.SST_API_BASE=location.origin;</script><script>SST_API.getMe()</script></head><body>'+publicHeader+publicDrawer+'<main><form id="real-login">Login</form></main></body></html>';const once=reconcilePublicDocument(input,'/member-login'),twice=reconcilePublicDocument(once,'/member-login');assert.equal((once.match(/src="\\/api-adapter-v33d\\.js"/g)||[]).length,1);assert(once.indexOf('src="/api-adapter-v33d.js"')<once.indexOf('SST_API.getMe()'));assert.equal(twice,once)});\n`;
          if(!tests.includes('member login loads the existing auth adapter')){tests+=testLine;fs.writeFileSync(testPath,tests)}
          NODE
      - name: Static source guard before deployment
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {reconcilePublicDocument,publicHeader,publicDrawer} from './public-shell-contract.mjs';
          const html='<html><head><script>window.SST_API_BASE=location.origin;</script><script>SST_API.getMe()</script></head><body>'+publicHeader+publicDrawer+'<main>Login</main></body></html>';
          const out=reconcilePublicDocument(html,'/member-login');assert.equal((out.match(/api-adapter-v33d\.js/g)||[]).length,1);assert(out.indexOf('api-adapter-v33d.js')<out.indexOf('SST_API.getMe()'));assert.equal(reconcilePublicDocument(out,'/member-login'),out);console.log('PASS: one synchronous auth adapter is injected before SST_API consumer and repair is idempotent.');
          NODE
      - name: Commit only source and proof changes to isolated preview branch
        run: |
          set -euo pipefail
          git config user.name 'SHIFT preview verification'
          git config user.email 'it@shiftsometimber.co.uk'
          git add public-shell-contract.mjs preview/stabilisation/browser-proof.mjs tests/public-shell-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Preview only: restore My Timber UI login adapter'
            git push origin HEAD:refs/heads/preview/stabilisation-life-back-20260917
          fi
          echo "PREVIEW_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require preview credential only
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Regression gates
        run: node --test --test-reporter=tap member-experience/tests/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs tests/my-timber-analytics-privacy.test.mjs
      - name: Prepare and verify isolated preview
        run: |
          node preview/stabilisation/prepare.mjs
          node preview/stabilisation/verify-public.mjs
      - name: Provision only separately named preview databases
        run: node preview/stabilisation/provision.mjs
      - name: Deploy only isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';const c=JSON.parse(fs.readFileSync('work/staging/generated/config.json'));assert.equal(c.name,'shift-stabilisation-preview');assert.equal(c.vars.SHIFT_ENVIRONMENT,'stabilisation-preview-20260917');assert(!c.routes&&!c.route&&!c.triggers&&!c.send_email&&!c.ai);assert.equal(c.workers_dev,true);
          NODE
          node node_modules/wrangler/bin/wrangler.js deploy --config work/staging/generated/config.json > "$RUNNER_TEMP/shift-preview-deploy.txt" 2>&1
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';const log=fs.readFileSync(process.env.RUNNER_TEMP+'/shift-preview-deploy.txt','utf8');const match=log.match(/https:\/\/shift-stabilisation-preview\.[a-z0-9-]+\.workers\.dev/);if(!match)throw Error('Isolated preview URL not returned');fs.appendFileSync(process.env.GITHUB_ENV,'PREVIEW_URL='+match[0]+'\n');console.log('PREVIEW ONLY',match[0]);
          NODE
      - name: Install Chromium and WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Prove actual UI login, logout, re-login and full Life Back loop
        run: node preview/stabilisation/browser-proof.mjs
      - name: Upload sanitised proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-timber-ui-login-preview-evidence
          retention-days: 14
          path: |
            work/staging/generated/public-proof.json
            work/staging/generated/review-evidence/**
          if-no-files-found: warn
