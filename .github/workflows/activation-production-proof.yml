name: Activation Production Proof
on:
  workflow_run:
    workflows: ['Cloudflare Production Promote']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: activation-production-proof
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Verify exact deployed bootstrap and aggregate cohort without writes
        run: node activation-measurement/production-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-live-${{ github.event.workflow_run.head_sha }}
          path: activation-live/
          retention-days: 30
