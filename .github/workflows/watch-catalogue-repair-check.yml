name: Watch and Catalogue Repair Check
on:
  push:
    branches: [fix/watch-catalogue-closeout-20260917]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Test catalogue no-op, drift and partial-publication handling
        run: node --test tests/catalogue-publication-d1-import.test.mjs
      - name: Capture exact primary source responses for review
        run: node scripts/watch-source-review-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-source-review-capture
          path: watch-source-capture/
