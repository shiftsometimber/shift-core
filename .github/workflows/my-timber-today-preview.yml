name: My Timber Today Hosted Preview

on:
  push:
    branches: [feat/adaptive-today-phase-1-2]
    paths:
      - '.github/workflows/my-timber-today-preview.yml'
      - 'preview/**'
      - 'migrations/**'
      - 'wrangler.my-timber-preview.template.jsonc'
      - 'worker-entry-v6.js'
      - 'worker.js'
      - 'commercial-catalogue-v1.js'
      - 'commercial-hq-v1.js'
      - 'treatment-catalogue-v1.js'
      - 'treatment-pathway-v1.js'
      - 'claims-library-v1.js'
      - 'member-daily-v3.js'
      - 'member-daily-v2.js'
      - 'shift-brain-v1.js'
      - 'frontend/member/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD_ISOLATED_PREVIEW'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: my-timber-today-hosted-preview
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'BUILD_ISOLATED_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      PREVIEW_DB_NAME: shift-core-my-timber-preview-db
      PREVIEW_CONFIG: wrangler.my-timber-preview.generated.jsonc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Fail closed without Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install exact Wrangler toolchain
        run: npm install --no-audit --no-fund

      - name: Resolve isolated preview D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          db_id=$(jq -r --arg name "$PREVIEW_DB_NAME" '.[] | select(.name==$name) | (.uuid // .database_id // .id)' /tmp/d1-list.json | head -n1)
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            npx wrangler d1 create "$PREVIEW_DB_NAME" --location weur
            npx wrangler d1 list --json > /tmp/d1-list.json
            db_id=$(jq -r --arg name "$PREVIEW_DB_NAME" '.[] | select(.name==$name) | (.uuid // .database_id // .id)' /tmp/d1-list.json | head -n1)
          fi
          test -n "$db_id" && test "$db_id" != "null"
          sed "s/__PREVIEW_D1_DATABASE_ID__/$db_id/" wrangler.my-timber-preview.template.jsonc > "$PREVIEW_CONFIG"
          echo "Isolated D1 resolved: $PREVIEW_DB_NAME"

      - name: Initialise preview-only schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --file preview/bootstrap.sql --config "$PREVIEW_CONFIG"
          npx wrangler d1 execute DB --remote --file migrations/006_commercial_catalogue_control.sql --config "$PREVIEW_CONFIG"
          npx wrangler d1 execute DB --remote --file migrations/007_treatment_catalogue.sql --config "$PREVIEW_CONFIG"
          npx wrangler d1 execute DB --remote --file migrations/008_claims_library.sql --config "$PREVIEW_CONFIG"
          npx wrangler d1 execute DB --remote --file migrations/009_my_timber_learning.sql --config "$PREVIEW_CONFIG"

      - name: Keep preview browser calls on the preview origin
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='frontend/member/api-adapter-v33d.js';
          const source=fs.readFileSync(file,'utf8');
          const next=source.replace("window.SST_API_BASE||'https://api.shiftsometimber.co.uk'","window.SST_API_BASE||window.location.origin");
          if(next===source) throw new Error('preview API base replacement did not apply');
          fs.writeFileSync(file,next);
          NODE

      - name: Deploy isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config "$PREVIEW_CONFIG" 2>&1 | tee /tmp/deploy.txt
          preview_url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.txt | tail -n1)
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "### My Timber Today preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$preview_url/member/dashboard#today]($preview_url/member/dashboard#today)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove problem-first help persists named decisions
        shell: bash
        run: |
          set -euo pipefail
          suffix=$(date +%s%N)
          email="today-known-$suffix@example.test"
          token="preview-known-$suffix"
          token_hash=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
          expires=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" \
            --command "INSERT INTO users(email,first_name) VALUES('$email','Matt'); INSERT INTO user_auth(user_id,password_hash,email_verified,email_verified_at) SELECT id,'preview-only',1,'$now' FROM users WHERE email='$email'; INSERT INTO member_status(user_id,lifecycle_stage,membership_status,source,last_activity_at) SELECT id,'registered','none','hosted_preview','$now' FROM users WHERE email='$email'; INSERT INTO member_state(user_id) SELECT id FROM users WHERE email='$email'; INSERT INTO user_sessions(user_id,token_hash,expires_at,last_used_at,created_at) SELECT id,'$token_hash','$expires','$now','$now' FROM users WHERE email='$email';" >/tmp/known-seed.txt
          auth=(-H "Cookie: sst_session=$token")
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json \
            --command "SELECT COUNT(*) AS invented FROM shift_treatment_context WHERE user_id=(SELECT id FROM users WHERE email='$email')" > /tmp/blank-treatment.json
          jq -e '[.. | objects | select(.invented? == 0)] | length == 1' /tmp/blank-treatment.json
          grep -Fq "headline:'Tell us what you’re on so tonight can be right.'" member-daily-v3.js
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -X PATCH -d '{"medicineKey":"mounjaro","doseKey":"5mg","durationKey":"weeks"}' \
            "$PREVIEW_URL/v1/shift/treatment-context" > /tmp/treatment.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d '{"mood":"alright","guts":"rough","energy":"empty"}' \
            "$PREVIEW_URL/v1/shift/today/check-in" > /tmp/checkin.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d '{"choiceKey":"eggs-toast"}' "$PREVIEW_URL/v1/shift/today/grub" > /tmp/grub.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d '{"choiceKey":"walk-10"}' "$PREVIEW_URL/v1/shift/today/move" > /tmp/move.json
          jq -e '.meal.name=="Scrambled eggs on toast"' /tmp/grub.json
          jq -e '.activity.name=="Easy walk" and .activity.minutes==10' /tmp/move.json
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json \
            --command "SELECT domain,json_extract(choice_json,'$.name') AS name,json_extract(choice_json,'$.minutes') AS minutes FROM shift_today_choices WHERE user_id=(SELECT id FROM users WHERE email='$email') ORDER BY domain" > /tmp/persisted.json
          jq -e '[.. | objects | select(.domain? == "grub" and .name == "Scrambled eggs on toast")] | length == 1' /tmp/persisted.json
          jq -e '[.. | objects | select(.domain? == "move" and .name == "Easy walk" and .minutes == 10)] | length == 1' /tmp/persisted.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d '{"mode":"working_late"}' "$PREVIEW_URL/v1/shift/today/rebuild" > /tmp/rebuild.json
          jq -e '.rebuild.now.domain=="hydration" and .rebuild.next.domain=="food" and .rebuild.later.domain=="movement" and (.rebuild.id>0)' /tmp/rebuild.json
          rebuild_id=$(jq -r '.rebuild.id' /tmp/rebuild.json)
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d "{\"rebuildId\":$rebuild_id,\"alternativeKey\":\"fakeaway\"}" "$PREVIEW_URL/v1/shift/today/rebuild/alternative" > /tmp/alternative.json
          jq -e '.rebuild.alternative.key=="fakeaway" and .rebuild.next.domain=="food" and .rebuild.later.domain=="movement" and (.rebuild.id>0)' /tmp/alternative.json
          alternative_id=$(jq -r '.rebuild.id' /tmp/alternative.json)
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d "{\"rebuildId\":$alternative_id}" "$PREVIEW_URL/v1/shift/today/complete" > /tmp/complete.json
          jq -e '.completion.headline=="Today shifted."' /tmp/complete.json

      - name: Prove the actual member page is served
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PREVIEW_URL/member/dashboard#today" -o /tmp/member-dashboard.html
          grep -Fq '<title>My Timber Today — isolated preview</title>' /tmp/member-dashboard.html
          grep -Fq 'id="todayActions"' /tmp/member-dashboard.html
          grep -Fq 'Create preview account' /tmp/member-dashboard.html
          grep -Fq 'Sign in to preview' /tmp/member-dashboard.html
          grep -Fq 'What do you need help sorting?' /tmp/member-dashboard.html
          curl -fsSI "$PREVIEW_URL/member-my-timber-problem-v1.js?v=2" | grep -Eqi '^content-type:.*(javascript|ecmascript)'
          curl -fsSI "$PREVIEW_URL/member-today-premium-v1.css?v=r3-1" | grep -Eqi '^content-type:.*text/css'
          curl -fsSI "$PREVIEW_URL/member-today-premium-v1.js?v=r3-1" | grep -Eqi '^content-type:.*(javascript|ecmascript)'

      - name: Prove service-level homepage and fail-closed live catalogue
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PREVIEW_URL/" -o /tmp/home.html
          grep -Fq 'SHIFT SOME TIMBER.' /tmp/home.html
          grep -Fq 'Find my treatment route' /tmp/home.html
          ! grep -Eqi 'mounjaro|wegovy|tirzepatide|semaglutide|tablet|injection' /tmp/home.html
          status=$(curl -sS -o /tmp/no-pathway.json -w '%{http_code}' "$PREVIEW_URL/v1/treatment/catalogue")
          test "$status" = '403'
          curl -fsS -c /tmp/pathway.cookies -X POST "$PREVIEW_URL/v1/treatment/pathway/start" >/tmp/pathway.json
          curl -fsS -b /tmp/pathway.cookies "$PREVIEW_URL/v1/treatment/catalogue" >/tmp/catalogue.json
          jq -e '.saleState=="blocked" and .priceStatus=="proposed" and ([.families[].formulations[].strengths[]]|length)==15 and ([.families[].formulations[].strengths[]|select(.ctaState!="blocked")]|length)==0' /tmp/catalogue.json
          curl -fsS -H 'Origin: https://hq.shiftsometimber.co.uk' -H 'X-Shift-Admin-Key: definitely-wrong' "$PREVIEW_URL/v1/hq/catalogue" -o /tmp/hq-denied.json -w '%{http_code}' | grep -Fq '401'

      - name: Install iPhone-format browser acceptance tool
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps webkit

      - name: Prove every R3 tap works in iPhone-format WebKit
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { webkit, devices } = require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            const email=`r3-tap-${Date.now()}@example.test`;
            await page.goto(`${process.env.PREVIEW_URL}/member/dashboard#today`,{waitUntil:'domcontentloaded'});
            await page.getByLabel('First name').fill('Matt');
            await page.getByLabel('Email').fill(email);
            await page.getByLabel('Password').fill('PreviewOnly-4827');
            const todayResponse=page.waitForResponse(response=>response.url().includes('/v1/shift/today')&&response.request().method()==='GET');
            await page.getByRole('button',{name:'Create preview account'}).click();
            const today=await todayResponse;
            const todayBody=await today.text();
            if(!today.ok())throw new Error(`today endpoint ${today.status()}: ${todayBody}`);
            try{await page.locator('[data-change]').waitFor({state:'visible',timeout:15000})}catch(error){throw new Error(`today did not render; response=${todayBody}; page=${(await page.locator('body').innerText()).slice(0,1200)}; errors=${errors.join(' | ')}`)}
            await page.locator('[data-change]').click();
            const workingResponse=page.waitForResponse(response=>response.url().endsWith('/v1/shift/today/rebuild')&&response.request().method()==='POST');
            await page.locator('[data-rebuild="working_late"]').click();
            const working=await workingResponse;
            const workingBody=await working.text();
            if(!working.ok())throw new Error(`working-late endpoint ${working.status()}: ${workingBody}`);
            try{await page.locator('.mt-rebuilt').waitFor({state:'visible'})}catch(error){throw new Error(`working-late did not render; response=${workingBody}; page=${(await page.locator('body').innerText()).slice(0,1200)}; errors=${errors.join(' | ')}`)}
            await page.locator('[data-change]').click();
            const chaosResponse=page.waitForResponse(response=>response.url().endsWith('/v1/shift/today/rebuild')&&response.request().method()==='POST');
            await page.locator('[data-rebuild="chaos"]').click();
            const chaos=await chaosResponse;
            if(!chaos.ok())throw new Error(`chaos endpoint ${chaos.status()}: ${await chaos.text()}`);
            await page.getByRole('heading',{name:'Your next three hours are sorted.'}).waitFor({state:'visible'});
            const alternativeResponse=page.waitForResponse(response=>response.url().endsWith('/v1/shift/today/rebuild/alternative')&&response.request().method()==='POST');
            await page.locator('[data-alternative="fakeaway"]').click();
            const alternative=await alternativeResponse;
            const alternativeBody=await alternative.text();
            if(!alternative.ok()||!alternativeBody.includes('fakeaway'))throw new Error(`fakeaway endpoint ${alternative.status()}: ${alternativeBody}`);
            const feedbackResponse=page.waitForResponse(response=>response.url().endsWith('/v1/shift/today/feedback')&&response.request().method()==='POST');
            await page.getByRole('button',{name:'Love this'}).first().click();
            const feedback=await feedbackResponse;
            if(!feedback.ok())throw new Error(`preference feedback endpoint ${feedback.status()}: ${await feedback.text()}`);
            await page.getByText(/more likely to appear when it fits/i).waitFor();
            const completionResponse=page.waitForResponse(response=>response.url().endsWith('/v1/shift/today/complete')&&response.request().method()==='POST');
            await page.locator('[data-complete-shifted]').click();
            const completion=await completionResponse;
            if(!completion.ok())throw new Error(`completion endpoint ${completion.status()}: ${await completion.text()}`);
            await page.locator('.mt-completed').waitFor({state:'visible'});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);
            if(overflow)throw new Error('horizontal overflow detected');
            if(errors.length)throw new Error(`page errors: ${errors.join(' | ')}`);
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Prove homepage to governed product on iPhone-format WebKit
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {webkit,devices}=require('playwright');
          (async()=>{
            const browser=await webkit.launch();
            const context=await browser.newContext({...devices['iPhone 13']});
            const page=await context.newPage();const errors=[];page.on('pageerror',error=>errors.push(error.message));
            await page.goto(process.env.PREVIEW_URL,{waitUntil:'networkidle'});
            if(/Mounjaro|Wegovy|tirzepatide|semaglutide|tablet|injection/i.test(await page.locator('body').innerText()))throw new Error('public homepage leaked post-CTA treatment detail');
            await page.getByRole('link',{name:/Find my treatment route/i}).click();
            await page.getByRole('button',{name:/Yes, I’m 18 or over/i}).click();await page.getByRole('button',{name:'Continue'}).click();
            await page.getByLabel('Height (cm)').fill('173');await page.getByLabel('Weight (kg)').fill('102');await page.getByRole('button',{name:'Continue'}).click();
            await page.getByRole('button',{name:'Not sure'}).click();await page.getByRole('button',{name:'Continue'}).click();
            await page.getByRole('button',{name:'No'}).click();await page.getByRole('button',{name:'Continue'}).click();
            await page.getByRole('button',{name:'Open to either'}).click();await page.getByRole('button',{name:'Show my routes'}).click();
            await page.getByRole('heading',{name:'Your routes, clearly.'}).waitFor();
            if(await page.getByRole('button',{name:'Create My Shift account'}).isEnabled())throw new Error('medicine account/purchase gate was enabled');
            await page.getByRole('link',{name:/See prices and information/i}).first().click();
            await page.getByText('Not available to buy').waitFor();
            const doseButtons=page.locator('[data-strength]');if(await doseButtons.count()<2)throw new Error('strength ladder missing');
            await doseButtons.nth(1).click();
            if(await page.getByRole('button',{name:'Purchase unavailable'}).isEnabled())throw new Error('purchase gate was enabled');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth);if(overflow)throw new Error('treatment journey horizontal overflow');
            if(errors.length)throw new Error(errors.join(' | '));await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Publish review instructions
        run: |
          {
            echo ''
            echo 'Use a fresh test email on the registration screen.'
            echo 'Production routes, production D1 and customer records were not touched.'
          echo 'Manual gate: choose a real problem, receive a useful action, save it, and see the next CTA.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview result to the draft PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- my-timber-today-hosted-preview -->'
          if [ "$JOB_STATUS" = 'success' ]; then
            body="$marker
          ## My Timber Today hosted preview: ready

          The isolated Worker and preview-only D1 both passed:
          - a named dinner was saved as **Scrambled eggs on toast**
          - movement was saved as **Easy walk · 10 min**
          - a blank treatment account was not assigned a medicine or dose
          - Working Late rebuilt Now / Next / Later through the live endpoint
          - Fakeaway recalculated the rebuilt day and Today Shifted completed

          **Open the one-thumb review:** $PREVIEW_URL/member/dashboard#today

          Use a fresh test email. Production routes and live customer data were not touched."
          else
            body="$marker
          ## My Timber Today hosted preview: commissioning failed

          The isolated preview did not pass its automated acceptance run. No production route or live customer record was touched.

          [Open the failed Actions run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          fi
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/475/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh pr comment 475 --body "$body" >/dev/null
          fi
