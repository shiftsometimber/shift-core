name: My Timber Today Hosted Preview
# Recovery candidate only: exercise remembered meal decisions before production sign-off.

on:
  push:
    branches: [feat/real-daily-shift-recovery, codex/my-timber-adaptive-day-v1, feat/adaptive-today-phase-1-2]
    paths:
      - '.github/workflows/my-timber-today-preview.yml'
      - 'preview/**'
      - 'wrangler.my-timber-preview.template.jsonc'
      - 'worker-entry-v6.js'
      - 'worker.js'
      - 'member-daily-v3.js'
      - 'member-daily-v2.js'
      - 'shift-brain-v1.js'
      - 'member-product-v8.js'
      - 'product-analytics-v1.js'
      - 'daily-shift-frontdoor-gate.mjs'
      - 'my-timber-9-contract-gate.mjs'
      - 'frontend/member/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD_ISOLATED_PREVIEW'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: my-timber-today-hosted-preview
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'BUILD_ISOLATED_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
      PREVIEW_DB_NAME: shift-core-my-timber-preview-db
      PREVIEW_CONFIG: wrangler.my-timber-preview.generated.jsonc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Fail closed without Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install exact Wrangler toolchain
        run: npm install --no-audit --no-fund

      - name: Prove real Grub and Fit Today contract
        run: node daily-shift-frontdoor-gate.mjs && node my-timber-9-contract-gate.mjs

      - name: Resolve isolated preview D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          db_id=$(jq -r --arg name "$PREVIEW_DB_NAME" '.[] | select(.name==$name) | (.uuid // .database_id // .id)' /tmp/d1-list.json | head -n1)
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            npx wrangler d1 create "$PREVIEW_DB_NAME" --location weur
            npx wrangler d1 list --json > /tmp/d1-list.json
            db_id=$(jq -r --arg name "$PREVIEW_DB_NAME" '.[] | select(.name==$name) | (.uuid // .database_id // .id)' /tmp/d1-list.json | head -n1)
          fi
          test -n "$db_id" && test "$db_id" != "null"
          sed "s/__PREVIEW_D1_DATABASE_ID__/$db_id/" wrangler.my-timber-preview.template.jsonc > "$PREVIEW_CONFIG"
          echo "Isolated D1 resolved: $PREVIEW_DB_NAME"
          echo "PREVIEW_D1_ID=$db_id" >> "$GITHUB_ENV"

      - name: Initialise preview-only schema
        run: npx wrangler d1 execute DB --remote --file preview/bootstrap.sql --config "$PREVIEW_CONFIG"

      - name: Keep preview browser calls on the preview origin
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='frontend/member/api-adapter-v33d.js';
          const source=fs.readFileSync(file,'utf8');
          const next=source.replace("window.SST_API_BASE||'https://api.shiftsometimber.co.uk'","window.SST_API_BASE||window.location.origin");
          if(next===source) throw new Error('preview API base replacement did not apply');
          fs.writeFileSync(file,next);
          NODE

      - name: Deploy isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config "$PREVIEW_CONFIG" 2>&1 | tee /tmp/deploy.txt
          preview_url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.txt | tail -n1)
          test -n "$preview_url"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "### My Timber Today preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$preview_url/member/dashboard#today]($preview_url/member/dashboard#today)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove joined Grub and Fit day rebuilds when work changes
        shell: bash
        run: |
          set -euo pipefail
          suffix=$(date +%s%N)
          email="today-known-$suffix@example.test"
          token="preview-known-$suffix"
          token_hash=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
          expires=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" \
            --command "INSERT INTO users(email,first_name) VALUES('$email','Matt'); INSERT INTO user_auth(user_id,password_hash,email_verified,email_verified_at) SELECT id,'preview-only',1,'$now' FROM users WHERE email='$email'; INSERT INTO member_status(user_id,lifecycle_stage,membership_status,source,last_activity_at) SELECT id,'registered','none','hosted_preview','$now' FROM users WHERE email='$email'; INSERT INTO member_state(user_id) SELECT id FROM users WHERE email='$email'; INSERT INTO user_sessions(user_id,token_hash,expires_at,last_used_at,created_at) SELECT id,'$token_hash','$expires','$now','$now' FROM users WHERE email='$email';" >/tmp/known-seed.txt
          auth=(-H "Cookie: sst_session=$token")
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -X POST -d '{}' "$PREVIEW_URL/v1/shift/preview-billy" > /tmp/billy.json
          curl -fsS "${auth[@]}" -H 'X-Shift-Local-Date: 2026-08-21' -H 'X-Shift-Local-Hour: 17' \
            "$PREVIEW_URL/v1/shift/daily-plan" > /tmp/daily.json
          jq -e '.daily.daily_output.status=="ready" and .daily.daily_output.meal.name=="Fakeaway salt and pepper chicken" and .daily.daily_output.workout.minutes==30' /tmp/daily.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' -H 'X-Shift-Local-Hour: 17' \
            -X POST -d '{"action":"reject","meal_id":"preview-dinner"}' "$PREVIEW_URL/v1/shift/daily-meal" > /tmp/rejected-meal.json
          jq -e '.action=="reject" and .daily.daily_output.meal.id=="preview-quick-dinner" and (.message|contains("not suggest"))' /tmp/rejected-meal.json
          curl -fsS "${auth[@]}" -H 'X-Shift-Local-Date: 2026-08-22' -H 'X-Shift-Local-Hour: 17' \
            "$PREVIEW_URL/v1/shift/daily-plan" > /tmp/next-day.json
          jq -e '.daily.daily_output.meal.id!="preview-dinner"' /tmp/next-day.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' -H 'X-Shift-Local-Hour: 17' \
            -X POST -d '{"scenario":"working_late"}' "$PREVIEW_URL/v1/shift/daily-adjust" > /tmp/late.json
          jq -e '.daily.daily_output.adjustment=="working_late" and .daily.daily_output.meal.name=="Loaded chicken tikka jacket potato" and .daily.daily_output.workout.minutes==10 and .daily.daily_output.next.kind=="meal" and .daily.daily_output.next.href=="#today-meal"' /tmp/late.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' -H 'X-Shift-Local-Hour: 17' \
            -X POST -d '{"scenario":"next_three_hours"}' "$PREVIEW_URL/v1/shift/daily-adjust" > /tmp/chaos.json
          jq -e '.daily.daily_output.adjustment=="next_three_hours" and .daily.daily_output.workout.minutes==10 and (.daily.daily_output.subhead|contains("Chaos Mode"))' /tmp/chaos.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' -H 'X-Shift-Local-Hour: 17' \
            -X POST -d '{"scenario":"rough_guts"}' "$PREVIEW_URL/v1/shift/daily-adjust" > /tmp/rough-guts.json
          jq -e '.daily.daily_output.adjustment=="rough_guts" and .daily.daily_output.workout.minutes==10 and (.daily.daily_output.subhead|contains("Rough Guts Mode"))' /tmp/rough-guts.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' -H 'X-Shift-Local-Hour: 17' \
            -X POST -d '{"feedback":"love","target":"daily_recommendation","meal_id":"preview-quick-dinner","adjustment":"rough_guts"}' "$PREVIEW_URL/v1/shift/daily-feedback" > /tmp/love.json
          jq -e '.ok==true and (.message|contains("favour")) and ([.daily.daily_output.memory[]|select(contains("loved"))]|length)==1' /tmp/love.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' -H 'X-Shift-Local-Hour: 17' \
            -X POST -d '{"action":"alternative","meal_id":"preview-quick-dinner","option":"takeaway"}' "$PREVIEW_URL/v1/shift/daily-meal" > /tmp/takeaway.json
          jq -e '.ok==true and .daily.daily_output.meal.id=="takeaway-simple" and (.message|contains("Shift has rebuilt"))' /tmp/takeaway.json
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json \
            --command "SELECT COUNT(*) AS feedback_count FROM shift_daily_feedback WHERE user_id=(SELECT id FROM users WHERE email='$email') AND feedback='love'" > /tmp/feedback.json
          jq -e '[.. | objects | select(.feedback_count? == 1)] | length == 1' /tmp/feedback.json
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json \
            --command "SELECT COUNT(*) AS invented FROM shift_treatment_context WHERE user_id=(SELECT id FROM users WHERE email='$email')" > /tmp/blank-treatment.json
          jq -e '[.. | objects | select(.invented? == 0)] | length == 1' /tmp/blank-treatment.json
          grep -Fq "headline:'Tell us what you’re on so tonight can be right.'" member-daily-v3.js
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -X PATCH -d '{"medicineKey":"mounjaro","doseKey":"5mg","durationKey":"weeks"}' \
            "$PREVIEW_URL/v1/shift/treatment-context" > /tmp/treatment.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d '{"mood":"alright","guts":"rough","energy":"empty"}' \
            "$PREVIEW_URL/v1/shift/today/check-in" > /tmp/checkin.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d '{"choiceKey":"eggs-toast"}' "$PREVIEW_URL/v1/shift/today/grub" > /tmp/grub.json
          curl -fsS "${auth[@]}" -H 'content-type: application/json' -H 'X-Shift-Local-Date: 2026-08-21' \
            -d '{"choiceKey":"walk-10"}' "$PREVIEW_URL/v1/shift/today/move" > /tmp/move.json
          jq -e '.meal.name=="Scrambled eggs on toast"' /tmp/grub.json
          jq -e '.activity.name=="Easy walk" and .activity.minutes==10' /tmp/move.json
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json \
            --command "SELECT domain,json_extract(choice_json,'$.name') AS name,json_extract(choice_json,'$.minutes') AS minutes FROM shift_today_choices WHERE user_id=(SELECT id FROM users WHERE email='$email') ORDER BY domain" > /tmp/persisted.json
          jq -e '[.. | objects | select(.domain? == "grub" and .name == "Scrambled eggs on toast")] | length == 1' /tmp/persisted.json
          jq -e '[.. | objects | select(.domain? == "move" and .name == "Easy walk" and .minutes == 10)] | length == 1' /tmp/persisted.json

      - name: Prove the actual member page is served
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$PREVIEW_URL/member/dashboard#today" -o /tmp/member-dashboard.html
          grep -Fq '<title>My Timber Today — isolated preview</title>' /tmp/member-dashboard.html
          grep -Fq 'id="todayActions"' /tmp/member-dashboard.html
          grep -Fq 'Create preview account' /tmp/member-dashboard.html
          grep -Fq 'Sign in to preview' /tmp/member-dashboard.html
          grep -Fq 'member-today-premium-v1.css?v=daily-shift-v2' /tmp/member-dashboard.html
          curl -fsSI "$PREVIEW_URL/member-my-timber-problem-v1.js?v=2" | grep -Eqi '^content-type:.*(javascript|ecmascript)'

      - name: Enable deterministic pilot proof only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const file=process.env.PREVIEW_CONFIG;
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'true',SHIFT_TODAY_MODEL_ENABLED:'false'};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          NODE
          npx wrangler deploy --config "$PREVIEW_CONFIG" >/tmp/pilot-proof-deploy.txt

      - name: Prove R4 proposal confirm audit and one-action kill
        shell: bash
        run: |
          set -euo pipefail
          suffix=$(date +%s%N)
          email="r4-pilot-proof-$suffix@example.test"
          token="r4-pilot-proof-$suffix"
          token_hash=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)
          expires=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          local_date=$(date -u +%F)
          pilot_start=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
          pilot_end=$(date -u -d '+7 day' +%Y-%m-%dT%H:%M:%SZ)
          recipe_id="pilot-proof-recipe-$suffix"
          exercise_id="pilot-proof-exercise-$suffix"

          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --command "INSERT INTO users(email,first_name,last_name,date_of_birth,postcode) VALUES('$email','Pilot','Proof','1980-01-01','M1'); INSERT INTO user_auth(user_id,password_hash,email_verified,email_verified_at) SELECT id,'preview-only',1,'$now' FROM users WHERE email='$email'; INSERT INTO member_status(user_id,lifecycle_stage,membership_status,source,last_activity_at) SELECT id,'active','member','r4_pilot_proof','$now' FROM users WHERE email='$email'; INSERT INTO member_state(user_id,my_why,roadmap,treatment_finder,decision_readiness,preferences) SELECT id,'{\"text\":\"Get life back\"}','{\"protein_target\":120}','{}','{\"stage\":\"ready\"}','{\"food\":{\"quick\":true},\"lifeBack\":{\"priorities\":[\"family time\"]}}' FROM users WHERE email='$email'; INSERT INTO user_sessions(user_id,token_hash,expires_at,last_used_at,created_at) SELECT id,'$token_hash','$expires','$now','$now' FROM users WHERE email='$email';" >/tmp/r4-user-seed.txt

          auth=(-H "Cookie: sst_session=$token" -H 'Content-Type: application/json' -H "X-Shift-Local-Date: $local_date" -H 'X-Shift-Local-Hour: 18')
          initial_status=$(curl -sS -o /tmp/r4-initial-off.json -w '%{http_code}' "${auth[@]}" "$PREVIEW_URL/v1/shift-ai/today/bootstrap")
          test "$initial_status" = 404

          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json --command "SELECT id AS user_id FROM users WHERE email='$email'" >/tmp/r4-user-id.json
          uid=$(jq -r '.. | objects | .user_id? // empty' /tmp/r4-user-id.json | head -n1)
          test -n "$uid"

          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --command "CREATE TABLE IF NOT EXISTS structured_content(id TEXT PRIMARY KEY,content_type TEXT NOT NULL,title TEXT NOT NULL,version INTEGER NOT NULL DEFAULT 1,status TEXT NOT NULL,data_json TEXT NOT NULL,review_json TEXT NOT NULL,updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP);" >/tmp/r4-catalogue-schema.txt
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --command "CREATE TABLE IF NOT EXISTS shift_personal_state(user_id INTEGER PRIMARY KEY,profile_json TEXT NOT NULL DEFAULT '{}',inventory_json TEXT NOT NULL DEFAULT '[]',updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP); INSERT INTO shift_personal_state(user_id,profile_json,inventory_json) VALUES($uid,'{\"routine\":{\"late_finish\":true}}','[]') ON CONFLICT(user_id) DO UPDATE SET profile_json=excluded.profile_json,inventory_json=excluded.inventory_json,updated_at=CURRENT_TIMESTAMP; INSERT INTO progress_entries(user_id,recorded_on,weight_kg,waist_cm,steps,protein_g,sleep_hours,mood_score,source) VALUES($uid,'$local_date',101,110,5000,90,6,3,'r4_pilot_proof'); INSERT INTO shift_today_checkins(user_id,local_date,mood,guts,energy) VALUES($uid,'$local_date','okay','fine','good') ON CONFLICT(user_id,local_date) DO UPDATE SET mood=excluded.mood,guts=excluded.guts,energy=excluded.energy,updated_at=CURRENT_TIMESTAMP; INSERT INTO structured_content(id,content_type,title,version,status,data_json,review_json) VALUES('$recipe_id','recipe','Chicken wrap',1,'published','{\"provenance\":{\"final_v1_acceptance\":{\"accepted\":true}},\"meal_type\":\"dinner\",\"prep_minutes\":5,\"cook_minutes\":7,\"tags\":[\"quick\"],\"ingredients\":[{\"item\":\"chicken\"}],\"nutrition\":{\"status\":\"validated\"}}','{\"status\":\"approved\",\"final_v1\":true}'); INSERT INTO structured_content(id,content_type,title,version,status,data_json,review_json) VALUES('$exercise_id','exercise','Ten-minute walk',1,'published','{\"provenance\":{\"final_v1_acceptance\":{\"accepted\":true}},\"minutes\":10,\"movement_group\":\"walking\",\"serving_groups\":[\"walking\"],\"visual\":{\"status\":\"approved\"}}','{\"status\":\"approved\",\"final_v1\":true}'); INSERT INTO shift_plans(user_id,plan_type,starts_on,status,plan_json) VALUES($uid,'grub','$local_date','active','{\"days\":[{\"meals\":[{\"id\":\"$recipe_id\",\"name\":\"Chicken wrap\"}]}]}'); INSERT INTO shift_plans(user_id,plan_type,starts_on,status,plan_json) VALUES($uid,'fit','$local_date','active','{\"sessions\":[{\"exercises\":[{\"id\":\"$exercise_id\",\"name\":\"Ten-minute walk\"}]}]}'); UPDATE shift_ai_pilot_control SET enabled=1,phase=1,max_members=5,consent_version='shift-ai-r4-pilot-consent-v1',starts_at='$pilot_start',ends_at='$pilot_end',stopped_at=NULL,stop_reason=NULL,updated_at=CURRENT_TIMESTAMP WHERE id=1; INSERT INTO shift_ai_pilot_access(user_id,status,cohort,consent_version,consented_at,consent_evidence_ref,starts_at,ends_at,activated_by) VALUES($uid,'active',1,'shift-ai-r4-pilot-consent-v1','$now','synthetic-r4-proof-$suffix','$pilot_start','$pilot_end','github-actions-r4-proof');" >/tmp/r4-context-seed.txt

          curl -fsS "${auth[@]}" "$PREVIEW_URL/v1/shift-ai/today/bootstrap" >/tmp/r4-bootstrap.json
          jq -e '.ok==true and .feature.model_enabled==false and (.recognition_starts|length)==5' /tmp/r4-bootstrap.json

          curl -fsS "${auth[@]}" -X POST -d '{"message":"I am working late","requested_route":"working-late","available_minutes":15}' "$PREVIEW_URL/v1/shift-ai/today/rebuild/propose" >/tmp/r4-proposal-one.json
          p1=$(jq -r '.proposal_id' /tmp/r4-proposal-one.json)
          test -n "$p1" && test "$p1" != null
          curl -fsS "${auth[@]}" -X POST -d "{\"proposal_id\":\"$p1\",\"confirmed\":true}" "$PREVIEW_URL/v1/shift-ai/today/rebuild/confirm" >/tmp/r4-confirm-one.json
          jq -e '.written==true and .canonical_today==true and .proposal_id=="'"$p1"'"' /tmp/r4-confirm-one.json

          curl -fsS "${auth[@]}" -X POST -d '{"message":"I am working late","requested_route":"working-late","available_minutes":10}' "$PREVIEW_URL/v1/shift-ai/today/rebuild/propose" >/tmp/r4-proposal-two.json
          p2=$(jq -r '.proposal_id' /tmp/r4-proposal-two.json)
          test -n "$p2" && test "$p2" != null && test "$p2" != "$p1"

          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --command "UPDATE shift_ai_pilot_control SET enabled=0,stopped_at=CURRENT_TIMESTAMP,stop_reason='R4_CANDIDATE_KILL_PROOF',updated_at=CURRENT_TIMESTAMP WHERE id=1;" >/tmp/r4-kill.txt

          confirm_status=$(curl -sS -o /tmp/r4-post-kill-confirm.json -w '%{http_code}' "${auth[@]}" -X POST -d "{\"proposal_id\":\"$p2\",\"confirmed\":true}" "$PREVIEW_URL/v1/shift-ai/today/rebuild/confirm")
          bootstrap_status=$(curl -sS -o /tmp/r4-post-kill-bootstrap.json -w '%{http_code}' "${auth[@]}" "$PREVIEW_URL/v1/shift-ai/today/bootstrap")
          propose_status=$(curl -sS -o /tmp/r4-post-kill-propose.json -w '%{http_code}' "${auth[@]}" -X POST -d '{"message":"I am working late"}' "$PREVIEW_URL/v1/shift-ai/today/rebuild/propose")
          test "$confirm_status" = 404 && test "$bootstrap_status" = 404 && test "$propose_status" = 404

          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json --command "SELECT (SELECT COUNT(*) FROM shift_ai_today_audit WHERE user_id=$uid AND event_name='rebuild_proposed') AS proposed_audits,(SELECT COUNT(*) FROM shift_ai_today_audit WHERE user_id=$uid AND event_name='rebuild_confirmed' AND outcome='written_to_my_timber' AND json_extract(result_json,'$.canonical_today')=1) AS confirmed_audits,(SELECT COUNT(*) FROM shift_ai_today_audit WHERE user_id=$uid AND event_name='pilot_gate_failed_closed' AND outcome='pilot_off' AND json_extract(result_json,'$.written')=0) AS killed_audits,(SELECT json_extract(choice_json,'$.proposal_id') FROM shift_today_choices WHERE user_id=$uid AND local_date='$local_date' AND domain='ai_rebuild') AS canonical_proposal,(SELECT COUNT(*) FROM shift_ai_today_proposals WHERE id='$p2' AND confirmed_at IS NOT NULL) AS killed_proposal_writes;" >/tmp/r4-audit-proof.json
          jq -e '[.. | objects | select(.proposed_audits? >= 2 and .confirmed_audits == 1 and .killed_audits >= 3 and .canonical_proposal == "'"$p1"'" and .killed_proposal_writes == 0)] | length == 1' /tmp/r4-audit-proof.json

          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --command "UPDATE shift_ai_pilot_access SET status='revoked',updated_at=CURRENT_TIMESTAMP WHERE user_id=$uid; UPDATE shift_ai_pilot_control SET enabled=0,updated_at=CURRENT_TIMESTAMP WHERE id=1;" >/tmp/r4-proof-sealed.txt
          echo "R4 pilot proof passed on D1 $PREVIEW_D1_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "One-action kill blocked bootstrap, proposal and pending confirmation; full audit and canonical write were proved." >> "$GITHUB_STEP_SUMMARY"

      - name: Return pilot master flag to off
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const file=process.env.PREVIEW_CONFIG;
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'false',SHIFT_TODAY_MODEL_ENABLED:'false'};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          NODE
          npx wrangler deploy --config "$PREVIEW_CONFIG" | tee /tmp/pilot-sealed-deploy.txt
          jq -e '.vars.SHIFT_AI_R4_PILOT_ENABLED=="false" and .vars.SHIFT_TODAY_MODEL_ENABLED=="false"' "$PREVIEW_CONFIG"
          npx wrangler d1 execute DB --remote --config "$PREVIEW_CONFIG" --json --command "SELECT enabled,stop_reason FROM shift_ai_pilot_control WHERE id=1; SELECT COUNT(*) AS active_synthetic_access FROM shift_ai_pilot_access WHERE status='active' AND consent_evidence_ref LIKE 'synthetic-r4-proof-%'; SELECT COUNT(*) AS canonical_audits FROM shift_ai_today_audit WHERE event_name='rebuild_confirmed' AND outcome='written_to_my_timber' AND json_extract(result_json,'$.canonical_today')=1; SELECT COUNT(*) AS killed_audits FROM shift_ai_today_audit WHERE event_name='pilot_gate_failed_closed' AND outcome='pilot_off' AND json_extract(result_json,'$.written')=0;" | tee /tmp/r4-final-sealed-state.json
          jq -e '[.. | objects | select(.enabled? == 0)] | length >= 1' /tmp/r4-final-sealed-state.json
          jq -e '[.. | objects | select(.active_synthetic_access? == 0)] | length >= 1' /tmp/r4-final-sealed-state.json
          jq -e '[.. | objects | select(.canonical_audits? >= 1)] | length >= 1' /tmp/r4-final-sealed-state.json
          jq -e '[.. | objects | select(.killed_audits? >= 3)] | length >= 1' /tmp/r4-final-sealed-state.json

      - name: Publish review instructions
        run: |
          {
            echo ''
            echo 'Use a fresh test email on the registration screen.'
            echo 'Production routes, production D1 and customer records were not touched.'
          echo 'Manual gate: choose a real problem, receive a useful action, save it, and see the next CTA.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish preview result to the draft PR
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- my-timber-today-hosted-preview -->'
          if [ "$JOB_STATUS" = 'success' ]; then
            body="$marker
          ## My Timber Today hosted preview: ready

          The isolated Worker and preview-only D1 both passed:
          - a named dinner was saved as **Scrambled eggs on toast**
          - movement was saved as **Easy walk · 10 min**
          - **Working Late**, **Chaos** and **Rough Guts** rebuilt the joined day
          - preference learning and a consequence-led **Takeaway instead** choice persisted
          - a blank treatment account was not assigned a medicine or dose

          **Open the one-thumb review:** $PREVIEW_URL/member/dashboard#today

          Use a fresh test email. Production routes and live customer data were not touched."
          else
            body="$marker
          ## My Timber Today hosted preview: commissioning failed

          The isolated preview did not pass its automated acceptance run. No production route or live customer record was touched.

          [Open the failed Actions run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          fi
          pr_number=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No open PR found for $GITHUB_REF_NAME; result remains in the job summary."
            exit 0
          fi
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr_number/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh pr comment "$pr_number" --body "$body" >/dev/null
          fi
