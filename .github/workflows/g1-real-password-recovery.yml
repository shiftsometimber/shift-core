name: G1 Real Password Recovery
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/g1-real-password-recovery.yml'
      - 'commissioning-identity-v1.js'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  real-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Acquire dedicated short-lived recovery commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Create disposable verified recovery member and send genuine reset mail
        id: recovery
        shell: bash
        env:
          OIDC: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          API='https://api.shiftsometimber.co.uk'
          SITE='https://shiftsometimber.co.uk'
          EMAIL="shiftsometimber+structured-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@gmail.com"
          OLD_PASSWORD='Shift-Recovery-Old-2026!'
          NEW_PASSWORD='Shift-Recovery-New-2026!'
          FINAL_PASSWORD='Shift-Recovery-Final-2026!'
          mkdir -p g1-real-password-recovery
          echo "Recovery inbox alias: ${EMAIL}"
          echo "After opening the genuine reset link, set the disposable account password to: ${NEW_PASSWORD}"

          registered='false'
          for i in $(seq 1 90); do
            status=$(curl -sS -o /tmp/register.json -w '%{http_code}' \
              -H "Origin: ${SITE}" -H 'Content-Type: application/json' -H "X-Shift-Commissioning-OIDC: ${OIDC}" \
              -X POST "${API}/v1/auth/register" \
              --data "$(jq -nc --arg email "$EMAIL" --arg password "$OLD_PASSWORD" '{email:$email,password:$password,firstName:"DaveRecovery",source:"commissioning-real-recovery"}')")
            if [ "$status" = '201' ]; then registered='true'; break; fi
            test "$status" = '403'
            sleep 4
          done
          test "$registered" = 'true'
          jq -e '.emailVerified == true' /tmp/register.json >/dev/null

          reset_status=$(curl -sS -o /tmp/reset-request.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/request-password-reset" \
            --data "$(jq -nc --arg email "$EMAIL" '{email:$email}')")
          test "$reset_status" = '200'

          old_before=$(curl -sS -o /tmp/old-before.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/login" \
            --data "$(jq -nc --arg email "$EMAIL" --arg password "$OLD_PASSWORD" '{email:$email,password:$password}')")
          test "$old_before" = '200'

          jq -nc --arg proof 'G1_REAL_PASSWORD_RECOVERY_PRODUCTION_V1' --arg email "$EMAIL" \
            '{proof:$proof,status:"WAITING_FOR_GENUINE_INBOX_RESET",email:$email,registration:{status:201,emailVerified:true},resetRequest:{status:200},preResetOldPasswordLogin:{status:200},criterion:"genuine reset email -> genuine reset token -> new login -> authenticated change-password -> logout -> final login"}' \
            > g1-real-password-recovery/report.json

          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "old=$OLD_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "final=$FINAL_PASSWORD" >> "$GITHUB_OUTPUT"
      - name: Wait for genuine inbox reset, then prove full retained recovery lifecycle
        shell: bash
        env:
          EMAIL: ${{ steps.recovery.outputs.email }}
          OLD_PASSWORD: ${{ steps.recovery.outputs.old }}
          NEW_PASSWORD: ${{ steps.recovery.outputs.new }}
          FINAL_PASSWORD: ${{ steps.recovery.outputs.final }}
        run: |
          set -euo pipefail
          API='https://api.shiftsometimber.co.uk'
          SITE='https://shiftsometimber.co.uk'
          changed='false'
          for i in $(seq 1 180); do
            sleep 10
            status=$(curl -sS -c /tmp/recovery-cookies.txt -o /tmp/new-login.json -w '%{http_code}' \
              -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
              -X POST "${API}/v1/auth/login" \
              --data "$(jq -nc --arg email "$EMAIL" --arg password "$NEW_PASSWORD" '{email:$email,password:$password}')")
            if [ "$status" = '200' ]; then changed='true'; break; fi
            test "$status" = '401'
          done
          test "$changed" = 'true'

          old_after=$(curl -sS -o /tmp/old-after.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/login" \
            --data "$(jq -nc --arg email "$EMAIL" --arg password "$OLD_PASSWORD" '{email:$email,password:$password}')")
          test "$old_after" = '401'

          change=$(curl -sS -b /tmp/recovery-cookies.txt -c /tmp/recovery-cookies.txt -o /tmp/change.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/change-password" \
            --data "$(jq -nc --arg currentPassword "$NEW_PASSWORD" --arg password "$FINAL_PASSWORD" '{currentPassword:$currentPassword,password:$password}')")
          test "$change" = '200'

          new_after_change=$(curl -sS -o /tmp/new-after-change.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/login" \
            --data "$(jq -nc --arg email "$EMAIL" --arg password "$NEW_PASSWORD" '{email:$email,password:$password}')")
          test "$new_after_change" = '401'

          logout=$(curl -sS -b /tmp/recovery-cookies.txt -c /tmp/recovery-cookies.txt -o /tmp/logout.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/logout")
          test "$logout" = '200'

          final=$(curl -sS -o /tmp/final-login.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/login" \
            --data "$(jq -nc --arg email "$EMAIL" --arg password "$FINAL_PASSWORD" '{email:$email,password:$password}')")
          test "$final" = '200'

          jq -nc --arg proof 'G1_REAL_PASSWORD_RECOVERY_PRODUCTION_V1' --arg email "$EMAIL" \
            '{proof:$proof,status:"PASS",email:$email,registration:{status:201,emailVerified:true},resetRequest:{status:200,delivery:"genuine_connected_inbox"},postTokenNewPasswordLogin:{status:200},oldPasswordInvalidated:{status:401},authenticatedChangePassword:{status:200},intermediatePasswordInvalidated:{status:401},logout:{status:200},retainedFinalLogin:{status:200},criterion:"genuine reset email -> genuine reset token -> new login -> authenticated change-password -> logout -> final login"}' \
            > g1-real-password-recovery/report.json
          cat g1-real-password-recovery/report.json
      - name: Upload genuine recovery lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-real-password-recovery
          path: g1-real-password-recovery
          if-no-files-found: warn
          retention-days: 30
