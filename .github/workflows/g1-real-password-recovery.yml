name: G1 Real Password Recovery
on:
  pull_request:
    paths:
      - '.github/workflows/g1-real-password-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-real-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Request genuine reset for verified commissioning member
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.shiftsometimber.co.uk'
          SITE='https://shiftsometimber.co.uk'
          EMAIL='shiftsometimber+realverify-31793828102-2@gmail.com'
          mkdir -p g1-real-recovery
          status=$(curl -sS -o /tmp/reset-request.json -w '%{http_code}' \
            -H "Origin: ${SITE}" -H 'Content-Type: application/json' \
            -X POST "${API}/v1/auth/request-password-reset" \
            --data "$(jq -nc --arg email "$EMAIL" '{email:$email}')")
          test "$status" = '200'
          jq -e '.ok == true' /tmp/reset-request.json >/dev/null
          jq -nc --arg proof 'G1_REAL_PASSWORD_RECOVERY_REQUEST_V1' --arg email "$EMAIL" --argjson requestStatus "$status" \
            '{proof:$proof,email:$email,request:{status:$requestStatus},criterion:"Existing verified production member -> real reset request -> genuine inbox delivery; token-use/password-change/login retention remains separate evidence"}' \
            > g1-real-recovery/report.json
          cat g1-real-recovery/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-real-password-recovery-request
          path: g1-real-recovery
          if-no-files-found: warn
          retention-days: 30
