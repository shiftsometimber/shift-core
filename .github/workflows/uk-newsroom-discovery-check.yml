name: Verify UK newsroom discovery preview
on:
  push:
    branches: [feat/uk-newsroom-discovery-20260913]
    paths: ['radar-newsroom-discovery-v1.js', 'worker-entry-v6.js', 'tests/radar-newsroom-discovery-v1.test.mjs', '.github/workflows/uk-newsroom-discovery-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check scoped discovery and editorial behaviour
        run: |
          node --test tests/radar-newsroom-discovery-v1.test.mjs tests/uk-depth-editorial.test.mjs tests/radar-newsroom-filters-v1.test.mjs tests/radar-uk-editorial-v1.test.mjs tests/radar-newsroom-page-v1.test.mjs tests/hq-radar-review-queue-v1.test.mjs tests/shift-ai-newsroom-wire-v1.test.mjs tests/radar-freshness-v2.test.mjs
          node my-timber-navigation-gate.mjs
          node my-timber-final-source-gate.mjs
          node g5-012-login-fastpath-gate.mjs
      - name: Check published reading destinations
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {NEWSROOM_READING} from './radar-newsroom-discovery-v1.js';
          for(const slug of new Set(Object.values(NEWSROOM_READING).flat().map(row=>row[2]))) {
            const response=await fetch('https://shiftsometimber.co.uk/medicine-news/uk-archive-'+slug,{signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200,slug);
            const html=await response.text();assert.ok(!html.includes('<h1>Update not found</h1>'),slug);
            console.log('PASS published destination: '+slug);
          }
          JS
