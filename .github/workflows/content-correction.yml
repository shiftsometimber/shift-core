name: Reviewed article correction
on:
  push:
    branches: [codex/full-website-content-20261002]
    paths: [editorial/content-audit/**, .github/workflows/content-correction.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test editorial/content-audit/corrections.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/content-tools" --no-audit --no-fund playwright@1.58.2
      - run: '"$RUNNER_TEMP/content-tools/node_modules/.bin/playwright" install --with-deps chromium'
      - run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/content-tools/node_modules/playwright" node editorial/content-audit/preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-correction-preview-${{ github.sha }}
          path: content-correction-preview/
  correct:
    needs: preview
    if: github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund
      - run: node editorial/content-audit/publish-corrections.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-correction-live-${{ github.sha }}
          path: content-correction-proof/
          retention-days: 90
