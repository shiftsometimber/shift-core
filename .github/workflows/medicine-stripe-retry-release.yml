name: Release medicine Stripe retry repair
on:
  push:
    branches: [fix/medicine-stripe-retry-20260913]
    paths: ['.github/workflows/medicine-stripe-retry-release.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Guard approved main and bounded source change
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = bee0a1d18cde7113a4aaa66897b4b5f64431e7b4
          python3 - <<'PY'
          import subprocess
          allowed={'medicine-commerce-v1.js','tests/medicine-stripe-retry-v1.test.mjs','verification/rec040-stripe-preservation.mjs','docs/rec040-stripe-retry.md','.github/workflows/medicine-stripe-retry-release.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only','bee0a1d18cde7113a4aaa66897b4b5f64431e7b4'],text=True).splitlines())
          assert changed <= allowed, changed-allowed
          PY
      - run: npm ci --no-audit --no-fund
      - name: Verify scoped changes and existing source gates
        run: |
          node --test tests/medicine-stripe-retry-v1.test.mjs tests/medicine-commerce-v1.test.mjs tests/commerce-stripe-v1.test.mjs
          node --test tests/grub-programme-v1.test.mjs tests/afternoon-ticket-c-fit.test.mjs tests/my-journey-v1.test.mjs tests/my-journey-checkin-v1.test.mjs tests/my-journey-observation-v1.test.mjs tests/adaptive-today-v1.test.mjs
          node my-timber-navigation-gate.mjs
          node my-timber-final-source-gate.mjs
          node g5-012-login-fastpath-gate.mjs
      - name: Guard current runtime and capture live baseline
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > editorial-deployment-before.json
          python3 - <<'PY'
          import json
          latest=max(json.load(open('editorial-deployment-before.json')),key=lambda x:x['created_on'])
          assert len(latest['versions'])==1 and latest['versions'][0]['version_id']=='dc3b60dd-f158-4a97-9d09-1d9984e86969', 'Worker moved; refuse stale release'
          PY
          node verification/rec035-newsroom-live.mjs before
          node verification/rec039-editorial-live.mjs before
          node verification/rec040-stripe-preservation.mjs before
      - name: Deploy medicine Stripe retry repair
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify released pages and preservation
        run: |
          for attempt in 1 2 3 4; do
            if node verification/rec035-newsroom-live.mjs after && node verification/rec039-editorial-live.mjs after && node verification/rec040-stripe-preservation.mjs after; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REC-040-stripe-retry-release
          path: |
            editorial-deployment-before.json
            newsroom-public-before.json
            newsroom-live-proof.json
            editorial-before.json
            editorial-live-proof.json
            stripe-preservation-before.json
            stripe-preservation-live.json
