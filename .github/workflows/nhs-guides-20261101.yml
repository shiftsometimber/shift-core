name: Seven NHS and private comparison guides
on:
  push:
    branches: [release/nhs-guides-20261101]
    paths: ['nhs-guides-20261101/**', '.github/workflows/nhs-guides-20261101.yml']
permissions:
  contents: read
concurrency:
  group: ${{ contains(github.event.head_commit.message, '[pages preflight]') && 'nhs-guides-read-only-preflight' || 'cloudflare-production-promote' }}
  cancel-in-progress: false
jobs:
  selected-pages:
    if: "!contains(github.event.head_commit.message, '[audit only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read current owners and page structures
        if: contains(github.event.head_commit.message, '[pages preflight]')
        run: node nhs-guides-20261101/capture.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Check and release Seven NHS and private comparison guides
        if: "!contains(github.event.head_commit.message, '[pages preflight]')"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix selected-pages-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node --check nhs-guides-20261101/runtime.mjs
          node --check nhs-guides-20261101/deploy.mjs
          node --test nhs-guides-20261101/*.test.mjs
          if [[ "${{ contains(github.event.head_commit.message, '[pages preview]') }}" == "true" ]]; then
            node nhs-guides-20261101/capture.mjs
            node nhs-guides-20261101/source-preview.mjs
          else
            node nhs-guides-20261101/deploy.mjs
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELECTED_PAGES_PREVIEW_ONLY: ${{ contains(github.event.head_commit.message, '[pages preview]') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nhs-guides-${{ github.run_id }}
          path: nhs-guides-evidence/
          retention-days: 90
