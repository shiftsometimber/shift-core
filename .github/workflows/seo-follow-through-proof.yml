name: Owner-approved sitewide SEO v3 proof
on:
  push:
    branches: [seo/approved-follow-through-20261006]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Validate exact source and release composition
        run: node --input-type=module -e "import {validateGrowthSource} from './release/growth-scope.mjs';validateGrowthSource()"
      - name: Verify exact paragraphs, indexing and privacy boundaries
        run: node --test tests/seo-follow-through-release.test.mjs tests/sitewide-seo-release.test.mjs tests/public-seo-programme.test.mjs tests/ai-fast-stream.test.mjs tests/shift-ai-edge-proof.test.mjs tests/ai-stream-reliability.test.mjs
      - name: Verify complete public handler and preserve every archive
        run: |
          git worktree add --detach /tmp/seo-v3-baseline b4392ca89d9388352c0b29117488d44e9886c6c1
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/seo-v3-baseline/node_modules
          BASELINE_WORKER=/tmp/seo-v3-baseline/shift-coach/worker.mjs node scripts/verify-seo-follow-through.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: seo-follow-through-proof
          path: seo-follow-through-proof/
          if-no-files-found: error
