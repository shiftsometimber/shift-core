name: Guarded nightly article correction
on:
  push:
    branches: [fix/nightly-article-review-20261027]
permissions:
  contents: read
jobs:
  correct:
    if: github.actor_id == '315011648' || github.actor == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Verify exact live version and candidate
        run: |
          node --check babylove/correct-mounjaro-availability-20261027.mjs
          node babylove/correct-mounjaro-availability-20261027.mjs --check
      - name: Apply guarded availability correction
        run: node babylove/correct-mounjaro-availability-20261027.mjs --apply
      - name: Verify production article
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 20 -D nightly-article-proof/live-headers.txt -o nightly-article-proof/live.html https://shiftsometimber.co.uk/articles/what-to-eat-on-mounjaro
          grep -Fq 'SHIFT does not currently provide or book prescribing.' nightly-article-proof/live.html
          grep -Fq '"datePublished":"2026-10-27T04:00:09.979Z"' nightly-article-proof/live.html
          grep -Eiq '^x-shift-article-source: *babylovegrowth' nightly-article-proof/live-headers.txt
          ! grep -Fq 'prescribing work through regulated partners' nightly-article-proof/live.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-article-availability-correction
          path: nightly-article-proof/
          retention-days: 14
