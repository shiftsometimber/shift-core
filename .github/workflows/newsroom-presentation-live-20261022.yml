name: Publish approved Newsroom presentation
on:
  push:
    branches: [release/newsroom-presentation-20261022]
    paths: [previews/newsroom-presentation/**, .github/workflows/newsroom-presentation-live-20261022.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: newsroom-presentation-live-20261022
  cancel-in-progress: false
jobs:
  publish-and-check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      NEWSROOM_EVIDENCE_DIR: newsroom-presentation-live-evidence
      NEWSROOM_RELEASE: 20261022-newsroom-live-v1
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: previews/newsroom-presentation
          fetch-depth: 4
      - name: Trust this checkout inside the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Capture the current published index once
        run: node --input-type=module -e "import{writeFileSync}from'node:fs';const r=await fetch('https://shiftsometimber.co.uk/shift-newsroom',{signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('Could not read Newsroom');writeFileSync('previews/newsroom-presentation/source-fixture.html',await r.text())"
      - name: Verify approved source and production boundaries
        run: |
          node previews/newsroom-presentation/build.cjs
          git diff --exit-code -- previews/newsroom-presentation/style.mjs previews/newsroom-presentation/client.mjs
          node --test previews/newsroom-presentation/test.mjs previews/newsroom-presentation/production.test.mjs
      - name: Match the browser client
        run: npm install --prefix "$RUNNER_TEMP/newsroom-browser" playwright@1.58.2 --no-audit --no-fund
      - name: Stage approved Newsroom without changing public routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node previews/newsroom-presentation/deploy-live.mjs stage
      - name: Check hosted release before public activation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/newsroom-browser/node_modules/playwright
          NEWSROOM_ORIGIN: https://shift-newsroom-presentation-20261022.matobrien.workers.dev
          NEWSROOM_CHECK_LINKS: '0'
        run: node previews/newsroom-presentation/check-browser.cjs
      - name: Activate only the two Newsroom route families
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/newsroom-presentation/deploy-live.mjs activate
      - name: Verify the actual public Newsroom on mobile and desktop
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/newsroom-browser/node_modules/playwright
          NEWSROOM_ORIGIN: https://shiftsometimber.co.uk
        run: node previews/newsroom-presentation/check-browser.cjs
      - name: Restore only this release's routes if acceptance fails
        if: ${{ failure() || cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node previews/newsroom-presentation/deploy-live.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsroom-presentation-live-${{ github.sha }}
          path: newsroom-presentation-live-evidence/
          retention-days: 90
