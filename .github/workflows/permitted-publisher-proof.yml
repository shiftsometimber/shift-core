name: Permitted Publisher Formats Proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'radar-*.js'
      - 'tests/radar*.test.mjs'
      - 'tests/source-reuse*.test.mjs'
      - 'scripts/verify-shift-take*.mjs'
      - 'docs/source-permissions-nice-gphc.md'
      - '.github/workflows/permitted-publisher-proof.yml'
permissions:
  contents: read
concurrency:
  group: permitted-publisher-formats-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify ordinary tracked source without repository or production writes
        run: |
          mkdir -p publisher-proof
          test ! -f scripts/publisher-format-edits.json
          git rev-parse HEAD > publisher-proof/candidate-sha.txt
      - run: npm ci --no-audit --no-fund
      - name: Real newsroom, source, permission and publication regressions
        run: |
          set -o pipefail
          node --test tests/radar*.test.mjs tests/source-reuse*.test.mjs | tee publisher-proof/regressions.tap
          node radar-scheduled-scan-staging.mjs | tee publisher-proof/scheduled-source-fixtures.log
      - name: Compile without production credentials or deployment
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir publisher-proof/worker | tee publisher-proof/compile.log
      - name: Retain tested source and readable change
        if: always()
        run: |
          mkdir -p publisher-proof
          git diff 45458894d07a6f56554b57328c152264250203f6 -- radar-*.js tests/source-reuse*.mjs tests/radar-auto-news-publisher-permissions.test.mjs scripts/verify-shift-take*.mjs > publisher-proof/candidate.patch
          cp radar-permitted-content-v1.js docs/source-permissions-nice-gphc.md publisher-proof/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permitted-publisher-proof-${{ github.event.pull_request.head.sha }}
          path: publisher-proof/
          retention-days: 14
