name: Free support SP1 ownership inspection
on:
  push:
    branches: [design/support-sp1-20261031]
    paths: ['release/support-sp1-20261031/**', '.github/workflows/support-sp1-20261031.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-readonly-support-sp1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check SP1 source syntax
        run: |
          node --check release/support-sp1-20261031/layout.mjs
          node --check release/support-sp1-20261031/styles.mjs
          node --check release/support-sp1-20261031/overlay.mjs
          node --check release/support-sp1-20261031/check.mjs
          node --check release/support-sp1-20261031/deploy.mjs
      - name: Install the locked asset hashing dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Stage and verify Free support SP1
        run: node release/support-sp1-20261031/deploy.mjs
        env:
          SP1_INSPECT_ONLY: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-sp1-${{ github.run_id }}
          path: support-sp1-evidence/
          retention-days: 90
