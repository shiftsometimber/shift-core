k.test.mjs tests/root-share-stream.test.mjs tests/root-share-speed-rollback.test.mjs"},{"id":"member-consent","body":"node --test tests/member-consent-repair-composition.test.mjs tests/photo-tracking-choice.test.mjs tests/request-evidence-privacy.test.mjs"},{"id":"finite-growth","body":"node --test tests/finite-growth-composition.test.mjs tests/growth-finite-response-policy.test.mjs tests/public-seo-technical.test.mjs"}]);
          const poolId="integration-source";
          const proofDir=join(process.env.RUNNER_TEMP||tmpdir(),'ci-source-proof',poolId);
          const programmeGrowthToken=poolId==='programme'?process.env.GITHUB_TOKEN:undefined;if(poolId==='programme')delete process.env.GITHUB_TOKEN;
          const maxConcurrent=2;
          mkdirSync(proofDir,{recursive:true});
          if(tasks.length===0||new Set(tasks.map(t=>t.id)).size!==tasks.length||tasks.some(t=>!/^[-a-z0-9]+$/.test(t.id)||typeof t.body!=='string'||!t.body))throw Error('Finite original command manifest required');
          const now=()=>new Date().toISOString(),events=[],children=new Map();
          const results=tasks.map(task=>({id:task.id,bodySha256:createHash('sha256').update(task.body).digest('hex'),status:'queued',pid:null,startedAt:null,finishedAt:null,exitCode:null,signal:null}));
          let active=0,nextIndex=0,cancelled=null,phase='hydrating',finishedAt=null;
          let evidenceFailed=false,sourceAfter=null,sourceUnchanged=false;const evidenceErrors=[];
