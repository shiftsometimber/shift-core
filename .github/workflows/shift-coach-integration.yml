name: Shift AI real-account integration candidate
on:
  push:
    branches: [live/shift-ai-coaching-20261002]
    paths: [shift-coach/**, wrangler.coaching.jsonc, .github/workflows/shift-coach-integration.yml]
  pull_request:
    paths: [shift-coach/**, wrangler.coaching.jsonc, .github/workflows/shift-coach-integration.yml, ask-timber-v1.js, docs/my-timber-detail-upgrade-20261012.md, docs/my-timber-patterns-20261012.md, docs/my-timber-progress-journey-20261012.md, docs/my-timber-progress-journey-20261012.receipt.json, frontend/member/api-adapter-v33d.js, frontend/member/member-progress-v1.js, member-daily-v2.js, member-experience/entry.mjs, member-experience/food-diary-client.mjs, member-experience/grub-runtime.mjs, member-experience/health-routes.mjs, member-experience/journey-portability.mjs, member-experience/progress-journey.mjs, member-experience/staging/verify-treatment-detail.mjs, member-experience/tests/journey-portability.test.mjs, member-experience/tests/progress-journey.test.mjs, member-experience/tests/treatment-detail.test.mjs, member-experience/tests/treatment-patterns.test.mjs, member-experience/treatment-detail.mjs, member-experience/treatment-page.mjs, member-experience/treatment-patterns.mjs, member-experience/treatment-routes.mjs, my-journey-v1.js, privacy-health-erasure-route-v1.js, shift-visualise-v1.js, tests/progress-charts.test.mjs, tests/progress-photo-journey.test.mjs, member-experience/public-preservation.mjs, release/support-recovery-preservation.mjs, tests/support-recovery-20261011.test.mjs, release/contact-rollback-runtime.mjs, tests/contact-rollback-runtime.test.mjs, docs/contact-rollback-evidence-20261012.json, shift-coach/recover-cancelled-release.mjs, release/root-share-preservation-rollback.mjs, release/root-share-completion-scope.mjs]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci --no-audit --no-fund
      - name: Verify exact retained photo acceptance maintenance
        run: node --test tests/photo-acceptance-maintenance-composition.test.mjs tests/rendered-member-acceptance-support.test.mjs
      - name: Verify exact approved root sharing preservation and restoration
        run: node --test tests/root-share-public-preservation.test.mjs tests/root-share-preservation-rollback.test.mjs tests/root-share-completion-composition.test.mjs
      - name: Verify bounded London private-photo date correction
        run: node --test tests/photo-calendar.test.mjs tests/photo-calendar-composition.test.mjs
      - name: Verify exact approved homepage sharing repair
        run: node --test tests/root-share-preview.test.mjs tests/root-share-preview-composition.test.mjs tests/root-share-preview-rollback.test.mjs tests/root-share-preview-transport.test.mjs tests/root-share-transport-rollback.test.mjs tests/root-share-stream.test.mjs tests/root-share-speed-rollback.test.mjs
      - name: Verify bounded member consent source and request-evidence privacy
        run: node --test tests/member-consent-repair-composition.test.mjs tests/photo-tracking-choice.test.mjs tests/request-evidence-privacy.test.mjs
      - name: Verify exact approved finite growth and retained obesity assertions
        run: node --test tests/finite-growth-composition.test.mjs tests/growth-finite-response-policy.test.mjs tests/public-seo-technical.test.mjs
      - run: node shift-coach/scope.mjs
        env:
          SHIFT_COACH_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node --test shift-coach/integration.test.mjs shift-coach/release.test.mjs shift-coach/public-font-delivery.test.mjs shift-coach/cancelled-release-recovery.test.mjs tests/tablet-routine.test.mjs tests/my-health-plan-v2.test.mjs tests/member-record-reliability.test.mjs tests/transactional-mail-reliability.test.mjs tests/auth-mail-delivery-reliability.test.mjs tests/member-signup-alert.test.mjs tests/my-journey-checkin-v1.test.mjs tests/my-journey-observation-v1.test.mjs tests/commerce-stripe-v1.test.mjs
      - name: Verify exact original and coaching release sources
        run: |
          node --input-type=module -e "import {validateGrowthSource} from './release/growth-scope.mjs'; validateGrowthSource()"
          node scripts/b1-release-scope.mjs
      - run: node --test member-experience/tests/*.test.mjs tests/member-auth-regression.test.mjs tests/my-journey-v1.test.mjs tests/promise-accuracy.test.mjs tests/app-layout-live.test.mjs tests/shared-footer.test.mjs
      - run: npx wrangler deploy --dry-run --config wrangler.coaching.jsonc --outdir "$RUNNER_TEMP/coaching-bundle"
      - run: npm install --prefix "$RUNNER_TEMP/coaching-workerd" --no-audit --no-fund wrangler@4.146.0
      - name: Verify exact compiled My Treatment assets and completed rollback chain
        env:
          RUN_TREATMENT_COMPILED_PROOF: 'true'
          WRANGLER_SEND_METRICS: 'false'
          TREATMENT_MINIFLARE: ${{ runner.temp }}/coaching-workerd/node_modules/miniflare
        run: node --test tests/my-treatment-compiled-control.test.mjs tests/my-treatment-rollback-runtime.test.mjs tests/my-treatment-compiled-composition.test.mjs
      - name: Exercise full compiled Worker on local workerd and D1
        env:
          COACHING_MINIFLARE: ${{ runner.temp }}/coaching-workerd/node_modules/miniflare
          COACHING_WORKER_BUNDLE: ${{ runner.temp }}/coaching-bundle/worker.js
          COACHING_PROOF_DIR: ${{ runner.temp }}/coaching-proof
        run: node shift-coach/workerd-proof.cjs
      - run: npm install --prefix "$RUNNER_TEMP/coaching-qa" --no-audit --no-fund playwright@1.63.0
      - run: "$RUNNER_TEMP/coaching-qa/node_modules/.bin/playwright install --with-deps chromium"
      - name: Verify My Timber progress journey with synthetic account records
        env:
          TREATMENT_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/coaching-qa/package.json
          TREATMENT_DETAIL_PROOF_DIR: ${{ runner.temp }}/coaching-proof/my-timber-progress-journey
        run: |
          node --test tests/progress-charts.test.mjs tests/progress-photo-journey.test.mjs member-experience/tests/progress-journey.test.mjs member-experience/tests/journey-portability.test.mjs tests/contact-rollback-runtime.test.mjs
          node member-experience/staging/verify-treatment-detail.mjs
      - name: Exercise synthetic accounts through the actual session-authenticated coaching routes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/coaching-qa/node_modules/playwright
          COACHING_PROOF_DIR: ${{ runner.temp }}/coaching-proof
        run: |
          node shift-coach/member-record-browser.mjs
          node tests/tablet-routine-browser.mjs
          node shift-coach/browser-proof.mjs
          node shift-coach/full-page-proof.mjs
          node shift-coach/public-trust-browser.mjs
          node shift-coach/public-font-browser-proof.mjs
          COACHING_PROOF_DIR="$RUNNER_TEMP/coaching-phantom-proof" node shift-coach/phantom-members.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shift-coach-integration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coaching-proof/
            ${{ runner.temp }}/coaching-phantom-proof/
          retention-days: 30
