          save();
          function stop(signal){if(cancelled)return;cancelled=signal;process.exitCode=1;record('pool-cancelled',{signal});for(const child of children.values())if(child.pid){try{process.kill(-child.pid,'SIGTERM');}catch(error){if(error.code!=='ESRCH')record('signal-delivery-failed',{code:error.code??'UNKNOWN'});}}}
