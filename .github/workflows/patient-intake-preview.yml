name: SHIFT patient intake isolated preview
on:
  push:
    branches: [preview/shift-patient-intake-20260913]
permissions:
  contents: read
concurrency:
  group: shift-patient-intake-preview
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Verify candidate and legacy payment flow
        run: node --test tests/patient-intake-v2.test.mjs tests/medicine-purchase-e2e.test.mjs tests/medicine-commerce-v1.test.mjs tests/medicine-stripe-retry-v1.test.mjs | tee patient-intake-tests.txt
      - name: Enforce isolated preview configuration
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict'),c=JSON.parse(fs.readFileSync('preview/patient-intake/wrangler.json'));
          assert.equal(c.name,'shift-patient-intake-preview');
          assert.deepEqual(Object.keys(c).sort(),['name','main','compatibility_date','workers_dev','preview_urls','assets'].sort());
          assert.equal(c.main,'worker.js');assert.deepEqual(c.assets,{directory:'./public',binding:'PREVIEW_ASSETS',run_worker_first:true,html_handling:'none'});
          JS
          node preview/patient-intake/build.mjs
      - name: Publish synthetic preview only
        run: npx wrangler deploy --config preview/patient-intake/wrangler.json 2>&1 | tee patient-intake-preview-deploy.txt
      - name: Verify published preview routing
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          (async()=>{const url=fs.readFileSync('patient-intake-preview-deploy.txt','utf8').match(/https:\/\/shift-patient-intake-preview\.[a-z0-9-]+\.workers\.dev/)[0];
          for(const path of ['/patient-intake','/treatment-checkout','/phone.html','/patient-intake.js','/demo.js']){const r=await fetch(url+path);assert.equal(r.status,200,path);assert.ok(r.headers.get('content-security-policy').includes("connect-src 'none'"));}
          assert.equal((await fetch(url+'/v1/patient-intake',{method:'POST',body:'{}'})).status,405);
          fs.writeFileSync('patient-intake-preview-http.json',JSON.stringify({url,readOnly:true,externalConnectionsBlocked:true,productionBindings:0},null,2));})();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patient-intake-preview-evidence
          path: |
            patient-intake-tests.txt
            patient-intake-preview-http.json
            patient-intake-preview-deploy.txt
