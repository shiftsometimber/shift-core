name: Snapshot evidence article for bounded repair
on:
  push:
    branches: [fix/evidence-based-article-20261003]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Read exact public article row
        run: |
          mkdir -p evidence-article-snapshot
          npx wrangler d1 execute shift-core-db --remote --json --command "SELECT id,title,slug,category,author,status,summary,body,seo_title,publish_at FROM knowledge_articles WHERE slug='evidence-based-weight-loss'" > evidence-article-snapshot/row.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('evidence-article-snapshot/row.json')
          data=json.loads(p.read_text())
          rows=data[0].get('results',[]) if data else []
          assert len(rows)==1 and rows[0]['status']=='published'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-article-snapshot-${{ github.sha }}
          path: evidence-article-snapshot/
          retention-days: 2
