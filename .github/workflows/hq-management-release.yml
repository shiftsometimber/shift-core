name: HQ Management Release
on:
  pull_request:
    paths: ['hq-management*', 'hq-ai-v2.js', 'worker.js', '.github/workflows/hq-management-release.yml']
  push:
    branches: [main]
    paths: ['hq-management*', '.github/workflows/hq-management-release.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --ignore-scripts
      - run: node hq-management-release-gate.mjs
      - run: node hq-management-acceptance.mjs
      - run: node --test tests/hq-commerce-content-v1.test.mjs tests/hq-catalogue-v1.test.mjs
      - run: npx wrangler deploy --dry-run --outdir /tmp/hq-build
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --ignore-scripts
      - name: Require current main and approved payload
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node hq-management-release-gate.mjs
      - name: Capture rollback and public preservation
        run: |
          npx wrangler deployments list --json > deployment-before.json
          node member-experience/public-preservation.mjs public-before.json
      - name: Deploy the scoped HQ runtime
        id: deploy
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const source=readFileSync('release/member-runtime-deploy.mjs','utf8');
          if(!source.includes("const output=cli('deploy');"))throw new Error('Deployment helper changed');
          writeFileSync('release/hq-deploy-generated.mjs',source.replace("const output=cli('deploy');","const output=cli('deploy','--keep-vars');"));
          JS
          node release/hq-deploy-generated.mjs
      - name: Verify private reporting boundary and HQ CORS
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for(const path of ['/v1/hq/management/report','/v1/hq/management/export']){
            const r=await fetch('https://api.shiftsometimber.co.uk'+path,{method:path.endsWith('export')?'POST':'GET',headers:{Origin:'https://hq.shiftsometimber.co.uk','Content-Type':'application/json'},...(path.endsWith('export')?{body:'{}'}:{})});
            assert.equal(r.status,401);assert.equal(r.headers.get('access-control-allow-origin'),'https://hq.shiftsometimber.co.uk');
          }
          console.log('PASS live reporting requires authentication and retains HQ-only CORS');
          JS
      - name: Verify public pages preserved
        run: node member-experience/public-preservation.mjs public-after.json public-before.json
      - name: Roll back owned runtime on verification failure
        if: failure() && steps.deploy.outcome == 'success'
        run: node release/member-details-rollback.mjs
      - name: Retain release and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-management-release-${{ github.sha }}
          path: |
            deployment-before.json
            public-before.json
            public-after.json
            b1-runtime-release/
