name: HQ Management Release
on:
  pull_request:
    paths: ['hq-management*', 'wrangler.hq-management.jsonc', 'hq-ai-v2.js', 'worker.js', '.github/workflows/hq-management-release.yml']
  push:
    branches: [main]
    paths: ['hq-management*', 'wrangler.hq-management.jsonc', '.github/workflows/hq-management-release.yml']
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.nvmrc'}
      - run: npm ci --ignore-scripts
      - run: node hq-management-release-gate.mjs
      - run: node hq-management-gateway-acceptance.mjs
      - run: node --test tests/hq-commerce-content-v1.test.mjs tests/hq-catalogue-v1.test.mjs
      - run: npx wrangler deploy --config wrangler.hq-management.jsonc --dry-run --outdir /tmp/hq-build
  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.nvmrc'}
      - run: npm ci --ignore-scripts
      - name: Require current main and approved payload
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          node hq-management-release-gate.mjs
      - name: Capture unchanged public runtime and responses
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > deployment-before.json
          node hq-management-public-preservation.mjs public-before.json
      - name: Deploy isolated HQ endpoints
        id: deploy
        run: node hq-management-deploy.mjs
      - name: Verify private reporting boundary and HQ CORS
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for(const path of ['/v1/hq/management/report','/v1/hq/management/export','/v1/hq/management/users/1']){
            const method=path.endsWith('export')?'POST':path.includes('/users/')?'PATCH':'GET';
            const r=await fetch('https://api.shiftsometimber.co.uk'+path,{method,headers:{Origin:'https://hq.shiftsometimber.co.uk','Content-Type':'application/json'},...(method!=='GET'?{body:'{}'}:{})});
            assert.equal(r.status,401);assert.equal(r.headers.get('access-control-allow-origin'),'https://hq.shiftsometimber.co.uk');
          }
          console.log('PASS live reporting and staff changes require authentication; HQ-only CORS');
          JS
      - name: Verify public runtime and exact responses unchanged
        run: |
          npx wrangler deployments list --config wrangler.jsonc --json > deployment-after.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const latest=p=>JSON.parse(readFileSync(p)).toSorted((a,b)=>Date.parse(b.created_on)-Date.parse(a.created_on))[0];
          assert.equal(latest('deployment-before.json').id,latest('deployment-after.json').id,'Public runtime moved during isolated HQ release');
          JS
          node hq-management-public-preservation.mjs public-after.json public-before.json
      - name: Roll back only the owned HQ endpoints on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: node hq-management-deploy.mjs --rollback
      - name: Retain release and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-management-release-${{ github.sha }}
          path: |
            deployment-before.json
            deployment-after.json
            public-before.json
            public-after.json
            b1-runtime-release/
