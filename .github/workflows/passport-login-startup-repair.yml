name: Apply scoped Passport login startup correction
on:
  push:
    branches: ['feat/health-passport-v1-20260919']
    paths: ['.github/workflows/passport-login-startup-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'shiftsometimber/shift-core' && github.ref == 'refs/heads/feat/health-passport-v1-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Replace only the exact reviewed private-product startup line
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          p=pathlib.Path('frontend/member/member-product-v33d.js')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='3b519d725c6b7bc294da479480497b5d17f17038','Source moved; reconcile instead of overwrite'
          text=p.read_text()
          old="if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',bootProduct,{once:true});else bootProduct();"
          new="""// The sign-in form owns authentication. Private product controls must not
          // issue their unauthenticated self-redirect while that form is still open.
          function bootProductWhenReady(){
           const authEntry=/^\\/member-(?:login|register)(?:\\.html)?\\/?$/.test(location.pathname);
           if(!authEntry||document.body.classList.contains('member-ready')){bootProduct();return}
           let started=false;
           const observer=new MutationObserver(()=>{
            if(started||!document.body.classList.contains('member-ready'))return;
            started=true;observer.disconnect();bootProduct();
           });
           observer.observe(document.body,{attributes:true,attributeFilter:['class']});
          }
          if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',bootProductWhenReady,{once:true});else bootProductWhenReady();"""
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          assert p.read_text().replace(new,old)==text
          PY
          node --check frontend/member/member-product-v33d.js
          node --test health-passport/login-startup.test.mjs
      - name: Commit the single verified file to this same preview branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/health-passport-v1-20260919 | cut -f1)" = "$GITHUB_SHA"
          git add -- frontend/member/member-product-v33d.js
          test "$(git diff --cached --name-only)" = 'frontend/member/member-product-v33d.js'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Delay private product startup until sign-in actually completes'
          git push origin HEAD:refs/heads/feat/health-passport-v1-20260919
