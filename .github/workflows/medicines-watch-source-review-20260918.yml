name: Medicines Watch source review capture
on:
  push:
    branches: [fix/medicines-watch-wegovy-review-20260918]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Capture exact monitored source responses for factual review
        continue-on-error: true
        run: node scripts/watch-source-review-capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicines-watch-source-review-20260918
          path: watch-source-capture/
          if-no-files-found: error
          retention-days: 30
