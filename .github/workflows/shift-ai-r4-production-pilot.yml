name: Shift AI R4 All Current Members

on:
  push:
    branches: [codex/my-timber-adaptive-day-v1]
    paths:
      - '.github/workflows/shift-ai-r4-production-pilot.yml'
      - 'shift-ai-live-today-v1.js'
      - 'commissioning-identity-v1.js'
      - 'commissioning-ops-v1.js'

permissions:
  contents: read
  id-token: write

concurrency:
  group: shift-ai-r4-production-pilot
  cancel-in-progress: false

jobs:
  deploy-and-expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_CONFIG: wrangler.shift-ai-r4-production.generated.jsonc
      PRODUCTION_D1_ID: 88f40aed-cb23-4372-8c94-8a73f48bc847
      COMMISSION_URL: https://api.shiftsometimber.co.uk/v1/commissioning/shift-ai-r4-pilot
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version-file: '.nvmrc'}
      - name: Require production authority
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
      - name: Install and prove locked candidate
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check worker-entry-v6.js
          node --check shift-ai-live-today-v1.js
          node --check commissioning-identity-v1.js
          node --check commissioning-ops-v1.js
          npm run test:shift-ai-live-today
          node tests/adaptive-today-source-gate.mjs
          git diff --exit-code 181baa5 -- worker-entry-v6.js member-product-v8.js frontend/member/api-adapter-v33d.js
          test "$(git diff --name-only 181baa5 -- migrations | wc -l)" -eq 0
      - name: Bind production dark with all-member audience
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,''));
          const db=config.d1_databases?.find(item=>item.binding==='DB');
          if(config.name!=='shift-core'||db?.database_id!==process.env.PRODUCTION_D1_ID)throw new Error('production binding mismatch');
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'false',SHIFT_TODAY_MODEL_ENABLED:'false',SHIFT_AI_R4_AUDIENCE:'all_current_members'};
          fs.writeFileSync(process.env.PRODUCTION_CONFIG,JSON.stringify(config,null,2));
          NODE
          npx wrangler deploy --config "$PRODUCTION_CONFIG" 2>&1 | tee /tmp/r4-dark.txt
          grep -F 'env.SHIFT_AI_R4_PILOT_ENABLED ("false")' /tmp/r4-dark.txt
          grep -F 'env.SHIFT_TODAY_MODEL_ENABLED ("false")' /tmp/r4-dark.txt
          grep -F 'env.SHIFT_AI_R4_AUDIENCE ("all_current_members")' /tmp/r4-dark.txt
      - name: Obtain repository OIDC identity
        run: |
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(jq -er '.value' <<<"$response")
          test -n "$token"
          echo "COMMISSION_OIDC=$token" >> "$GITHUB_ENV"
      - name: Prove full-scale kill switch and audit
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/r4-expand.json -w '%{http_code}' -H "X-Shift-Commissioning-OIDC: $COMMISSION_OIDC" -H 'Content-Type: application/json' --data '{"action":"expand_all_current_members","proof":"SHIFT_AI_R4_PRODUCTION_COMMISSION_V1"}' "$COMMISSION_URL")
          jq . /tmp/r4-expand.json
          test "$code" = 200
          jq -e '.ok==true and .proof=="SHIFT_AI_R4_ALL_CURRENT_MEMBERS_LIVE_V1" and .kill_switch_proved==true and .current_members>=1 and .audit_active==true and .expansion_audits>=1 and .enabled==1 and .master_enabled==false and .model_enabled==false and .audience=="all_current_members"' /tmp/r4-expand.json
          echo "CURRENT_MEMBERS=$(jq -r .current_members /tmp/r4-expand.json)" >> "$GITHUB_ENV"
      - name: Remove commissioning bridge and enable journey
        run: |
          set -euo pipefail
          git show 181baa5:commissioning-identity-v1.js > commissioning-identity-v1.js
          git show 181baa5:commissioning-ops-v1.js > commissioning-ops-v1.js
          node - <<'NODE'
          const fs=require('fs'),file=process.env.PRODUCTION_CONFIG,config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'true',SHIFT_TODAY_MODEL_ENABLED:'false',SHIFT_AI_R4_AUDIENCE:'all_current_members'};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          NODE
          npx wrangler deploy --config "$PRODUCTION_CONFIG" 2>&1 | tee /tmp/r4-final.txt
          grep -F 'env.SHIFT_AI_R4_PILOT_ENABLED ("true")' /tmp/r4-final.txt
          grep -F 'env.SHIFT_TODAY_MODEL_ENABLED ("false")' /tmp/r4-final.txt
          grep -F 'env.SHIFT_AI_R4_AUDIENCE ("all_current_members")' /tmp/r4-final.txt
          version=$(grep -F 'Current Version ID:' /tmp/r4-final.txt | tail -n1 | sed 's/.*Current Version ID: //')
          test -n "$version"
          echo "WORKER_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prove final production boundary
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/r4-unauth.json -w '%{http_code}' 'https://api.shiftsometimber.co.uk/v1/shift-ai/today/bootstrap')" = 401
          test "$(curl -sS -o /tmp/r4-hook.json -w '%{http_code}' -H 'Content-Type: application/json' --data '{}' "$COMMISSION_URL")" = 404
          printf '%s\n' '## Shift AI R4 live for all current members' '' "- Deployed commit: $GITHUB_SHA" "- Worker version: $WORKER_VERSION" "- Eligible current members: $CURRENT_MEMBERS" '- Model: off' '- Confirmation before writes: enforced' '- One-action kill-switch: proved at all-member scope' '- Full audit: active' '- Commissioning hook: removed' >> "$GITHUB_STEP_SUMMARY"
      - name: Seal journey if any gate failed
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          if test -f "$PRODUCTION_CONFIG"; then
            git show 181baa5:commissioning-identity-v1.js > commissioning-identity-v1.js
            git show 181baa5:commissioning-ops-v1.js > commissioning-ops-v1.js
            node - <<'NODE'
          const fs=require('fs'),file=process.env.PRODUCTION_CONFIG,config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'false',SHIFT_TODAY_MODEL_ENABLED:'false',SHIFT_AI_R4_AUDIENCE:'all_current_members'};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          NODE
            npx wrangler deploy --config "$PRODUCTION_CONFIG"
          fi
          echo 'Expansion gate failed; production master flag returned to off.' >> "$GITHUB_STEP_SUMMARY"
