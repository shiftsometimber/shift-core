name: Shift AI R4 Production Pilot

on:
  push:
    branches: [codex/my-timber-adaptive-day-v1]
    paths:
      - '.github/workflows/shift-ai-r4-production-pilot.yml'
      - 'commissioning-identity-v1.js'
      - 'commissioning-ops-v1.js'

permissions:
  contents: read
  id-token: write

concurrency:
  group: shift-ai-r4-production-pilot
  cancel-in-progress: false

jobs:
  deploy-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_CONFIG: wrangler.shift-ai-r4-production.generated.jsonc
      PRODUCTION_D1_ID: 88f40aed-cb23-4372-8c94-8a73f48bc847
      COMMISSION_URL: https://api.shiftsometimber.co.uk/v1/commissioning/shift-ai-r4-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Require production authority
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
      - name: Install exact toolchain
        run: npm install --no-audit --no-fund
      - name: Prove sealed R4 and locked surfaces
        run: |
          set -euo pipefail
          node --check worker-entry-v6.js
          node --check shift-ai-live-today-v1.js
          node --check commissioning-identity-v1.js
          node --check commissioning-ops-v1.js
          npm run test:shift-ai-live-today
          node tests/adaptive-today-source-gate.mjs
          git diff --exit-code 181baa5 -- shift-ai-live-today-v1.js worker-entry-v6.js member-product-v8.js frontend/member/api-adapter-v33d.js
          test "$(git diff --name-only 181baa5 -- migrations | wc -l)" -eq 0
      - name: Bind production Worker and D1 dark
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,''));
          const db=config.d1_databases?.find(item=>item.binding==='DB');
          if(config.name!=='shift-core'||db?.database_id!==process.env.PRODUCTION_D1_ID)throw new Error('production binding mismatch');
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'false',SHIFT_TODAY_MODEL_ENABLED:'false'};
          fs.writeFileSync(process.env.PRODUCTION_CONFIG,JSON.stringify(config,null,2));
          NODE
          jq -e '.name=="shift-core" and .vars.SHIFT_AI_R4_PILOT_ENABLED=="false" and .vars.SHIFT_TODAY_MODEL_ENABLED=="false" and (.d1_databases[]|select(.binding=="DB")|.database_id)==env.PRODUCTION_D1_ID' "$PRODUCTION_CONFIG"
      - name: Deploy authenticated commissioning bridge dark
        run: |
          set -euo pipefail
          npx wrangler deploy --config "$PRODUCTION_CONFIG" 2>&1 | tee /tmp/r4-production-dark.txt
          grep -F 'env.SHIFT_AI_R4_PILOT_ENABLED ("false")' /tmp/r4-production-dark.txt
          grep -F 'env.SHIFT_TODAY_MODEL_ENABLED ("false")' /tmp/r4-production-dark.txt
      - name: Obtain repository OIDC identity
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(jq -er '.value' <<<"$response")
          test -n "$token"
          echo "COMMISSION_OIDC=$token" >> "$GITHUB_ENV"
      - name: Commission D1 and activate exactly five
        run: |
          set -euo pipefail
          sed "s/__PREVIEW_D1_DATABASE_ID__/247b065f-fea4-4891-945b-b707f2417656/" wrangler.my-timber-preview.template.jsonc > /tmp/r4-preview.jsonc
          npx wrangler d1 execute DB --remote --config /tmp/r4-preview.jsonc --json --command "WITH selected AS (SELECT id,ROW_NUMBER() OVER(PARTITION BY lower(trim(first_name)) ORDER BY id DESC) AS rn FROM users WHERE lower(trim(first_name)) IN ('matt','linda','ava','isla','finley')) SELECT u.email,u.first_name,u.last_name,u.phone,u.date_of_birth,u.postcode,a.password_hash,a.email_verified,a.email_verified_at,s.my_why,s.roadmap,s.treatment_finder,s.decision_readiness,s.preferences,p.profile_json,p.inventory_json FROM selected x JOIN users u ON u.id=x.id JOIN user_auth a ON a.user_id=u.id LEFT JOIN member_state s ON s.user_id=u.id LEFT JOIN shift_personal_state p ON p.user_id=u.id WHERE x.rn=1 ORDER BY u.id" > /tmp/r4-preview-accounts.json
          jq -e '[..|objects|select(.results?!=null)|.results][0] | length==5 and ([.[].first_name|ascii_downcase]|unique|length)==5' /tmp/r4-preview-accounts.json
          jq -n --argjson accounts "$(jq -c '[..|objects|select(.results?!=null)|.results][0]' /tmp/r4-preview-accounts.json)" '{action:"import_activate",proof:"SHIFT_AI_R4_PRODUCTION_COMMISSION_V1",accounts:$accounts}' > /tmp/r4-production-request.json
          code=$(curl -sS -o /tmp/r4-production-commission.json -w '%{http_code}' -H "X-Shift-Commissioning-OIDC: $COMMISSION_OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/r4-production-request.json "$COMMISSION_URL")
          rm -f /tmp/r4-preview-accounts.json /tmp/r4-production-request.json
          jq . /tmp/r4-production-commission.json
          test "$code" = 200
          jq -e '.ok==true and .proof=="SHIFT_AI_R4_PRODUCTION_ACTIVATED_V1" and .kill_switch_proved==true and .enabled==1 and .phase==1 and .max_members==5 and .active_members==5 and .valid_consents==5 and .non_cohort_access==0 and .activation_audits>=5 and .master_enabled==false and .model_enabled==false' /tmp/r4-production-commission.json
      - name: Prove master switch dark independently
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/r4-production-status.json -w '%{http_code}' -H "X-Shift-Commissioning-OIDC: $COMMISSION_OIDC" -H 'Content-Type: application/json' --data '{"action":"status","proof":"SHIFT_AI_R4_PRODUCTION_COMMISSION_V1"}' "$COMMISSION_URL")
          jq . /tmp/r4-production-status.json
          test "$code" = 200
          jq -e '.ok==true and .enabled==1 and .active_members==5 and .valid_consents==5 and .non_cohort_access==0 and .master_enabled==false and .model_enabled==false' /tmp/r4-production-status.json
      - name: Remove bridge and enable sealed pilot
        run: |
          set -euo pipefail
          git show 181baa5:commissioning-identity-v1.js > commissioning-identity-v1.js
          git show 181baa5:commissioning-ops-v1.js > commissioning-ops-v1.js
          node - <<'NODE'
          const fs=require('fs'),file=process.env.PRODUCTION_CONFIG;
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'true',SHIFT_TODAY_MODEL_ENABLED:'false'};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          NODE
          npx wrangler deploy --config "$PRODUCTION_CONFIG" 2>&1 | tee /tmp/r4-production-final.txt
          grep -F 'env.SHIFT_AI_R4_PILOT_ENABLED ("true")' /tmp/r4-production-final.txt
          grep -F 'env.SHIFT_TODAY_MODEL_ENABLED ("false")' /tmp/r4-production-final.txt
          version=$(grep -F 'Current Version ID:' /tmp/r4-production-final.txt | tail -n1 | sed 's/.*Current Version ID: //')
          test -n "$version"
          echo "WORKER_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prove final boundary
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/r4-production-unauth.json -w '%{http_code}' 'https://api.shiftsometimber.co.uk/v1/shift-ai/today/bootstrap')
          test "$code" = 401
          hook_code=$(curl -sS -o /tmp/r4-production-hook.json -w '%{http_code}' -H 'Content-Type: application/json' --data '{}' "$COMMISSION_URL")
          test "$hook_code" = 404
          printf '%s\n' '## R4 controlled production pilot live' '' "- Deployed commit: $GITHUB_SHA" "- Worker version: $WORKER_VERSION" '- Production D1: bound and verified' '- Five consented members: active' '- All other members: default off' '- Model: off' '- One-action kill-switch: proved' '- Full audit: active' '- Commissioning hook: removed' >> "$GITHUB_STEP_SUMMARY"
      - name: Seal pilot if any gate failed
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          if test -f "$PRODUCTION_CONFIG"; then
            git show 181baa5:commissioning-identity-v1.js > commissioning-identity-v1.js
            git show 181baa5:commissioning-ops-v1.js > commissioning-ops-v1.js
            node - <<'NODE'
          const fs=require('fs'),file=process.env.PRODUCTION_CONFIG;
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.vars={...config.vars,SHIFT_AI_R4_PILOT_ENABLED:'false',SHIFT_TODAY_MODEL_ENABLED:'false'};
          fs.writeFileSync(file,JSON.stringify(config,null,2));
          NODE
            npx wrangler deploy --config "$PRODUCTION_CONFIG" 2>&1 | tee /tmp/r4-production-sealed.txt
            grep -F 'env.SHIFT_AI_R4_PILOT_ENABLED ("false")' /tmp/r4-production-sealed.txt
          fi
          echo 'Launch gate failed; production master flag returned to off.' >> "$GITHUB_STEP_SUMMARY"
