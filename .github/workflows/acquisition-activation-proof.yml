name: Acquisition Activation Proof
on:
  push:
    branches: ['fix/acquisition-activation-20260919']
  pull_request:
    branches: [main]
    paths:
      - 'acquisition-activation/**'
      - 'activation-measurement/**'
      - 'member-register-fastpath-v2.js'
      - 'auth-email-verification-v1.js'
      - 'frontend/member/api-adapter-v33d.js'
      - 'health-passport/routes.mjs'
      - 'privacy-health-erasure-route-v1.js'
      - '.github/workflows/acquisition-*.yml'
permissions:
  contents: read
concurrency:
  group: acquisition-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Record exact source with no repository or production writes
        run: |
          mkdir -p acquisition-proof
          test ! -f acquisition-activation/candidate.b64
          git rev-parse HEAD > acquisition-proof/source-sha.txt
      - run: npm ci --no-audit --no-fund
      - name: Same-account acquisition, auth, privacy and existing member regressions
        run: |
          set -o pipefail
          node --test acquisition-activation/*.test.mjs activation-measurement/*.test.mjs tests/member-auth*.test.mjs tests/turnstile-auth-v1.test.mjs health-passport/*.test.mjs tests/my-journey*.test.mjs member-experience/tests/*.test.mjs tests/public-shell-contract.test.mjs tests/public-audit-repair.test.mjs | tee acquisition-proof/regressions.tap
          node my-journey-integration-gate.mjs
          node my-timber-final-source-gate.mjs
      - name: Compile the exact candidate without deployment credentials
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir acquisition-proof/worker | tee acquisition-proof/compile.log
      - name: Capture current signup controller and consent baseline without account writes
        run: node acquisition-activation/capture.mjs
      - name: Install isolated browser runner
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Actual captured signup form to real source-linked save using fictional accounts
        run: |
          node acquisition-activation/browser-server.mjs > acquisition-proof/server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8766/__test/report >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          python3 acquisition-activation/browser-proof.py
      - name: Retain source and bounded diff
        if: always()
        run: |
          mkdir -p acquisition-proof
          cp acquisition-activation/README.md acquisition-proof/README.md
          git diff 25350515a23b984daf54c12ab10b158cc5ce8a3b -- acquisition-activation/ activation-measurement/ auth-email-verification-v1.js member-register-fastpath-v2.js frontend/member/api-adapter-v33d.js health-passport/routes.mjs privacy-health-erasure-route-v1.js .github/workflows/ > acquisition-proof/candidate.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acquisition-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: acquisition-proof/
          retention-days: 14
