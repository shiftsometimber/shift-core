name: V1 Release Blocker Board
on:
  pull_request:
    paths:
      - 'docs/V1-RELEASE-BLOCKER-BOARD-V2.md'
      - 'docs/MATT-FINAL-ACCEPTANCE-PACK.md'
      - 'release-blocker-board-gate.mjs'
      - '.github/workflows/v1-release-blocker-board.yml'
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: node release-blocker-board-gate.mjs
