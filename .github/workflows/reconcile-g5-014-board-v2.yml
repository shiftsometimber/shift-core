name: Reconcile G5-014 Sceptical Customer
on:
  pull_request:
    paths:
      - 'reconcile-g5-014-board-v2.mjs'
      - 'docs/evidence/2026-08-14-g5-014-sceptical-customer-production-pass.md'
      - '.github/workflows/reconcile-g5-014-board-v2.yml'
  push:
    branches: ['main']
    paths:
      - 'reconcile-g5-014-board-v2.mjs'
      - 'docs/evidence/2026-08-14-g5-014-sceptical-customer-production-pass.md'
      - '.github/workflows/reconcile-g5-014-board-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reconcile earned G5-014 PASS
        run: node reconcile-g5-014-board-v2.mjs
      - name: Prove exact 57-row crosswalk
        run: node finish-line-gate.mjs
      - name: Commit authoritative matrix, ledger and boards
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/LAUNCH-FINISH-LINE.md docs/COMMISSIONING-EVIDENCE.md docs/V1-RELEASE-BLOCKER-BOARD-V2.md finish-line-gate.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reconcile G5-014 to 46 PASS / 8 AMBER'
          git push origin HEAD:main
