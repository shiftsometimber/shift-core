name: Read-only SEO owner and image diagnostic
on:
  push:
    branches: [release/sitewide-seo-20261101]
    paths: ['seo-owner-state-20261101.mjs', '.github/workflows/seo-owner-state-20261101.yml']
permissions:
  contents: read
concurrency:
  group: seo-owner-state-read-only-20261101
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --prefix seo-page-tools --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: node seo-owner-state-20261101.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-owner-state-${{ github.run_id }}
          path: seo-owner-evidence/
          retention-days: 30
