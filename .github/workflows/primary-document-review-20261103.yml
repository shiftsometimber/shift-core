name: Qualify two approved primary documents through source review
on:
  push:
    branches: [fix/primary-document-review-20261103]
    paths:
      - .github/workflows/primary-document-review-20261103.yml
      - release/primary-document-review-20261103.mjs
      - tests/primary-document-review-20261103.test.mjs
permissions:
  contents: read
  id-token: write
concurrency:
  group: newsroom-primary-source-review-1700-1701
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'shiftsometimber/shift-core' && github.actor_id == '315011648'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRIMARY_REVIEW_DB_ID: 88f40aed-cb23-4372-8c94-8a73f48bc847
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require finite source-review scope and unchanged shared gates
        run: |
          git fetch --no-tags --depth=1 origin c175ab099305c47fd70ff917e13da736dbabd870
          python3 - <<'PY'
          import subprocess
          base='c175ab099305c47fd70ff917e13da736dbabd870'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          expected={'.github/workflows/primary-document-review-20261103.yml','release/primary-document-review-20261103.mjs','tests/primary-document-review-20261103.test.mjs'}
          assert changed==expected,(changed,expected)
          assert subprocess.check_output(['git','rev-parse','HEAD:radar-source-review-v1.js'],text=True).strip()=='6af066c4bccf0d2e57796624bd62a9659ec1f74f'
          PY
          node --check release/primary-document-review-20261103.mjs
      # The unchanged HQ UI-string suite failed in 41655345331 because it expects
      # the retired blanket "Nothing publishes ... until you approve it" text.
      # This finite data-only appraisal does not change that UI or its runtime.
      # Its failure remains recorded; use source and publisher-permission checks.
      - name: Prove document classification, immutable originals and retained source/publication gates
        run: node --test tests/primary-document-review-20261103.test.mjs tests/radar-auto-news-publisher-permissions.test.mjs tests/radar-official-intake-v1.test.mjs tests/radar-source-snapshots-v1.test.mjs
      - name: Read originals and exact existing CMS snapshots without writes
        run: node release/primary-document-review-20261103.mjs --snapshot
      - name: Retain exact original rows and documents before observation writes
        uses: actions/upload-artifact@v4
        with:
          name: primary-document-review-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: primary-document-review-proof/
          if-no-files-found: error
          retention-days: 90
      - name: Record only the two qualified source observations
        run: node release/primary-document-review-20261103.mjs --apply
      - name: Retain source appraisal and original-preservation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-document-review-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: primary-document-review-proof/
          if-no-files-found: warn
          retention-days: 90
