name: My Timber iOS v1 Xcode package
on:
  push:
    branches: [release/my-timber-ios-v1-package-20260930]
    paths:
      - '.github/workflows/my-timber-ios-v1-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify v1 identity
        run: |
          grep -q "MARKETING_VERSION: 1.0.0" my-timber-app/ios/project.yml
          grep -q "CURRENT_PROJECT_VERSION: 1" my-timber-app/ios/project.yml
          grep -q "PRODUCT_BUNDLE_IDENTIFIER: uk.co.shiftsometimber.mytimber" my-timber-app/ios/project.yml
          node --test my-timber-app/tests/source.test.mjs
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd my-timber-app/ios
          xcodegen generate
          xcodebuild -project MyTimber.xcodeproj -scheme MyTimber -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      - name: Make owner-ready package
        run: |
          mkdir -p My-Timber-iOS-v1.0.0
          cp -R my-timber-app/ios/MyTimber.xcodeproj My-Timber-iOS-v1.0.0/
          cp -R my-timber-app/ios/Sources My-Timber-iOS-v1.0.0/
          cp -R my-timber-app/ios/Resources My-Timber-iOS-v1.0.0/
          cp my-timber-app/ios/GeneratedInfo.plist My-Timber-iOS-v1.0.0/
          cat > My-Timber-iOS-v1.0.0/OPEN-ME.txt <<'TXT'
          MY TIMBER iOS v1.0.0 BUILD 1
          Bundle ID: uk.co.shiftsometimber.mytimber

          1. Double-click MyTimber.xcodeproj.
          2. In Xcode select the MyTimber target > Signing & Capabilities.
          3. Select your SHIFT SOME TIMBER LTD Apple Developer team and leave Automatically manage signing on.
          4. Select Any iOS Device (arm64).
          5. Product > Archive.
          6. Organizer > Distribute App > App Store Connect > Upload.
          TXT
          ditto -c -k --sequesterRsrc --keepParent My-Timber-iOS-v1.0.0 My-Timber-iOS-v1.0.0-Xcode.zip
          shasum -a 256 My-Timber-iOS-v1.0.0-Xcode.zip > My-Timber-iOS-v1.0.0-Xcode.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: My-Timber-iOS-v1.0.0-Xcode
          path: |
            My-Timber-iOS-v1.0.0-Xcode.zip
            My-Timber-iOS-v1.0.0-Xcode.sha256
          if-no-files-found: error
          retention-days: 30
