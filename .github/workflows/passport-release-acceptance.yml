name: Passport Release Acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/passport-release-acceptance.yml'
      - 'scripts/verify-watch-access-closeout.mjs'
      - 'scripts/watch-access-contract.mjs'
      - 'tests/watch-access-contract.test.mjs'
permissions:
  contents: read
concurrency:
  group: passport-release-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - name: Capture exact source and anonymous responses
        run: |
          mkdir -p release-acceptance/source
          git rev-parse HEAD > release-acceptance/candidate-head.txt
          git ls-tree HEAD scripts/verify-watch-access-closeout.mjs medicines-watch/monitor.mjs > release-acceptance/git-blobs.txt
          cp scripts/verify-watch-access-closeout.mjs medicines-watch/monitor.mjs medicines-watch/page.mjs release-acceptance/source/
          cp .github/workflows/cloudflare-production-promote.yml .github/workflows/my-timber-final-production.yml release-acceptance/source/
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest=[];
          for(const path of ['/v1/medicines-watch/health','/treatment-centre/medicines-watch','/v1/health-passport']){
            const r=await fetch('https://shiftsometimber.co.uk'+path,{cache:'no-store',redirect:'manual',signal:AbortSignal.timeout(30000)});
            const body=Buffer.from(await r.arrayBuffer()),file=encodeURIComponent(path)+'.txt';
            writeFileSync('release-acceptance/'+file,body);
            manifest.push({path,status:r.status,file,sha256:createHash('sha256').update(body).digest('hex'),checkedAt:new Date().toISOString()});
          }
          writeFileSync('release-acceptance/http.json',JSON.stringify(manifest,null,2));
          NODE
      - name: Existing Medicines Watch check without modification
        run: |
          set -o pipefail
          node scripts/verify-watch-access-closeout.mjs 2>&1 | tee release-acceptance/watch-check.log
      - name: Exact Passport delivery verification
        if: always()
        run: |
          set -o pipefail
          node health-passport/production-live.mjs 2>&1 | tee release-acceptance/passport-check.log
      - name: Existing member delivery verification
        if: always()
        run: |
          set -o pipefail
          node member-experience/verify-production-member.mjs 2>&1 | tee release-acceptance/member-check.log
      - name: Watch contract regression tests when present
        if: always()
        run: |
          set -o pipefail
          if test -f tests/watch-access-contract.test.mjs; then node --test tests/watch-access-contract.test.mjs | tee release-acceptance/watch-tests.tap; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passport-release-acceptance-${{ github.event.pull_request.head.sha }}
          path: |
            release-acceptance/
            watch-access-closeout.json
            member-live-proof.json
            health-passport/generated/live-http.json
