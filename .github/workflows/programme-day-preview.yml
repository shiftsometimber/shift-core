name: Programme day preview
on:
  pull_request:
    paths: ["programme-day.mjs", "growth-member-public.mjs", "release/growth-preservation.mjs", "release/approved-runtime-composition*", "tests/programme-day*.mjs", "scripts/verify-programme-day.cjs", ".github/workflows/programme-day-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test tests/programme-day*.mjs tests/growth-release.test.mjs tests/approved-runtime-composition.test.mjs tests/public-tool-release.test.mjs
      - run: node scripts/b1-release-scope.mjs
      - run: npm install --prefix "$RUNNER_TEMP/programme-tools" --no-audit --no-fund playwright@1.63.0
      - run: '"$RUNNER_TEMP/programme-tools/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node scripts/verify-programme-day.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/programme-tools/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme-day-preview
          path: programme-day-proof
