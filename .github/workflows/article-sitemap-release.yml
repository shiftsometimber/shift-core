name: Release reviewed Knowledge discovery repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/article-sitemap-release.yml]
permissions:
  contents: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DISCOVERY_SOURCE: 578982aa05c000b2f3ae4d01aea53172e67972fd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require exact reviewed discovery source and current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$DISCOVERY_SOURCE" HEAD
          python3 - <<'PY'
          import os,subprocess
          source=os.environ['DISCOVERY_SOURCE']
          changed=set(subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines())
          expected={
            '.github/workflows/article-sitemap-release.yml',
            'babylove/dynamic-public.mjs',
            'babylove/dynamic-public.test.mjs',
            'release/bounded-discovery-release-gate-20261031.mjs',
            'shift-coach/release-contract.mjs',
          }
          assert changed==expected,(changed,expected)
          PY
      - name: Install exact toolchain and verify discovery candidate
        run: |
          npm ci --no-audit --no-fund
          node babylove/prepare-public-bundle.mjs
          git diff --exit-code -- babylove/editorial/public-bundle.mjs
          node --check babylove/dynamic-public.mjs
          node --test babylove/*.test.mjs tests/knowledge-editorial-*.test.mjs
          node --test tests/canonical-runtime-build.test.mjs tests/independent-presentation-preservation.test.mjs
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Capture current runtime and unchanged public pages
        run: |
          mkdir -p article-sitemap-proof b1-runtime-release
          npx wrangler deployments list --config wrangler.jsonc --json > deployment-before.json
          cp deployment-before.json article-sitemap-proof/
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const clean=s=>s.replace(/<script\b[^>]*\bsrc=["']https:\/\/static.cloudflareinsights.com[^"']*["'][\s\S]*?<\/script>/gi,'').replace(/<script\b[^>]*>[\s\S]*?window\.__CF\$cv\$params[\s\S]*?<\/script>/gi,'');
          const pages={};
          for(const path of ['/','/about','/member-login']){
            const response=await fetch('https://shiftsometimber.co.uk'+path,{headers:{'Cache-Control':'no-cache','User-Agent':'SHIFT-Knowledge-Discovery-Release/1.0'}});
            assert.equal(response.status,200,path);
            pages[path]=createHash('sha256').update(clean(await response.text())).digest('hex');
          }
          writeFileSync('article-sitemap-proof/before.json',JSON.stringify(pages,null,2));
          JS
      - name: Deploy exact current main through owned version promotion
        id: publish
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          node release/member-runtime-deploy.mjs
      - name: Verify Knowledge discovery and preserve unrelated pages
        run: |
          sleep 10
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          const base='https://shiftsometimber.co.uk';
          const clean=s=>s.replace(/<script\b[^>]*\bsrc=["']https:\/\/static.cloudflareinsights.com[^"']*["'][\s\S]*?<\/script>/gi,'').replace(/<script\b[^>]*>[\s\S]*?window\.__CF\$cv\$params[\s\S]*?<\/script>/gi,'');
          const before=JSON.parse(readFileSync('article-sitemap-proof/before.json'));
          const after={};
          for(const path of Object.keys(before)){
            const response=await fetch(base+path,{headers:{'Cache-Control':'no-cache','User-Agent':'SHIFT-Knowledge-Discovery-Release/1.0'}});
            assert.equal(response.status,200,path);
            after[path]=createHash('sha256').update(clean(await response.text())).digest('hex');
          }
          assert.deepEqual(after,before,'Unrelated public pages changed');
          const knowledge=await fetch(base+'/knowledge',{headers:{'Cache-Control':'no-cache'}});
          assert.equal(knowledge.status,200);
          const html=await knowledge.text();
          for(const slug of ['weight-loss-maintenance-plan','type-2-diabetes-remission-men'])assert(html.includes('/articles/'+slug),'Knowledge omission: '+slug);
          const expected=new Map([
            ['weight-loss-maintenance-plan','babylovegrowth'],
            ['type-2-diabetes-remission-men','shift-contributor'],
          ]);
          const articles={};
          for(const [slug,source] of expected){
            const response=await fetch(base+'/articles/'+slug,{headers:{'Cache-Control':'no-cache'}});
            assert.equal(response.status,200,slug);
            assert.equal(response.headers.get('x-shift-article-source'),source,slug+' source');
            const body=await response.text();
            assert(body.includes('<link rel="canonical" href="'+base+'/articles/'+slug),slug+' canonical');
            assert(!/noindex/i.test(response.headers.get('x-robots-tag')||''),slug+' header noindex');
            assert(!/<meta[^>]+(?:name|http-equiv)=["']robots["'][^>]+content=["'][^"']*noindex/i.test(body),slug+' HTML noindex');
            articles[slug]={source,status:response.status};
          }
          writeFileSync('article-sitemap-proof/after.json',JSON.stringify({pages:after,knowledge:{status:knowledge.status},articles},null,2));
          JS
          npx wrangler deployments list --config wrangler.jsonc --json > article-sitemap-proof/deployment-after.json
      - name: Restore captured runtime if owned verification fails
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        run: node release/member-details-rollback.mjs
      - name: Record release evidence
        if: always()
        run: |
          mkdir -p article-sitemap-proof
          git rev-parse HEAD > article-sitemap-proof/commit.txt
          cp -r b1-runtime-release article-sitemap-proof/ 2>/dev/null || true
          find article-sitemap-proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > article-sitemap-proof/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-discovery-live-${{ github.sha }}
          path: article-sitemap-proof/
          retention-days: 30
