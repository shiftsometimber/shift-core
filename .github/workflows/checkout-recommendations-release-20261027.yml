name: Approved checkout recommendations release
on:
  push:
    branches: [release/checkout-recommendations-20261027]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture exact serving owners and catalogue structure without changing production
        run: node release/checkout-recommendations-20261027/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-release-${{ github.run_id }}
          path: checkout-release/
          retention-days: 90
