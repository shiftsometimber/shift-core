name: Approved checkout recommendations release
on:
  push:
    branches: [release/checkout-recommendations-20261027]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production-promote
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify account, checkout, permissions and automatic SKU allocation
        run: |
          node checkout-extras/build-assets.mjs --check
          node --test checkout-extras/feature.test.mjs checkout-extras/medicine-integration.test.mjs tests/checkout-recovery.test.mjs tests/medicine-commerce-v1.test.mjs tests/purchase-basket.test.mjs health-nutrition/feature.test.mjs
      - name: Install automatic SKU creation hooks without changing the deployed application
        run: node release/checkout-recommendations-20261027/release.mjs sku-hooks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-release-${{ github.run_id }}
          path: checkout-release/
          retention-days: 90
