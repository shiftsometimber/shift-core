name: Final V1 Production Publication
on:
  workflow_run:
    workflows: ['Cloudflare Production Promote']
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH_ACCEPTED_V1 after current main is deployed'
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: final-v1-production-publication
  cancel-in-progress: false
jobs:
  publish-and-prove:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH_ACCEPTED_V1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 9e5386dcf455be34c582d93f8bfc79e6
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHIFT_API_BASE: https://api.shiftsometimber.co.uk
      SHIFT_SITE_BASE: https://shiftsometimber.co.uk
      FINAL_V1_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_V1_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Fail closed when production deploy credential is absent
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret is not configured'; exit 1; }
      - name: Refuse stale source before any production publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current=$(git rev-parse origin/main)
          echo "Promoted source: $FINAL_V1_SOURCE_SHA"
          echo "Current main: $current"
          test "$current" = "$FINAL_V1_SOURCE_SHA" || { echo 'main moved after Worker promotion; promote current main before publishing accepted content'; exit 1; }
      - name: Regression-protect final A=0 reconciliation before production mutation
        run: node final-v1-gate2-reconciliation-source-gate.mjs
      - name: Validate exact final human acceptance
        run: node final-v1-human-acceptance-gate.mjs
      - name: Validate accepted Fit visual public-serving source
        run: node fit-premium-public-serving-gate.mjs
      - run: python3 -m pip install --quiet openpyxl
      - run: python3 cofid-industrial-extract.py /tmp/cofid-index.json
      - name: Regenerate exact accepted Grub publication payload
        env:
          COFID_INDEX: /tmp/cofid-index.json
          GRUB_PUBLICATION_DIR: final-v1-production-publication-evidence/grub
        run: node grub-v1-publication-pack.mjs evidence/grub-v1-final-decisions-2026-08-14.json
      - name: Generate exact accepted production SQL
        env:
          COFID_INDEX: /tmp/cofid-index.json
          GRUB_PUBLISHABLE_FILE: final-v1-production-publication-evidence/grub/grub-v1-publishable.json
          FINAL_V1_PUBLICATION_DIR: final-v1-production-publication-evidence
        run: node final-v1-production-publication.mjs
      - name: Install exact Wrangler toolchain
        run: npm install --no-audit --no-fund
      - name: Publish accepted V1 authority atomically to existing production structured_content
        run: npx wrangler d1 execute shift-core-db --remote --file=final-v1-production-publication-evidence/final-v1-production-publication.sql --config wrangler.jsonc
      - name: Acquire short-lived Shift commissioning identity
        id: oidc
        shell: bash
        run: |
          raw=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=shift-production-commissioning")
          token=$(printf '%s' "$raw" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Prove real authenticated accepted Grub + Fit serving and retained outcomes
        env:
          SHIFT_COMMISSIONING_OIDC: ${{ steps.oidc.outputs.token }}
          FINAL_V1_SERVING_DIR: final-v1-production-serving-evidence
        run: node final-v1-production-serving.mjs
      - name: Prove all 26 accepted Fit premium visuals over production HTTP
        env:
          FIT_PREMIUM_ASSET_EVIDENCE_DIR: final-v1-production-serving-evidence/fit-premium-assets
        run: node fit-premium-assets-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-v1-production-publication-serving-evidence
          path: |
            final-v1-production-publication-evidence/
            final-v1-production-serving-evidence/
          retention-days: 90
      - name: Refuse to reconcile stale production evidence onto a newer main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current=$(git rev-parse origin/main)
          echo "Promoted/proven source: $FINAL_V1_SOURCE_SHA"
          echo "Current main: $current"
          test "$current" = "$FINAL_V1_SOURCE_SHA" || { echo 'main moved during production proof; rerun promotion/publication on current main before reconciliation'; exit 1; }
      - name: Atomically reconcile final four Gate-2 originals to A=0
        env:
          FINAL_V1_SERVING_REPORT: final-v1-production-serving-evidence/final-v1-production-serving.json
          FINAL_V1_PUBLICATION_SUMMARY: final-v1-production-publication-evidence/final-v1-production-publication-summary.json
          FINAL_V1_FIT_ASSET_REPORT: final-v1-production-serving-evidence/fit-premium-assets/fit-v1-26-premium-assets-production.json
        run: |
          node reconcile-final-v1-gate2-board.mjs
          node finish-line-gate.mjs
      - name: Commit exact production evidence and A=0 source of truth
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main "$FINAL_V1_SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SHIFT-COMMISSIONING-REMEDIATION-MATRIX.md docs/COMMISSIONING-EVIDENCE.md docs/LAUNCH-FINISH-LINE.md docs/V1-RELEASE-BLOCKER-BOARD-V2.md docs/V1-RELEASE-BLOCKER-COUNTS.txt docs/evidence/2026-08-14-final-v1-gate2-production-pass.md
          if [ -f docs/ACTIVE-RECOVERY.md ]; then git add docs/ACTIVE-RECOVERY.md; fi
          if [ -f docs/MATT-FINAL-ACCEPTANCE-PACK.md ]; then git add docs/MATT-FINAL-ACCEPTANCE-PACK.md; fi
          git diff --cached --quiet && { echo 'Final Gate-2 source of truth already reconciled'; exit 0; }
          git commit -m 'Commissioning: close final Gate 2 rows from production accepted-authority proof'
          git push origin HEAD:main
